const V2_EXTRA_ENGLISH={"physiology":[{"t":"Cardiac pacemaker","x":"Pacemaker cells in the sinoatrial node do not have a stable resting membrane potential. Slow inward currents gradually depolarize the membrane until threshold is reached, after which calcium-dependent channels contribute to the action potential. Autonomic input changes the slope of this spontaneous depolarization and therefore changes heart rate."},{"t":"Renin release","x":"Renin secretion from juxtaglomerular cells increases when renal perfusion pressure falls, when sympathetic activity rises, or when sodium chloride delivery to the macula densa decreases. Renin initiates the renin-angiotensin-aldosterone system, which helps restore arterial pressure and extracellular fluid volume."},{"t":"ADH and water balance","x":"Antidiuretic hormone increases water reabsorption in the collecting duct by promoting insertion of aquaporin-2 channels into the apical membrane of principal cells. This response allows the kidney to produce a more concentrated urine when plasma osmolality rises or effective circulating volume falls."},{"t":"Pulmonary surfactant","x":"Pulmonary surfactant lowers surface tension at the air-liquid interface of the alveoli. By doing so, it reduces the tendency of small alveoli to collapse and increases lung compliance. A deficiency of surfactant can greatly increase the work required for breathing."},{"t":"Oxygen dissociation","x":"Hemoglobin releases oxygen more readily when carbon dioxide, hydrogen ion concentration, temperature, or 2,3-bisphosphoglycerate increases. This rightward shift of the oxygen dissociation curve facilitates oxygen delivery to metabolically active tissues."},{"t":"Synaptic release","x":"When an action potential reaches a presynaptic terminal, voltage-gated calcium channels open. The resulting calcium influx triggers synaptic vesicles to fuse with the membrane and release neurotransmitter. The transmitter then binds receptors on the postsynaptic cell and changes its electrical or biochemical state."},{"t":"Skeletal muscle","x":"In skeletal muscle, an action potential travels along the sarcolemma and into the transverse tubules. This electrical signal triggers calcium release from the sarcoplasmic reticulum. Calcium binds troponin, allowing actin and myosin to interact and generate force."},{"t":"Insulin action","x":"Insulin promotes glucose uptake in skeletal muscle and adipose tissue and favors the storage of nutrients as glycogen and lipid. In the liver, insulin suppresses pathways that produce glucose. These coordinated actions lower blood glucose after a meal."},{"t":"Cortisol feedback","x":"The hypothalamic-pituitary-adrenal axis is controlled by negative feedback. Corticotropin-releasing hormone stimulates ACTH secretion, which in turn promotes cortisol production by the adrenal cortex. Rising cortisol suppresses further CRH and ACTH release."},{"t":"Extracellular potassium","x":"An increase in extracellular potassium reduces the concentration gradient that normally drives potassium out of cells. Because resting membranes are often highly permeable to potassium, the resting membrane potential becomes less negative. Severe hyperkalemia can therefore alter excitability and cardiac conduction."},{"t":"Metabolic acidosis","x":"In metabolic acidosis, the primary disturbance is a fall in bicarbonate concentration. The respiratory system can compensate within minutes by increasing ventilation and lowering carbon dioxide. The kidneys provide slower compensation by increasing net acid excretion and regenerating bicarbonate."},{"t":"Glomerular filtration","x":"Glomerular filtration depends on the balance of hydrostatic and oncotic pressures across the filtration barrier. High pressure in glomerular capillaries favors filtration, whereas pressure in Bowman space and plasma oncotic pressure oppose it. Changes in arteriolar resistance can therefore alter glomerular filtration rate."},{"t":"Countercurrent mechanism","x":"The loop of Henle contributes to a hyperosmotic renal medulla through countercurrent multiplication. Differences in water and solute permeability between the descending and ascending limbs create a longitudinal osmotic gradient. This gradient allows collecting ducts to reabsorb water efficiently in the presence of antidiuretic hormone."},{"t":"Chemoreceptors","x":"Central chemoreceptors respond mainly to changes in carbon dioxide through changes in hydrogen ion concentration in the cerebrospinal fluid. Peripheral chemoreceptors can respond to low arterial oxygen as well as carbon dioxide and pH. Together they adjust ventilation to maintain blood-gas homeostasis."},{"t":"Mean arterial pressure","x":"Mean arterial pressure is determined largely by cardiac output and total peripheral resistance. Short-term regulation depends heavily on neural reflexes, while long-term regulation requires control of extracellular fluid volume by the kidneys and hormones."},{"t":"Calcium homeostasis","x":"The concentration of free calcium in the cytosol is much lower than that outside the cell or inside intracellular stores. Pumps, exchangers, and calcium-binding proteins maintain this gradient. Transient changes in cytosolic calcium can therefore serve as rapid intracellular signals."},{"t":"Endocrine receptors","x":"Peptide hormones usually act through receptors on the cell surface because they do not readily cross the plasma membrane. Steroid hormones can cross the membrane and bind intracellular receptors that regulate gene transcription. The two strategies produce different time courses and patterns of cellular response."},{"t":"Homeostatic control","x":"A homeostatic control system typically includes a regulated variable, a sensor, an integrating center, and one or more effectors. Negative feedback reduces deviations from a target range, whereas positive feedback amplifies a process until a terminating event occurs."}],"chem":[{"t":"Chemical potential","x":"Chemical potential is the partial molar Gibbs energy of a component in a mixture. Differences in chemical potential provide a driving force for mass transfer and chemical reaction. At phase equilibrium, the chemical potential of each component is equal in all coexisting phases."},{"t":"Fugacity","x":"Fugacity is introduced to describe the escaping tendency of a real gas in a form that resembles pressure in ideal-gas equations. At low pressure the fugacity approaches the pressure. At higher pressure, intermolecular interactions cause the two quantities to differ."},{"t":"Activity coefficient","x":"The activity coefficient corrects liquid-phase composition for non-ideal molecular interactions. A value near unity indicates nearly ideal behavior, while significant deviations indicate that unlike and like molecular interactions are not equivalent. Activity coefficients are widely used in vapor-liquid equilibrium calculations."},{"t":"CSTR energy balance","x":"A non-isothermal continuously stirred tank reactor may exhibit strong coupling between reaction kinetics and heat transfer. For an exothermic reaction, heat generation can rise rapidly with temperature, while heat removal depends on the cooling system. This interaction can produce multiple steady states."},{"t":"Residence-time distribution","x":"Real reactors may deviate from ideal plug flow or complete mixing. Residence-time distribution experiments use a tracer to determine how long fluid elements remain inside a vessel. The resulting distribution can reveal bypassing, dead zones, or excessive mixing."},{"t":"Catalyst diffusion","x":"A porous catalyst particle can experience concentration gradients when reaction inside the pores is fast compared with diffusion. Under these conditions, not all active sites are used equally. The effectiveness factor provides a measure of the reduction in observed reaction rate caused by internal diffusion resistance."},{"t":"Pipe pressure drop","x":"Pressure decreases along a pipe because mechanical energy is dissipated by viscous effects. In laminar flow the pressure drop has a strong dependence on pipe radius, whereas turbulent pressure loss depends on Reynolds number and surface roughness through the friction factor."},{"t":"Cavitation","x":"Cavitation can occur when the local pressure in a pump falls below the liquid vapor pressure. Vapor bubbles form and later collapse as they enter regions of higher pressure. Repeated collapse can damage equipment and reduce hydraulic performance."},{"t":"Overall heat transfer","x":"The overall heat-transfer coefficient combines several thermal resistances, including convection on both sides of a wall, conduction through the wall, and fouling. A large resistance in any one step can control the overall heat-transfer rate."},{"t":"Transient conduction","x":"Transient heat conduction occurs when temperature inside a solid changes with time. The Biot number compares internal conduction resistance with external convection resistance, while the Fourier number measures the extent of thermal diffusion over time."},{"t":"Distillation reflux","x":"Increasing the reflux ratio in a distillation column generally improves separation at a given number of stages, but it also increases condenser and reboiler duties. Design therefore requires a compromise between capital cost, energy use, and separation performance."},{"t":"Absorption column","x":"Gas absorption transfers a soluble component from a gas phase into a liquid solvent. Counter-current operation maintains a larger concentration driving force over much of the column. The required height depends on equilibrium behavior and mass-transfer performance."},{"t":"Membrane separation","x":"Membrane processes separate species because components have different rates of transport through a selective barrier. Pressure, concentration, or electrical potential may provide the driving force, depending on the membrane process and the species being separated."},{"t":"Feedback control","x":"A feedback controller acts on the difference between a measured process variable and its set point. Integral action can remove steady-state offset, but excessive integral action may produce oscillation or windup when an actuator saturates."},{"t":"Dead time","x":"Dead time is a delay between a change in manipulated input and the first observable change in process output. Long dead time makes feedback control more difficult because corrective action is based on information that is already old."},{"t":"Dimensional analysis","x":"Dimensional analysis reduces a large set of variables into a smaller set of dimensionless groups. These groups help identify similarity between systems of different scales and are widely used to correlate transport and fluid-flow data."},{"t":"Reverse osmosis","x":"Reverse osmosis applies hydraulic pressure to overcome the natural osmotic driving force across a semipermeable membrane. Water preferentially permeates the membrane while many dissolved salts are retained, making the process useful for desalination."},{"t":"Crystallization","x":"Crystallization requires a supersaturated solution. The degree of supersaturation influences both nucleation and crystal growth, so cooling rate, evaporation, and seeding can strongly affect the final crystal-size distribution."}],"biochem":[{"t":"AMPK signaling","x":"AMP-activated protein kinase functions as a cellular energy sensor. When energy availability falls, AMPK promotes pathways that generate ATP and suppresses energy-consuming biosynthetic pathways. This helps cells restore energy balance during metabolic stress."},{"t":"Nrf2 response","x":"Nrf2 is a transcription factor that coordinates antioxidant defense. Under basal conditions it is continuously targeted for degradation by a Keap1-dependent mechanism. Oxidative or electrophilic stress stabilizes Nrf2, allowing it to accumulate in the nucleus and activate protective genes."},{"t":"Mitochondrial dynamics","x":"Mitochondria continually undergo fusion and fission. Fusion can help maintain function by mixing mitochondrial contents, while fission can isolate damaged regions and facilitate their removal by mitophagy. An imbalance in these processes can disturb cellular homeostasis."},{"t":"Mitophagy","x":"Mitophagy is the selective autophagic removal of damaged or unnecessary mitochondria. By preventing the accumulation of dysfunctional organelles, mitophagy helps control mitochondrial quality, reactive oxygen species, and cellular stress responses."},{"t":"Redox signaling","x":"Reactive oxygen species are not only toxic by-products. At controlled levels, oxidants such as hydrogen peroxide can reversibly modify proteins and participate in signal transduction. Oxidative stress occurs when oxidant production exceeds the capacity of antioxidant and repair systems."},{"t":"Glutathione","x":"Reduced glutathione is an important cellular antioxidant. It donates reducing equivalents to reactions that detoxify peroxides and becomes oxidized in the process. The balance between reduced and oxidized glutathione is one indicator of cellular redox state."},{"t":"DNA repair","x":"Cells possess multiple DNA-repair pathways that recognize different types of damage. If damage cannot be repaired, checkpoint pathways can delay the cell cycle or promote apoptosis. Defects in these systems can increase mutation burden and genomic instability."},{"t":"Alternative splicing","x":"Alternative splicing allows a single gene to produce multiple messenger RNA isoforms. By changing which exons are included, cells can generate proteins with different structures, localization, or functions without changing the underlying DNA sequence."},{"t":"MicroRNA","x":"MicroRNAs are short regulatory RNAs that guide protein complexes to target messenger RNAs. Partial base pairing can reduce translation and promote mRNA destabilization, allowing a single microRNA to influence many genes in a regulatory network."},{"t":"Ubiquitin system","x":"Ubiquitination is a reversible post-translational modification. Polyubiquitin chains can target proteins to the proteasome for degradation, while other ubiquitin patterns can regulate trafficking, DNA repair, or signaling without necessarily causing degradation."},{"t":"ER stress","x":"The unfolded protein response is activated when the endoplasmic reticulum accumulates misfolded proteins. Its initial goal is to restore homeostasis by reducing protein load and increasing folding capacity. If stress remains severe, the response can contribute to apoptosis."},{"t":"Cell-cycle checkpoint","x":"Cell-cycle checkpoints prevent cells from progressing when DNA is damaged or replication is incomplete. The p53-p21 pathway can block cell-cycle progression after damage, providing time for repair or promoting senescence and apoptosis when damage is severe."},{"t":"Warburg metabolism","x":"Many cancer cells maintain high rates of glycolysis and lactate production even when oxygen is available. This metabolic pattern can support rapid growth by providing ATP and biosynthetic intermediates, although tumors remain metabolically heterogeneous."},{"t":"Enzyme inhibition","x":"Different modes of enzyme inhibition produce distinct kinetic patterns. Competitive inhibitors raise the apparent substrate requirement without changing maximal velocity, whereas pure noncompetitive inhibitors reduce maximal velocity while leaving Km unchanged."},{"t":"Protein localization","x":"Protein function often depends on subcellular localization. Signal sequences, lipid modifications, and protein-protein interactions can direct proteins to the nucleus, mitochondria, endoplasmic reticulum, plasma membrane, or other compartments."},{"t":"Mitochondrial calcium","x":"Mitochondria can take up calcium from the cytosol, especially near sites of calcium release from the endoplasmic reticulum. Moderate calcium uptake can stimulate metabolism, whereas excessive mitochondrial calcium can contribute to permeability transition and cell injury."},{"t":"Autophagy","x":"Autophagy delivers cytoplasmic material to lysosomes for degradation and recycling. It often supports survival during nutrient deprivation or stress, but its effect depends on context and should not automatically be interpreted as a form of cell death."},{"t":"Receptor signaling","x":"Signal-transduction pathways often contain amplification, feedback, and cross-talk. The same receptor can produce different outcomes depending on cell type, signal strength, duration, and the availability of downstream signaling proteins."}]};

'Fugacity':'這段主要說明逸度可視為真實氣體的有效壓力，用來修正非理想氣體行為；在低壓理想極限下，逸度會趨近於壓力。',
'Activity coefficient':'這段主要說明活度係數用來描述溶液偏離理想狀態的程度。理想溶液中活度係數接近 1，非理想分子作用力則會使其偏離 1。',
'CSTR energy balance':'這段主要說明連續攪拌槽反應器的能量衡算需考慮流入、流出、反應熱與熱交換等項目；放熱反應中熱移除能力會直接影響操作溫度與穩定性。',
'Residence-time distribution':'這段主要說明停留時間分布可描述實際反應器內流體停留時間的分散程度，並用來判斷短路、死區或偏離理想流動的情形。',
'Catalyst diffusion':'這段主要說明多孔催化劑中的內部擴散可能限制反應物進入活性位置，使觀察到的反應速率低於本徵反應速率；顆粒大小與有效擴散係數都會影響此效應。',
'Pipe pressure drop':'這段主要說明管內流動的壓降受到流速、管徑、長度、粗糙度與流動型態影響；工程上常以摩擦因子與雷諾數描述。',
'Cavitation':'這段主要說明當局部壓力下降到液體蒸氣壓以下時會形成氣泡，氣泡之後塌陷可造成噪音、振動與設備侵蝕，泵浦設計需避免汽蝕。',
'Overall heat transfer':'這段主要說明總熱傳係數把多個串聯熱阻整合在一起，包括流體對流、壁面導熱與污垢熱阻，因此任一主要熱阻增加都會降低整體熱傳能力。',
'Transient conduction':'這段主要說明非穩態導熱中，物體內的溫度會隨時間改變。是否可採集總法分析通常與畢奧數是否足夠小有關。',
'Distillation reflux':'這段主要說明提高蒸餾回流比通常可改善分離、降低所需理論級數，但同時也會增加再沸器與冷凝器的能源負荷，因此存在能耗與設備之間的折衷。',
'Absorption column':'這段主要說明吸收塔利用氣液接觸把溶質由氣相轉移到液相，效率受到平衡關係、質傳係數、接觸面積與氣液流率等因素影響。',
'Membrane separation':'這段主要說明膜分離利用膜對不同物種的選擇性與跨膜驅動力進行分離；依程序不同，驅動力可以是壓力差、濃度差或電位差。',
'Feedback control':'這段主要說明回授控制器根據量測值與設定值的偏差調整操縱變數。積分作用可消除穩態偏差，但過強的積分作用可能導致振盪或積分飽和。',
'Dead time':'這段主要說明死時間是操縱變數改變後，到程序輸出開始出現反應之前的延遲；死時間越長，回授控制越困難，因為控制器取得的是較舊的資訊。',
'Dimensional analysis':'這段主要說明因次分析可把許多變數整理成少數無因次群，幫助找出不同尺度系統間的相似性，並常用於流體與傳輸資料的關聯。',
'Reverse osmosis':'這段主要說明逆滲透以外加壓力克服自然滲透驅動力，使水優先穿過半透膜而保留多數鹽類，因此常用於海水淡化與除鹽。',
'Crystallization':'這段主要說明結晶需要過飽和溶液，而過飽和程度會影響成核與晶體成長；冷卻速率、蒸發與晶種都會改變最後的晶體粒徑分布。',
'AMPK signaling':'這段主要說明 AMP 活化蛋白激酶是細胞能量感測器。能量不足時，它會促進產生 ATP 的途徑並抑制耗能的生合成反應，幫助恢復能量平衡。',
'Nrf2 response':'這段主要說明 Nrf2 是重要的抗氧化轉錄因子。平常會受 Keap1 調控而降解，氧化或親電子壓力出現時則會穩定並進入細胞核，啟動保護性基因。',
'Mitochondrial dynamics':'這段主要說明粒線體會持續進行融合與分裂。融合有助於混合內容物與維持功能，分裂則可隔離受損區域並利於粒線體自噬；兩者失衡會影響細胞恆定。',
'Mitophagy':'這段主要說明粒線體自噬會選擇性移除受損或多餘的粒線體，藉此維持粒線體品質、控制活性氧與細胞壓力。',
'Redox signaling':'這段主要說明活性氧不只是有害副產物，適量時也可參與訊號傳遞；當氧化物產生超過抗氧化與修復能力時，才會形成氧化壓力。',
'Glutathione':'這段主要說明還原型穀胱甘肽是重要細胞抗氧化物，可提供還原力清除過氧化物並在過程中被氧化；還原型與氧化型穀胱甘肽的比例可反映細胞氧化還原狀態。',
'DNA repair':'這段主要說明細胞具有多種 DNA 修復路徑來處理不同損傷；若損傷無法修復，檢查點可延後細胞週期或啟動細胞凋亡，修復缺陷則會增加突變與基因體不穩定。',
'Alternative splicing':'這段主要說明選擇性剪接讓同一個基因產生不同訊息 RNA 異構型，藉由改變外顯子的組合製造具有不同結構、位置或功能的蛋白質。',
'MicroRNA':'這段主要說明微小 RNA 會引導蛋白複合體辨識目標訊息 RNA，抑制翻譯或促進 RNA 不穩定化，因此一個微小 RNA 可以影響多個基因。',
'Ubiquitin system':'這段主要說明泛素化是一種可逆的轉譯後修飾。某些多聚泛素鏈會把蛋白質送往蛋白酶體降解，而其他泛素型態也可調節運輸、DNA 修復或訊號傳遞。',
'ER stress':'這段主要說明當內質網累積錯誤摺疊蛋白時會啟動未摺疊蛋白反應，初期目標是降低蛋白質負荷並提升摺疊能力；若壓力持續且嚴重，則可能促進細胞凋亡。',
'Cell-cycle checkpoint':'這段主要說明細胞週期檢查點會在 DNA 受損或複製未完成時阻止細胞繼續前進；例如 p53-p21 路徑可暫停細胞週期，提供修復時間，嚴重時也可導向衰老或凋亡。',
'Warburg metabolism':'這段主要說明許多癌細胞即使在有氧條件下仍維持高糖解與乳酸產生，這可提供快速生長所需的能量與生合成中間物，但不同腫瘤之間仍存在代謝異質性。',
'Enzyme inhibition':'這段主要說明不同酵素抑制方式會造成不同動力學變化。競爭性抑制會提高表觀米氏常數而不改變最大反應速率；理想純非競爭性抑制則降低最大反應速率而米氏常數不變。',
'Protein localization':'這段主要說明蛋白質功能常取決於它在細胞內的位置，訊號序列、脂質修飾與蛋白質交互作用可把蛋白送往細胞核、粒線體、內質網或細胞膜等位置。',
'Mitochondrial calcium':'這段主要說明粒線體可從胞質吸收鈣離子，適量鈣離子可促進代謝，但過多粒線體鈣離子可能引發通透性轉換與細胞傷害。',
'Autophagy':'這段主要說明自噬會把細胞質物質送到溶小體分解並回收，常可幫助細胞在缺乏養分或壓力下存活，因此不能看到自噬增加就直接解讀成細胞死亡。',
'Receptor signaling':'這段主要說明訊號傳遞路徑存在放大、回饋與交互作用；同一受體在不同細胞型態、訊號強度、持續時間與下游蛋白條件下可能產生不同結果。'
};
function extractEnglishKeySentences(text,maxSentences=3){
 const arr=(String(text||'').match(/[^.!?]+[.!?]+/g)||[String(text||'')]).map(x=>x.trim()).filter(Boolean);
 if(arr.length<=maxSentences)return arr.join(' ');
 const scored=arr.map((x,i)=>({x,i,s:(i===0?3:0)+(i===arr.length-1?3:0)+(/result|show|indicat|conclu|therefore|thus|however|because|increase|decrease|improve|reduce|allow|help|whereas/i.test(x)?2:0)})).sort((a,b)=>b.s-a.s||a.i-b.i).slice(0,maxSentences).sort((a,b)=>a.i-b.i);
 return scored.map(o=>o.x).join(' ');
}
async function translateEnglishToZhTW(text){
 const src=String(text||'').trim();if(!src)return '';
 try{
  const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q='+encodeURIComponent(src);
  const r=await fetch(u);if(r.ok){const j=await r.json();const z=(j?.[0]||[]).map(x=>x?.[0]||'').join('').trim();if(z)return z;}
 }catch(e){}
 try{
  const u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(src.slice(0,4500))+'&langpair=en|zh-TW';
  const r=await fetch(u);if(r.ok){const j=await r.json();const z=String(j?.responseData?.translatedText||'').trim();if(z&&!/QUERY LENGTH LIMIT/i.test(z))return z;}
 }catch(e){}
 return '';
}
async function englishReferenceAnswer(p,mode='summary'){
 const local=ENGLISH_REFERENCE_ZH[p?.t||''];
 let zh=local||'';
 if(!zh){
   const keyText=extractEnglishKeySentences(p?.x||'',mode==='translate'?4:3);
   const translated=await translateEnglishToZhTW(keyText);
   if(translated) zh='這段主要內容可以整理為：'+translated;
   else zh='這是一段線上即時抽取的陌生英文素材。本機無法在離線狀態可靠產生繁中翻譯；作答時至少要抓出研究／段落主題、主要機制或結果，以及最後結論。原文重點句為：'+keyText;
 }
 return {zh,terms:technicalEnglishAnswerText(zh)};
}
function englishAttemptGrade(answer){
 const n=String(answer||'').trim().length;

 if(n<18)return 'g2';
 if(n<45)return 'g3';
 return 'g4';
}

function practiceOpt(type,icon,title,sub){return `<button class="practice-option" onclick="startPractice('${currentSchool}','${type}')"><span style="font-size:24px">${icon}</span><strong>${title}</strong><small>${sub}</small></button>`}

function eligibleQuestion(q,schoolId,type){const s=SCHOOL[schoolId]; if(q.schools&& !q.schools.includes(schoolId))return false;
 if(type==='project')return q.domain==='project'; if(type==='personal')return q.domain==='personal';
 if(type==='pro')return s.group==='chem'?['thermo','reaction','transport','unitops','control','engmath','instrument','organic','calc','materials'].includes(q.domain):['physiology','biochem','molbio','cellbio','experiment'].includes(q.domain);
 if(type==='mixed') return s.group==='chem'? !['physiology','biochem','molbio','cellbio'].includes(q.domain): !['thermo','reaction','transport','unitops','control','engmath','instrument','organic','calc','materials'].includes(q.domain);
 return true;
}
function chooseQuestion(schoolId,type='mixed'){return chooseScheduled(ALLQ.filter(q=>eligibleQuestion(q,schoolId,type)));}
function startQuickSchool(id){startPractice(id,'mixed')} window.startQuickSchool=startQuickSchool;
function startPractice(id,type){clearFormalTimer();formalSession=null;practiceDomain=null;practiceProfessor=null;currentSchool=id;currentMode='practice';currentPracticeType=type; if(type==='paper')return showPaperMode(id); if(type==='english')return showEnglishMode(id); if(type==='visual')return renderQuestion(chooseVisualQuestion(id,'mixed'),'visual'); if(type==='special')return showSpecialPractice(id); if(type==='presentation')return showPresentationPractice(id); if(type==='professor')return showProfessorPractice(id); if(type==='wrong'||type==='unclear'||type==='favorite')return startRecordPractice(id,type); renderQuestion(chooseQuestion(id,type),type)} window.startPractice=startPractice;

const V4_EXTRA_ENGLISH={"physiology":[["Cardiac pacemaker","Pacemaker cells in the sinoatrial node do not maintain a stable resting membrane potential. Slow inward currents gradually depolarize the membrane until threshold is reached, after which calcium-dependent currents contribute to the action potential. Autonomic input changes the slope of this spontaneous depolarization and therefore alters heart rate."],["Capillary exchange","Fluid movement across capillary walls depends on hydrostatic and oncotic pressure differences as well as the permeability of the capillary barrier. Changes in these Starling forces can favor filtration or reabsorption. Excess filtration that is not removed by lymphatic drainage can contribute to edema."],["Renal glucose handling","Filtered glucose is normally reabsorbed in the proximal tubule through sodium-glucose cotransporters. When the filtered load exceeds the transport capacity, glucose remains in the tubular fluid and appears in the urine. This can also increase osmotic water loss."],["Countercurrent mechanism","The loop of Henle establishes an osmotic gradient in the renal medulla. The ascending limb reabsorbs salt but is relatively impermeable to water, while the descending limb is more permeable to water. This arrangement allows the kidney to produce concentrated urine when antidiuretic hormone is present."],["Ventilation perfusion matching","Efficient pulmonary gas exchange requires coordination between alveolar ventilation and pulmonary blood flow. Regions with low ventilation relative to perfusion can lower arterial oxygenation, whereas areas with high ventilation but little perfusion behave more like dead space."],["Oxygen unloading","Hemoglobin releases oxygen more readily in metabolically active tissues where carbon dioxide, hydrogen ion concentration, and temperature are increased. These local changes reduce hemoglobin oxygen affinity and support oxygen delivery to tissues with greater metabolic demand."],["Insulin signaling","Insulin binds to a receptor tyrosine kinase and activates intracellular signaling pathways including PI3K and Akt. In skeletal muscle and adipose tissue, this promotes translocation of GLUT4 transporters to the plasma membrane and increases glucose uptake."],["HPA axis","Psychological or physiological stress can activate the hypothalamic-pituitary-adrenal axis. Corticotropin-releasing hormone stimulates ACTH secretion, which promotes cortisol release from the adrenal cortex. Cortisol then exerts negative feedback on the hypothalamus and pituitary."],["Synaptic integration","A neuron receives many excitatory and inhibitory synaptic inputs. These postsynaptic potentials can summate across time and space, and the net effect at the axon initial segment determines whether the membrane reaches threshold for an action potential."],["Myelinated conduction","Myelin increases membrane resistance and reduces capacitance along the axon. As a result, depolarizing current spreads farther between nodes of Ranvier, where voltage-gated sodium channels regenerate the action potential. This saltatory conduction greatly increases conduction velocity."],["Skeletal muscle contraction","An action potential travels along the muscle membrane and into the transverse tubules, triggering calcium release from the sarcoplasmic reticulum. Calcium binds to troponin, allowing actin and myosin to interact and generate force through repeated cross-bridge cycling."],["Acid-base compensation","Primary respiratory and metabolic acid-base disturbances trigger compensatory responses in other organ systems. The lungs can change carbon dioxide rapidly through ventilation, whereas the kidneys adjust bicarbonate handling and acid excretion more slowly."],["Autoregulation of blood flow","Many organs can maintain relatively stable blood flow despite moderate changes in perfusion pressure. Local metabolic signals and myogenic responses alter arteriolar resistance, helping match tissue blood supply to metabolic demand."],["ADH and water balance","Antidiuretic hormone acts on V2 receptors in collecting duct principal cells. It increases the insertion of aquaporin-2 water channels into the apical membrane, allowing more water to be reabsorbed when the renal medulla is hyperosmotic."],["Aldosterone action","Aldosterone increases sodium reabsorption and potassium secretion in the distal nephron. It promotes the expression and activity of epithelial sodium channels and the sodium-potassium ATPase in principal cells."],["Baroreceptor adaptation","Arterial baroreceptors respond strongly to rapid changes in blood pressure but adapt during sustained pressure changes. Therefore, the baroreflex is especially important for short-term regulation and is less effective as the sole mechanism for long-term blood pressure control."],["Endocrine receptor specificity","Hormones circulate widely, but only cells that express the appropriate receptors respond directly. The same hormone may also produce different effects in different tissues because receptor subtypes and downstream signaling proteins vary among cell types."],["Calcium removal","After a cytosolic calcium signal, calcium must be removed to restore the resting state. Plasma membrane pumps and exchangers export calcium, while SERCA pumps return calcium to the endoplasmic or sarcoplasmic reticulum. Mitochondria can also transiently take up calcium."],["Respiratory control","Central chemoreceptors respond primarily to changes in carbon dioxide through changes in hydrogen ion concentration in cerebrospinal fluid. Peripheral chemoreceptors also respond to low arterial oxygen, especially when oxygen tension falls substantially."],["Exercise physiology","During dynamic exercise, cardiac output rises because heart rate and stroke volume increase. Blood flow is redistributed toward active skeletal muscle, while local metabolites promote vasodilation and improve oxygen delivery to working tissue."],["Renal autoregulation II","Changes in afferent arteriolar tone help stabilize glomerular filtration. Myogenic responses react to vessel stretch, while tubuloglomerular feedback uses sodium chloride delivery to the macula densa as a signal related to filtration and tubular flow."],["Membrane excitability","The effect of an ion on membrane voltage depends on both its equilibrium potential and the membrane conductance for that ion. Opening a channel drives the membrane potential toward the equilibrium potential of the ion carried by that channel."],["Smooth muscle","Smooth muscle contraction is regulated primarily through calcium-calmodulin activation of myosin light-chain kinase. Unlike skeletal muscle, smooth muscle does not use troponin as the main calcium-sensitive regulatory protein."],["Edema formation","Edema can develop when capillary hydrostatic pressure rises, plasma oncotic pressure falls, capillary permeability increases, or lymphatic drainage is impaired. These mechanisms all favor net movement or retention of fluid in the interstitial space."]],"biochem":[["Enzyme saturation","As substrate concentration increases, the rate of a simple enzyme-catalyzed reaction approaches a maximum value. At high substrate concentrations, most active sites are occupied and adding more substrate produces little additional increase in reaction velocity."],["Competitive inhibition","A competitive inhibitor binds to the active site and reduces the apparent ability of the enzyme to bind substrate. Increasing substrate concentration can overcome the inhibition, so the apparent Km increases while the ideal Vmax remains unchanged."],["Allosteric regulation","Allosteric enzymes can respond cooperatively to substrate or regulatory molecules. Their activity may change sharply over a narrow concentration range, allowing metabolic pathways to respond sensitively to cellular conditions."],["Glycolytic control","Phosphofructokinase-1 is a major regulatory enzyme in glycolysis. High ATP can inhibit the enzyme, whereas AMP and fructose-2,6-bisphosphate promote activity. This helps match glycolytic flux to energy demand."],["Mitochondrial respiration","Electrons from NADH and FADH2 move through the respiratory chain to oxygen. The released energy drives proton pumping across the inner mitochondrial membrane, creating a proton-motive force that powers ATP synthase."],["Uncoupling","An uncoupler dissipates the proton gradient across the inner mitochondrial membrane. Electron transport and oxygen consumption may increase, but ATP synthesis becomes less efficient because the proton-motive force is no longer tightly coupled to ATP production."],["Pentose phosphate pathway","The pentose phosphate pathway generates NADPH and ribose-5-phosphate. NADPH supports reductive biosynthesis and antioxidant defense, while ribose-5-phosphate contributes to nucleotide synthesis."],["Protein folding","A protein sequence contains the information needed to adopt a functional structure, but folding in cells is also assisted by molecular chaperones. Misfolded proteins may be refolded, sequestered, or targeted for degradation."],["Ubiquitin proteasome","Proteins destined for proteasomal degradation are often tagged with polyubiquitin chains. E3 ubiquitin ligases help determine substrate specificity, and the proteasome unfolds and degrades selected proteins in an ATP-dependent process."],["Redox balance","Cells maintain redox balance through multiple antioxidant systems. Reduced glutathione, thioredoxin, catalase, and superoxide dismutases help control reactive species, while NADPH provides reducing power to regenerate antioxidant capacity."],["DNA damage response","DNA damage activates signaling networks that pause the cell cycle and promote repair. If damage cannot be repaired, cells may enter senescence or apoptosis, reducing the risk of propagating severely damaged genomes."],["mRNA regulation","Gene expression can be regulated after transcription through changes in mRNA stability and translation. MicroRNAs and RNA-binding proteins can alter how long an mRNA persists or how efficiently it is translated."],["Protein phosphorylation","Protein kinases transfer phosphate groups to selected amino acid residues, while phosphatases remove them. Reversible phosphorylation can change enzyme activity, localization, binding interactions, and signal-transduction pathways."],["Apoptotic signaling","In the intrinsic apoptotic pathway, mitochondrial outer-membrane permeabilization allows cytochrome c to enter the cytosol. This promotes apoptosome formation and activation of initiator and executioner caspases."],["Autophagy","Autophagy delivers portions of cytoplasm and organelles to lysosomes for degradation. It can support survival during nutrient limitation, but excessive or dysregulated autophagy can also accompany disease states."],["Mitochondrial dynamics","Mitochondria continually undergo fission and fusion. These processes help distribute mitochondria, mix mitochondrial contents, and isolate damaged regions that may later be removed through mitophagy."],["PCR amplification","PCR amplifies a selected DNA region through repeated cycles of denaturation, primer annealing, and extension. Specificity depends strongly on primer design, annealing conditions, and the quality of the template."],["qPCR interpretation","In quantitative PCR, fluorescence is monitored during amplification. A lower threshold cycle generally indicates more starting template, but reliable relative quantification also requires appropriate reference genes and similar amplification efficiencies."],["Western blot normalization","Western blot signals are commonly normalized to a stable loading control or total protein signal. A suitable reference should not change with treatment, because an unstable loading control can create misleading relative expression results."],["Flow cytometry gating","Flow cytometry analysis typically begins with a sequence of gates that identify the cell population of interest, exclude debris and doublets, and sometimes remove dead cells. The gating strategy can strongly influence the final quantitative result."],["Cellular senescence","Senescent cells remain metabolically active but undergo a durable cell-cycle arrest. They can also develop a senescence-associated secretory phenotype that alters the surrounding tissue environment."],["Signal amplification","Cell-surface receptors can activate enzyme cascades in which one activated molecule modifies many downstream targets. This signal amplification allows a small extracellular stimulus to produce a large intracellular response."],["Metabolic flexibility","Cells can shift their use of glucose, fatty acids, and amino acids depending on nutrient availability and functional state. This metabolic flexibility is important for adapting to stress and maintaining ATP production."],["ROS signaling","Reactive oxygen species can damage cellular components when present at high levels, but low or transient ROS can also function as signaling molecules. Therefore, the biological effect depends on species, location, concentration, and duration."]],"chem":[["Energy balance","A steady-flow energy balance accounts for enthalpy carried by inlet and outlet streams as well as heat transfer, shaft work, and changes in kinetic and potential energy. Different process units simplify this balance in different ways."],["Entropy generation","Real processes generate entropy because of irreversibilities such as friction, mixing, chemical reaction, and heat transfer across a finite temperature difference. Entropy generation provides a measure of lost work potential."],["Throttling process","A throttling valve reduces pressure without producing shaft work. If heat transfer and kinetic and potential energy changes are negligible, the process is approximately isenthalpic even though it is highly irreversible."],["Vapor liquid equilibrium","At phase equilibrium, each chemical species has the same chemical potential in all coexisting phases. In practical calculations this condition is often expressed by equality of fugacity between the vapor and liquid phases."],["Azeotropic mixture","An azeotrope has the same vapor and liquid composition at a particular condition. Because the relative volatility approaches unity at that point, ordinary distillation cannot pass through the azeotropic composition."],["Reaction order","Reaction order describes how the rate depends on reactant concentration and must generally be determined from kinetics. It is not necessarily equal to the stoichiometric coefficient unless the reaction step is elementary."],["CSTR design","A continuously stirred tank reactor is assumed to be perfectly mixed, so the outlet composition is the same as the reactor composition. The reaction rate used in its design equation is therefore evaluated at the exit conditions."],["PFR design","In an ideal plug-flow reactor, concentration and temperature may change continuously with axial position. A differential mole balance relates the change in molar flow to the local reaction rate along the reactor volume."],["Catalyst diffusion","Porous catalyst particles can experience internal diffusion resistance when reaction is faster than transport through the pores. Increasing particle size can strengthen this limitation even when the intrinsic catalyst chemistry is unchanged."],["Packed-bed pressure drop","Pressure drop through a packed bed depends on fluid properties, superficial velocity, particle diameter, and bed void fraction. Very small particles improve external area but can greatly increase hydraulic resistance."],["Laminar flow","In fully developed laminar flow through a circular pipe, viscous effects dominate and the velocity profile is parabolic. The maximum centerline velocity is twice the average velocity for this ideal case."],["Turbulent transport","Turbulence produces eddies that increase mixing and enhance momentum, heat, and mass transfer. This improvement in transfer rates is usually accompanied by a larger pressure drop and higher pumping demand."],["Heat-transfer resistance","Heat transfer through a wall with convection on both sides can be represented as thermal resistances in series. The overall heat-transfer coefficient combines these resistances into a single engineering parameter."],["Biot number","The Biot number compares internal conductive resistance with external convective resistance. When the Biot number is very small, internal temperature gradients are limited and a lumped-capacitance approximation may be reasonable."],["Diffusion","Fickian diffusion occurs in response to a concentration or chemical-potential gradient. The diffusion coefficient depends on the molecular species, medium, temperature, and other physical conditions."],["Membrane separation","Pressure-driven membrane processes separate species according to differences in permeability, size, charge, or solubility. Concentration polarization and fouling can reduce flux and alter selectivity during operation."],["Distillation reflux","Increasing reflux generally improves separation in a distillation column because more liquid is returned for internal contacting. However, higher reflux also increases condenser and reboiler energy duties."],["Absorption column","In gas absorption, a solute transfers from the gas phase into a liquid solvent. Performance depends on phase equilibrium, interfacial area, mass-transfer coefficients, solvent flow rate, and hydrodynamic limits such as flooding."],["Drying","Drying often begins with a constant-rate period controlled mainly by external transfer. As the material becomes drier, internal moisture movement becomes limiting and the process enters a falling-rate period."],["PID control","Proportional action responds to current error, integral action responds to accumulated error, and derivative action responds to the rate of change. Their combination can improve performance but poor tuning can create oscillation or instability."],["Dead time","Process dead time is a delay between a change in input and the first observable response in the measured output. Large dead time makes feedback control more difficult because corrective actions are based on outdated information."],["HPLC separation","HPLC separates analytes through different interactions with the stationary and mobile phases. Retention time is method-dependent, while resolution depends on column efficiency, retention, and selectivity."],["BET surface area","Gas adsorption measurements can be interpreted with the BET model to estimate specific surface area. The result is widely used for porous catalysts, powders, and adsorbents, although model assumptions and pressure range must be considered."],["Rheology","Non-Newtonian materials can show shear thinning, shear thickening, yield stress, or viscoelastic behavior. A rheometer can characterize these responses over a range of controlled stresses, shear rates, or oscillatory conditions."]]};

function preferredZhTerm(v){return String(v||'').split('／')[0].trim().replace(/^Goldman\s*/i,'高德曼').replace(/^Thiele\s*/i,'蒂勒').replace(/^Ergun\s*/i,'厄岡').replace(/^Darcy-Weisbach\s*/i,'達西－魏斯巴赫').replace(/^Routh-Hurwitz\s*/i,'勞斯－赫維茲').replace(/^Jacobian\s*/i,'雅可比');}
function escapeRegExpSafe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function replaceEnglishTermSafe(text,from,to){
 let out=String(text||''), f=String(from||''); if(!f)return out;
 const esc=escapeRegExpSafe(f);
 // 英文字詞只允許完整單字／完整片語命中。禁止把 gas 換進 gastric、CO 換進 comparator、cell 換進 cells。
 if(/[A-Za-z0-9]/.test(f)){
   try{
     const re=new RegExp('(^|[^A-Za-z0-9])('+esc+')(?=$|[^A-Za-z0-9])','gi');
     return out.replace(re,(m,prefix)=>prefix+String(to));
   }catch(e){ return out; }
 }
 return out.split(f).join(String(to));
}
function replaceEnglishMapSafe(text,mapEntries){
 let out=String(text||'');
 const rows=[...mapEntries].filter(([a,b])=>a&&b).sort((x,y)=>String(y[0]).length-String(x[0]).length);
 for(const [from,to] of rows) out=replaceEnglishTermSafe(out,from,to);
 return out;
}
