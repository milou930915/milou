const HIGH_FREQ_COMPLETE_ANSWERS={"什麼是 homeostasis？請舉一個生理學例子。":"Homeostasis 是生物體透過調節機制，把內在環境維持在相對穩定的範圍，而不是完全不變。典型例子是血糖調節：血糖升高時胰島素促進葡萄糖攝取與儲存，血糖下降時升糖素促進肝醣分解與糖質新生，形成負回饋。","靜止膜電位主要由哪些因素決定？":"靜止膜電位主要由細胞膜兩側的離子濃度梯度，以及膜對各種離子的相對通透性共同決定。多數細胞在靜止時對鉀離子的通透性較高，所以膜電位通常接近鉀離子的平衡電位；鈉鉀幫浦則負責長期維持鈉、鉀濃度梯度。","Na⁺/K⁺ ATPase 每次運輸幾個 Na⁺ 和 K⁺？":"鈉鉀幫浦每消耗一分子 ATP，會把三個 Na⁺ 送出細胞、兩個 K⁺ 送入細胞。它主要用來維持跨膜離子濃度梯度，並具有小幅度的生電作用。","action potential 的 depolarization 和 repolarization 主要跟哪些離子有關？":"以典型神經細胞為例，去極化主要是電壓閘控鈉離子通道開啟後 Na⁺ 快速流入；之後鈉通道失活、電壓閘控鉀離子通道開啟，K⁺ 外流，使膜電位重新復極。","什麼是 refractory period？有什麼生理意義？":"不反應期是動作電位發生後，細胞在一段時間內無法或較難再次產生動作電位的時期。絕對不反應期主要和鈉離子通道失活有關；相對不反應期則常和鉀離子通透性仍偏高有關。它能限制最高放電頻率，也有助於動作電位沿單一方向傳遞。","細胞內 Ca²⁺ 為什麼通常維持很低？":"細胞會把胞質 Ca²⁺ 維持在很低的基線，這樣短暫的 Ca²⁺ 上升才能作為清楚的訊號。細胞透過質膜上的 Ca²⁺ 幫浦、鈉鈣交換器，以及內質網的 SERCA 幫浦等機制移除胞質 Ca²⁺；若長期過高，也可能干擾酵素活性與粒線體功能，甚至造成細胞傷害。","心輸出量 cardiac output 怎麼算？":"心輸出量等於心率乘以每搏量，也就是每分鐘心臟打出的總血液量。心率主要受自主神經等調節，而每搏量則受前負荷、後負荷與心肌收縮力影響。","Frank-Starling mechanism 在說什麼？":"Frank-Starling 機制是指在生理範圍內，心室舒張末期充盈增加會使心肌纖維被拉長，進而提高收縮力量與每搏量。因此回心血量增加時，心臟通常能把更多血液打出去，使輸入和輸出維持匹配。","血壓突然下降時，baroreceptor reflex 會怎麼反應？":"血壓突然下降時，頸動脈竇和主動脈弓壓力受器受到的牽張減少，放電頻率下降。延腦整合後會增加交感、降低副交感，使心率與收縮力上升，並造成周邊血管收縮，幫助把血壓拉回。","RAAS 系統在血壓與體液調節中的作用？":"當腎灌流下降、交感活性增加或緻密斑感受到 NaCl 降低時，腎素分泌增加。腎素促進血管張力素 I 形成，再由 ACE 轉成血管張力素 II；血管張力素 II 會促進血管收縮與醛固酮分泌，增加鈉和水的保留，最終提高循環血量與血壓。","GFR 主要受到哪些壓力決定？":"腎絲球過濾率主要由過濾係數和淨過濾壓決定。腎絲球毛細血管靜水壓促進液體進入 Bowman 囊；Bowman 囊內靜水壓與血漿膠體滲透壓則抵抗過濾，因此這些 Starling 力的平衡會影響 GFR。","ADH 的主要作用是什麼？":"抗利尿激素主要作用在腎臟集合管，使主細胞頂端膜增加 AQP2 水通道，提升水的通透性與再吸收，因而減少尿量並提高尿液濃度。","呼吸性酸中毒時，腎臟如何代償？":"呼吸性酸中毒的主要問題是二氧化碳累積。若持續一段時間，腎臟會增加 H⁺ 排泄，同時增加碳酸氫根的再吸收與新生，以提高血中碳酸氫根濃度，協助把 pH 拉回正常方向。","什麼因素會讓氧合血紅素解離曲線右移？":"二氧化碳上升、H⁺ 增加、溫度升高和 2,3-BPG 增加都可使氧合血紅素解離曲線右移。右移代表血紅素對氧的親和力下降，因此更容易在周邊組織釋放氧氣。","胰島素與 glucagon 在血糖調節中大致做什麼？":"胰島素主要在血糖升高時促進細胞攝取葡萄糖、肝醣合成與能量儲存，因此降低血糖；升糖素則在血糖下降時主要作用於肝臟，促進肝醣分解與糖質新生，使血糖上升。兩者共同形成血糖恆定的負回饋調節。","交感與副交感對心臟的主要影響？":"交感神經主要經 β1 受體增加心率、房室傳導與心肌收縮力；副交感神經主要經迷走神經的 M2 受體降低心率並減慢房室傳導。對心室收縮力的直接副交感作用相對較弱。","Michaelis-Menten 方程式中的 Km 和 Vmax 各代表什麼？":"Vmax 是在酵素活性位幾乎被受質飽和時的最大反應速率，通常會隨酵素總量增加而提高。Km 是反應速率達到 Vmax 一半時的受質濃度；在符合米氏動力學的情況下，Km 常可用來描述酵素對受質的表觀親和性。","competitive inhibition 對 Km 和 Vmax 有什麼影響？":"典型競爭性抑制劑和受質競爭酵素活性位，因此需要更高的受質濃度才能達到相同速率，表觀 Km 會上升。但在足夠高的受質濃度下可以克服抑制，所以 Vmax 通常不變。","pure noncompetitive inhibition 對 Km 和 Vmax 有什麼影響？":"在理想的純非競爭性抑制下，抑制劑同等地和游離酵素及酵素－受質複合體結合，因此有效酵素量下降，Vmax 降低；但受質表觀親和性不改變，所以 Km 維持不變。真實系統若是混合型抑制，Km 則可能改變。","為什麼 ATP 可以抑制 phosphofructokinase-1？":"PFK-1 是糖解作用的重要調節酵素。當細胞 ATP 很高時，除了作為受質外，ATP 也可結合 PFK-1 的變構調節位點，降低酵素對 fructose-6-phosphate 的反應，表示能量已充足，因此減慢糖解作用。","glycolysis 發生在哪裡？主要產物是什麼？":"糖解作用發生在細胞質，一分子葡萄糖最後形成兩分子丙酮酸。整體淨產生兩分子 ATP 和兩分子 NADH；在缺氧條件下，丙酮酸還可進一步轉成乳酸以再生 NAD⁺。","TCA cycle 主要發生在哪裡？它最大的功能是什麼？":"在真核細胞中，三羧酸循環主要發生在粒線體基質。它會氧化 acetyl-CoA，產生 NADH、FADH₂ 和少量 GTP／ATP，最重要的是提供還原當量給電子傳遞鏈進一步製造 ATP。","電子傳遞鏈主要在哪裡？最終電子接受者是什麼？":"電子傳遞鏈位在粒線體內膜。電子由 NADH 和 FADH₂ 經不同複合體傳遞，過程中將質子泵到膜間腔，建立質子梯度；氧氣是最終電子接受者，最後被還原成水。","oxidative phosphorylation 如何把 proton gradient 轉成 ATP？":"電子傳遞鏈建立粒線體內膜兩側的質子電化學梯度。質子沿梯度經 ATP synthase 回流到基質時，所釋放的能量驅動 ADP 和無機磷酸合成 ATP，這就是化學滲透偶聯的核心。","NADH 和 FADH2 進入 ETC 的位置有什麼差異？":"NADH 的電子主要由複合體 I 進入電子傳遞鏈，而 FADH₂ 的電子主要由複合體 II 進入。因為 FADH₂ 繞過會泵質子的複合體 I，所以通常建立的質子梯度較少，最後產生的 ATP 也較少。","蛋白質的一級、二級、三級、四級結構各是什麼？":"一級結構是胺基酸排列順序；二級結構是局部規則構型，例如 α 螺旋和 β 摺板；三級結構是單一多肽鏈整體的三維摺疊；四級結構則是多條多肽次單元之間的組合與排列。","disulfide bond 通常在哪種環境較容易形成？":"雙硫鍵通常較容易在氧化環境形成，例如內質網腔或細胞外空間。細胞質一般偏還原環境，因此較不利於穩定雙硫鍵形成。","ROS 一定都是有害的嗎？":"不一定。低量或短暫的活性氧可以作為訊號分子，參與細胞增殖、代謝與壓力反應；只有當產生量超過抗氧化能力、造成氧化還原失衡時，才會形成氧化壓力並傷害蛋白質、脂質或 DNA。","DNA replication 為什麼需要 primer？":"DNA polymerase 無法從零開始合成新的 DNA 鏈，它需要既有的 3′-OH 端才能延伸。因此複製開始時先由 primase 合成短 RNA primer，提供可供 DNA polymerase 延伸的 3′-OH。","leading strand 和 lagging strand 差在哪裡？":"DNA polymerase 只能沿 5′→3′ 方向合成。leading strand 因方向和複製叉前進方向一致，可以連續合成；lagging strand 方向相反，所以必須分段形成 Okazaki fragments，再由 DNA ligase 連接。","PCR 三個基本步驟是什麼？":"PCR 每個循環主要包含三步：先高溫變性使雙股 DNA 分開，再降溫讓引子和模板退火，最後由耐熱 DNA polymerase 延伸新鏈。重複循環後，目標 DNA 片段會大量擴增。","qPCR 和一般 PCR 最大差異是什麼？":"一般 PCR 通常在反應結束後才判讀擴增產物；qPCR 則在每個循環即時量測螢光訊號，因此可以用 Cq／Ct 等參數對起始模板量做相對或絕對定量。","RT-qPCR 中 RT 是什麼？":"RT 指 reverse transcription，也就是先把 RNA 逆轉錄成 cDNA，之後再用 qPCR 進行即時定量。RT 不是 real-time 的縮寫；real-time 指的是後面的 qPCR 偵測方式。","Western blot 和 RT-qPCR 分別測什麼層級？":"Western blot 主要偵測蛋白質的相對表現與分子量；RT-qPCR 則主要量測特定 mRNA 的相對或絕對量。因此 mRNA 與蛋白質結果不一定完全一致，因為中間還受到轉譯與蛋白質降解等調控。","如果 mRNA 沒變但 protein 下降，可能有哪些原因？":"可能代表調控發生在轉錄後層級，例如轉譯效率下降、蛋白質降解增加、蛋白質穩定性改變，或 miRNA 等調控機制作用。要區分這些可能性，可以進一步測蛋白質半衰期、proteasome 作用或轉譯相關指標。","什麼是 promoter？":"Promoter 是位在基因附近、協助啟動轉錄的 DNA 調控區域。RNA polymerase 和轉錄因子會在 promoter 附近組裝，決定轉錄是否開始以及大致的轉錄活性；enhancer 等其他調控元件則可進一步影響表現強度。","CRISPR-Cas9 的基本原理？":"CRISPR-Cas9 利用 guide RNA 和目標 DNA 配對，引導 Cas9 在具有適當 PAM 序列的目標位置造成雙股 DNA 斷裂。細胞接著透過 NHEJ 或 HDR 修復，因此可用來造成基因失活或進行特定位點修改。","apoptosis 和 necrosis 有什麼典型差異？":"典型 apoptosis 是受調控的程序性死亡，常伴隨 caspase 活化、細胞縮小與膜起泡，而細胞膜在早期通常仍維持完整；典型 necrosis 則常伴隨細胞腫脹、膜完整性破壞與內容物外漏，因此較容易引發發炎。","intrinsic apoptosis pathway 的核心粒線體事件是什麼？":"內在型 apoptosis 的關鍵事件是粒線體外膜通透化，讓 cytochrome c 從粒線體釋放到細胞質。之後形成 apoptosome、活化 caspase-9，再啟動下游執行型 caspase；BAX、BAK 與 BCL-2 家族在這個步驟中非常重要。","autophagy 一定代表細胞死亡嗎？":"不一定。自噬本來是細胞回收受損胞器與大分子的恆定機制，在營養缺乏或壓力下常具有保護作用。只有在特定情境下，自噬過度或失調才可能和細胞死亡相關，所以不能只看到 LC3 等標記改變就直接說自噬造成死亡。","細胞週期有哪些主要 phase？":"細胞週期主要包括 G1、S、G2 和 M 期。G1 期進行生長與準備，S 期進行 DNA 複製，G2 期檢查並準備分裂，M 期則完成有絲分裂；部分細胞也可離開週期進入 G0。","flow cytometry 的 FSC 和 SSC 大致反映什麼？":"前向散射光通常和細胞大小較相關；側向散射光則較反映細胞內部顆粒度與結構複雜度。它們常被用來初步區分細胞群與排除碎屑，但不是絕對的細胞大小或顆粒度直接量測。","flow cytometry 為什麼需要 compensation？":"多色流式中，不同螢光染劑的發射光譜常會彼此重疊，因此某個偵測通道可能收到其他染劑的訊號。Compensation 是用單色控制估計並扣除這些光譜外溢，避免把重疊訊號誤判成真正雙陽性。","什麼是 isotype control？":"Isotype control 使用和目標抗體相同的免疫球蛋白類型與螢光標記，但不針對樣本中的特定抗原，用來估計非專一性抗體結合與部分背景螢光。它可以協助判讀背景，但不能取代所有 gating 或 biological control。","如果你要測細胞 apoptosis，Annexin V/PI 四象限怎麼解讀？":"Annexin V 會辨識外翻到細胞膜外側的 phosphatidylserine，PI 則只在細胞膜完整性受損時進入細胞。因此 Annexin V−/PI− 通常視為存活細胞，Annexin V+/PI− 常代表早期 apoptosis，雙陽性常見於晚期 apoptosis 或 secondary necrosis，而 Annexin V−/PI+ 則可能是膜受損的壞死細胞。","Western blot 為什麼要 loading control？":"Loading control 用來校正不同 lane 之間的上樣量、轉膜效率等技術差異，讓目標蛋白的比較更可靠。常見 β-actin、GAPDH 等內參，但前提是 treatment 不會明顯改變它本身的表現；必要時也可考慮 total protein normalization。","如果 treatment 會改變 β-actin，你還能拿它當 loading control 嗎？":"不適合。Loading control 必須在各組之間相對穩定，如果 treatment 本身會改變 β-actin，就會造成錯誤的 normalization。此時應改用經驗證穩定的其他內參，或採用 total protein normalization。","ELISA 和 Western blot 的主要差異？":"ELISA 適合在多樣本中定量特定抗原或蛋白，通常不提供蛋白分子量資訊；Western blot 則先經電泳分離，再用抗體偵測，因此除了相對表現量，也能看到條帶位置與大致分子量。兩者都高度依賴抗體專一性。","為什麼實驗需要 positive control 和 negative control？":"Positive control 用來確認整個 assay 在應該有反應時確實能偵測到訊號，證明系統可正常運作；negative control 則用來估計背景、非專一性或基線訊號。缺少這些 control 時，即使得到正或負結果也可能很難判讀。","p value < 0.05 代表什麼？":"p 值是在虛無假設成立的前提下，觀察到目前資料或更極端資料的機率。p<0.05 表示這個機率低於預先設定的 5% 門檻，因此常被判為統計顯著，但它不代表『虛無假設只有 5% 機率為真』，也不直接表示效果很大或很重要。","統計顯著就代表生物上重要嗎？":"不一定。統計顯著只表示在特定統計假設與樣本數下，資料和虛無假設不太相容；生物意義還要看 effect size、confidence interval、可重現性與是否具有實際生理或臨床重要性。樣本數很大時，即使非常小的差異也可能達顯著。","什麼是 state function？請舉例。":"狀態函數只取決於系統的初始與最終狀態，而和中間經過的路徑無關，例如內能、焓、熵與吉布斯自由能。相對地，熱與功屬於路徑函數，數值會隨實際過程不同而改變。","chemical potential 是什麼概念？":"化學勢可以理解成某一成分加入一點點時，系統吉布斯自由能的偏莫耳變化。它是物質傳遞、化學反應與相平衡的重要驅動量；在平衡狀態下，同一成分在可交換的各相之間化學勢必須相等。","為什麼真實氣體需要 fugacity？":"理想氣體可以直接用壓力描述化學勢，但真實氣體因分子間作用力與非理想性，壓力本身不再能完全代表逃逸傾向。因此引入 fugacity 作為修正後的有效壓力，使化學勢關係仍可保留類似理想氣體的形式；在低壓理想極限下 fugacity 會接近實際壓力。","Raoult’s law 適用什麼情況？":"Raoult 定律主要適用於接近理想溶液的液相，其中各成分的分壓等於液相莫耳分率乘以該純物質的飽和蒸氣壓。若分子間作用差異明顯、溶液非理想，通常需要加入活度係數修正。","activity coefficient γ > 1 通常代表什麼偏差？":"活度係數大於 1 通常代表對 Raoult 定律的正偏差，也就是異種分子之間的作用相對較弱，使成分較容易從液相逸出到氣相，因此實際蒸氣壓高於理想預測。","Gibbs phase rule 是什麼？":"對沒有化學反應的平衡系統，Gibbs phase rule 可寫成 F=C−P+2，其中 F 是自由度、C 是成分數、P 是相數。它表示在不破壞相平衡的情況下，可以獨立改變的強度性變數數目。","steady state 和 equilibrium 差在哪？":"Steady state 表示系統中的巨觀量隨時間不再改變，但仍可能有物質、能量或動量持續流動；equilibrium 則表示系統內沒有造成淨變化的驅動力，因此不存在淨傳輸或淨反應。也就是說，steady state 不一定是 equilibrium。","isothermal expansion 和 free expansion 差在哪？":"等溫膨脹指溫度維持不變，是否可逆要看實際操作方式；自由膨脹則是氣體向近乎真空的空間膨脹，外壓接近零，因此邊界功近乎為零，而且是不可逆過程。對理想氣體自由膨脹，內能只和溫度有關，所以若沒有熱交換而溫度不變，內能變化可為零。","Carnot efficiency 怎麼寫？代表什麼？":"Carnot 熱機效率為 1−Tc/Th，溫度必須使用絕對溫度。它代表在兩個固定熱源溫度之間運轉時，任何可逆熱機能達到的理論最高效率，實際熱機因不可逆損失只會更低。","enthalpy 和 internal energy 差在哪？":"內能是系統內部微觀能量的總和；焓定義為 H=U+PV，把流動系統中推動流體所需的 PV 項一起包含進來。因此在穩態開放系統的能量衡算中，焓通常比內能更方便使用。","Arrhenius equation 是什麼？溫度為什麼會影響 k？":"Arrhenius 方程式可寫成 k=Aexp(−Ea/RT)。溫度升高時，更多分子具有足夠能量跨越活化能障礙，因此速率常數 k 通常會以指數方式增加；活化能越高，k 對溫度越敏感。","reaction order 和 stoichiometric coefficient 一定相同嗎？":"不一定。Reaction order 是速率式中濃度次方的指數，通常需要由實驗或反應機構決定；stoichiometric coefficient 則來自總反應方程式的化學計量關係。只有對真正的 elementary reaction，速率式指數才常能直接對應化學計量係數。","CSTR 和 PFR 在理想假設下最大的差異？":"理想 CSTR 假設槽內完全混合，因此反應器內濃度和出口濃度相同；理想 PFR 則沿軸向逐步改變濃度，假設沒有軸向混合。對正反應級數的單一反應，在相同轉化率下 PFR 常能利用入口較高濃度維持較高平均反應速率，因此所需體積通常較小。","對一階不可逆反應、相同 conversion，CSTR 和 PFR 哪個通常需要較大體積？為什麼？":"對一階不可逆反應，在相同進料與轉化率下，CSTR 通常需要較大體積。因為 CSTR 完全混合，整個反應器都處在較低的出口反應物濃度；PFR 則在入口處維持較高濃度，因此沿程平均反應速率較高。","batch reactor 的設計式基本概念？":"Batch reactor 沒有連續進出流，基本莫耳衡算是累積等於反應生成或消耗，也就是 dN_A/dt=r_A V。將速率式代入並依初始條件積分後，就可以求反應時間和轉化率之間的關係。","space time 和 residence time 是什麼概念？":"Space time 常定義為反應器體積除以入口體積流率，代表在入口條件下理想上填滿一個反應器體積所需的時間。Residence time 則描述流體元素實際停留在反應器中的時間；在非理想流動中會形成一個 residence-time distribution，而不一定只有單一值。","為什麼 packed-bed catalyst particle 不能太大也不能太小？":"顆粒太大時，反應物進入顆粒內部的擴散距離增加，容易產生內部擴散限制，使有效利用的活性位下降；顆粒太小雖可減少內擴散阻力，但會讓床層壓降明顯上升，增加能耗甚至造成操作問題。因此顆粒尺寸需要在傳質效率和壓降之間折衷。","selectivity 和 conversion 差在哪？":"Conversion 描述限制反應物有多少比例被消耗；selectivity 描述已反應的物料中，有多少朝目標產物方向生成。Yield 則常把目標產物生成量和原始進料量連在一起，因此三者衡量的意義不同。","Newtonian fluid 和 non-Newtonian fluid 差在哪？":"Newtonian fluid 在固定溫度與壓力下，剪應力和剪切速率呈線性關係，比例常數就是黏度，而且黏度不隨剪切速率改變。Non-Newtonian fluid 的表觀黏度則可能隨剪切速率或時間改變，例如 shear thinning、shear thickening 或具有 yield stress。","shear stress 對 Newtonian fluid 的 constitutive equation？":"對牛頓流體，剪應力和速度梯度成正比，常寫成 τ=μ du/dy；若把方向符號納入，實際正負號會依座標與應力定義而定。μ 是動力黏度，代表流體對剪切變形的阻力。","continuity equation 表達什麼守恆？":"Continuity equation 表達質量守恆，也就是控制體內質量累積等於流入減流出。對穩態、不可壓縮流體，常可簡化為速度場散度等於零。","heat transfer 三種模式？":"三種基本熱傳模式是傳導、對流與輻射。傳導是由溫度梯度造成的分子尺度能量傳遞；對流是流體整體運動和邊界層傳熱共同造成；輻射則透過電磁波傳遞，不需要介質。","Fourier’s law 在說什麼？":"Fourier 定律描述傳導熱通量和溫度梯度成正比，方向由高溫指向低溫，常寫成 q''=−k∇T。k 是熱導率，負號表示熱流方向和溫度增加方向相反。","Fick’s first law 在說什麼？":"Fick 第一定律描述擴散通量和濃度梯度成正比，方向由高濃度往低濃度，常寫成 J_A=−D_AB∇C_A。D_AB 是擴散係數，代表分子擴散能力。","Nu、Sh、Re 各自大致代表什麼？":"Reynolds number 比較慣性效應和黏滯效應，用來描述流況；Nusselt number 表示對流熱傳相對於純導熱的強弱；Sherwood number 則是質傳版本，表示對流質傳相對於分子擴散的強弱。","Biot number 的物理意義？":"Biot number 比較物體內部導熱阻力和外部對流熱阻力，常寫成 Bi=hL_c/k_s。Bi 很小時，物體內部溫度梯度相對小，因此可近似使用 lumped-capacitance method。","mass transfer coefficient 和 diffusivity 是同一個東西嗎？":"不是。Diffusivity 是分子尺度的傳質性質，描述物種因濃度梯度而擴散的能力；mass-transfer coefficient 則是把邊界層、流況與幾何等效應整合成的系統參數，因此會隨操作條件改變。","boundary layer 是什麼？":"Boundary layer 是靠近固體表面、速度或溫度／濃度梯度很大的薄區域。因 no-slip condition，流體速度從壁面零值逐漸過渡到主流速度；同樣概念也可延伸到 thermal boundary layer 和 concentration boundary layer。","蒸餾分離的核心驅動是什麼？":"蒸餾利用各成分在氣液平衡下揮發傾向不同來分離，核心可用 relative volatility 描述。較易揮發的成分在氣相中相對富集，透過反覆氣化與冷凝可以提高純度；所以比只說『沸點不同』更完整。","absorption 和 adsorption 差在哪？":"Absorption 是物質進入另一相的體相，例如氣體溶解進液體；adsorption 則主要發生在固體或液體表面，分子附著在界面上。兩者機制與設備設計因此不同。","liquid-liquid extraction 需要什麼基本條件？":"液液萃取通常需要兩個彼此不互溶或只有限互溶的液相，並且溶質在兩相之間具有有利的分配係數與選擇性。萃取後還要能有效相分離，因此溶劑密度、黏度與互溶性也很重要。","counter-current heat exchanger 為什麼常比 co-current 有效率？":"逆流式熱交換器讓兩股流體沿整個設備維持較大的平均溫差，因此在相同傳熱面積與傳熱係數下，通常有較大的對數平均溫差，傳熱效率較好，也能達到更靈活的出口溫度組合。","open-loop 和 closed-loop control 差在哪？":"Open-loop control 不利用輸出結果回頭修正輸入，因此結構簡單，但對 disturbance 或 model error 較敏感；closed-loop control 會量測輸出並和 setpoint 比較，根據 error 進行 feedback correction，因此通常有較好的擾動抑制能力，但設計不當也可能造成 oscillation 或 instability。","first-order system 的 time constant 代表什麼？":"一階系統的 time constant τ 代表系統反應速度的特徵時間。對單位 step response，經過一個 τ 時，輸出會到達最終變化量的約 63.2%；τ 越小，系統通常反應越快。","ODE 和 PDE 差在哪？":"常微分方程只包含對單一獨立變數的導數，例如只隨時間變化的動態系統；偏微分方程則包含兩個以上獨立變數的偏導數，例如溫度同時隨空間和時間變化的熱傳問題。","Laplace transform 在工程上有什麼用？":"拉普拉斯轉換可以把時間域中的微分方程轉成 s 域的代數方程，讓線性動態系統更容易求解，並且可以直接把初始條件帶進去。工程上常用在控制系統、電路與暫態傳輸問題；在 s 域求得結果後，再用反拉普拉斯轉換回時間域。","eigenvalue / eigenvector 的定義？":"若非零向量 v 經矩陣 A 作用後只改變大小而方向不變，也就是 Av=λv，那麼 λ 是 eigenvalue，v 是對應的 eigenvector。工程上 eigenvalue 常用來描述線性系統的自然模態、穩定性與時間尺度。","Fourier series 的用途？":"Fourier series 可以把週期函數表示成不同頻率的 sine 和 cosine 疊加，因此能把複雜週期訊號分解成簡單諧波。工程上常用在訊號分析，也常搭配 PDE 的 separation of variables 解熱傳或擴散問題。"};

function cleanHintForAnswer(h){
 let t=String(h||'').trim();
 t=t.replace(/^不要只說[^；。]*[；。]?/,'').replace(/^先[^；。]*[；。]?/,'').replace(/^這題[^；。]*[；。]?/,'').replace(/^教授[^；。]*[；。]?/,'');
 return t.trim();
}
function buildCompleteModelAnswer(q,rec=null,seen=new Set()){
 if(!q)return rec?.model||'這題尚無可核對的參考答案。';
 if(LEARNING_CONTENT.answers?.[q.id])return LEARNING_CONTENT.answers[q.id];
 if(COMPLETE_ANSWER_OVERRIDES[q.text])return COMPLETE_ANSWER_OVERRIDES[q.text];
 // Built-in variants only rephrase the same question. Resolve the current parent
 // before falling back to the answer copied when the variant was first built.
 if(q.variantOf&&!seen.has(q.id)){
  seen.add(q.id);const base=ALLQ.find(x=>x.id===q.variantOf);
  if(base&&!seen.has(base.id))return buildCompleteModelAnswer(base,null,seen);
 }
 const raw=String(q.answer||rec?.model||'').trim();
 if(raw)return raw;
 if(q.domain==='personal')return '請用自己的真實經驗回答：先說立場與動機，再交代情境、你採取的具體行動、結果與反思，最後連結到申請方向。這類題目沒有固定標準答案。';
 const points=(q.must||[]).map(g=>g.find(x=>/[一-鿿]/.test(x))||g[0]).filter(Boolean);
 return '這題尚無專門撰寫的完整參考答案。'+(points.length?'可先核對這些重點：'+points.join('、')+'。':'請根據上一題情境與實際資料回答，不能只憑題目推定實驗結果。');
}
function bilingualAnswerFor(q,rec=null){
 // Rebuild old records from current bank content; stored answers must not bypass Chinese corrections.
 const source=q?buildCompleteModelAnswer(q,rec):(rec?.model||'這題尚無可核對的參考答案。');
 return {zh:fullChineseAnswerText(source,q?.domain||rec?.domain),terms:technicalEnglishAnswerText(source,q?.domain||rec?.domain)};
}

function evaluateAnswer(q,answer){
 if(q.domain==='personal') return evaluatePersonal(q,answer);
 const must=q.must||[],nice=q.nice||[]; const hitMust=must.filter(g=>matchGroup(answer,g)); const hitNice=nice.filter(g=>matchGroup(answer,g));
 const partial=semanticPartialCredit(q,answer);
 const mr=must.length?hitMust.length/must.length:1,nr=nice.length?hitNice.length/nice.length:0;
 let grade='g3';
 if(mr>=.9 && (nice.length===0||nr>=.35))grade='g5';
 else if(mr>=.67)grade='g4';
 else if(mr>=.34)grade='g3';
 else if(partial.length)grade='g3';
 else if(answer.trim().length<5)grade='g1';
 else grade='g3'; // 本地規則採保守判定：沒有明確矛盾時，不把自由口說武斷判錯
 let confidence=(answer.length<12||must.length<2)?'低':(mr===1?'高':'中');
 if(mr===0)confidence='低';
 return {grade,confidence,correct:[...hitMust.map(g=>g.join('／')),...partial],missing:must.filter(g=>!matchGroup(answer,g)).map(g=>g.join('／')),bonus:hitNice.map(g=>g.join('／'))};
}
function evaluatePersonal(q,a){

 const hasExample=/例如|像是|當時|我曾|實驗|專題|課程|因為/.test(a); let grade=ratio>=.7&&hasExample?'g5':ratio>=.5?'g4':a.length>35?'g3':a.length>12?'g2':'g1';
 return {grade,confidence:'中',correct:hit.map(g=>g.join('／')),missing:groups.filter(g=>!matchGroup(a,g)).map(g=>g.join('／')),bonus:hasExample?['有具體脈絡或例子']:[]};
}

     if(status) status.innerHTML='<b>目前頁面可能在 App／預覽框架內。</b> 這類內嵌頁面常會直接禁止麥克風，因此瀏覽器不一定會跳出允許視窗。請改用「在瀏覽器開啟」或下載 ZIP 後用 localhost 啟動器。';

     return 'file';
   }
   if(navigator.permissions?.query){
     try{
       const p=await navigator.permissions.query({name:'microphone'});
       if(status){
         if(p.state==='granted') status.textContent='麥克風權限：已允許。按「錄音＋語音轉文字」即可開始。';

       }
       return p.state;
     }catch(_e){}
   }
   if(status) status.textContent='無法預先讀取麥克風權限狀態。可直接按「要求麥克風權限」測試。';
   return 'unknown';

async function fetchFromOpenAlex(query){const url=`https://api.openalex.org/works?search=${encodeURIComponent(query)}&filter=open_access.is_oa:true,has_abstract:true&per-page=50&sort=publication_date:desc`;const r=await fetchTimeout(url,9000);if(!r.ok)throw new Error('OpenAlex 連線失敗');const j=await r.json();return (j.results||[]).map(x=>{const abs=trimAbstract(openAlexAbstract(x.abstract_inverted_index),900);const loc=x.best_oa_location||x.primary_location||{};const link=loc.landing_page_url||loc.pdf_url||x.doi||x.id;return{id:x.id,title:x.title||'',authorString:(x.authorships||[]).slice(0,5).map(a=>a.author?.display_name).filter(Boolean).join(', '),journalTitle:x.primary_location?.source?.display_name||'',pubYear:x.publication_year||'',abstractText:abs,link,provider:'OpenAlex'} }).filter(x=>x.title&&x.link)}

async function fetchRandomPaper(query){
 let items=[];const api=`https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(`(${query}) AND OPEN_ACCESS:Y`)}&format=json&pageSize=50&resultType=core`;
 try{const r=await fetchTimeout(api,9000);if(r.ok){const j=await r.json();items=fromEuropePmc(j)}}catch(e){}
 if(!items.length){try{items=fromEuropePmc(await europePmcJsonp(query,9000))}catch(e){}}

 let p=pickUnseenPaper(items);

function openDashboard(){audioStorageSize().then(sz=>{const rs=state.records;const by={};rs.forEach(r=>by[r.domain]=(by[r.domain]||0)+1);const weak={};[...currentReviewRecords('wrong'),...currentReviewRecords('unclear')].forEach(r=>weak[r.domain]=(weak[r.domain]||0)+1);const top=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,5);app.innerHTML=`<div class="panel"><div class="school-head"><div><h2>我的進度</h2><p>練習紀錄與目前掌握度；啟用同步後可合併手機與電腦進度。</p></div><button class="btn ghost" onclick="goHome()">← 首頁</button></div><div class="dashboard-grid"><div class="metric"><b>${rs.length}</b><small>累積回答</small></div><div class="metric"><b>${currentReviewRecords('wrong').length}</b><small>答錯／不會</small></div><div class="metric"><b>${currentReviewRecords('unclear').length}</b><small>回答不清楚／不完整</small></div><div class="metric"><b>${rs.filter(r=>r.favorite).length}</b><small>收藏題</small></div></div>${reviewSummaryHtml()}<div class="section-title"><div><h2>目前弱項</h2></div></div>${top.length?top.map(([d,n])=>`<div class="record-row"><div><b>${domainName(d)}</b><small>近期需要再練</small></div><div>${n} 題</div></div>`).join(''):'<div class="empty">還沒有足夠資料判斷。</div>'}<div class="answer-tools"><button class="btn red" onclick="openReview('wrong')">複習答錯／不會</button><button class="btn gold" onclick="openReview('unclear')">複習回答不清楚</button><button class="btn secondary" onclick="openReview('pending')">待複核</button><button class="btn red" onclick="clearAllAudio()">清除所有保留錄音</button></div></div>`})} window.openDashboard=openDashboard;

function reviewExportRecords(filter,school=''){
 let rs=[...state.records].sort((a,b)=>ReviewScheduler.recordTime(b)-ReviewScheduler.recordTime(a));
 if(school)rs=rs.filter(r=>r.school===school);
 if(filter==='favorite')return rs.filter(r=>r.favorite);
 if(['wrong','unclear','pending'].includes(filter)){
  // Mastery stays shared across schools; display the selected school's own latest answer.
  const idx=reviewIndex(),seen=new Set();
  return rs.filter(r=>{const key=ReviewScheduler.family(r,idx.byId);if(seen.has(key)||idx.progress.get(key)?.level!==filter)return false;seen.add(key);return true;});
 }
 return filter==='latest'?rs.slice(0,20):rs;
}
function buildReviewDocument(rs,scope={}){
 const scopeText=(SCHOOL[scope.school]?.name||'全部學校／校系')+'｜'+({wrong:'答錯／不會',unclear:'回答不清楚',pending:'待複核',favorite:'我的收藏',latest:'最近紀錄'}[scope.filter]||'複習紀錄');
 const body=rs.map((r,i)=>{
  const q=ALLQ.find(q=>q.id===r.qid)||null;const a=bilingualAnswerFor(q,r);
  return `<article class="review-item"><header class="item-heading"><span class="item-number">第 ${i+1} 題</span><h2>${escapeHtml(fullChineseAnswerText(r.question,r.domain))}</h2><p class="meta">${escapeHtml(SCHOOL[r.school]?.name||'')}｜${escapeHtml(domainName(r.domain))}｜${escapeHtml(gradeText(r.grade))}</p></header>${r.visualKey?renderVisualStimulus(r.visualKey):''}${r.sourceText?`<h3>原英文段落</h3><p>${escapeHtml(r.sourceText)}</p>`:''}<div class="original-answer"><h3>我的回答</h3><p>${escapeHtml(r.answer)}</p></div><h3>需要補充或修正</h3><p>${escapeHtml((r.missing||[]).map(x=>chineseConceptText(x,r.domain)).join('、')||'依下方機制、條件與限制逐項核對。')}</p><section class="answer-chinese"><h3>中文參考回答</h3><p>${escapeHtml(a.zh)}</p>${formulaHelpHtml(q,a.zh).replace('<details class="formula-help">','<details class="formula-help" open>')}</section>${learningNotesHtml(q,r,{print:true})}${r.followups?.length?`<section class="review-followups"><h3>教授可能追問</h3><ul>${r.followups.map(x=>`<li>${escapeHtml(fullChineseAnswerText(x,r.domain))}</li>`).join('')}</ul></section>`:''}</article>`;
 }).join('');
 const style=document.querySelector('style')?.textContent||'';
 return `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究所面試｜中文圖解複習講義</title><style>${style}
 @page{size:A4;margin:15mm}*{box-sizing:border-box}body{display:block;background:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#203647;line-height:1.8;margin:0;padding:28px;max-width:850px;margin-inline:auto;font-size:14px}.review-cover{border-bottom:3px solid #1b4a51;padding-bottom:18px;margin-bottom:28px}.review-cover h1{font-size:26px;margin:0 0 8px}.review-cover p{margin:5px 0;color:#5e7080}.review-item{break-before:page;page-break-before:always;margin-top:28px}.review-item:first-of-type{break-before:auto;page-break-before:auto}.lesson-heading{break-inside:avoid;page-break-inside:avoid;break-after:avoid}.item-number{font-size:12px;color:#437969;font-weight:bold}.item-heading h2{font-size:20px;margin:5px 0;line-height:1.6}.review-item h3{font-size:16px;margin:15px 0 6px;break-after:avoid}.meta{font-size:12px;color:#617184}.review-item p{margin:5px 0;white-space:pre-line;overflow-wrap:anywhere}.original-answer{background:#f3f5f7;padding:12px 16px;margin:15px 0}.answer-chinese{margin:18px 0;border:1px solid #c5d8cd;border-left:4px solid #417c67}.answer-chinese p{font-size:15px;line-height:1.9}.learning-lesson{padding:0;border:0;border-radius:0}.mechanism-figure{break-inside:avoid;page-break-inside:avoid}.mechanism-figure svg{min-width:0;max-width:600px}.mechanism-steps li,.evidence-limit,.recall-check,.term-item{break-inside:avoid;page-break-inside:avoid}.glossary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.term-item{border:1px solid #d3dde4;border-radius:8px;padding:10px;font-size:13px}.term-item p{font-size:12px}.term-original{font-size:11px}.visual-stimulus{break-inside:avoid;max-width:650px}.visual-svg{width:100%;height:auto}.print-action{margin:20px 0;padding:12px 22px;border:0;border-radius:9px;background:#214f57;color:white;font:inherit;cursor:pointer}.review-item{break-inside:auto}.note{font-size:12px;color:#657786}@media print{body{max-width:none;padding:0;font-size:11pt}.print-action,.print-help{display:none}.review-item{margin:0}.glossary-grid{display:block;columns:2;column-gap:12px}.term-item{display:inline-block;width:100%;margin-bottom:8px;padding:8px;line-height:1.5}.term-item p{line-height:1.6}.term-item,.evidence-limit,.recall-check,.answer-chinese{-webkit-print-color-adjust:exact;print-color-adjust:exact}a{color:inherit}.mechanism-figure svg{max-width:560px}p,li{orphans:3;widows:3}}@media(max-width:600px){body{padding:15px}.glossary-grid{grid-template-columns:1fr}}
 </style></head><body><header class="review-cover"><h1>中文圖解複習講義</h1><p>研究所模擬面試 · ${new Date().toLocaleDateString('zh-TW')} · 共 ${rs.length} 題</p><p>匯出範圍：${escapeHtml(scopeText)}</p><p>先讀中文回答，再沿著圖解理解每一步，最後用自我檢查題確認是否真的會了。</p></header><button class="print-action" onclick="window.print()">列印／另存 PDF</button><p class="print-help">在列印視窗的目的地選擇「另存為 PDF」。若視窗沒有自動出現，請按上方按鈕；建議紙張選 A4，並關閉瀏覽器的頁首與頁尾。</p>${body}<p class="note">公式保留必要符號；對應術語可參考每題名詞表。圖解為概念示意，不能代替原始實驗證據。</p></body></html>`;
}
function exportReviewPDF(filter=reviewView.filter,school=reviewView.school){
 const rs=reviewExportRecords(filter,school);if(!rs.length){toast('目前篩選範圍沒有可匯出的題目');return;}
 const w=window.open('','_blank');if(!w){toast('瀏覽器擋住新視窗，請允許此網站開啟複習講義後再試。');return;}
 w.document.write(buildReviewDocument(rs,{filter,school}));w.document.close();
 // Wait for the document, fonts and diagrams before opening the print dialog.
 const print=()=>Promise.resolve(w.document.fonts?.ready).catch(()=>{}).then(()=>setTimeout(()=>{if(!w.closed)w.print();},200));
 if(w.document.readyState==='complete')print();else w.addEventListener('load',print,{once:true});
}
window.exportReviewPDF=exportReviewPDF;


function defaultSyncEndpoint(){
 if(location.protocol==='http:'||location.protocol==='https:') return location.origin+'/api/sync';
 return '';
}
function randomSyncCode(){
 const b=new Uint8Array(18); crypto.getRandomValues(b);
 return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
}
function normalizeEndpoint(v){
 let x=String(v||'').trim().replace(/\/+$/,'');
 if(!x) x=defaultSyncEndpoint();
 return x;
}
function cloudSafeState(){
 const copy=JSON.parse(JSON.stringify(state));
 delete copy.sync;
 return copy;
}
function mergeUniqueBy(arrA,arrB,keyFn){
 const m=new Map();
 for(const x of [...(arrA||[]),...(arrB||[])]) m.set(keyFn(x),x);
 return [...m.values()];
}
function mergeCloudState(remote){
 if(!remote||typeof remote!=='object') return;
 state.records=ReviewScheduler.mergeRecords(state.records,remote.records).map(r=>({...r,reviewBucket:reviewBucketFor(r)}));
 state.seenPapers=[...new Set([...(state.seenPapers||[]),...(remote.seenPapers||[])])].slice(-800);
 const sq={...(remote.seenQuestions||{}),...(state.seenQuestions||{})};
 for(const k of new Set([...Object.keys(remote.seenQuestions||{}),...Object.keys(state.seenQuestions||{})])){
   sq[k]=[...new Set([...(remote.seenQuestions?.[k]||[]),...(state.seenQuestions?.[k]||[])])].slice(-600);
 }
 state.seenQuestions=sq;
 state.onlineEnglish={...(remote.onlineEnglish||{}),...(state.onlineEnglish||{})};
 state.lastOnlineEnglishRefresh={...(remote.lastOnlineEnglishRefresh||{}),...(state.lastOnlineEnglishRefresh||{})};
 state.remoteQuestionSpecs=mergeUniqueBy(state.remoteQuestionSpecs,remote.remoteQuestionSpecs,x=>x.id||x.text||JSON.stringify(x));
 state.lastQuestionBankRefresh=Math.max(state.lastQuestionBankRefresh||0,remote.lastQuestionBankRefresh||0);
 state.stats={...(remote.stats||{}),...(state.stats||{})};
 state.prefs={...(remote.prefs||{}),...(state.prefs||{})};
 if(typeof applyRemoteQuestionSpecs==='function') applyRemoteQuestionSpecs(state.remoteQuestionSpecs||[]);
}
async function syncRequest(method,path,body){
 const ep=normalizeEndpoint(state.sync.endpoint);
 if(!ep) throw new Error('尚未設定同步伺服器網址');
 const url=ep+path;
 const opt={method,headers:{'Content-Type':'application/json'}};
 if(body!==undefined) opt.body=JSON.stringify(body);
 const r=await fetch(url,opt);
 if(r.status===404&&method==='GET') return null;
 if(!r.ok) throw new Error('同步伺服器回應 '+r.status);
 return await r.json();
}
async function cloudSyncNow(showToast=true){
 if(!state.sync.enabled||!state.sync.code) return false;
 try{
   state.sync.status='同步中';
   const remote=await syncRequest('GET','/'+encodeURIComponent(state.sync.code));
   if(remote?.data) mergeCloudState(remote.data);
   const merged=cloudSafeState();
   await syncRequest('PUT','/'+encodeURIComponent(state.sync.code),{data:merged,updatedAt:Date.now()});
   state.sync.lastSync=Date.now();state.sync.status='已同步';
   localStorage.setItem('gradInterviewState',JSON.stringify(state));
   if(showToast)toast('雲端同步完成');
   return true;
 }catch(e){
   state.sync.status='同步失敗：'+e.message;
   localStorage.setItem('gradInterviewState',JSON.stringify(state));
   if(showToast)toast('同步失敗：'+e.message);
   return false;
 }
}
function scheduleCloudSync(){
 if(!state.sync?.enabled||!state.sync.code)return;
 clearTimeout(syncDebounce);
 syncDebounce=setTimeout(()=>cloudSyncNow(false),3500);
}
function createSyncCode(){
 state.sync.code=randomSyncCode();
 state.sync.endpoint=normalizeEndpoint(state.sync.endpoint);
 state.sync.enabled=true;saveState(true);openDataPanel();toast('已建立同步碼，請妥善保存');
}
function enableSyncFromUI(){
 const ep=$('#syncEndpoint')?.value||'',code=($('#syncCode')?.value||'').trim();
 if(code.length<16){toast('同步碼至少 16 個字元');return}
 state.sync.endpoint=normalizeEndpoint(ep);state.sync.code=code;state.sync.enabled=true;saveState(true);
 cloudSyncNow(true).then(()=>openDataPanel());
}
function disableCloudSync(){state.sync.enabled=false;state.sync.status='已停用';saveState(true);openDataPanel()}
async function copySyncCode(){try{await navigator.clipboard.writeText(state.sync.code||'');toast('同步碼已複製')}catch(e){toast('無法自動複製，請手動複製')}}
window.cloudSyncNow=cloudSyncNow;window.createSyncCode=createSyncCode;window.enableSyncFromUI=enableSyncFromUI;window.disableCloudSync=disableCloudSync;window.copySyncCode=copySyncCode;

function openDataPanel(){audioStorageSize().then(sz=>{
 const endpoint=state.sync.endpoint||defaultSyncEndpoint();
 const last=state.sync.lastSync?new Date(state.sync.lastSync).toLocaleString('zh-TW'):'尚未同步';
 app.innerHTML=`<div class="panel"><div class="school-head"><div><h2>資料、同步與空間</h2><p>收藏、錯題、回答紀錄、已看 Paper 與弱項可同步；為節省空間與隱私，錄音不會上傳。</p></div><button class="btn ghost" onclick="goHome()">← 首頁</button></div>
 <div class="dashboard-grid"><div class="metric"><b>${state.records.length}</b><small>回答紀錄</small></div><div class="metric"><b>${state.seenPapers.length}</b><small>Paper 紀錄</small></div><div class="metric"><b>${(sz/1024/1024).toFixed(2)} MB</b><small>本機永久錄音</small></div><div class="metric"><b>${APP_VERSION}</b><small>版本</small></div></div>
 <div class="section-title"><div><h2>跨裝置同步</h2><div class="sub">同一組同步碼可在手機與電腦合併進度。真正跨網路自動同步需要把完整版部署在可持久保存資料的 HTTPS 伺服器；ZIP 已附同步後端。</div></div></div>
 <div class="eval-grid"><div class="eval-box"><h4>同步伺服器</h4><input id="syncEndpoint" value="${escapeHtml(endpoint)}" placeholder="https://你的網站/api/sync" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033"><p class="sub">若本程式與同步後端部署在同一網站，通常不用改。</p></div>
 <div class="eval-box"><h4>同步碼</h4><input id="syncCode" value="${escapeHtml(state.sync.code||'')}" placeholder="第一次使用可建立新同步碼" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033"><p class="sub">同步碼等同於這份練習資料的鑰匙，請不要公開分享。</p></div></div>
 <div class="answer-tools"><button class="btn" onclick="createSyncCode()">建立新的同步碼</button><button class="btn green" onclick="enableSyncFromUI()">連線／合併同步</button><button class="btn secondary" onclick="cloudSyncNow(true)">立即同步</button><button class="btn ghost" onclick="copySyncCode()">複製同步碼</button><button class="btn red" onclick="disableCloudSync()">停用同步</button></div>
 <div class="disclaimer"><b>狀態：</b>${escapeHtml(state.sync.status||'尚未啟用')}｜<b>上次成功：</b>${escapeHtml(last)}<br>系統採「合併」而不是單向覆蓋；手機與電腦各自新增的回答、收藏和 Paper 紀錄會盡量保留。音檔永遠只留在錄音那台裝置。</div>
 <div class="section-title"><div><h2>題庫更新</h2><div class="sub">內建題庫已在 v15 擴充；額外的「已驗證更新包」每 2 天自動檢查一次。Paper 仍是每次即時抽取，英文素材每 2 天更新。</div></div></div>
 <div class="answer-tools"><button class="btn secondary" onclick="refreshQuestionBank(true)">🔄 立即檢查題庫更新</button><span class="pill">本機核心題：${ALLQ_BASE.length}</span><span class="pill">含題型變化：約 ${ALLQ.length}</span></div>
 <div class="section-title"><div><h2>手動備份</h2></div></div><div class="answer-tools"><button class="btn" onclick="exportData()">📤 匯出 JSON 備份</button><button class="btn secondary" onclick="document.querySelector('#importFile').click()">📥 匯入備份</button><button class="btn red" onclick="clearAllAudio()">只清除錄音</button></div>
 <div class="disclaimer">即使未部署雲端同步，也可用 JSON 在裝置間搬移。錄音不放進 JSON，避免檔案過大。</div></div>`;
})}
window.openDataPanel=openDataPanel;
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`研究所面試練習紀錄_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)} window.exportData=exportData;
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.records)throw new Error('格式不符');Object.assign(state,j);state.records=ReviewScheduler.mergeRecords(state.records,[]);saveState();toast('匯入完成');showHome()}catch(err){toast('匯入失敗：'+err.message)}e.target.value=''})

refreshQuestionBank(false).catch(()=>{});
if(state.sync?.enabled&&state.sync?.code){setTimeout(()=>cloudSyncNow(false),1800);setInterval(()=>cloudSyncNow(false),60000);}
if('serviceWorker' in navigator && (location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.querySelector('#installAppBtn');if(b)b.classList.remove('hidden');});
async function installPwaApp(){
 if(!deferredInstallPrompt){toast('此瀏覽器目前沒有提供安裝提示；可用瀏覽器選單的「加入主畫面／安裝 App」');return;}
 deferredInstallPrompt.prompt();
 try{await deferredInstallPrompt.userChoice;}catch(_e){}
 deferredInstallPrompt=null;const b=document.querySelector('#installAppBtn');if(b)b.classList.add('hidden');
}
window.installPwaApp=installPwaApp;
showHome();
</script>
