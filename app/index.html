const VISUAL_QUESTIONS=[
 VQ('project','看這張 CCK-8 time-course 圖，你會怎麼描述主要結果？','proj_cck_time',['48 h下降|48小時下降','72 h更低|72小時更低','time-dependent|時間效應'],['24 h 約100%以上|24小時接近控制'],'先描述趨勢，不要直接把 viability 下降說成 apoptosis。',A('這張圖顯示 10 μM Pimozide 處理 24 小時時，相對細胞存活指標約為 108%，沒有明顯下降；48 小時降到約 63%，72 小時進一步降到約 43%。因此可以說，Pimozide 對 AGS 細胞的抑制效果會隨處理時間延長而變得更明顯。不過 CCK-8 主要反映細胞代謝活性相關的相對存活狀態，單靠這張圖還不能直接判定細胞死亡型態，更不能直接說是細胞凋亡。'),['24 h 高於 100% 你怎麼解釋？','要證明 apoptosis 你會補什麼？'],null,'mid'),
 VQ('project','24 h 的 CCK-8 約 108%，高於 control，你會怎麼解釋？','proj_cck_time',['不能直接說促進增殖|不等於增殖','metabolic activity|代謝活性','variation|變異'],['technical variation|早期適應'],'不要把 108% 解讀成 Pimozide 一定促進生長。',A('24 小時約 108% 只代表 CCK-8 讀值略高於對照組，不能因此直接說 Pimozide 促進細胞增殖。CCK-8 讀值會受到細胞代謝狀態、細胞數與操作變異等因素影響，所以這個小幅上升可能是早期代謝反應，也可能只是實驗變異。要判斷是否真的具有生物意義，仍需要看生物重複、統計結果，並搭配細胞計數或其他存活率測定方法確認。'),[],null,'hard'),
 VQ('project','看 Fluo-4 圖，你可以下什麼結論？又不能下什麼結論？','proj_fluo4',['胞內Ca增加|intracellular Ca','隨濃度上升|濃度增加'],['不能說粒線體Ca|不是絕對濃度'],'把「觀察到什麼」和「不能證明什麼」都說清楚。',A('Fluo-4 的相對螢光強度由 5、10 到 15 μM 逐步上升，表示 Pimozide 處理後，AGS 細胞內與 Ca²⁺ 相關的訊號增加，而且在目前三個測試濃度下呈現上升趨勢。不過 Fluo-4 量到的是整體胞內 Ca²⁺ 相關訊號，不是粒線體專一性探針，而且本實驗也沒有把螢光值校正成絕對 Ca²⁺ 濃度，所以不能直接說粒線體 Ca²⁺ 增加，也不能只靠這張圖判定 Ca²⁺ 的來源。'),[],null,'mid'),
 VQ('project','如果教授指著 Fluo-4 圖問：「這是 dose-dependent 嗎？」你會怎麼答？','proj_fluo4',['這三點呈上升趨勢|上升','dose-dependent需統計|不能只看三點'],['replicates|trend test'],'避免把三個平均值直接升級成嚴格劑量依賴。',A('就平均值來看，5、10、15 μM 的 Fluo-4 訊號依序上升，因此可以描述為在目前測試濃度下呈現濃度相關的上升趨勢。不過若要嚴格宣稱具有明確的劑量依賴關係，不能只看三個平均值，還需要確認生物重複與統計結果，最好再增加更多濃度點建立較完整的劑量－反應關係。'),[],null,'hard'),
 VQ('project','看 MitoTracker Deep Red 圖，你會怎麼解讀？','proj_mitotracker',['訊號上升|increase','膜電位相關|potential-related'],['粒線體量影響|TMRM|TMRE'],'不要把 MitoTracker 單獨當成 ΔΨm 的專一量測。',A('MitoTracker Deep Red 的相對螢光隨 Pimozide 濃度增加而上升，表示粒線體相關、且會受到膜電位影響的訊號增加。依照目前研究的解讀，這個結果和粒線體膜電位上升相符；但 MitoTracker Deep Red 的訊號也可能受到粒線體總量等因素影響，因此不能只靠這個探針就把膜電位上升當成完全確定的結論。若要更專一地驗證粒線體膜電位，可以再使用 TMRM、TMRE 或 JC-1 等方法。'),[],null,'hard'),
 VQ('project','為什麼看到 MitoTracker 訊號升高，不能直接說「粒線體功能變好」？','proj_mitotracker',['膜電位升高不等於功能好|hyperpolarization','stress|ROS'],['ATP|respiration'],'先分開「訊號方向」與「功能好壞」。',A('膜電位相關訊號升高不等於粒線體功能一定變好。細胞受到壓力時也可能先出現粒線體過極化，而過高的膜電位有時會增加電子洩漏並伴隨活性氧物種上升。因此要判斷粒線體功能是否真的改善，還需要進一步量測氧氣消耗量、三磷酸腺苷生成、呼吸鏈功能，或搭配更專一的膜電位測定方法。'),[],null,'hard'),
 VQ('project','看 MitoSOX 圖，最安全的結論是什麼？','proj_mitosox',['各組高於基準|整體上升','15低於10|非單調'],['不宣稱dose-dependent','變異'],'這題重點是不要硬講 dose-dependent。',A('三個 Pimozide 濃度的 MitoSOX 平均訊號整體都高於對照基準，表示粒線體超氧陰離子相關訊號整體增加，支持粒線體氧化壓力上升。不過 15 μM 的平均值比 10 μM 稍低，因此不能說這是一個嚴格、單調的劑量依賴增加。比較保守而準確的說法是：Pimozide 處理後粒線體氧化壓力相關訊號整體上升，但濃度和訊號之間不是完全線性的關係。'),[],null,'mid'),
 VQ('project','15 μM 的 MitoSOX 比 10 μM 低，你會優先想到哪些可能性？','proj_mitosox',['biological variation|變異','probe/gating|技術','cell death|存活偏差'],['saturation|更多replicate'],'至少提出技術與生物兩類解釋。',A('我會先把可能原因分成技術因素和生物因素。技術上要檢查染色是否一致、圈選分析是否相同、細胞數是否接近，以及探針負載是否穩定；生物上則可能是較高濃度造成更多細胞死亡，導致最後被分析的是較耐受的細胞族群，也可能是反應本身已接近飽和或呈現非線性。因為 15 μM 的變異較大，我會增加生物重複，並在流式分析中加入存活細胞圈選，再確認這個差異是否可重現。'),[],null,'boss'),
 VQ('project','看 NAO 圖，你會怎麼描述？','proj_nao',['訊號明顯上升|increase','15 μM最高|15最高','cardiolipin'],['不能直接數粒線體'],'NAO 不是在顯微鏡下一顆顆數 mitochondria。',A('NAO 訊號隨 Pimozide 濃度增加而明顯上升，其中 15 μM 的增加最明顯，表示與心磷脂及粒線體總量相關的訊號增加。不過 NAO 並不是直接把粒線體一顆一顆計數，所以不能只靠這個結果就證明粒線體數量一定增加。若要更有力地證明粒線體總量增加，可以再搭配 TOM20、VDAC、粒線體 DNA 拷貝數或其他獨立指標。'),[],null,'mid'),
 VQ('project','NAO 15 μM 上升很多，這能直接說 mitochondrial biogenesis 增加嗎？','proj_nao',['不能|不可以','biogenesis需要其他證據|PGC-1α'],['TOM20|mtDNA'],'「mass signal 增加」和「biogenesis 被啟動」是不同層次。',A('不能直接說粒線體生合成增加。NAO 上升只能支持心磷脂或粒線體總量相關訊號增加；粒線體生合成屬於更進一步的機制性結論，還需要 PGC-1α、TFAM、粒線體 DNA 拷貝數、粒線體蛋白質表現等證據共同支持。另外也要排除粒線體腫大、探針累積增加等其他可能解釋。'),[],null,'boss'),

 VQ('experiment','這張 Western blot 你會怎麼判讀？','bio_wb',['target protein增加|目標蛋白上升','loading control穩定|β-actin穩定'],['densitometry|normalize'],'先看 target，再看 loading control，再談定量。',A('目標蛋白的條帶從對照組到較高藥物濃度整體變深，而 β-actin 大致維持相近，因此初步支持目標蛋白表現量增加。不過正式分析不能只靠肉眼判讀條帶深淺，應進行條帶密度定量，先用穩定的上樣內參或合適的總蛋白正規化方法校正，再以生物重複進行統計。也就是說，一張代表性的西方墨點圖可以呈現趨勢，但不足以單獨支持定量結論。'),[],null,'basic'),
 VQ('experiment','如果這張 Western blot 的 β-actin 其實也隨 treatment 改變，會發生什麼問題？','bio_wb',['不能當穩定loading control|normalization錯誤','換內參|total protein'],['validate loading control'],'這題在測你是否知道 control 本身也要被驗證。',A('如果 β-actin 本身也會受到實驗處理影響，就不適合作為穩定的上樣內參，因為用它做正規化可能把真正的差異放大、縮小，甚至產生錯誤結論。這時應改用經過驗證、在各組間穩定的其他內參，或採用總蛋白正規化，並重新確認各組上樣量與轉膜效率是否一致。'),[],null,'hard'),
 VQ('experiment','這張 flow histogram 整體右移，你第一句會怎麼說？','bio_flow',['螢光強度增加|右移','population distribution|族群'],['不能直接等同生物結論'],'先描述資料，不要一開始就把右移翻成機制。',A('我會先客觀描述：處理組的螢光強度分布相較對照組整體向右移，表示被量測的螢光訊號在細胞族群中增加。至於這個增加代表哪一個生物事件，還要依使用的探針種類，以及圈選分析、背景訊號、細胞存活狀態和螢光補償是否適當來判斷，所以不能只看到直方圖右移就直接下機制結論。'),[],null,'basic'),
 VQ('experiment','看到 flow histogram 右移，你會先檢查哪些 control？','bio_flow',['unstained control|未染色','gating','viability'],['single stain|compensation'],'教授常用這題確認你是不是只會看圖。',A('我會先用未染色對照與陰性對照界定背景訊號和自體螢光，再確認各組的圈選條件是否一致，並排除細胞碎屑、雙聯體與死細胞。如果是多色流式分析，還要確認單色染色對照與螢光補償是否正確。只有在這些技術條件都一致時，螢光分布的右移才比較能解讀成真正的生物訊號差異。'),[],null,'hard'),
 VQ('cellbio','請判讀這張 Annexin V/PI 四象限圖。','bio_annexin',['左下存活|viable','右下early apoptosis|早期凋亡','右上late apoptosis|晚期凋亡'],['左上膜受損'],'先把四象限說對。',A('左下象限的 Annexin V−／PI− 約 64%，通常視為存活細胞；右下象限 Annexin V+／PI− 約 20%，常代表早期細胞凋亡；右上雙陽性約 12%，常見於晚期細胞凋亡或次級壞死；左上 Annexin V−／PI+ 約 4%，則代表細胞膜完整性已受損的族群。實際判讀時仍要結合適當的圈選對照與實驗時間點，不能只看四象限比例就下完整機制結論。'),[],null,'mid'),
 VQ('cellbio','這張 Annexin V/PI 圖能不能單獨證明 apoptosis 的完整機制？','bio_annexin',['不能|不可以','phenotype|死亡表型','caspase|PARP'],['time course'],'四象限能支持死亡型態，但不是完整 pathway。',A('不能。Annexin V／PI 可以支持細胞膜上的磷脂醯絲胺酸外翻，以及細胞膜完整性改變等死亡表型，但它不能單獨證明完整的細胞凋亡路徑。若要進一步證明細胞凋亡機制，還可以檢測半胱天冬酶活化、PARP 裂解、粒線體相關事件，或加入抑制劑與回復實驗來驗證。'),[],null,'hard'),
 VQ('molbio','看這兩條 qPCR amplification curve，哪個樣本起始模板較多？為什麼？','bio_qpcr',['Sample A','較早Cq|較早threshold','起始模板較多'],['efficiency相近'],'前提是 amplification efficiency 可比較。',A('樣本 A 較早進入指數上升期，並且較早跨過相同的螢光閾值，因此它的 Cq／Ct 值較小。在兩組擴增效率相近的前提下，這表示樣本 A 的起始模板量較多。不過如果兩組擴增效率差異很大，就不能只根據 Cq／Ct 值直接比較起始模板量。'),[],null,'mid'),
 VQ('molbio','如果 Sample A 和 B 的 amplification efficiency 不一樣，還能直接用 ΔΔCt 嗎？','bio_qpcr',['不能直接|需效率相近','amplification efficiency'],['standard curve'],'先說 ΔΔCt 的重要假設。',A('不建議直接使用傳統 ΔΔCt 方法，因為這個方法假設目標基因和內參基因的擴增效率相近且穩定。若兩者擴增效率不同，應先用標準曲線確認各自的效率，必要時改用具有效率校正的計算方法，否則最後得到的倍數變化可能出現系統性偏差。'),[],null,'hard'),
 VQ('biochem','看這張 Michaelis–Menten 圖，competitive inhibitor 對 Km 與 Vmax 的影響是什麼？','bio_mm_comp',['Km上升|apparent Km increase','Vmax不變|same Vmax'],[], '曲線右移，但高受質時可以追上。',A('典型的競爭性抑制會使表觀 Km 上升，也就是需要更高的受質濃度才能達到相同反應速率。因為提高受質濃度可以和抑制劑競爭酵素的活性位，所以在足夠高的受質濃度下仍可以接近原本的 Vmax，因此 Vmax 理論上不變。圖形上通常表現為曲線向右移，但在很高的受質濃度時仍趨近相同的最大反應速率。'),[],null,'mid'),
 VQ('physiology','請指出這張 action potential 圖中的 depolarization、repolarization 和 after-hyperpolarization。','phys_ap',['上升段depolarization|去極化','下降段repolarization|再極化','低於resting after-hyperpolarization|過極化'],['Na|K'],'先描述曲線，再連到離子通道。',A('膜電位超過閾值後快速上升到正電位的階段是去極化，主要是電壓閘控鈉離子通道開啟，使 Na⁺ 大量流入細胞；之後膜電位下降的階段是再極化，主要和鈉離子通道失活以及 K⁺ 外流有關。再極化後短暫低於靜止膜電位的部分稱為後過極化，通常是因為 K⁺ 通透性仍暫時維持在較高狀態。'),[],null,'basic'),
 VQ('physiology','如果 extracellular Na⁺ 明顯降低，這張 action potential 最可能哪一部分改變？','phys_ap',['peak下降|overshoot下降','Na driving force下降'],['upstroke'],'想 depolarization 的 Na⁺ driving force。',A('細胞外 Na⁺ 濃度降低會減少 Na⁺ 的電化學驅動力，因此以 Na⁺ 為主要去極化離子的快速動作電位，其上升速度與峰值通常都會下降。這不只是靜止膜電位改變的問題，更重要的是鈉離子通道開啟時能產生的向內鈉離子電流變小，所以去極化幅度會受到限制。'),[],null,'hard'),
 VQ('physiology','這張氧合血紅素曲線右移代表什麼？','phys_o2',['親和力下降|affinity decrease','釋氧增加|unloading'],['CO2|H+|temperature|2,3-BPG'],'先講生理意義，再舉造成右移的因素。',A('曲線右移表示在相同氧分壓下，血紅素的氧飽和度較低，也就是血紅素對氧氣的親和力下降，因此更容易把氧氣釋放到周邊組織。二氧化碳增加、氫離子增加、溫度升高，以及 2,3-BPG 增加，都會促使氧合血紅素解離曲線向右移。'),[],null,'basic'),
 VQ('experiment','看這張 rescue experiment，如果 Drug 增加 ROS，而加 scavenger 後 ROS 降回接近基準，能說明什麼？','bio_rescue',['scavenger逆轉ROS|rescue','ROS參與|支持'],['因果仍需下游表型'],'介入比單純 correlation 更強，但還要看你要證明的真正 endpoint。',A('這表示加入清除劑後，可以把藥物引起的活性氧物種增加拉回來，支持這個氧化訊號確實能受到外加介入所調控。不過如果研究問題是『活性氧物種是否造成某個下游表型』，還需要進一步確認清除劑是否也能同時回復那個下游表型。只有活性氧物種本身下降，還不足以證明它就是造成下游效應的因果中介。'),[],null,'boss'),

 VQ('reaction','由這張 Arrhenius plot 可以得到什麼資訊？','chem_arrhenius',['線性|ln k vs 1/T','slope -Ea/R|活化能'],['intercept ln A'],'斜率不是 Ea 本身，要注意負號與 R。',A('阿瑞尼士方程式取自然對數後可以寫成 ln k = ln A − Ea／R·(1／T)。因此如果把 ln k 對 1／T 作圖得到近似直線，直線斜率就是 −Ea／R，可以用來估算活化能；截距則對應 ln A。斜率越負、絕對值越大，代表估算出的活化能越高。'),[],null,'mid'),
 VQ('reaction','如果 Arrhenius plot 出現明顯彎曲，你會想到什麼？','chem_arrhenius',['mechanism change|機構改變','mass transfer|傳質限制','temperature range'],['non-Arrhenius'],'不要硬套一條直線。',A('如果阿瑞尼士圖明顯彎曲，我會先懷疑不同溫度區間可能出現反應機構改變、催化劑狀態改變，或外部與內部質傳限制，使觀察到的表觀動力學發生改變；另一種可能是量測溫度範圍太廣，無法用單一組阿瑞尼士參數描述。這種情況下不應直接用一條直線硬求單一活化能，而應先確認不同溫度區間是否存在不同控制步驟。'),[],null,'hard'),
 VQ('thermo','看這張 binary x–y VLE 圖，為什麼 equilibrium curve 在 y=x 上方代表 A 較揮發？','chem_vle',['vapor richer A|氣相A較多','yA>xA'],['relative volatility >1'],'比較同一平衡點的液相與氣相組成。',A('在同一平衡狀態下，如果平衡曲線位於 y=x 對角線上方，就表示 yA 大於 xA，也就是氣相中的 A 莫耳分率高於液相中的 A 莫耳分率。這代表 A 相對比較容易進入氣相，也可以理解為 A 相對於另一成分的相對揮發度大於 1。這正是蒸餾能透過反覆氣液平衡，逐步讓氣相富集較易揮發成分的基礎。'),[],null,'mid'),
 VQ('unitops','如果 equilibrium curve 越靠近 y=x，蒸餾分離通常會變容易還是困難？','chem_vle',['更困難|harder','relative volatility接近1'],['more stages|reflux'],'曲線與對角線距離反映氣液組成差異大小。',A('會更困難。當平衡曲線越靠近 y=x 對角線時，同一平衡級的氣相組成和液相組成越接近，表示相對揮發度越接近 1，因此每一級能產生的富集效果越小。若仍要達到相同的分離純度，通常需要更多理論級數、提高回流比，或改用其他更適合的分離方法。'),[],null,'mid'),
 VQ('control','比較 Step response A 和 B，哪一個比較快？哪一個 overshoot 較大？','chem_pid',['A較快|A faster','A overshoot較大|overshoot'],['B慢但平穩'],'先比較 rise time 與 overshoot，不要只說誰比較好。',A('響應 A 上升得比較快，但明顯超過設定值，而且伴隨一定程度的振盪，因此超越量較大；響應 B 上升較慢，但幾乎是平順地接近設定值。哪一個比較好不能只看反應快慢，而要依系統需求，在響應速度、超越量、整定時間與魯棒性之間做取捨。'),[],null,'basic'),
 VQ('control','如果系統出現像 Response A 那樣的大 overshoot，你會從 PID 哪些方向調整？','chem_pid',['降低P或I|reduce gain','增加D|damping'],['anti-windup'],'沒有唯一答案，要說調參方向與副作用。',A('如果超越量太大，可以考慮降低比例增益、減弱積分作用，或增加適量的微分作用來提高阻尼；如果存在積分飽和，也應加入抗積分飽和措施。不過 PID 參數彼此會互相影響，所以不能只改一個參數就保證所有性能都變好，還需要同時評估響應速度、穩態誤差、振盪程度與雜訊敏感度。'),[],null,'hard'),
 VQ('unitops','這張 ΔP–velocity 圖在哪裡開始 fluidization？你怎麼判斷？','chem_fluidized',['pressure drop plateau|壓降平台','minimum fluidization velocity|最小流化速度'],['drag balances effective weight'],'從上升轉為平台的轉折附近判斷。',A('在較低表觀流速時，床層仍接近固定床狀態，因此壓降會隨流速增加而上升。當曲線開始由上升轉為近似平台的轉折附近，就是最小流化速度所在的區域。此時流體對顆粒的阻力大致平衡顆粒床的有效重量，之後再提高流速主要使床層膨脹，而總壓降不再像固定床階段那樣明顯增加。'),[],null,'mid'),
 VQ('reaction','這張 RTD 有明顯長尾，你會怎麼解讀？','chem_rtd',['long tail|長尾','dead zone|滯留區','nonideal flow|非理想'],['broad residence time'],'RTD 不只看平均值，也要看分布形狀。',A('E(t) 在峰值之後出現明顯長尾，表示有一部分流體在反應器中的停留時間遠長於主要流體，可能存在滯留區、混合較慢的區域，或整體停留時間分布過寬。這代表實際反應器已偏離理想流動。後續可以計算平均停留時間與變異數，並把實際停留時間分布和理想連續攪拌槽反應器、理想塞流反應器的理論分布比較，以判斷非理想流動的程度。'),[],null,'hard'),
 VQ('unitops','這張 pump curve 和 system curve 的交點代表什麼？','chem_pump',['operating point|操作點','head相等|泵浦揚程等於系統需求'],['flow rate'],'系統會自然落在兩者可同時滿足的位置。',A('泵浦特性曲線和系統曲線的交點就是實際操作點，因為在這個流量下，泵浦能提供的揚程正好等於管路系統需要克服的總揚程。當管路阻力改變時，系統曲線的位置或斜率也會改變，因此新的交點會決定新的實際流量與操作揚程。'),[],null,'basic'),
 VQ('unitops','如果管路阻力增加，pump operating point 一般會怎麼移？','chem_pump',['system curve上移/變陡|resistance increase','flow rate下降|流量下降'],['head change'],'固定轉速、同一 pump curve 下回答。',A('在泵浦轉速與泵浦特性曲線都不變的情況下，管路阻力增加會使系統曲線變得更陡或向上移動，因此它和泵浦曲線的交點通常會往較低流量方向移動，而操作揚程往往會提高。實際改變幅度仍取決於系統中的靜揚程和摩擦損失各占多少比例。'),[],null,'hard'),
 VQ('transport','請比較圖中的 Newtonian、shear-thinning、shear-thickening。','chem_rheology',['Newtonian線性|linear','shear-thinning表觀黏度下降','shear-thickening表觀黏度上升'],[], '斜率/τ÷γ̇ 可以連回 apparent viscosity。',A('牛頓流體的剪應力和剪切速率呈線性關係，因此黏度在固定條件下可以視為常數；剪切變稀流體隨剪切速率增加，表觀黏度會下降；剪切增稠流體則相反，剪切速率越高，表觀黏度越高。判讀這張圖時不能只比較曲線高低，而要看剪應力和剪切速率之間的關係，以及曲線相對線性關係的彎曲方式。'),[],null,'mid'),
 VQ('transport','如果要塗布一個黏著劑，你為什麼可能希望它有 shear-thinning 行為？','chem_rheology',['施工時黏度下降|易塗布','靜置時黏度較高|不流掛'],['processability'],'把 rheology 和實際操作連起來。',A('如果黏著劑具有剪切變稀特性，在塗布或攪拌時剪切速率提高，表觀黏度會下降，因此材料比較容易流動、鋪展和塗得均勻；停止施力後，黏度再回升，則有助於減少流掛並維持塗層形狀。所以剪切變稀行為可以同時兼顧施工操作性與靜置穩定性。'),[],null,'mid'),
 VQ('transport','看 counter-current heat exchanger 的溫度分布，為什麼逆流常比並流有效？','chem_hex',['temperature driving force較均勻|溫差','LMTD較大'],['outlet temperature'],'注意橫軸沿 hot stream，所以 cold stream 實際方向相反。',A('逆流配置可以讓熱流體和冷流體在整個換熱器長度上維持較均勻、通常也較大的溫差驅動力，因此在總傳熱係數與面積乘積相同時，逆流通常具有較大的對數平均溫差，換熱效果也較好。另外，逆流配置還可能讓冷流體出口溫度接近、甚至高於熱流體出口溫度，這在並流配置下通常無法達成。'),[],null,'mid'),
 VQ('reaction','這張 ideal PFR concentration profile 告訴你什麼？','chem_pfr',['concentration沿volume下降|濃度下降','local rate changes|局部速率'],['no axial mixing'],'PFR 不是整支反應器都等於出口濃度。',A('在理想塞流反應器中，反應物濃度會沿著反應器體積逐步下降，因此局部反應速率也會隨位置改變。這和理想連續攪拌槽反應器的完全混合假設不同，因為連續攪拌槽反應器內部濃度可視為均一，並且等於出口濃度。對正反應級數而言，塞流反應器前段較高的反應物濃度可以維持較高的局部反應速率。'),[],null,'basic'),
 VQ('reaction','看 ln(C/C₀) 對 time 幾乎成一直線，你會怎麼判斷反應級數與 k？','chem_firstorder',['first-order|一階','slope -k|斜率'],['k約0.2 min-1|0.2'],'用 integrated rate law。',A('如果 ln(C／C₀) 對時間作圖呈現良好線性，表示這組資料和一階反應的積分速率式 ln(C／C₀)=−kt 相容，因此直線斜率就是 −k。這張模擬圖在 0 到 10 分鐘之間大約下降 2.0，所以可以估算 k 約為 0.20 min⁻¹。不過正式判斷反應級數時仍應進行線性回歸，並和其他可能的反應級數模型比較，而不是只靠目測。'),[],null,'mid')
];

VISUAL_QUESTIONS.push(
 VQ('experiment','看這張藥物劑量－反應曲線，你會怎麼描述？','bio_dose_response',['濃度增加存活下降|劑量反應','半最大抑制濃度'],['不能只靠單一點'],'先說整體趨勢，再說半最大抑制濃度的大概位置與限制。',A('這張圖顯示隨著藥物濃度增加，細胞相對存活率逐步下降，呈現明顯的濃度相關抑制趨勢。由圖形粗略估計，細胞存活率降到約一半的位置大約落在 7.5 到 10 μM 之間，因此半最大抑制濃度大致在這個區間。不過正式的半最大抑制濃度不應只靠目測，而應使用足夠的濃度點與生物重複，再以適當的非線性迴歸模型估算並提供信賴區間。'),[],null,'mid'),
 VQ('experiment','如果要從這張 dose–response curve 選後續機制實驗濃度，你會怎麼選？','bio_dose_response',['避免過度毒性|保留存活細胞','低中高濃度|梯度'],['機制不是只看IC50'],'不能只回答「直接選半最大抑制濃度」。',A('我不會只固定選半最大抑制濃度，而會依研究目的選擇一組能代表低、中、高效應的濃度。做早期機制實驗時，通常會避免選擇造成大量細胞死亡的濃度，因為嚴重細胞損傷可能讓量到的訊號只是次級效應。比較理想的是保留足夠存活細胞，同時又能產生可重現的生物變化，再搭配時間序列確認事件先後。'),[],null,'hard'),
 VQ('cellbio','看這張細胞生長曲線，Treatment 的效果你會怎麼描述？','bio_growth',['後期增長受抑制|growth inhibition','不能直接等於死亡'],['時間效應'],'先區分「細胞數沒有增加」和「細胞被殺死」。',A('對照組的相對細胞數隨時間持續增加，而處理組在 24 小時後增加速度明顯變慢，48 到 72 小時幾乎不再上升，甚至略有下降。因此可以說處理會抑制細胞族群的淨增加。不過這張圖本身不能區分是細胞增殖被抑制、細胞週期停滯，還是細胞死亡增加；若要分辨機制，需要再搭配細胞週期、細胞死亡與直接細胞計數等實驗。'),[],null,'mid'),
 VQ('cellbio','如果 Treatment 72 h 比 48 h 稍低，你可以直接說細胞死亡增加嗎？','bio_growth',['不能直接|需死亡指標','變異'],['Annexin V|caspase'],'淨細胞數下降只是結果，死亡機制要另外驗證。',A('不能直接這樣下結論。處理組從 48 到 72 小時略為下降，表示淨細胞數或相關訊號減少，但造成減少的原因可能包括細胞死亡、細胞脫落、測量變異或代謝狀態改變。若要說細胞死亡增加，還需要用 Annexin V／PI、半胱天冬酶活化、膜完整性或其他死亡指標進一步確認。'),[],null,'hard'),
 VQ('cellbio','這張 DNA content 圖顯示 Treatment 在哪個細胞週期區域累積？','bio_cellcycle',['4N DNA增加|G2/M增加'],['不能分G2和M'],'先根據 DNA 含量判斷，不要過度解讀。',A('處理組在較高 DNA 含量、約 4N 的區域相對增加，因此可以說細胞在 G2／M 區域累積，支持 G2／M 細胞週期停滯的可能性。不過單純用 DNA 含量無法把 G2 期和 M 期完全分開，所以若要進一步判斷是停在 G2 還是有絲分裂期，還需要加入磷酸化組蛋白 H3、cyclin B1 等額外指標。'),[],null,'mid'),
 VQ('cellbio','如果 sub-G1 population 增加，你會怎麼解讀？','bio_cellcycle',['DNA含量低|DNA片段化','凋亡可能'],['不能單獨證明'],'sub-G1 是線索，不是完整細胞凋亡證據。',A('如果小於 G1 DNA 含量的族群明顯增加，通常表示有較多細胞出現 DNA 片段化，因此常被視為細胞凋亡的線索。不過 sub-G1 會受到固定、染色與碎屑排除方式影響，所以不能單靠這個區域就證明細胞凋亡，最好再搭配 Annexin V／PI、半胱天冬酶或 PARP 裂解等結果。'),[],null,'hard'),
 VQ('experiment','這張 ELISA standard curve 要怎麼用來求未知樣本濃度？','bio_elisa_std',['由吸光值內插|標準曲線範圍'],['稀釋倍數'],'先確認未知值落在標準曲線可靠範圍內。',A('先用已知濃度的標準品建立吸光值與濃度之間的回歸關係，再把未知樣本的吸光值代入曲線做內插。以這張模擬圖來看，若未知樣本吸光值約為 1.00，濃度大約落在 50 ng／mL 左右。正式分析時還要使用實際回歸方程式，確認未知樣本落在標準曲線的可靠範圍內，並乘回任何前處理的稀釋倍數。'),[],null,'basic'),
 VQ('experiment','如果未知樣本吸光值高於最高標準點，你應該怎麼做？','bio_elisa_std',['不能外推|稀釋重測'],['線性範圍'],'不要直接拿曲線外的點硬算。',A('如果未知樣本的吸光值高於最高標準點，我不會直接把標準曲線向外延伸估算，因為那已經超出經驗證的定量範圍。比較合適的做法是把樣本適當稀釋後重新測量，讓吸光值落回標準曲線的可靠區間，再依稀釋倍數換算原始濃度。'),[],null,'mid'),
 VQ('molbio','這張 volcano plot 上，右上與左上區域分別代表什麼？','bio_volcano',['右上上調且顯著|左上下調且顯著','變化幅度與顯著性'],['多重比較'],'先分清楚橫軸方向和縱軸高度。',A('火山圖的橫軸代表表現變化幅度，往右是上調、往左是下調；縱軸越高代表統計顯著程度越高。因此右上方通常代表變化幅度大而且顯著上調的基因，左上方則代表顯著下調的基因。真正篩選候選基因時，還要同時設定變化幅度門檻與經多重比較校正後的顯著性門檻。'),[],null,'mid'),
 VQ('molbio','為什麼 volcano plot 不能只挑 p 值最小的基因？','bio_volcano',['變化幅度|多重比較'],['生物意義'],'統計顯著不等於生物效應大。',A('因為 p 值只反映資料和虛無假設的不相容程度，不代表變化幅度一定大。樣本數很大時，很小的表現差異也可能非常顯著，所以還需要同時看表現倍數變化、信賴區間、多重比較校正以及基因的生物意義，才比較能挑出真正值得後續驗證的候選基因。'),[],null,'hard'),
 VQ('experiment','這張 FSC/SSC 圖裡哪一群比較像 debris？你會怎麼 gate？','bio_fscssc',['低FSC低SSC是碎屑|主群圈選'],['doublet discrimination'],'先分主要細胞群和低散射碎屑。',A('左下方低前向散射、低側向散射的小群比較像細胞碎屑；中央偏右的高密度群則比較像主要細胞族群。我會先用前向散射與側向散射把主要細胞群圈出來、排除明顯碎屑，之後再用前向散射面積與高度或寬度做雙聯體排除，必要時再加入存活染劑排除死細胞，最後才分析目標螢光訊號。'),[],null,'mid'),
 VQ('experiment','為什麼不同 treatment 組不能隨意用完全不同的 FSC/SSC gate？','bio_fscssc',['選樣偏差|一致規則'],['形態改變時需記錄'],'圈選可以因生物學改變調整，但規則要可解釋、可重現。',A('如果每一組都依照想得到的結果任意改變圈選範圍，就可能產生選樣偏差，讓不同組別其實比較的是不同細胞族群。比較好的做法是先建立一致、可重現的圈選策略並盡量套用到所有組別；如果處理確實會造成細胞大小或顆粒度改變而需要調整，也應清楚記錄規則並使用額外的存活與雙聯體排除控制來支持。'),[],null,'hard'),
 VQ('cellbio','這張 phosphorylation time course 顯示的訊號特徵是什麼？','bio_signal_time',['快速上升後下降|15 min峰值'],['負回饋|去磷酸化'],'先描述時間順序。',A('這個磷酸化訊號在處理後很快上升，大約 15 分鐘達到最高，之後逐步下降並在較晚時間接近基準，屬於暫時性的訊號活化。這種型態可能反映上游刺激快速啟動激酶，之後再受到磷酸酶、負回饋或受體去敏感化等機制關閉。若要確認機制，還需要搭配上游抑制劑或更密集的早期時間點。'),[],null,'mid'),
 VQ('experiment','看這張 phospho/total Western blot，為什麼不能只比較 p-ERK band？','bio_wb_phospho',['要除以total ERK|區分磷酸化與蛋白量'],['loading control'],'磷酸化訊號要以對應 total protein 正規化。',A('只看磷酸化 ERK 的條帶變深，不能確定是 ERK 的磷酸化比例真的增加，還是總 ERK 蛋白本身變多。比較合理的分析是先把磷酸化 ERK 對同一樣本的總 ERK 做正規化，再確認總 ERK 與整體上樣控制都相對穩定。這樣才比較能把變化解讀成蛋白質活化狀態的改變，而不是蛋白質總量差異。'),[],null,'mid'),
 VQ('experiment','這張 phospho/total blot 最支持哪個時間點訊號最強？','bio_wb_phospho',['15 min最強|pERK/total ERK'],['短暫活化'],'不要只看 p-band，先確認 total band 穩定。',A('總 ERK 在各時間點大致穩定，而磷酸化 ERK 在 15 分鐘的條帶最強，因此正規化後最可能也是 15 分鐘的 ERK 活化程度最高。5 分鐘已開始上升，30 分鐘則有所回落，所以整體較符合快速、暫時性的活化型態。正式結論仍應以多次生物重複的條帶密度定量為準。'),[],null,'basic'),
 VQ('physiology','請指出這張心電圖中的 P wave、QRS complex 與 T wave 各代表什麼。','phys_ecg',['P心房去極化|QRS心室去極化|T心室再極化'],['心房再極化被QRS遮蔽'],'依序說電事件，不要直接說肌肉收縮。',A('P 波主要代表心房去極化；QRS 波群主要代表心室去極化；T 波主要代表心室再極化。這些是心臟的電活動，不應直接把波形本身等同於機械收縮。心房再極化通常振幅較小，而且時間上和 QRS 波群重疊，所以在一般心電圖上不容易單獨看見。'),[],null,'basic'),
 VQ('physiology','如果 PR interval 明顯延長，你會優先想到哪一段傳導變慢？','phys_ecg',['房室傳導延遲|AV node'],['第一度房室傳導阻滯'],'PR interval 從心房去極化開始到心室去極化開始。',A('PR 間期延長表示從心房去極化開始到心室去極化開始所需的時間增加，最常先想到房室結或房室傳導系統的傳導變慢。如果每個 P 波之後仍都有 QRS，而且只是 PR 間期固定延長，典型上可符合第一度房室傳導阻滯，但正式診斷還需要實際心電圖與臨床情境。'),[],null,'hard'),
 VQ('physiology','這張左心室壓力－容積環中，寬度大致代表什麼？','phys_pv',['搏出量|EDV-ESV'],['環面積為每搏功'],'先說橫向寬度。',A('壓力－容積環的橫向寬度大致等於舒張末期容積減去收縮末期容積，也就是一次心搏的搏出量。環內的面積則和心室每搏所做的外部機械功有關。因此看到環變寬時，通常表示搏出量增加，但還要一起看舒張末期與收縮末期容積各自如何改變。'),[],null,'basic'),
 VQ('physiology','如果 afterload 增加，PV loop 通常會怎麼改變？','phys_pv',['收縮末期壓力上升|ESV增加','搏出量下降'],['loop變窄'],'假設前負荷與收縮力暫時不變。',A('在前負荷與心肌收縮力暫時不變的情況下，後負荷增加會讓心室必須產生更高壓力才能射血，因此收縮末期壓力會上升，而且通常會留下較多收縮末期容積。結果搏出量下降，壓力－容積環會變得較高、較窄。長期變化則還會受到代償機制影響。'),[],null,'hard'),
 VQ('physiology','這張 flow–volume loop 為什麼比較像 obstructive pattern？','phys_flowvolume',['呼氣峰值下降|呼氣支內凹','阻塞'],['氣道阻力'],'看呼氣支的內凹。',A('和正常曲線相比，這條異常曲線的呼氣峰值流速較低，而且呼氣支呈現明顯內凹，這是氣道阻塞常見的型態，反映呼氣時氣流受到較大阻力。若要進一步判斷阻塞嚴重度，還需要搭配第一秒用力呼氣量、用力肺活量以及兩者比值等肺功能數據。'),[],null,'mid'),
 VQ('physiology','只看 flow–volume loop，能不能直接診斷 asthma？','phys_flowvolume',['不能|需臨床與肺功能','可逆性'],['支氣管擴張劑測試'],'圖形支持阻塞，但病因不只一種。',A('不能。這張圖可以支持阻塞型通氣障礙，但造成阻塞的疾病不只有氣喘，也可能包括慢性阻塞性肺病或其他氣道問題。若要支持氣喘，通常還要結合症狀、肺功能指標，以及支氣管擴張劑後是否具有可逆性等證據。'),[],null,'hard'),
 VQ('physiology','這張口服葡萄糖耐受曲線中，Impaired 組最大的問題是什麼？','phys_glucose',['血糖峰值較高|下降較慢'],['胰島素阻抗|胰島素分泌'],'不要只說「血糖高」。',A('異常組不只血糖峰值比較高，而且在 120 到 180 分鐘仍維持偏高，表示攝入葡萄糖後把血糖拉回基準的能力變差。可能原因包括胰島素分泌不足、周邊組織胰島素敏感性下降，或兩者並存。單靠這張血糖曲線無法直接區分是哪一個機制，還需要搭配胰島素濃度或其他代謝評估。'),[],null,'mid'),
 VQ('physiology','看 renal glucose handling 圖，為什麼 reabsorption 最後會趨近平台？','phys_renal_glucose',['轉運最大量|載體飽和'],['SGLT'],'腎小管轉運蛋白數量有限。',A('腎小管對葡萄糖的再吸收依賴有限數量的轉運系統。當濾過葡萄糖負荷持續增加時，這些轉運蛋白會逐漸接近飽和，因此再吸收速率最後趨近一個最大值，也就是轉運最大量。超過這個能力後，多出的葡萄糖就會開始出現在尿液中。'),[],null,'mid'),
 VQ('physiology','為什麼 glucose excretion 不是等到 Tm 才突然垂直上升，而會有 splay？','phys_renal_glucose',['不同腎元差異|逐步飽和'],['renal threshold'],'真實腎元的轉運能力不完全一致。',A('真實腎臟中的不同腎元並不是在完全相同的血糖濃度下同時達到飽和，而且轉運過程本身也不是理想的瞬間開關。因此在整個腎臟的總體曲線上，葡萄糖排泄會在接近轉運上限之前就逐漸出現，形成一段平滑過渡區，也就是所謂的展延現象。'),[],null,'hard'),
 VQ('unitops','在這張 McCabe–Thiele 圖中，操作線如果更靠近平衡線，代表分離通常變容易還是困難？','chem_mccabe',['更困難|更多理論級數'],['夾點'],'兩條線距離越小，每級能完成的組成改變越有限。',A('操作線越靠近平衡線，代表每一個平衡級可利用的氣液組成差距越小，因此分離的驅動程度降低，通常需要更多理論級數才能達到相同產品純度。當兩條線在某一區域非常接近時，可能形成夾點，使所需級數急遽增加。'),[],null,'mid'),
 VQ('unitops','提高 reflux ratio，在 McCabe–Thiele 圖上通常會帶來什麼取捨？','chem_mccabe',['理論級數下降|能耗增加','回流增加'],['minimum reflux'],'級數和能耗通常是反向取捨。',A('提高回流比通常會讓操作線遠離平衡線，因此在相同分離目標下所需的理論級數可以減少，分離操作也比較有餘裕；但回流量增加會提高再沸器與冷凝器的熱負荷，能耗與設備負荷也會上升。所以設計上通常是在塔板數與操作能耗之間做經濟折衷，而不是一味把回流比提高。'),[],null,'hard'),
 VQ('thermo','看這張 T–x–y 圖，bubble line 與 dew line 中間代表什麼區域？','chem_txy',['氣液兩相區','bubble與dew'],['單相液體與氣體'],'先說兩相區，再說兩側。',A('泡點線和露點線之間是氣液兩相共存區。對固定壓力而言，低於泡點線通常是單一液相；高於露點線通常是單一氣相。當整體組成落在兩相區時，可以用同一溫度下泡點線與露點線對應的組成，分別判斷液相與氣相的平衡組成。'),[],null,'basic'),
 VQ('thermo','在 T–x–y 圖兩相區中，怎麼求 vapor 與 liquid 的平衡組成？','chem_txy',['水平線|bubble交點液相|dew交點氣相'],['槓桿法'],'固定溫度下畫水平線。',A('在固定溫度下畫一條水平線，和泡點線的交點給出平衡液相組成，和露點線的交點給出平衡氣相組成。如果還知道整體組成，則可以再用槓桿法估算兩相各自的相對量。'),[],null,'mid'),
 VQ('unitops','這張 breakthrough curve 什麼時候可以說床層開始 breakthrough？','chem_breakthrough',['C/C0達指定門檻|不是等到1'],['例如0.05或0.1'],'breakthrough 是操作定義，門檻要先講清楚。',A('突破時間通常不是等到出口濃度完全等於入口濃度才定義，而是先指定一個操作門檻，例如出口濃度達到入口濃度的 5% 或 10%。當曲線第一次達到這個門檻時，就可定義為突破時間。實際門檻要依污染物毒性、產品規格與製程需求決定。'),[],null,'mid'),
 VQ('unitops','breakthrough curve 變得很陡和很寬，各代表什麼？','chem_breakthrough',['陡代表質傳區窄|寬代表質傳區寬'],['軸向分散'],'從質傳區寬度來理解。',A('如果突破曲線很陡，表示質傳區相對窄，床層從未突破到接近飽和的轉換較集中，通常代表床層利用比較有效率；如果曲線很寬，則表示質傳區較寬，可能和傳質阻力、軸向分散或吸附動力學較慢有關。實際判斷還要一起看流速、顆粒尺寸與床高。'),[],null,'hard'),
 VQ('unitops','這張 adsorption isotherm 為什麼會逐漸趨近平台？','chem_adsorption',['有限吸附位點|飽和'],['Langmuir'],'平台表示可用位點逐漸被占滿。',A('隨平衡濃度增加，吸附量一開始快速上升，之後逐漸趨近平台，表示吸附材料上的可用位點數量有限，濃度再增加時新增可占據的位置越來越少。這種型態和 Langmuir 型有限位點吸附相符，但要確認模型是否適用，仍應用完整資料分別擬合不同等溫模型並比較。'),[],null,'mid'),
 VQ('unitops','如果這張 isotherm 沒有平台、在高濃度仍持續上升，你會想到什麼？','chem_adsorption',['可能非Langmuir|未達飽和'],['Freundlich'],'不能看到任何曲線都硬套 Langmuir。',A('如果在目前濃度範圍內仍持續上升而沒有明顯平台，可能代表尚未測到吸附飽和區，也可能表示系統不符合簡單的 Langmuir 單層、等能位點假設，例如存在表面異質性或多層吸附。這時應擴大濃度範圍，並比較 Langmuir、Freundlich 等模型的擬合與物理合理性。'),[],null,'hard'),
 VQ('unitops','為什麼 constant-pressure filtration 常把 t/V 對 V 作圖？','chem_filtration',['線性化|斜率與截距'],['濾餅與濾材阻力'],'連回過濾方程式。',A('在常壓過濾、不可壓縮濾餅等簡化假設下，可以把過濾方程式整理成 t／V 對 V 的線性形式。直線斜率主要和濾餅比阻、液體黏度、固體濃度及過濾面積有關，截距則包含濾材阻力。因此把資料線性化後，可以從斜率和截距估算不同阻力貢獻。'),[],null,'mid'),
 VQ('unitops','如果 t/V–V 圖明顯彎曲，你會懷疑什麼？','chem_filtration',['濾餅可壓縮|模型假設失效'],['黏度改變'],'先檢查線性化假設。',A('若圖形明顯偏離直線，我會先檢查常壓是否真的維持、液體黏度是否穩定，以及濾餅是否可視為不可壓縮。可壓縮濾餅的比阻可能隨壓力或時間改變，另外濾材堵塞、濾餅結構逐漸改變也可能造成非線性，因此不能直接套用最簡單的常壓過濾線性式。'),[],null,'hard'),
 VQ('unitops','這張 drying-rate curve 可以分成哪些主要階段？','chem_drying',['定率乾燥期|降率乾燥期','臨界含水量'],['外部與內部傳質'],'先說區段，再解釋控制機制。',A('在較高含水量區，乾燥速率近似維持固定，可以視為定率乾燥期，這時材料表面仍有足夠自由水，乾燥常主要受外部熱質傳控制。當含水量降到臨界含水量後，表面不再持續完全濕潤，進入降率乾燥期，內部水分向表面移動的阻力逐漸變重要，因此乾燥速率下降。'),[],null,'mid'),
 VQ('unitops','提高 air velocity 對 constant-rate drying period 通常有什麼影響？','chem_drying',['外部傳熱質傳增加|乾燥速率提高'],['降率期效果較小'],'區分外部控制與內部控制。',A('在定率乾燥期，表面通常仍接近濕潤狀態，乾燥速率較受外部氣膜的熱傳與質傳控制。因此提高空氣流速通常會降低外部邊界層阻力，使定率乾燥速率上升。不過進入降率乾燥期後，如果主要限制轉為材料內部的水分擴散，單純提高空氣流速的改善效果可能會變小。'),[],null,'hard'),
 VQ('materials','從這張 stress–strain curve 可以讀出哪些重要材料性質？','mat_stress',['彈性模數|降伏|極限抗拉強度|延性'],['韌性'],'至少說斜率、降伏、最大應力、斷裂應變。',A('曲線起始近線性區的斜率可用來估算彈性模數，代表材料剛性；開始出現明顯永久變形的位置和降伏行為有關；曲線最高應力對應極限抗拉強度；斷裂前的應變大小則可反映延性。若把曲線下面積積分，還可和材料吸收能量的韌性相關。'),[],null,'mid'),
 VQ('materials','如果兩材料的 Young’s modulus 一樣，但其中一個斷裂應變大很多，代表什麼？','mat_stress',['剛性相近|延性不同'],['韌性可能較高'],'彈性模數和延性是不同概念。',A('彈性模數一樣表示兩種材料在小變形彈性區的剛性相近，但斷裂應變大很多的材料具有更高延性，能在破裂前承受更大的塑性變形。如果它同時維持足夠的應力水準，應力－應變曲線下面積也可能更大，也就是韌性較高；但韌性不能只靠斷裂應變單獨判斷。'),[],null,'hard'),
 VQ('materials','這張 TGA 圖中 300–400°C 的大幅失重，你會怎麼解讀？','mat_tga',['主要熱分解區|不能直接判單一成分'],['DTG|氣體分析'],'熱重分析告訴你質量何時下降，不直接告訴你掉的是什麼。',A('這張圖在大約 300 到 400°C 出現明顯質量下降，表示樣品在這個溫度區間發生主要的熱分解或揮發事件。不過熱重分析本身只量測質量隨溫度的變化，不能單獨確定是哪一個化學成分分解。若要更精確指認，可搭配微分熱重曲線、差示掃描量熱，或連接質譜與紅外光譜分析逸出氣體。'),[],null,'mid'),
 VQ('materials','TGA 最後還有約 20% residue，這能直接說就是 ash content 嗎？','mat_tga',['不能一定|氣氛與殘炭影響'],['氧化氣氛'],'惰性氣氛下可能留下殘炭。',A('不能直接把殘留量全部等同灰分。若熱重分析是在惰性氣氛中進行，樣品可能形成殘炭，因此最後的殘留物可能同時包含無機灰分與碳化殘渣。若要估算真正灰分，通常需要在氧化氣氛下進一步把有機碳燒掉，或另外做標準灰分測定。'),[],null,'hard'),
 VQ('materials','XRD 圖中峰位和峰寬分別大致告訴你什麼？','mat_xrd',['峰位晶面間距/相別','峰寬晶粒尺寸或微應變'],['Bragg law'],'不要把峰高直接等同含量。',A('繞射峰的位置主要和晶面間距有關，可以透過布拉格定律協助辨識晶相；峰寬則可能受到晶粒尺寸、微應變與儀器展寬等因素影響，較寬的峰常和較小的相干繞射晶域或較大微應變有關。至於峰高會受到很多條件影響，不能單獨直接當成某一晶相含量。'),[],null,'mid'),
 VQ('materials','如果 XRD peak 變寬，你能直接說 crystallinity 下降嗎？','mat_xrd',['不能直接|晶粒尺寸/微應變/儀器因素'],['非晶背景'],'峰寬來源不只結晶度。',A('不能只因為峰變寬就直接說結晶度下降。峰寬可能來自晶粒尺寸變小、微應變增加、缺陷增加，也包含儀器本身的展寬效應。若要評估結晶度，還應看晶體峰與非晶背景的相對貢獻，並使用一致的基線與分析方法。'),[],null,'hard'),
 VQ('reaction','這張 CSTR heat generation/removal 圖的交點代表什麼？','chem_cstr_thermal',['穩態|產熱等於移熱','可能多重穩態'],['stability'],'交點是能量平衡可能解。',A('產熱曲線與移熱曲線的交點表示反應器產生的熱量和系統移除的熱量相等，因此對應可能的穩態溫度。如果兩條曲線有多個交點，就代表能量衡算可能存在多重穩態；但每個交點是否穩定還要再看受到小擾動後，淨產熱是否會把系統拉回該點。'),[],null,'mid'),
 VQ('reaction','為什麼 exothermic CSTR 可能發生 thermal runaway？','chem_cstr_thermal',['溫度升高反應變快|產熱正回饋','移熱跟不上'],['Arrhenius'],'把動力學和能量平衡串起來。',A('放熱反應的速率常隨溫度依阿瑞尼士關係快速上升，所以溫度稍微增加可能讓反應更快、產熱更多，進一步讓溫度再上升，形成正回饋。如果冷卻系統的移熱能力無法跟上產熱增加，原本的穩態可能失去穩定性，溫度就會快速上升而發生熱失控。'),[],null,'boss'),
 VQ('transport','這張 stagnant film 的濃度分布近似線性，代表什麼簡化條件？','chem_film',['穩態一維擴散|擴散係數近似常數','無反應'],['Fick first law'],'線性 profile 通常來自最簡單的穩態擴散假設。',A('近似線性的濃度分布通常符合最簡化的穩態一維分子擴散情況，也就是擴散係數近似常數、膜內沒有化學反應，而且幾何與邊界條件不隨時間改變。在這些條件下，濃度梯度近似固定，因此依費克第一定律，擴散通量也可以近似為常數。'),[],null,'mid'),
 VQ('transport','如果 film thickness 變成原本兩倍、兩端濃度不變，diffusive flux 會怎麼變？','chem_film',['約減半|與厚度反比'],['Fick law'],'在其他條件相同、穩態線性 profile 下回答。',A('在穩態一維擴散、擴散係數與兩端濃度差都不變的情況下，濃度梯度大約等於濃度差除以膜厚，因此膜厚變成兩倍時，濃度梯度會變成原來的一半，依費克第一定律，擴散通量也大約降為一半。'),[],null,'basic'),
 VQ('control','比較這兩條 closed-loop response，哪一個穩定？','chem_unstable',['Damped穩定|振幅衰減','Growing不穩定|振幅增加'],['underdamped'],'看振盪包絡是否逐步縮小。',A('第一條響應雖然有振盪，但振幅會隨時間逐漸縮小，最後回到設定值附近，因此屬於穩定但欠阻尼的系統。第二條響應的振盪幅度反而持續增大，沒有趨向有限的穩態值，因此是不穩定的閉迴路響應。'),[],null,'basic'),
 VQ('control','如果閉迴路振盪幅度持續放大，你會優先檢查什麼？','chem_unstable',['controller gain過高|stability margin不足','delay|sign'],['PID tuning'],'先確認回授方向和穩定性。',A('我會先確認回授方向是否正確，以及控制器增益是否過高，因為正回授或過大的迴路增益都可能造成發散。接著會檢查程序中的時間延遲、模型誤差與感測器問題，並從根軌跡、頻率響應或實際調參結果評估穩定裕度。若是比例積分微分控制器，也會重新降低過強的比例或積分作用，必要時增加適當阻尼。'),[],null,'hard')
);
ALLQ_BASE.push(...VISUAL_QUESTIONS);ALLQ.push(...VISUAL_QUESTIONS);
const FORMAL_VISUAL_RATE={ntuche:.22,ntuibmb:.35,nthuche:.20,nycuphys:.28,nckuche:.24,ncuchem:.18,nchuche:.20,nchubiochem:.30,nsysubio:.32,ccubio:.32,ccuche:.20};
function visualField(q){
 const key=q?.visual||'';
 if(key.startsWith('chem_')||key.startsWith('mat_'))return 'chem';
 if(key.startsWith('bio_')||key.startsWith('phys_'))return 'bio';
 if(key.startsWith('proj_'))return 'project';
 return 'unknown';
}
function visualQuestionsFor(schoolId,type='mixed'){
 const s=SCHOOL[schoolId];if(!s)return [];
 const resolvedType=type==='visual'?'mixed':type;
 return VISUAL_QUESTIONS.filter(q=>{
  const field=visualField(q);
  // v20 hard routing: 生科校系絕不抽化工／材料圖；化工校系絕不抽一般生醫／生理圖。

const V16_EMBEDDED_SPECS=[{"domain":"physiology","text":"PAH clearance 為什麼可以用來近似 renal plasma flow？","answer":"在低濃度時，PAH 不只被腎絲球過濾，也會被近端腎小管主動分泌，因此一次通過腎臟時大部分 PAH 會被清除。於是 PAH clearance 可近似有效腎血漿流量；因為萃取並非百分之百，所以它不是絕對真實的 renal plasma flow。","must":["PAH","過濾","分泌","renal plasma flow"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"biochem","text":"AMPK 在細胞能量不足時通常扮演什麼角色？","answer":"當 AMP/ATP 比例上升代表能量不足時，AMPK 會被活化，促進產生 ATP 的分解代謝路徑，同時抑制耗能的生合成路徑，藉此協助恢復細胞能量平衡。","must":["AMPK","能量不足","ATP","分解代謝"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"molbio","text":"ChIP-qPCR 和 ChIP-seq 的差別是什麼？","answer":"兩者都先用抗體富集與特定蛋白結合的染色質。ChIP-qPCR 針對預先選定的少數基因區域做定量；ChIP-seq 則搭配定序，在全基因組尺度找出可能的結合位置。","must":["ChIP","qPCR","定序","全基因組"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"cellbio","text":"mitophagy 和一般 autophagy 的關係是什麼？","answer":"mitophagy 是選擇性自噬的一種，專門辨識並移除受損或多餘的粒線體。它利用自噬機器把目標粒線體包入自噬體，最後送到溶酶體降解，因此是粒線體品質控制的重要部分。","must":["mitophagy","選擇性自噬","粒線體品質控制"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"experiment","text":"什麼是 primary endpoint？為什麼研究設計最好事先定義？","answer":"primary endpoint 是研究最主要要回答的結果指標。事先定義可以避免看到資料後再挑最有利的結果，降低分析彈性造成的偏差，也讓樣本數與統計分析能圍繞主要研究問題設計。","must":["primary endpoint","事先定義","偏差"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"thermo","text":"Clausius–Clapeyron 關係大致在描述什麼？","answer":"Clausius–Clapeyron 關係描述飽和蒸氣壓隨溫度變化的趨勢，簡化形式會把蒸發焓和 ln vapor pressure 對 1/T 的斜率連結起來。它常用來估算不同溫度下的 vapor pressure。","must":["vapor pressure","溫度","蒸發焓"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"reaction","text":"Damköhler number 的物理意義是什麼？","answer":"Damköhler number 比較 reaction time scale 和 transport 或 flow time scale。值很大代表反應相對快，系統可能受到傳輸或停留時間限制；值很小則代表反應相對慢，kinetics 可能是主要限制。","must":["Damköhler","反應","傳輸","time scale"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"transport","text":"Péclet number 的物理意義是什麼？","answer":"Péclet number 比較 convection 和 diffusion 的相對重要性。值大時 bulk convection 主導傳輸，值小時 molecular diffusion 相對重要；熱傳與質傳都有對應的 Péclet number。","must":["Péclet","convection","diffusion"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"unitops","text":"packed column 的 flooding 是什麼？","answer":"當氣體流速過高時，向上的氣流會嚴重阻礙液體向下流動，使液體 hold-up 和 pressure drop 急遽增加，最終無法正常逆流操作，這稱為 flooding。設計通常要留在 flooding velocity 以下的安全操作範圍。","must":["packed column","flooding","pressure drop"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"control","text":"Routh–Hurwitz criterion 可以做什麼？","answer":"Routh–Hurwitz criterion 可利用 characteristic polynomial 的係數建立 Routh array，不必逐一求根，就能判斷右半平面 roots 的數量，進而分析連續時間線性系統的 closed-loop stability。","must":["Routh-Hurwitz","characteristic polynomial","stability"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"engmath","text":"matrix condition number 很大通常代表什麼？","answer":"condition number 很大代表線性系統對輸入或數值誤差很敏感，小小的資料擾動可能造成解大幅改變。這種 ill-conditioned problem 在數值計算時需要特別注意 scaling、演算法與誤差放大。","must":["condition number","敏感","數值誤差"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"instrument","text":"mass spectrometry 中 m/z 代表什麼？","answer":"m/z 是離子的 mass-to-charge ratio。質譜儀先把分子形成離子，再依不同 m/z 分離與偵測，因此可提供分子量、碎片與結構相關資訊。","must":["m/z","離子","mass-to-charge"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"organic","text":"inductive effect 如何影響酸鹼性？","answer":"吸電子取代基可透過 sigma bonds 拉走電子密度，穩定 conjugate base，因此常提高附近酸性；供電子取代基則可能使 conjugate base 較不穩定而降低酸性。影響通常會隨距離增加而減弱。","must":["inductive effect","吸電子","conjugate base","酸性"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"project","text":"為什麼你說是 5-FU sensitivity 增加，而不是只說 combination treatment 比較毒？","answer":"因為在適當的比較下，低濃度 Pimozide 加入 5-FU 後，cell viability 比相同 5-FU alone 更低，支持 Pimozide 讓細胞對 5-FU 的反應增強。不過若要更嚴格使用 chemosensitization 或 synergy，仍需完整 dose-response 與 interaction analysis。","must":["5-FU alone","反應增強","dose-response","interaction"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"hard"},{"domain":"personal","text":"如果教授問你『你最不喜歡做的工作是什麼？』你會怎麼回答才不會變成負面？","answer":"我會選一個真實但可管理的工作情境，說明自己為什麼不喜歡，以及如何建立方法完成它。例如重複性高的整理工作比較不吸引我，但我會用清單與固定格式降低錯誤，確保研究紀錄仍完整。重點是讓教授看到自我認識與責任感。","must":["真實","方法","責任感"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"physiology","text":"clearance 的基本概念是什麼？","answer":"clearance 表示單位時間內有多少體積的 plasma 可視為被腎臟完全清除某物質。它不是實際有一桶血漿被抽走，而是用尿中排出速率除以 plasma concentration 得到的等效體積概念。","must":["clearance","排出速率","plasma concentration"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"biochem","text":"substrate-level phosphorylation 和 oxidative phosphorylation 有何不同？","answer":"substrate-level phosphorylation 是由高能中間物直接把 phosphate 轉給 ADP 形成 ATP，不需要電子傳遞鏈；oxidative phosphorylation 則利用電子傳遞建立 proton gradient，再由 ATP synthase 合成 ATP。","must":["substrate-level phosphorylation","oxidative phosphorylation","ATP"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"molbio","text":"Northern blot 主要測什麼？","answer":"Northern blot 是把 RNA 依大小分離、轉膜，再用互補 probe 偵測特定 RNA，因此可以觀察目標 RNA 的大小與相對表現。現在常被 qPCR 或 RNA-seq 取代，但原理上能提供 transcript size 資訊。","must":["Northern blot","RNA","probe","大小"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"transport","text":"為什麼總傳熱係數 U 不是材料本身固定的物性？","answer":"總傳熱係數 U 綜合了熱流兩側的 convection resistance、壁面 conduction resistance 與 fouling resistance，因此會隨流速、流體性質、幾何與操作狀態改變，不是單一材料的固定物性。","must":["總傳熱係數","convection","conduction","fouling"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"unitops","text":"reverse osmosis 的 driving force 是什麼？","answer":"reverse osmosis 施加高於 osmotic pressure difference 的 hydraulic pressure，迫使 solvent 從高 solute concentration 一側穿過 semipermeable membrane 到低濃度側。有效 driving force 可看成 pressure difference 扣除 osmotic pressure difference。","must":["reverse osmosis","壓力","osmotic pressure","membrane"],"nice":[],"hint":"先答核心定義，再補機制或限制。","difficulty":"mid"},{"domain":"physiology","text":"為什麼急性出血會讓心率上升？","answer":"急性出血使循環血量與動脈壓下降，壓力受器放電減少，延腦心血管中樞因此提高交感並降低副交感活動，使心率與心肌收縮力上升，同時促進周邊血管收縮，以維持平均動脈壓。","must":["血量下降","壓力受器","交感","心率上升"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"運動時為什麼骨骼肌血流會增加，即使交感神經活性也上升？","answer":"運動時全身交感活性上升，但活動中的骨骼肌會產生腺苷、二氧化碳、氫離子、鉀離子等局部代謝物，造成局部血管擴張。這種代謝性調節可部分克服交感性血管收縮，因此骨骼肌血流仍明顯增加。","must":["局部代謝物","血管擴張","交感","骨骼肌血流"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼站立時容易短暫頭暈？正常情況下身體怎麼補償？","answer":"由躺姿突然站起時，重力使部分血液暫時淤積在下肢，靜脈回流、心室充盈與心輸出量下降，可能使腦灌流短暫降低。正常情況下壓力受器反射會增加交感活性，使心率、收縮力與血管阻力上升，幫助恢復血壓。","must":["重力","靜脈回流下降","壓力受器反射","交感"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼發燒時心率通常會上升？","answer":"體溫升高會增加代謝需求，也會影響竇房結放電與自主神經平衡，因此心率通常隨體溫上升而增加。若同時有脫水，循環血量下降也會進一步促進反射性心率上升。","must":["體溫","代謝需求","竇房結","心率"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"腎臟如何利用緻密斑調節腎絲球過濾率？","answer":"緻密斑感受遠端腎小管液中的氯化鈉輸送量。若氯化鈉過高，會釋放訊號使入球小動脈收縮，降低腎絲球過濾率；若氯化鈉偏低，則可促進腎素釋放並使入球小動脈較為擴張，協助維持腎絲球過濾率。","must":["緻密斑","NaCl","入球小動脈","腎素"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼嚴重低血鉀可能造成肌無力？","answer":"低血鉀使細胞外鉀離子下降，鉀離子的平衡電位變得更負，許多可興奮細胞的靜止膜電位也因此較負，離閾值更遠，較不容易產生動作電位，所以可能出現肌無力或心律異常。","must":["低血鉀","靜止膜電位","過極化","興奮性"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"高血鉀為什麼既可能增加興奮性，又可能在嚴重時抑制興奮性？","answer":"輕中度高血鉀會使靜止膜電位去極化，細胞更接近閾值，因此一開始可能提高興奮性；但若去極化持續且過度，電壓閘控鈉通道會有更多處於失活狀態，反而降低動作電位產生與傳導能力。","must":["高血鉀","去極化","鈉通道失活","興奮性"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼肺氣腫患者常有呼氣困難？","answer":"肺氣腫破壞肺泡壁與彈性纖維，使肺的彈性回縮力下降，呼氣時小氣道較容易塌陷並造成氣體滯留，因此呼氣尤其困難。","must":["肺氣腫","彈性回縮","小氣道塌陷","氣體滯留"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"貧血時動脈血氧分壓可以正常，但總含氧量仍下降，為什麼？","answer":"動脈血氧分壓主要反映溶解在血漿中的氧，而血液的大部分氧是由血紅素攜帶。貧血時血紅素濃度下降，所以即使動脈血氧分壓與血氧飽和度可接近正常，總血氧含量仍會降低。","must":["貧血","血紅素","血氧分壓","總含氧量"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"呼吸頻率變快一定代表肺泡通氣增加嗎？","answer":"不一定。肺泡通氣量等於呼吸頻率乘以每次呼吸中扣除死腔後真正進入肺泡的氣體量。如果呼吸變得非常快而淺，每次呼吸大多只在死腔內移動，肺泡通氣反而可能沒有增加，甚至下降。","must":["肺泡通氣","呼吸頻率","潮氣量","死腔"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼 ADH 不足會造成大量稀尿？","answer":"ADH 不足時，集合管主細胞頂端膜的 aquaporin-2 插入減少，集合管對水的通透性降低，即使腎髓質存在滲透壓梯度，水也不易被再吸收，因此尿量增加且尿液較稀。","must":["ADH","aquaporin-2","集合管","稀尿"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼 aldosterone 過多可能造成低血鉀？","answer":"aldosterone 會增加遠端腎元主細胞的鈉再吸收，並促進鉀離子分泌到尿液中。因此長期或過度的 aldosterone 作用會增加鉀排泄，可能導致低血鉀。","must":["aldosterone","鈉再吸收","鉀分泌","低血鉀"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"交感與副交感對瞳孔的作用有何差異？","answer":"交感神經活化虹膜放射肌的 α1 受體，使瞳孔放大；副交感神經經動眼神經作用於括約肌的 muscarinic 受體，使瞳孔縮小。","must":["交感","副交感","瞳孔放大","瞳孔縮小"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼神經髓鞘受損會使傳導速度下降？","answer":"髓鞘能提高膜電阻並降低膜電容，使局部電流能快速傳到下一個郎飛結。髓鞘受損後電流較容易漏失，膜充電也變慢，跳躍式傳導效率下降，因此傳導速度降低，嚴重時甚至會傳導阻斷。","must":["髓鞘","膜電阻","膜電容","傳導速度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"什麼是去極化阻斷？","answer":"如果細胞膜長時間維持過度去極化，許多電壓閘控鈉通道會停留在失活狀態，無法恢復成可再次開啟的狀態。此時即使膜電位接近閾值，也難以產生新的正常動作電位，稱為去極化阻斷。","must":["持續去極化","鈉通道失活","動作電位"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"為什麼心臟有很長的不反應期？","answer":"心肌動作電位具有明顯平台期，使有效不反應期延長並接近整個收縮期。這可避免像骨骼肌一樣發生強直收縮，確保每次收縮後有足夠舒張時間讓心室重新充盈。","must":["平台期","不反應期","避免強直","心室充盈"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"前負荷增加時，為什麼搏出量通常增加？","answer":"在生理範圍內，前負荷增加代表心室舒張末期充盈增加，心肌纖維被拉到較有利的長度，增加肌絲產生力量的能力，因此下一次收縮的搏出量通常上升，這就是 Frank-Starling 機制。","must":["前負荷","舒張末期充盈","Frank-Starling","搏出量"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"換氣不足造成的酸鹼異常屬於哪一類？為什麼？","answer":"換氣不足會使二氧化碳排出減少，動脈二氧化碳分壓上升，碳酸與氫離子增加，使血液 pH 下降，因此主要造成呼吸性酸中毒。","must":["換氣不足","二氧化碳上升","pH下降","呼吸性酸中毒"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"什麼是滲透性利尿？","answer":"當腎小管液中存在大量不能被有效再吸收的溶質時，水會因滲透作用留在腎小管中，降低水的再吸收並增加尿量，稱為滲透性利尿；高血糖造成的糖尿就是典型例子之一。","must":["滲透性利尿","腎小管","溶質","水再吸收"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"physiology","text":"胰高血糖素為什麼主要作用在肝臟，而不是骨骼肌？","answer":"肝細胞具有明顯的 glucagon receptor，能透過 cAMP 訊號促進肝醣分解與糖質新生，將葡萄糖釋放到血液中。骨骼肌缺乏相同程度的 glucagon receptor，而且肌肉中的肝醣主要供自身使用。","must":["glucagon receptor","肝臟","肝醣分解","骨骼肌"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼酵素不會改變反應的平衡常數？","answer":"酵素會降低正向與逆向反應所需的活化能，因此能讓系統更快到達平衡，但不會改變反應物與產物之間的自由能差，所以不會改變平衡常數或最終平衡位置。","must":["酵素","活化能","自由能差","平衡常數"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"Km 一定等於酵素和受質的解離常數嗎？","answer":"不一定。Km 是 Michaelis-Menten 動力學中的綜合參數，會受到受質結合、解離與催化速率常數共同影響。只有在特定條件下，Km 才可近似酵素與受質的解離常數，因此不能一概把 Km 當成親和力的直接量測。","must":["Km","解離常數","速率常數","親和力"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼高 ATP 常會抑制糖解作用？","answer":"高 ATP 表示細胞能量充足，因此可透過別構調節抑制 phosphofructokinase-1 等關鍵酵素，降低糖解作用速度，避免在能量已充足時繼續大量分解葡萄糖。","must":["ATP","能量充足","PFK-1","糖解作用"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼 NADH 過高可能抑制檸檬酸循環？","answer":"NADH 是檸檬酸循環與其他氧化代謝產生的重要還原當量。當 NADH/NAD+ 比例過高時，代表電子與能量供應充足，會抑制多個去氫酶反應，使檸檬酸循環速度下降。","must":["NADH","NAD+","去氫酶","檸檬酸循環"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"蛋白質變性和蛋白質水解有什麼不同？","answer":"變性主要是破壞蛋白質的二級、三級或四級結構，使功能喪失，但通常不切斷主鏈的胜肽鍵；水解則會直接切斷胜肽鍵，把多肽鏈分解成較小的胜肽或胺基酸。","must":["變性","水解","胜肽鍵","結構"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼磷酸化可以快速調控酵素活性？","answer":"蛋白質磷酸化可快速改變蛋白的電荷、構形、結合能力或細胞位置，而且可由 kinase 與 phosphatase 可逆控制，因此非常適合做快速且可逆的訊號與酵素活性調節。","must":["磷酸化","kinase","phosphatase","可逆"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"什麼是底物層級磷酸化？和氧化磷酸化有何不同？","answer":"底物層級磷酸化是直接把高能磷酸基從代謝中間物轉移到 ADP 形成 ATP，不需要電子傳遞鏈或質子梯度；氧化磷酸化則利用電子傳遞建立質子梯度，再由 ATP synthase 合成 ATP。","must":["底物層級磷酸化","ATP","電子傳遞鏈","質子梯度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼缺氧時乳酸生成會增加？","answer":"缺氧使粒線體氧化 NADH 的能力受限，細胞需要把 NADH 重新氧化成 NAD+ 才能維持糖解作用。乳酸去氫酶把丙酮酸還原成乳酸，同時再生 NAD+，因此乳酸生成增加。","must":["缺氧","NAD+","NADH","乳酸"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"糖質新生為什麼不能只是把糖解作用完全反向？","answer":"糖解作用中有幾個步驟在生理條件下高度不可逆，因此糖質新生必須使用不同的旁路酵素繞過這些步驟，並消耗 ATP 或 GTP，才能把非醣前驅物轉回葡萄糖。","must":["不可逆步驟","旁路酵素","ATP","糖質新生"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"酮體主要在什麼情況下增加？","answer":"長時間飢餓、低醣或未控制糖尿病時，脂肪分解與肝臟 β-氧化增加，產生大量 acetyl-CoA；當草醯乙酸被糖質新生消耗時，acetyl-CoA 會較多轉向酮體生成。","must":["飢餓","β-氧化","acetyl-CoA","酮體"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼 glutathione 對抗氧化很重要？","answer":"還原型 glutathione 可以提供還原力，協助 glutathione peroxidase 清除過氧化物，之後氧化型 glutathione 可再由 glutathione reductase 利用 NADPH 還原，因此形成重要的細胞抗氧化循環。","must":["glutathione","過氧化物","NADPH","抗氧化"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"蛋白質的 pI 是什麼？","answer":"等電點 pI 是蛋白質或胺基酸淨電荷為零時的 pH。當環境 pH 低於 pI 時分子通常偏正電，高於 pI 時則偏負電，因此 pI 會影響溶解度與電泳行為。","must":["pI","淨電荷","pH","電泳"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼極端溫度會降低酵素活性？","answer":"低溫會降低分子碰撞與反應速率；過高溫度則可能破壞維持蛋白質結構的非共價作用，使酵素變性並改變活性位，因此活性通常在某個溫度範圍內最高。","must":["溫度","碰撞","變性","活性位"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"飽和脂肪酸和不飽和脂肪酸對膜流動性的影響有何差異？","answer":"不飽和脂肪酸的雙鍵通常造成碳鏈彎曲，使脂質不易緊密排列，因此可提高膜流動性；飽和脂肪酸較容易緊密堆積，通常使膜較為緊密、流動性較低。","must":["不飽和脂肪酸","飽和脂肪酸","膜流動性","排列"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"biochem","text":"為什麼膽固醇可以緩衝細胞膜流動性？","answer":"高溫時膽固醇限制磷脂過度移動，降低過度流動；低溫時又可阻止脂肪酸鏈過度緊密排列，避免膜變得太僵，因此能在不同溫度下緩衝膜流動性的變化。","must":["膽固醇","膜流動性","高溫","低溫"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"為什麼 RNA polymerase 不需要 primer，但 DNA polymerase 需要？","answer":"RNA polymerase 可以在啟動子定位後直接從頭開始合成 RNA；多數 DNA polymerase 則只能在已有的 3' hydroxyl 端延伸，因此 DNA 複製需要 primer 提供可延伸的起點。","must":["RNA polymerase","DNA polymerase","primer","3' hydroxyl"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"mRNA 的 5' cap 有哪些主要功能？","answer":"5' cap 可保護 mRNA 免於外切核酸酶降解，參與核輸出，並被翻譯起始因子辨識以促進核糖體招募，因此對 mRNA 穩定性與翻譯效率都很重要。","must":["5' cap","mRNA穩定性","核輸出","翻譯起始"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"poly(A) tail 的主要功能是什麼？","answer":"poly(A) tail 可與 poly(A)-binding protein 結合，提高 mRNA 穩定性、促進核輸出並增強翻譯效率。尾巴逐漸縮短也常和 mRNA 降解啟動有關。","must":["poly(A) tail","mRNA穩定性","翻譯","降解"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"alternative splicing 為什麼能增加蛋白質多樣性？","answer":"同一個 pre-mRNA 可以選擇不同 exon 組合進行剪接，產生不同成熟 mRNA，再翻譯成不同蛋白質 isoform，因此一個基因可以產生多種功能或調控特性不同的蛋白。","must":["alternative splicing","exon","mRNA","isoform"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"什麼是 nonsense mutation？它可能造成什麼結果？","answer":"nonsense mutation 把原本編碼胺基酸的 codon 變成終止 codon，使翻譯提早停止，可能產生截短蛋白；若終止位點符合條件，mRNA 也可能被 nonsense-mediated decay 清除。","must":["nonsense mutation","終止 codon","截短蛋白","NMD"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"missense mutation 一定會影響蛋白質功能嗎？","answer":"不一定。missense mutation 會改變一個胺基酸，但影響取決於位置、胺基酸性質、蛋白質結構與功能區域。有些突變幾乎沒有影響，有些則可能嚴重改變穩定性或功能。","must":["missense mutation","胺基酸","位置","蛋白質功能"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"為什麼 qPCR 做 melt curve 有助於判斷反應品質？","answer":"melt curve 可觀察擴增產物在升溫時解鏈的特徵。若主要只有一個特定產物，通常會出現單一主要熔解峰；多峰或異常峰可能提示非專一性產物或 primer-dimer。","must":["melt curve","特定產物","非專一性","primer-dimer"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"RNA-seq 和 qPCR 各適合回答什麼問題？","answer":"RNA-seq 適合在較廣泛甚至全轉錄體尺度探索哪些基因表現改變；qPCR 則適合針對少數已知目標做高靈敏度定量與驗證。兩者常可搭配使用。","must":["RNA-seq","qPCR","全轉錄體","驗證"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"CRISPR-Cas9 做基因 knockout 的基本原理是什麼？","answer":"guide RNA 將 Cas9 導引到特定 DNA 序列，Cas9 造成雙股斷裂；細胞常用較容易出錯的 non-homologous end joining 修復，形成 insertion/deletion，若造成 frameshift 或關鍵區域破壞即可達到 knockout。","must":["CRISPR-Cas9","guide RNA","雙股斷裂","NHEJ"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"為什麼基因 knockout 後沒有表型，不代表這個基因沒有功能？","answer":"可能存在功能冗餘、補償性路徑、特定環境下才需要該基因，或 knockout 不完全等情況。因此無明顯表型只能表示在目前條件與測量指標下沒有觀察到差異，不能直接說基因沒有功能。","must":["功能冗餘","補償","條件依賴","knockout"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"什麼是 epigenetic regulation？","answer":"表觀遺傳調控是指不改變 DNA 序列本身，卻能改變基因表現狀態的機制，例如 DNA methylation、histone modification 與 chromatin remodeling，部分狀態可在細胞分裂後維持。","must":["epigenetic","DNA methylation","histone","chromatin"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"DNA methylation 在 promoter 區域增加時，基因表現通常會怎麼變？","answer":"在許多基因中，promoter 或 CpG island 的 DNA methylation 增加常與染色質較緊密及轉錄抑制相關，因此基因表現通常下降；但仍需依基因與位置判斷，不能把所有 methylation 都視為抑制。","must":["DNA methylation","promoter","轉錄抑制","基因表現"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"轉錄因子如何調控基因表現？","answer":"轉錄因子辨識特定 DNA 序列，並招募或阻擋共同調節蛋白、RNA polymerase 或染色質調控複合體，進而提高或降低目標基因的轉錄。","must":["轉錄因子","DNA序列","RNA polymerase","轉錄"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"為什麼 Western blot 的蛋白變化和 qPCR 的 mRNA 變化可能不一致？","answer":"mRNA 與蛋白之間還受到翻譯效率、蛋白降解、mRNA 穩定性、時間延遲與後轉錄調控影響，因此 mRNA 不變時蛋白仍可能改變，反之亦然。","must":["mRNA","蛋白","翻譯","降解"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"molbio","text":"siRNA knockdown 和 CRISPR knockout 有何核心差異？","answer":"siRNA 主要促進特定 mRNA 降解，通常是暫時且不完全的表現降低；CRISPR knockout 則改變基因組 DNA，若成功建立穩定細胞株，通常能造成較持久的功能缺失。","must":["siRNA","mRNA","CRISPR","基因組"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"粒線體膜電位主要是怎麼形成的？","answer":"電子傳遞鏈將電子由 NADH/FADH2 傳向氧的過程中，複合體 I、III、IV 將質子由基質泵到膜間腔，形成跨內膜的電化學梯度，其中電位差就是粒線體膜電位的重要部分。","must":["電子傳遞鏈","質子","內膜","膜電位"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"粒線體去極化一定代表細胞已經死亡嗎？","answer":"不一定。粒線體去極化表示膜電位下降，常代表粒線體功能受損或壓力增加，但細胞是否死亡還取決於程度、持續時間與其他補償機制。需要搭配 apoptosis、ATP、viability 等指標判斷。","must":["去極化","粒線體功能","細胞死亡","其他指標"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"ER stress 和 unfolded protein response 有什麼關係？","answer":"當內質網累積未正確摺疊蛋白時會產生 ER stress，細胞啟動 unfolded protein response，暫時降低蛋白質合成、增加分子伴侶與降解能力；若壓力過強或持續太久，也可能轉向促進細胞死亡。","must":["ER stress","unfolded protein response","蛋白折疊","細胞死亡"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"lysosome 在 autophagy 中扮演什麼角色？","answer":"自噬體包裹細胞質或胞器後會與 lysosome 融合，lysosome 內的酸性水解酵素分解內容物，產生的胺基酸、脂肪酸等可再被細胞利用。","must":["autophagy","lysosome","融合","分解"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"為什麼細胞週期檢查點很重要？","answer":"檢查點會監測 DNA 是否受損、複製是否完成及染色體是否正確連接紡錘體，只有條件合適才允許進入下一階段，可降低突變與染色體錯誤傳給子細胞的風險。","must":["細胞週期","檢查點","DNA損傷","染色體"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"p53 活化後可能造成哪些細胞反應？","answer":"p53 可誘導 p21 等基因使細胞週期暫停，提供 DNA 修復時間；若損傷嚴重，也可促進 apoptosis 或 senescence，因此是重要的腫瘤抑制調控因子。","must":["p53","p21","細胞週期","apoptosis"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"intrinsic apoptosis 和 mitochondria 有什麼關係？","answer":"內在凋亡路徑常由細胞壓力啟動 BCL-2 family 調控，使粒線體外膜通透化並釋放 cytochrome c，之後形成 apoptosome、活化 caspase-9，再啟動 downstream caspases。","must":["intrinsic apoptosis","粒線體外膜","cytochrome c","caspase-9"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"necrosis 和 apoptosis 在概念上有何差異？","answer":"apoptosis 是受調控的細胞死亡，常有細胞縮小、染色質凝縮與膜維持較久等特徵；necrosis 常伴隨能量失衡、細胞腫脹與膜破裂，較容易引起周圍發炎。實際生物系統也可能存在混合型死亡。","must":["apoptosis","necrosis","膜破裂","發炎"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"細胞膜上的 receptor internalization 有什麼調控意義？","answer":"受體內吞可降低細胞表面的受體數量，使訊號減弱或終止；被內吞的受體也可能被回收回膜上，或送往 lysosome 降解，因此是調節訊號強度與持續時間的重要機制。","must":["receptor internalization","訊號","回收","降解"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"cellbio","text":"細胞為什麼需要維持低的胞質 Ca2+ 基礎濃度？","answer":"低基礎 Ca2+ 可讓短暫的 Ca2+ 上升成為高訊噪比的細胞訊號，同時避免持續高 Ca2+ 活化蛋白酶、磷脂酶或粒線體壓力等有害反應。細胞會用幫浦、交換器與胞器儲存維持低濃度。","must":["胞質Ca2+","訊號","幫浦","細胞毒性"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"做 Western blot 時為什麼需要 loading control？","answer":"loading control 用來校正不同泳道之間總蛋白上樣量與轉膜效率等技術差異，使目標蛋白訊號能較合理地比較。但前提是 loading control 本身不能被實驗處理明顯改變。","must":["Western blot","loading control","上樣量","正規化"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"如果 β-actin 會被處理影響，你會怎麼辦？","answer":"若 β-actin 不是穩定的 loading control，就不應繼續用它做正規化。可以先驗證其他內參蛋白，例如 GAPDH、tubulin，或使用 total protein normalization，並選擇在實驗條件下穩定的方法。","must":["β-actin","loading control","其他內參","total protein"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"flow cytometry 的 FSC 和 SSC 通常各代表什麼？","answer":"FSC 通常與細胞大小相關，SSC 則與細胞內部複雜度或顆粒度相關。它們常用來做初步 gating，但不是精確的體積或顆粒定量，因此仍需依細胞種類與儀器設定解讀。","must":["FSC","SSC","細胞大小","顆粒度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"flow cytometry 為什麼需要 compensation？","answer":"不同螢光染料的 emission spectrum 可能重疊，使一個 detector 收到其他染料的訊號。compensation 是用單染控制估計 spillover，數學上扣除重疊訊號，避免把光譜重疊誤判成真正共表現。","must":["flow cytometry","compensation","光譜重疊","單染控制"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"什麼是 isotype control？它可以解決所有 flow background 問題嗎？","answer":"isotype control 使用與實驗抗體相同 species、isotype 與 fluorophore，但不辨識目標抗原，用來估計部分非專一性抗體結合。它不能取代 unstained、single-stain、FMO 等控制，也不能解決所有自體螢光或 gating 問題。","must":["isotype control","非專一性","FMO","gating"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"FMO control 的用途是什麼？","answer":"FMO control 保留多色 panel 中除了某一個目標螢光外的所有染色，可反映 spillover 與背景在該 channel 的實際分布，因此特別適合幫助設定陽性/陰性 gate。","must":["FMO control","gating","spillover","多色 flow"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"CCK-8 的吸光值下降一定等於細胞死亡增加嗎？","answer":"不一定。CCK-8 主要反映細胞內還原酵素相關的代謝活性，吸光值下降可能來自細胞數下降、增殖變慢、代謝活性降低或細胞死亡，因此若要判定死亡機制，需要搭配其他 assay。","must":["CCK-8","代謝活性","細胞數","細胞死亡"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"為什麼細胞實驗要做 biological replicate，而不能只增加同一盤的 wells？","answer":"同一盤多孔重複主要降低加樣與孔間變異，屬 technical replicate；biological replicate 則在不同獨立實驗或不同批次中重做，能反映生物與實驗日間變異，因此對推論與統計更重要。","must":["technical replicate","biological replicate","獨立實驗","變異"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"mean ± SD 和 mean ± SEM 的意義有何不同？","answer":"SD 描述觀測資料本身的離散程度；SEM 約等於 SD 除以根號 n，描述樣本平均值估計母體平均值的不確定程度。SEM 通常比 SD 小，因此不能把兩者當成同一件事。","must":["SD","SEM","離散程度","平均值不確定性"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"什麼情況下 one-way ANOVA 比多次 t-test 更合適？","answer":"當要比較三組以上的平均值時，若反覆做多次 t-test，第一類錯誤率會累積。one-way ANOVA 先檢驗是否存在整體組間差異，再搭配適當 post-hoc test 判斷哪些組別不同。","must":["one-way ANOVA","多組比較","第一類錯誤","post-hoc"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"什麼情況下 two-way ANOVA 會比 one-way ANOVA 更適合？","answer":"如果研究同時有兩個自變項，例如藥物濃度與處理時間，two-way ANOVA 可以分別評估兩個主效應，還能分析兩者是否存在 interaction，因此比把每個時間點分開做 one-way ANOVA 更完整。","must":["two-way ANOVA","兩個自變項","主效應","interaction"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"為什麼做藥物實驗要有 vehicle control？","answer":"若藥物需要 DMSO 或其他溶劑配製，溶劑本身可能影響細胞。vehicle control 讓對照組接受與處理組相同濃度的溶劑，才能把觀察到的差異較合理地歸因於藥物。","must":["vehicle control","溶劑","DMSO","對照"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"為什麼不能只靠一個螢光 probe 就宣稱某個機制成立？","answer":"螢光 probe 可能受到專一性、染料載入、細胞數、膜電位、氧化還原環境等因素影響。若要支持機制，通常需要不同原理的 orthogonal assay、功能性介入或 rescue experiment 共同驗證。","must":["螢光probe","專一性","orthogonal assay","rescue"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"ELISA 和 Western blot 的主要差別是什麼？","answer":"ELISA 通常在液相中利用抗體對特定蛋白做高通量定量，結果多以濃度或吸光訊號表示；Western blot 先依分子量分離蛋白再用抗體偵測，能同時提供目標蛋白的大致分子量資訊，但通量通常較低。","must":["ELISA","Western blot","定量","分子量"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"methods","text":"如果實驗結果和文獻完全相反，你第一步會做什麼？","answer":"先不要急著改理論或刪資料，而是檢查原始數據、試劑、細胞狀態、儀器設定、對照組與操作紀錄，確認 technical issue；接著做獨立重複，若結果可重現，再從細胞株、條件與生物差異尋找合理解釋。","must":["原始數據","對照","獨立重複","技術問題"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"Gibbs free energy 的物理意義是什麼？","answer":"在定溫定壓條件下，Gibbs free energy 的變化可用來判斷過程的自發方向：ΔG < 0 的方向熱力學上有利，ΔG = 0 對應平衡。它也和在定溫定壓下可取得的最大非膨脹功有關。","must":["Gibbs free energy","定溫定壓","自發","平衡"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"為什麼 ΔG < 0 不代表反應一定很快？","answer":"ΔG 只描述初末狀態的熱力學驅動力，不包含反應路徑上的活化能。即使 ΔG 很負，如果活化能很高，反應仍可能非常慢，因此速率要由動力學判斷。","must":["ΔG","活化能","熱力學","動力學"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"chemical potential 可以怎麼理解？","answer":"chemical potential 是 Gibbs free energy 對某一成分莫耳數的偏微分，可視為該成分加入系統時對自由能的邊際貢獻。物質會傾向由較高 chemical potential 移向較低，平衡時各相中的 chemical potential 相等。","must":["chemical potential","Gibbs free energy","偏微分","平衡"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"理想氣體的 fugacity 和 pressure 有什麼關係？","answer":"對理想氣體而言 fugacity 等於壓力；對真實氣體則可用 fugacity coefficient 修正非理想性，寫成 f = φP。當壓力很低時，φ 通常趨近 1。","must":["fugacity","pressure","fugacity coefficient","理想氣體"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"Raoult’s law 適用的核心假設是什麼？","answer":"Raoult’s law 最適合理想液體混合物，假設不同分子間作用力與同類分子間作用力相近，使每個成分的分壓等於液相莫耳分率乘以純成分飽和蒸氣壓。","must":["Raoult’s law","理想溶液","莫耳分率","飽和蒸氣壓"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"activity coefficient 大於 1 通常代表什麼？","answer":"activity coefficient 大於 1 代表相對於理想溶液有正偏差，通常表示異種分子間作用力較弱，使成分較容易逃逸到氣相，因此其有效活度高於理想預測。","must":["activity coefficient","正偏差","非理想溶液","作用力"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"什麼是 azeotrope？為什麼一般蒸餾難以跨越？","answer":"共沸點是特定組成下氣相與液相組成相同的狀態，因此在該點做簡單平衡蒸餾不再能改變組成。要跨越通常需要壓力擺動、共沸/萃取蒸餾或其他分離方法。","must":["azeotrope","氣液組成相同","蒸餾","分離"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"Clausius-Clapeyron equation 可以用來做什麼？","answer":"在近似蒸氣為理想氣體且液體體積可忽略時，Clausius-Clapeyron relation 可描述飽和蒸氣壓與溫度的關係，並可由斜率估計汽化焓或由已知溫度壓力估算另一點的飽和蒸氣壓。","must":["Clausius-Clapeyron","飽和蒸氣壓","溫度","汽化焓"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"為什麼節流閥常近似為等焓過程？","answer":"穩態節流設備通常沒有軸功，熱傳可忽略，且入口出口動能、位能變化常小，因此由穩態能量平衡得到入口焓約等於出口焓，所以常視為等焓。","must":["節流","穩態能量平衡","等焓","無軸功"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"Carnot efficiency 為什麼只取決於高低溫熱源？","answer":"可逆 Carnot cycle 的效率由第二定律決定，η = 1 - Tc/Th，因此只取決於絕對溫度的高低。任何在相同熱源間運作的真實不可逆熱機效率都不可能超過 Carnot efficiency。","must":["Carnot","效率","高溫熱源","低溫熱源"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"entropy generation 為什麼可用來衡量不可逆性？","answer":"對真實過程，第二定律要求 entropy generation 大於等於零；可逆過程為零，不可逆程度越大，通常 entropy generation 越大。因此可用它量化摩擦、有限溫差傳熱、混合等不可逆損失。","must":["entropy generation","不可逆","第二定律","可逆"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"混合兩種理想氣體時為什麼 entropy 會增加？","answer":"混合後每一種氣體可佔據的可及空間增加，微觀排列方式變多，因此熵增加。即使沒有反應或熱效應，理想氣體的 mixing entropy 仍為正。","must":["理想氣體","混合","entropy","微觀狀態"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"critical point 的特徵是什麼？","answer":"在 critical point，液體與氣體的性質差異消失，兩相界面不再存在；高於臨界溫度時，單靠加壓無法把氣體凝結成一般液體。","must":["critical point","液氣差異","臨界溫度","凝結"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"compressibility factor Z 的意義是什麼？","answer":"Z = PV/(nRT) 用來表示真實氣體相對於理想氣體的偏離。Z = 1 為理想行為；小於或大於 1 分別反映在特定條件下吸引力或排斥/體積效應的主導程度。","must":["compressibility factor","Z","理想氣體","非理想"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"thermo","text":"Maxwell relation 有什麼用途？","answer":"Maxwell relations 由熱力學基本關係與狀態函數的全微分導出，可把難以直接量測的 entropy、chemical potential 等偏導數，轉換成較容易由壓力、體積、溫度等性質取得的偏導數。","must":["Maxwell relation","狀態函數","偏導數","熱力學"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"一階 batch reaction 的濃度隨時間如何變化？","answer":"對定體積、單一一階反應 -dCA/dt = kCA，積分後得到 CA = CA0 exp(-kt)。因此 ln(CA/CA0) 對時間作圖應為斜率 -k 的直線。","must":["一階反應","batch","指數衰減","速率常數"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"一階反應的半衰期和初始濃度有關嗎？","answer":"理想一階反應的半衰期 t1/2 = ln2/k，因此只取決於速率常數 k，不取決於初始濃度。","must":["一階反應","半衰期","ln2/k","初始濃度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"二階反應的半衰期為什麼和初始濃度有關？","answer":"若速率為 kCA^2，積分可得 1/CA - 1/CA0 = kt，因此半衰期 t1/2 = 1/(kCA0)。所以初始濃度越高，半衰期越短。","must":["二階反應","半衰期","初始濃度","1/(kCA0)"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"Arrhenius equation 中 activation energy 越高代表什麼？","answer":"Arrhenius equation k = A exp(-Ea/RT)。Ea 越高時 k 對溫度越敏感，因此升高相同溫度通常會造成更大的速率常數變化；但實際速率也取決於 A 與反應機構。","must":["Arrhenius","activation energy","溫度","速率常數"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"為什麼正級數反應中 PFR 常比 CSTR 需要較小體積？","answer":"正級數反應的速率在高濃度時較快。PFR 入口保持高反應物濃度並沿程逐漸下降，因此平均反應速率通常高於同轉化率下整槽皆為出口低濃度的 CSTR，所以達到相同轉化率時 PFR 常需較小體積。","must":["PFR","CSTR","正級數","平均反應速率"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"CSTR 為什麼可以直接用出口濃度代表槽內濃度？","answer":"理想 CSTR 假設完全混合，因此槽內各處組成與溫度均一，出口流體就是從這個均一混合槽流出，所以出口濃度等於槽內濃度。","must":["CSTR","完全混合","出口濃度","槽內濃度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"space time 和 residence time 有什麼差別？","answer":"space time 常定義為反應器體積除以入口體積流率，是用入口條件定義的設計量；實際 residence time 則是流體元素在反應器內真正停留的時間，當密度或流率沿程改變、流場非理想時兩者不一定相同。","must":["space time","residence time","體積","流率"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"什麼是 residence time distribution？","answer":"RTD 描述不同流體元素在反應器內停留時間的分布，可用 tracer pulse 或 step experiment 測得。它能反映 bypass、dead zone、mixing 等非理想流動，並幫助評估真實反應器表現。","must":["RTD","tracer","停留時間分布","非理想流動"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"催化劑為什麼能加快反應卻不改變平衡？","answer":"催化劑提供較低活化能的反應路徑，使正向與逆向反應都加快，因此更快到達平衡；但它不改變反應物與產物的自由能差，所以不改變平衡常數或平衡組成。","must":["催化劑","活化能","正逆反應","平衡常數"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"external mass transfer limitation 會怎麼影響催化反應？","answer":"若反應物從 bulk fluid 到 catalyst surface 的外部傳質太慢，表面濃度會低於 bulk concentration，整體觀察速率由傳質限制，增加攪拌或流速可減少邊界層並提高觀察速率。","must":["外部傳質","催化劑表面","邊界層","攪拌"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"internal diffusion limitation 是什麼？","answer":"多孔催化劑內部若反應很快而擴散跟不上，顆粒內部反應物濃度會低於表面，只有靠近外層的活性位被充分利用，造成 effectiveness factor 小於 1。","must":["內部擴散","多孔催化劑","effectiveness factor","濃度梯度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"reaction","text":"Thiele modulus 的物理意義可以怎麼理解？","answer":"Thiele modulus 比較多孔催化劑內部反應速率與擴散速率的相對重要性。數值小表示擴散快、濃度較均一；數值大表示反應相對快，內部擴散限制較明顯。","must":["Thiele modulus","反應","擴散","內部限制"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Reynolds number 的物理意義是什麼？","answer":"Reynolds number 是慣性力相對於黏滯力的無因次比值。數值較低時黏滯作用主導、流動較平順；數值高時慣性效應較強，較容易出現不穩定與湍流，但臨界值取決於幾何與邊界條件。","must":["Reynolds number","慣性力","黏滯力","湍流"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Prandtl number 在熱傳中代表什麼？","answer":"Prandtl number 是動量擴散率相對於熱擴散率的比值，Pr = ν/α。它反映速度邊界層與熱邊界層相對厚度，是對流熱傳相關式的重要無因次參數。","must":["Prandtl number","動量擴散","熱擴散","邊界層"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Schmidt number 在質傳中代表什麼？","answer":"Schmidt number 是動量擴散率相對於質量擴散率的比值，Sc = ν/D，可反映速度邊界層和濃度邊界層的相對尺度。","must":["Schmidt number","動量擴散","質量擴散","邊界層"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Nusselt number 的物理意義是什麼？","answer":"Nusselt number 是實際對流熱傳相對於純導熱的無因次表示，Nu = hL/k。Nu 越大代表對流造成的熱傳增強越明顯。","must":["Nusselt number","對流","導熱","熱傳係數"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Sherwood number 和 Nusselt number 有什麼類比？","answer":"Sherwood number Sh = k_m L/D，是對流質傳相對於分子擴散的無因次量；它在質傳中的角色類似 Nusselt number 在熱傳中的角色。","must":["Sherwood number","質傳","擴散","Nusselt"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Fick’s first law 適用於什麼概念？","answer":"Fick’s first law 描述擴散通量與濃度梯度成正比、方向相反，常用於穩態或局部瞬時擴散通量分析。負號表示物質由高濃度向低濃度擴散。","must":["Fick’s first law","擴散通量","濃度梯度","負號"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Fick’s second law 和 first law 的差別？","answer":"first law 給出通量與濃度梯度的關係；second law 由質量守恆結合 first law 得到，用來描述非穩態下濃度隨時間與空間如何變化。","must":["Fick’s first law","Fick’s second law","非穩態","濃度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Fourier’s law 的負號代表什麼？","answer":"Fourier’s law q = -k∇T 中的負號表示熱傳方向與溫度梯度方向相反，也就是熱會自高溫區流向低溫區。","must":["Fourier’s law","負號","溫度梯度","高溫到低溫"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"Newtonian fluid 的定義是什麼？","answer":"Newtonian fluid 的剪應力與剪切速率成正比，比例常數就是黏度，且在固定溫壓下黏度不隨剪切速率改變。水和多數簡單低分子液體在一定範圍可近似 Newtonian。","must":["Newtonian fluid","剪應力","剪切速率","黏度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"shear-thinning fluid 是什麼？","answer":"shear-thinning 流體的表觀黏度會隨剪切速率上升而下降，常見於高分子溶液、懸浮液與許多生物流體。其原因常和內部結構在剪切下排列或破壞有關。","must":["shear-thinning","表觀黏度","剪切速率","高分子"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"邊界層為什麼會形成？","answer":"黏性流體在固體表面滿足 no-slip condition，使壁面速度等於固體速度，而遠離壁面則接近主流速度，因此在壁面附近形成速度由零到主流值快速變化的區域，稱為速度邊界層。","must":["邊界層","no-slip","壁面","速度梯度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"transport","text":"為什麼湍流通常能提高熱傳與質傳？","answer":"湍流的渦動造成強烈的宏觀混合，使熱量或物質能更快跨越邊界層傳遞，因此通常提高有效熱傳與質傳係數，但也會增加摩擦壓降與泵功需求。","must":["湍流","混合","熱傳","壓降"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"unitops","text":"蒸餾的分離驅動力是什麼？","answer":"蒸餾利用不同成分在氣液平衡下揮發性的差異。較易揮發成分在氣相中相對富集，經多次汽化與冷凝接觸後即可逐步提高分離程度。","must":["蒸餾","揮發度","氣液平衡","氣相富集"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"unitops","text":"relative volatility 越接近 1 代表蒸餾容易還是困難？","answer":"relative volatility 越接近 1，表示兩成分的揮發性越相似，氣液兩相組成差異越小，因此蒸餾分離越困難，需要更多理論板或更高能耗。","must":["relative volatility","1","蒸餾","分離困難"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"unitops","text":"reflux ratio 增加通常對蒸餾塔有什麼影響？","answer":"提高 reflux ratio 通常能提高塔內液氣接觸與分離能力，對固定產品純度可降低所需理論板數；但同時增加 condenser/reboiler 負荷與能耗，因此存在經濟上的最佳化問題。","must":["reflux ratio","分離","理論板","能耗"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"unitops","text":"吸收和 stripping 的差別是什麼？","answer":"吸收是把目標成分由氣相轉移到液相溶劑；stripping 則相反，利用氣體或降低溶解度把揮發性成分由液相移到氣相。兩者都依賴氣液平衡與傳質驅動力。","must":["吸收","stripping","氣相","液相"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"unitops","text":"為什麼 countercurrent heat exchanger 通常比 cocurrent 更有效？","answer":"countercurrent arrangement 能在整個熱交換器長度上維持較大的平均溫差，因此在相同 UA 下通常能達到較高熱交換量，或在相同 duty 下需要較小面積。","must":["countercurrent","cocurrent","平均溫差","熱交換"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"control","text":"feedback control 的核心概念是什麼？","answer":"feedback control 量測輸出並與設定值比較，將誤差送入 controller 調整 manipulated variable，使輸出回到設定值附近。它能抵抗未量測擾動，但也可能因控制器調整不當造成振盪或不穩定。","must":["feedback","設定值","誤差","manipulated variable"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"control","text":"P、I、D 三項各自主要做什麼？","answer":"P 根據當前誤差立即修正；I 累積過去誤差，可消除穩態偏差但可能增加振盪；D 對誤差變化率反應，可提供預測與阻尼效果，但對雜訊敏感。","must":["P","I","D","穩態偏差"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"control","text":"為什麼 integral action 容易造成 windup？","answer":"當 actuator 已達飽和限制時，實際輸出無法再增加，但 integral term 仍持續累積誤差，造成控制器內部積分量過大。當系統離開飽和後會出現長時間過度補償，因此需要 anti-windup。","must":["integral","saturation","windup","anti-windup"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"control","text":"二階欠阻尼系統中 damping ratio 降低時通常會發生什麼？","answer":"在自然頻率等其他條件近似不變時，阻尼比降低會使系統更振盪、百分比超越量增加，通常需要更久才穩定到容許範圍；阻尼比接近或大於 1 時則較不易振盪。","must":["damping ratio","overshoot","oscillation","settling"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"control","text":"Laplace transform 在工程分析中有什麼用？","answer":"Laplace transform 可以把時間域中的微分方程轉成 s 域的代數方程，讓線性動態系統更容易求解，並可直接把初始條件帶入。求得 s 域解後，再用 inverse Laplace transform 回到時間域；控制系統與暫態分析都常使用。","must":["Laplace transform","微分方程","s域","初始條件"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"math","text":"eigenvalue 在動態系統穩定性分析中有什麼意義？","answer":"對線性系統 xdot = Ax，矩陣 A 的 eigenvalues 決定各模態隨時間的指數行為。連續時間系統若所有 eigenvalue 的實部都小於零，系統通常漸近穩定；有正實部則代表存在發散模態。","must":["eigenvalue","動態系統","實部","穩定"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"math","text":"為什麼 boundary condition 對 PDE 解很重要？","answer":"偏微分方程通常有無限多個數學解，邊界條件與初始條件把實際系統的物理限制加入問題，才能選出符合特定幾何與操作情境的唯一或適當解。","must":["PDE","boundary condition","初始條件","唯一解"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"math","text":"Taylor expansion 在工程近似中有什麼用途？","answer":"Taylor expansion 可把非線性函數在某操作點附近展開成多項式。保留低階項即可得到局部近似，因此常用來做線性化、誤差估計與數值分析，但離展開點太遠時誤差可能變大。","must":["Taylor expansion","非線性","線性化","近似"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"HPLC 的基本分離原理是什麼？","answer":"HPLC 讓樣品隨流動相通過固定相，不同成分因與固定相、流動相作用力不同而有不同保留時間，因此被分離，再由 UV、螢光、質譜等 detector 偵測。","must":["HPLC","固定相","流動相","保留時間"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"GC 適合分析什麼類型的樣品？","answer":"GC 適合能汽化且在分析溫度下具有足夠熱穩定性的化合物。樣品在載氣中通過柱子，依揮發性與固定相作用差異分離；不揮發或熱不穩定物質通常不適合直接 GC 分析。","must":["GC","揮發性","熱穩定","載氣"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"UV-Vis absorbance 和濃度之間什麼時候可以用 Beer-Lambert law？","answer":"在單色光、均勻樣品、濃度不太高且沒有明顯散射或化學平衡改變時，A = εbc 可近似成立，因此吸光度與濃度成正比。偏離這些條件時線性可能變差。","must":["Beer-Lambert","吸光度","濃度","線性"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"為什麼螢光量測常比吸光量測更靈敏？","answer":"吸光法量的是入射光和透射光之間的小差異，而螢光法在較暗背景下量測由樣品發出的特定波長光，因此在低濃度時常有較高訊噪比；但也更容易受 quenching、photobleaching 等影響。","must":["螢光","吸光","靈敏度","訊噪比"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"DLS 量到的粒徑是什麼概念？","answer":"dynamic light scattering 由粒子布朗運動造成的散射光波動估計擴散係數，再用 Stokes-Einstein relation 換算 hydrodynamic diameter，因此量到的是含溶劑化層與形狀效應的水動力學粒徑，不是直接的幾何直徑。","must":["DLS","布朗運動","hydrodynamic diameter","Stokes-Einstein"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"為什麼量 zeta potential 前要注意 pH 和 ionic strength？","answer":"表面官能基的質子化狀態會隨 pH 改變，而 ionic strength 會影響 electrical double layer 的厚度與屏蔽，因此兩者都會明顯改變量到的 zeta potential，跨條件比較時必須控制或至少報告。","must":["zeta potential","pH","ionic strength","double layer"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"instrument","text":"FTIR peak 位移可以直接證明形成共價鍵嗎？","answer":"不能單靠峰位移就直接證明。FTIR peak shift 可表示鍵結環境、氫鍵或分子間作用改變，但若要主張形成特定新共價鍵，通常需要更具專一性的峰、對照組，並搭配 NMR、XPS 或其他分析佐證。","must":["FTIR","peak shift","共價鍵","其他分析"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"為什麼 flow cytometry 使用 5、10、15 μM，而 CCK-8 單藥有做到 50 μM？","answer":"兩個實驗目的不同。CCK-8 使用較廣濃度範圍是為了建立細胞存活率的濃度反應；flow cytometry 則希望在細胞仍有足夠存活、避免大量死亡干擾時觀察 Ca2+ 與粒線體相關訊號，因此選較低的 5、10、15 μM。","must":["CCK-8","flow cytometry","濃度範圍","避免死亡干擾"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"為什麼 combination experiment 改用 1、2.5、5 μM Pimozide？","answer":"合併處理的目的是觀察低劑量 Pimozide 是否能在自身毒性較低的情況下增加 5-FU 的抑制效果。如果使用前面已能明顯降低 viability 的高濃度 Pimozide，就不容易區分是 Pimozide 本身造成的毒性，還是對 5-FU 反應的增加。","must":["combination","低劑量","自身毒性","5-FU"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"為什麼 combination 用 72 h，而 flow cytometry 多是 48 h？","answer":"flow cytometry 主要是希望在細胞還未大量死亡時觀察 Ca2+ 與粒線體表型，所以選 48 h；combination 使用較低劑量 Pimozide 與 5-FU，需要較長時間讓細胞存活率差異累積，因此使用 72 h。兩者時間不同反映 endpoint 與實驗目的不同。","must":["48 h","72 h","flow","combination"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"不同 assay 使用不同時間與濃度，還能把結果串成同一個機制嗎？","answer":"可以把它們視為支持同一研究假說的不同層次證據，但不能把不同條件下的結果直接當成同一條因果鏈。更嚴謹的做法是加入 matched concentration、matched time point 或 rescue experiment，確認相同條件下粒線體變化和 5-FU sensitivity 的關聯。","must":["不同條件","不能直接因果","matched condition","rescue"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"如果教授問你題目為什麼寫 through，但實驗沒有真正證明 causality，你怎麼答？","answer":"題目反映研究最初的機制假說，而目前結果顯示 Pimozide 處理同時伴隨粒線體氧化壓力增加及 5-FU 反應增強，但現階段仍主要是相關性證據。我會在結論中保守表達，並用 MitoTEMPO 或其他抗氧化 rescue experiment 作為下一步驗證因果。","must":["through","假說","相關性","rescue"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"你為什麼不能直接稱 Pimozide 和 5-FU 為 synergy？","answer":"目前只證明某些 combination 組的 cell viability 低於單獨處理，這能支持增強抑制效果，但不能區分 additive 和 synergistic interaction。若要稱 synergy，需要做完整 dose matrix，並使用 Bliss、Loewe 或 Chou-Talalay combination index 等方法分析。","must":["synergy","additive","dose matrix","interaction analysis"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"Shaw 2021 這篇 review 在你的簡報中扮演什麼角色？","answer":"Shaw 2021 是整理 diphenylbutylpiperidine 類抗精神病藥物老藥新用抗癌證據的 review，可支持 Pimozide 具有抗癌與 drug repurposing 潛力這個背景；但它不能直接證明 Pimozide 在 AGS 胃癌中會透過粒線體氧化壓力增加 5-FU sensitivity。","must":["Shaw 2021","review","drug repurposing","不能直接證明"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"Cai 2017 這篇研究和你的專題最直接的連結是什麼？","answer":"Cai 2017 在 osteosarcoma 模型中顯示 Pimozide 可增加 ROS、抑制細胞生長，並觀察到和 5-FU 反應相關的效果，因此提供「Pimozide 可能影響 ROS 與 5-FU response」的先前依據。但癌種與機制背景不同，所以只能支持研究假說，不能當成 AGS 的直接證據。","must":["Cai 2017","osteosarcoma","ROS","5-FU"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"如果教授問為什麼不直接用 JC-1 或 TMRM 量膜電位，你怎麼回答？","answer":"本研究依既有實驗設計使用 MitoTracker Deep Red 作為膜電位相關粒線體訊號來觀察，但我知道它不是最專一的 ΔΨm 定量工具。如果要更嚴謹驗證，我會補做 TMRM、TMRE 或 JC-1，並搭配適當 positive control。","must":["MitoTracker Deep Red","膜電位","TMRM","JC-1"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"project","text":"NAO 訊號增加為什麼不能百分之百等同粒線體數量增加？","answer":"NAO 與粒線體內膜 cardiolipin 相關，因此訊號可反映粒線體相關量的變化，但也可能受到膜脂組成、染色條件與細胞狀態影響。若要更確定 mitochondrial mass 增加，可搭配 TOM20、VDAC、mtDNA copy number 或影像分析。","must":["NAO","cardiolipin","mitochondrial mass","驗證"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"personal","text":"如果教授問「你從化工轉到生醫，最大的不足是什麼？」你怎麼答？","answer":"我會承認自己相較於生科本科生，在某些生理、分生與生化基礎的系統性可能較不足，但我已透過細胞實驗與專題逐步補強，也願意在入學前持續補課。我的化工背景則讓我在定量、變因控制與系統分析上有另一種優勢。","must":["承認不足","補強","化工背景","定量"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"personal","text":"如果教授問「你的實驗失敗很多次，你會怎麼調適？」","answer":"我會先把情緒和實驗判斷分開，記錄失敗條件並逐項排查變因，必要時縮小成小規模 pilot，向學長姐或老師確認關鍵步驟。同時安排短暫休息避免持續疲勞影響操作，讓自己回到可以理性分析的狀態。","must":["記錄","排查","pilot","求助"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"personal","text":"如果教授問「你最大的研究優勢是什麼？」你怎麼答比較具體？","answer":"我會把優勢落在具體行為，而不是只說認真，例如我習慣把操作條件、數據與異常完整記錄，遇到問題會先整理可能變因再查文獻或和老師討論。這讓我能比較系統化地排查實驗並把結果整理成可比較的資訊。","must":["具體行為","記錄","排查","整理"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"personal","text":"如果教授問「你為什麼要讀研究所，而不是直接工作？」","answer":"我希望把目前只有本科專題程度的研究經驗深化成能獨立形成問題、設計實驗、分析資料與解釋結果的能力。研究所能提供較完整的研究訓練與專業深度，這是我目前最想補強的部分。","must":["研究所","研究能力","獨立","專業深度"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]},{"domain":"personal","text":"如果教授問「你有申請哪些學校？」應該怎麼答？","answer":"可以誠實回答主要申請方向，不需要刻意隱瞞。重點是接著說明為什麼這個系所對你特別有吸引力，例如研究方向、訓練內容或你和實驗室的契合點，避免讓教授感覺只是廣泛投遞。","must":["誠實","申請方向","本所吸引力","契合"],"nice":[],"hint":"先用一句話直接回答，再補機制、例子或限制。","difficulty":"mid","schools":null,"followups":[]}];

async function refreshQuestionBank(force=false){
 if(!force && Date.now()-(state.lastQuestionBankRefresh||0)<QUESTION_UPDATE_MS && state.remoteQuestionSpecs?.length) return 0;
 if(location.protocol==='file:'){if(force)toast('直接開啟 HTML 時無法自動讀取題庫更新檔；請用 ZIP 內 localhost 啟動器或正式網站版');return 0;}
 try{
   let r;
   try{ r=await fetch('/api/question-updates?t='+Date.now(),{cache:'no-store'}); }catch(_e){}
   if(!r||!r.ok) r=await fetch('question_updates.json?t='+Date.now(),{cache:'no-store'});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const j=await r.json();const list=Array.isArray(j)?j:(j.questions||[]);
   const before=(state.remoteQuestionSpecs||[]).length;
   const seen=new Set((state.remoteQuestionSpecs||[]).map(x=>x.text));
   for(const sp of list)if(sp?.text&&!seen.has(sp.text)){state.remoteQuestionSpecs.push(sp);seen.add(sp.text);}
   state.lastQuestionBankRefresh=Date.now();
   const added=applyRemoteQuestionSpecs(state.remoteQuestionSpecs);
   saveState();
   if(force)toast(`題庫檢查完成；本次載入 ${list.length} 題更新素材`);
   return Math.max(added,state.remoteQuestionSpecs.length-before);
 }catch(e){
   if(force)toast('題庫更新失敗：'+e.message);
   return 0;
 }
}
window.refreshQuestionBank=refreshQuestionBank;
