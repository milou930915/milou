 threshold"],"nice":["log relation"],"hint":"前提是 amplification efficiency 合理。","answer":"在相同 assay 與效率下，起始 target 越多越早達 fluorescence threshold，因此 Ct/Cq 越低；定量需配合 reference/standard 與 efficiency。"},{"domain":"molbio","text":"ΔΔCt method 的基本用途？","must":["relative expression|相對表現","reference gene normalization|內參正規化"],"nice":["calibrator"],"hint":"需要假設 amplification efficiencies 相近。","answer":"ΔΔCt 用 target Ct 先對 reference gene 正規化，再對 calibrator/control 比較，計算 relative expression（常用 2^-ΔΔCt），前提是 assay efficiency 適合。"},{"domain":"molbio","text":"RNA-seq 和 qPCR 在研究用途上最大的差異？","must":["global transcriptome|全轉錄體","targeted|特定基因"],"nice":["discovery vs validation"],"hint":"一個偏 discovery，一個偏 targeted validation。","answer":"RNA-seq 可廣泛量測 transcriptome 並發現新轉錄本；qPCR 對少數已知 target 具有高靈敏、快速且便於驗證的優勢。"},{"domain":"molbio","text":"knockout、knockdown、overexpression 三者概念差異？","must":["knockout remove gene function|基因剔除","knockdown reduce expression|降低表現","overexpression increase|過度表現"],"nice":["CRISPR|siRNA|plasmid"],"hint":"區分基因層級與表現量調控。","answer":"knockout 通常造成 gene function loss；knockdown 使 mRNA/protein 降低但不一定完全消失；overexpression 則提高 target expression，用來做 loss/gain-of-function。"},{"domain":"cellbio","text":"BAX/BAK 在 intrinsic apoptosis 中扮演什麼角色？","must":["MOMP|粒線體外膜通透化","cytochrome c release|釋放細胞色素c"],"nice":["BCL2 family"],"hint":"它們是 pro-apoptotic effectors。","answer":"BAX/BAK oligomerization 造成 mitochondrial outer membrane permeabilization，讓 cytochrome c 等釋出並啟動 apoptosome/caspase cascade。"},{"domain":"cellbio","text":"caspase-8 和 caspase-9 分別較典型屬於哪條 apoptosis pathway？","must":["caspase8 extrinsic|外源","caspase9 intrinsic|內源"],"nice":["death receptor|apoptosome"],"hint":"8 常接 death receptor，9 接 mitochondria。","answer":"caspase-8 是 death receptor/extrinsic pathway 的典型 initiator；caspase-9 在 cytochrome c-Apaf1 apoptosome 中啟動 intrinsic pathway。"},{"domain":"cellbio","text":"lysosome 的酸性環境如何維持？","must":["V-ATPase|質子幫浦","H+ pumping|泵入氫離子"],"nice":["degradation enzymes"],"hint":"酸性讓 hydrolases 發揮功能。","answer":"lysosomal V-type H⁺-ATPase 消耗 ATP 將 protons 泵入 lumen，維持低 pH，支援 acid hydrolases。"},{"domain":"cellbio","text":"ER stress 會啟動什麼主要反應？","must":["UPR|unfolded protein response"],"nice":["PERK|IRE1|ATF6"],"hint":"先答 UPR。","answer":"unfolded/misfolded proteins 在 ER 累積會啟動 UPR，主要 sensor 包括 PERK、IRE1、ATF6，先試圖恢復 folding/homeostasis，嚴重持續時可促 apoptosis。"},{"domain":"cellbio","text":"mitochondrial fission 和 fusion 為什麼重要？","must":["quality control|品質控制","network dynamics|粒線體動態"],"nice":["DRP1|MFN|OPA1"],"hint":"不是單純越多融合越好。","answer":"fission/fusion 動態幫助 mitochondrial content mixing、distribution 與 damage segregation；DRP1 常參與 fission，MFN/OPA1 參與 fusion，失衡可影響 function/mitophagy。"},{"domain":"cellbio","text":"autophagosome 最後需要和哪個胞器融合才能完成降解？","must":["lysosome|溶酶體"],"nice":["autolysosome"],"hint":"形成 autolysosome 後才主要降解 cargo。","answer":"autophagosome 與 lysosome 融合形成 autolysosome，利用 lysosomal hydrolases 分解 cargo 並回收成分。"},{"domain":"cellbio","text":"receptor internalization 可能如何調節 signaling？","must":["desensitization|降低訊號","endocytosis"],"nice":["recycling|degradation"],"hint":"受體進細胞後可回收或降解。","answer":"ligand-activated receptors 可經 endocytosis internalization，降低 surface receptor signaling；之後可能 recycling 回膜或送 lysosome degradation，調節訊號持續時間。"},{"domain":"cellbio","text":"cell cycle 的 G1/S checkpoint 主要在確認什麼？","must":["DNA damage|DNA損傷","growth conditions|生長條件"],"nice":["p53|Rb"],"hint":"是否適合進入 DNA replication。","answer":"G1/S checkpoint 整合 DNA integrity、cell size/growth signals 等，若 damage 嚴重可透過 p53/p21 等抑制 cycle，避免進入 S phase。"},{"domain":"experiment","text":"Western blot 中 blocking 的目的？","must":["reduce nonspecific binding|降低非專一性結合"],"nice":["BSA|milk"],"hint":"膜上剩餘位置如果不封閉，抗體容易亂黏。","answer":"blocking 用 protein solution 佔據 membrane 非特異性 binding sites，降低 primary/secondary antibody nonspecific background。"},{"domain":"experiment","text":"Western blot 中 primary antibody 和 secondary antibody 各自做什麼？","must":["primary target protein|一抗辨識目標","secondary detect primary|二抗辨識一抗"],"nice":["signal amplification"],"hint":"二抗常帶 HRP/fluorophore。","answer":"primary antibody 提供 target specificity；labeled secondary antibody 辨識 primary antibody，提供 signal generation/amplification。"},{"domain":"experiment","text":"為什麼 flow cytometry 要先排除 doublets？","must":["single cells|單細胞","doublet bias|雙細胞偏差"],"nice":["FSC-A vs FSC-H"],"hint":"兩個細胞黏一起會讓訊號失真。","answer":"doublet discrimination 透過 pulse area/height/width 等排除多細胞事件，避免把兩個細胞當一個造成 fluorescence/DNA content 偏差。"},{"domain":"experiment","text":"flow cytometry 的 live/dead stain 有什麼用途？","must":["exclude dead cells|排除死細胞","membrane integrity"],"nice":["nonspecific binding"],"hint":"死亡細胞常有高背景。","answer":"viability dyes 利用 membrane integrity 或 amine accessibility 區分 dead cells，排除後可降低 nonspecific staining 與錯誤群體判讀。"},{"domain":"experiment","text":"為什麼 fluorescence experiment 要避免 photobleaching？","must":["signal decrease|螢光下降","light exposure|光照"],"nice":["protect from light"],"hint":"光照本身會破壞 fluorophore。","answer":"photobleaching 使 fluorophore 在持續 excitation 下永久失去螢光，會讓 signal 隨操作時間下降，因此 staining/reading 常需避光與控制曝光。"},{"domain":"experiment","text":"ELISA standard curve 的作用？","must":["convert absorbance to concentration|吸光值轉濃度","known standards|已知標準"],"nice":["linear/dynamic range"],"hint":"未知樣本必須落在可靠範圍。","answer":"用已知 concentration standards 建立 signal-concentration relation，再插值 unknown samples；超出 dynamic range 應稀釋或重測。"},{"domain":"experiment","text":"為什麼做 cell culture 時 passage number 需要注意？","must":["phenotype drift|表型漂移","reproducibility|再現性"],"nice":["senescence/genetic changes"],"hint":"高 passage 不一定和低 passage 一樣。","answer":"隨 passage 增加，細胞可能累積 genetic/epigenetic changes、selection 或 senescence-like effects，造成 phenotype/drug response 漂移，因此應控制並記錄 passage range。"},{"domain":"experiment","text":"mycoplasma contamination 為什麼危險？","must":["alter metabolism/gene expression|改變代謝基因表現","often invisible|不易察覺"],"nice":["PCR testing"],"hint":"培養液可能看起來仍然清澈。","answer":"mycoplasma 常不造成明顯 turbidity，卻可改變 cell growth、metabolism、gene expression 與 experimental response，因此需定期檢測。"},{"domain":"experiment","text":"randomization 和 blinding 在實驗設計中各解決什麼問題？","must":["randomization reduce selection bias|隨機化降低選擇偏差","blinding reduce observer bias|盲性降低觀察偏差"],"nice":["analysis"],"hint":"兩者處理不同 bias。","answer":"randomization 讓已知/未知 confounders 更平均分配；blinding 降低操作、判讀或分析受到預期影響。"},{"domain":"experiment","text":"multiple comparisons 為什麼會提高 false positive 風險？","must":["type I error|第一型錯誤","many tests|多重檢定"],"nice":["post hoc correction"],"hint":"每次都用 0.05，測越多越容易撞到假陽性。","answer":"多次 hypothesis tests 會累積 family-wise false-positive probability，因此 ANOVA 後常需 Tukey、Dunnett 或 FDR 等方法控制 multiple comparisons。"},{"domain":"thermo","text":"第一定律對封閉系統的核心表達是什麼？","must":["energy conservation|能量守恆","Delta U = Q - W|內能熱功"],"nice":["sign convention"],"hint":"先說能量守恆，再注意功的正負定義。","answer":"對封閉系統，總能量變化等於進入的熱減去系統對外作功（依常用 sign convention）；若忽略 KE/PE，ΔU = Q - W。"},{"domain":"thermo","text":"第二定律為什麼需要 entropy？","must":["direction/irreversibility|方向與不可逆","entropy generation >=0|熵產生非負"],"nice":["isolated system"],"hint":"第一定律只守恆，不決定方向。","answer":"第二定律以 entropy generation 描述 process direction/irreversibility；孤立系統的 entropy 不會自發下降，S_gen ≥ 0。"},{"domain":"thermo","text":"可逆過程和不可逆過程最大的熱力學差異？","must":["entropy generation zero|可逆熵產生零","irreversible positive|不可逆熵產生正"],"nice":["infinitesimal driving force"],"hint":"可逆是理想極限。","answer":"reversible process 是理想極限，沿途接近平衡且 S_gen=0；real irreversible processes 因 finite gradients、friction、mixing 等使 S_gen>0。"},{"domain":"thermo","text":"Clausius inequality 表達什麼概念？","must":["integral dQ/T <=0|Clausius","second law"],"nice":["equality reversible"],"hint":"循環可逆時等號成立。","answer":"對 cyclic process，∮δQ/T ≤ 0；reversible cycle 取等號，irreversible cycle 小於零，是 second law 的一種表達。"},{"domain":"thermo","text":"ideal gas 的 internal energy 和 enthalpy 主要是什麼的函數？","must":["temperature|溫度"],"nice":["u(T) h(T)"],"hint":"理想氣體忽略 intermolecular potential。","answer":"對 ideal gas，u=u(T)、h=h(T)，主要只依 temperature；因此等溫理想氣體 Δu=Δh=0。"},{"domain":"thermo","text":"Joule-Thomson coefficient 的物理意義？","must":["dT/dP at constant H|定焓壓力變化對溫度","throttling"],"nice":["inversion temperature"],"hint":"節流是近似等焓。","answer":"μJT=(∂T/∂P)H，描述 throttling/isenthalpic pressure change 時 temperature 對 pressure 的反應；正值時降壓會降溫。"},{"domain":"thermo","text":"throttling valve 常用什麼熱力學近似？","must":["isenthalpic|等焓","h in = h out"],"nice":["steady adiabatic no work"],"hint":"節流不是 isentropic。","answer":"steady、adiabatic、無 shaft work 且 KE/PE 可忽略的 throttling valve 通常近似 h_in = h_out，是 isenthalpic process。"},{"domain":"thermo","text":"compressor 和 turbine 在理想穩流分析中能量方向有何差異？","must":["compressor work input|壓縮機需輸功","turbine work output|渦輪輸出功"],"nice":["enthalpy rise/drop"],"hint":"壓縮機升壓、turbine 膨脹做功。","answer":"compressor 需要 shaft work input 並通常使 fluid enthalpy 上升；turbine 由 fluid expansion 產生 shaft work output，enthalpy 下降。"},{"domain":"thermo","text":"isentropic efficiency 為什麼對 compressor 和 turbine 定義方向不同？","must":["compare actual vs ideal work|實際與理想功","compressor ideal/actual turbine actual/ideal"],"nice":["<=1"],"hint":"兩者都讓效率 ≤1。","answer":"turbine ηs=(actual work)/(isentropic ideal work)；compressor ηs=(isentropic ideal work input)/(actual work input)，使效率通常≤1。"},{"domain":"thermo","text":"phase equilibrium 時各相 chemical potential 要滿足什麼條件？","must":["chemical potential equal|化學勢相等"],"nice":["each component"],"hint":"每一 component 都要在各相相等。","answer":"在 T,P equilibrium 下，每個 component 的 chemical potential 在共存 phases 間相等；等價地其 fugacity 在各相相等。"},{"domain":"thermo","text":"bubble point 和 dew point 分別代表什麼？","must":["bubble first vapor|第一個氣泡","dew first liquid|第一滴液體"],"nice":["VLE"],"hint":"一個從液體加熱，一個從氣體冷卻。","answer":"bubble point 是指定 P/composition 下液體開始產生第一個 vapor bubble；dew point 是 vapor 開始出現第一滴 liquid 的條件。"},{"domain":"thermo","text":"azeotrope 對普通蒸餾有什麼限制？","must":["vapor liquid same composition|氣液組成相同","distillation limit|蒸餾限制"],"nice":["relative volatility 1"],"hint":"到 azeotrope 附近不能靠普通蒸餾再越過。","answer":"azeotrope 處 vapor/liquid composition 相同、relative volatility 近 1，因此 conventional distillation 無法跨越其 composition，需要 pressure-swing、entrainer 等方法。"},{"domain":"thermo","text":"Henry’s law 常用在什麼情境？","must":["dilute solute gas liquid|稀溶質氣液平衡","partial pressure proportional concentration"],"nice":["low concentration"],"hint":"和 Raoult 對 solvent/ideal solution 情境區分。","answer":"Henry’s law 常描述稀溶質在 gas-liquid equilibrium 中 partial pressure 與 liquid concentration/mole fraction 成比例，適合 dilute solute region。"},{"domain":"thermo","text":"excess Gibbs energy 和 activity coefficient 有什麼關係？","must":["nonideality|非理想性","activity coefficient"],"nice":["GE models NRTL Wilson UNIQUAC"],"hint":"GE 模型就是用來描述液相非理想。","answer":"excess Gibbs energy 衡量 real solution 相對 ideal solution 的 deviation；activity coefficients 可由 GE 對 composition 的偏導得到，NRTL/Wilson/UNIQUAC 等都屬相關 model。"},{"domain":"thermo","text":"partial molar property 是什麼？","must":["change total property adding component|加入微量成分對總性質變化"],"nice":["composition T P constant"],"hint":"chemical potential 就是 partial molar Gibbs。","answer":"partial molar property 定義為固定 T,P 與其他 component amounts 時，總 extensive property 對某 component mole number 的偏導；partial molar Gibbs 就是 chemical potential。"},{"domain":"reaction","text":"零階反應的一般 concentration-time 關係？","must":["C = C0 - kt|線性下降"],"nice":["half life concentration dependent"],"hint":"和一階 exponential 不同。","answer":"對 constant-volume zero-order reaction，-dC/dt=k，因此 C=C0-kt，直到 reactant 接近耗盡。"},{"domain":"reaction","text":"一階反應 integrated rate law 是什麼？","must":["ln C/C0 = -kt|ln"],"nice":["exponential"],"hint":"ln concentration 對 time 是直線。","answer":"constant-volume first-order：C=C0 e^-kt，等價 ln(C/C0)=-kt，half-life=ln2/k。"},{"domain":"reaction","text":"二階反應 2A→products 的典型 integrated law？","must":["1/C - 1/C0 = kt|倒數線性"],"nice":["half life"],"hint":"常見速率 -dC/dt=kC²。","answer":"若 -dC/dt=kC²，積分得 1/C - 1/C0 = kt。"},{"domain":"reaction","text":"activation energy 越高，溫度對 reaction rate 的敏感度通常如何？","must":["more sensitive|更敏感","Arrhenius"],"nice":["slope ln k vs 1/T"],"hint":"Arrhenius slope magnitude = Ea/R。","answer":"Arrhenius relation 中 ln k 對 1/T 斜率為 -Ea/R；Ea 越高，k 對 temperature 變化通常越敏感。"},{"domain":"reaction","text":"parallel reactions 中要提高 desired product selectivity，可以從哪些方向思考？","must":["relative kinetics|相對速率","temperature/concentration"],"nice":["catalyst|reactor type"],"hint":"看 desired 與 undesired reaction orders/Ea。","answer":"selectivity 取決於 desired/undesired reaction 的相對 kinetics；可依 reaction orders、activation energies 選 concentration、temperature、reactor type 或 catalyst。"},{"domain":"reaction","text":"series reactions A→B→C 要最大化 intermediate B，操作上通常有什麼概念？","must":["optimal residence time|最佳停留時間","avoid overreaction|避免過度反應"],"nice":["PFR/batch"],"hint":"太短 B 還沒形成，太長 B 被消耗。","answer":"series reaction 中 intermediate B 先生成再消耗，因此存在 optimal reaction/residence time；常需在 B maximum 附近快速 quench/separate。"},{"domain":"reaction","text":"CSTR 的 steady-state mole balance 基本形式？","must":["in - out + generation = 0|進出生成"],"nice":["F_A0-F_A+r_AV=0"],"hint":"steady state accumulation=0。","answer":"CSTR steady state species balance：F_A0 - F_A + r_A V = 0（r_A 對 reactant 通常為負），核心是 in-out+generation=0。"},{"domain":"reaction","text":"PFR differential mole balance 的基本形式？","must":["dF_A/dV = r_A|微分設計式"],"nice":["conversion form"],"hint":"沿 reactor volume composition 連續變。","answer":"ideal PFR 由 differential balance 得 dF_A/dV=r_A；可轉成 dX/dV=-r_A/F_A0 等形式積分。"},{"domain":"reaction","text":"space velocity 和 space time 之間大致什麼關係？","must":["inverse|互為倒數"],"nice":["SV=v0/V tau=V/v0"],"hint":"在相同基準下互為倒數。","answer":"space time τ=V/v0；space velocity 常定義 SV=v0/V，因此在相同 volumetric basis 下 SV≈1/τ。"},{"domain":"reaction","text":"external mass transfer limitation 和 internal diffusion limitation 如何區分概念？","must":["external film|外部膜傳質","internal pore diffusion|孔內擴散"],"nice":["particle size/stirring"],"hint":"一個在 particle 外邊界層，一個在 pore 內。","answer":"external limitation 是 bulk 到 particle surface 的 film transport 受限；internal limitation 是 reactant 進入 porous catalyst 內部擴散慢，常可用攪拌/流速與 particle size variation 診斷。"},{"domain":"reaction","text":"Thiele modulus 大致衡量什麼競爭？","must":["reaction vs diffusion|反應與內擴散"],"nice":["large diffusion limitation"],"hint":"越大通常內部濃度梯度越嚴重。","answer":"Thiele modulus 比較 intrinsic reaction rate tendency 與 pore diffusion capability；大 φ 常代表 internal diffusion limitation 強、effectiveness factor 降低。"},{"domain":"reaction","text":"effectiveness factor η 的意義？","must":["actual rate / rate if whole pellet surface concentration|實際速率比無擴散限制速率"],"nice":["<=1 typical"],"hint":"衡量 porous catalyst 內部利用程度。","answer":"η 通常定義為實際 pellet reaction rate 與假設整顆 pellet 都處於 surface concentration 時反應速率之比；內擴散限制越強 η 越小。"},{"domain":"reaction","text":"Ergun equation 主要描述什麼？","must":["pressure drop packed bed|填充床壓降"],"nice":["viscous inertial terms"],"hint":"有黏滯和慣性兩部分。","answer":"Ergun equation 描述 flow through packed bed 的 pressure drop，包含低 Re 主導的 viscous term 與較高 Re 的 inertial term，和 particle size、void fraction 等有關。"},{"domain":"reaction","text":"如果 exothermic CSTR 發生 multiplicity，代表什麼？","must":["multiple steady states|多重穩態","heat generation/removal nonlinear"],"nice":["thermal runaway"],"hint":"熱生成與移除曲線可有多個交點。","answer":"exothermic CSTR 因 temperature-rate feedback，heat generation 和 heat removal 可能有多個交點，形成 multiple steady states，並可能涉及 ignition/extinction 或 runaway risk。"},{"domain":"transport","text":"Bernoulli equation 的主要假設有哪些？","must":["steady|穩態","incompressible|不可壓縮","negligible viscosity|無黏性沿流線"],"nice":["along streamline"],"hint":"有 pump/turbine/loss 時要擴充。","answer":"基本 Bernoulli equation 適用 steady、incompressible、negligible viscous loss 且沿 streamline 的 mechanical energy balance；工程上常加 pump head、turbine head、head loss。"},{"domain":"transport","text":"Darcy-Weisbach equation 主要算什麼？","must":["pressure/head loss|壓降頭損","friction factor"],"nice":["L/D v2/2g"],"hint":"管流 friction loss。","answer":"Darcy-Weisbach：h_f=f(L/D)(v²/2g)，用 friction factor 描述 straight pipe wall friction 造成的 head loss。"},{"domain":"transport","text":"laminar pipe flow 的 velocity profile 為什麼是拋物線？","must":["viscous momentum diffusion|黏性動量傳遞","no slip"],"nice":["Navier Stokes solution"],"hint":"由壓力梯度與黏滯力平衡。","answer":"fully developed laminar circular pipe flow 解 Navier-Stokes，在 no-slip boundary 下得到 parabolic velocity profile。"},{"domain":"transport","text":"turbulent flow 為什麼通常有較高的 heat/mass transfer coefficient？","must":["mixing/eddies|渦流混合","boundary layer thinner|邊界層較薄"],"nice":["higher pressure drop"],"hint":"代價通常是壓降也更高。","answer":"turbulent eddies 增強 momentum/heat/species mixing，使 wall gradients 增大、transfer coefficients 通常提高，但也增加 frictional pressure drop。"},{"domain":"transport","text":"no-slip boundary condition 是什麼？","must":["fluid velocity equals wall|流體速度等於壁面"],"nice":["stationary wall zero"],"hint":"黏性流體在固體壁面相對速度近 0。","answer":"no-slip 指 viscous fluid 在 solid wall 的 tangential velocity 與 wall velocity 相同；stationary wall 上 fluid velocity 為 0。"},{"domain":"transport","text":"Prandtl number 的物理意義？","must":["momentum diffusivity / thermal diffusivity|動量擴散比熱擴散"],"nice":["velocity vs thermal boundary layer"],"hint":"Pr=ν/α。","answer":"Prandtl number Pr=ν/α，比較 momentum diffusivity 與 thermal diffusivity，影響 velocity 與 thermal boundary-layer 相對厚度。"},{"domain":"transport","text":"Schmidt number 的物理意義？","must":["momentum diffusivity / mass diffusivity|動量擴散比質量擴散"],"nice":["Sc=nu/D"],"hint":"質傳版 Pr。","answer":"Schmidt number Sc=ν/D，比較 momentum diffusivity 與 molecular mass diffusivity，影響 velocity/concentration boundary layers。"},{"domain":"transport","text":"Lewis number 的物理意義？","must":["thermal diffusivity / mass diffusivity|熱擴散比質量擴散"],"nice":["Le=alpha/D"],"hint":"比較熱和質傳擴散速度。","answer":"Lewis number Le=α/D，比較 thermal diffusivity 與 mass diffusivity；在 coupled heat/mass transfer 很常用。"},{"domain":"transport","text":"lumped capacitance method 什麼時候合理？","must":["Bi < 0.1|Biot小","uniform internal temperature|內部溫度均勻"],"nice":["internal resistance small"],"hint":"判斷內導熱阻力相對外對流。","answer":"通常 Bi=hL_c/k <0.1 時，內部 conduction resistance 相對小，可近似物體內 temperature uniform，用 lumped capacitance。"},{"domain":"transport","text":"overall heat-transfer coefficient U 為什麼不是單一材料性質？","must":["multiple resistances|多重熱阻","convection conduction fouling"],"nice":["series resistance"],"hint":"它是整個 exchanger 系統的等效係數。","answer":"U 整合 hot/cold-side convection、wall conduction、fouling 等 thermal resistances，因此取決於流況、幾何、材料與污垢，不是純 material property。"},{"domain":"transport","text":"LMTD 是什麼用途？","must":["mean temperature driving force|平均溫差驅動力","heat exchanger"],"nice":["counter/co-current"],"hint":"用在 Q=UAΔT_lm。","answer":"log mean temperature difference 將 exchanger 兩端變化的 temperature difference 合成等效 driving force，常用 Q=UAΔT_lm。"},{"domain":"transport","text":"concentration polarization 在膜分離中是什麼？","must":["solute accumulation near membrane|膜面濃度累積","boundary layer"],"nice":["flux decline"],"hint":"不是 membrane fouling 本身但可加劇。","answer":"被截留 solute 在 membrane surface 附近累積形成 concentration boundary layer，降低 effective driving force、提高 osmotic resistance，造成 flux decline。"},{"domain":"transport","text":"osmosis 和 reverse osmosis 的差異？","must":["osmotic natural solvent flow|滲透","RO pressure > osmotic pressure|反滲透施壓"],"nice":["membrane"],"hint":"RO 用外壓反轉自然溶劑流向。","answer":"osmosis 是 solvent 自低 solute chemical potential difference 跨 semipermeable membrane；RO 施加大於 osmotic pressure 的外壓，使 solvent 往 feed→permeate 的分離方向移動。"},{"domain":"transport","text":"interphase mass transfer 中 overall mass-transfer coefficient 為什麼有兩側阻力？","must":["gas and liquid film resistance|氣液兩側膜阻"],"nice":["equilibrium relation"],"hint":"兩相邊界層都可能限制。","answer":"two-film theory 中 species 需穿過 gas-side 和 liquid-side films；overall coefficient 將兩側 resistance 依 equilibrium relation 合併。"},{"domain":"unitops","text":"relative volatility α 對 distillation 難易度代表什麼？","must":["larger easier separation|越大越容易分離","volatility ratio"],"nice":["alpha near 1 difficult"],"hint":"α越接近1越難蒸餾。","answer":"relative volatility 衡量兩 component vapor-liquid preference；α 越偏離 1，distillation separation 通常越容易，接近 1 則需要更多 stages/reflux。"},{"domain":"unitops","text":"reflux ratio 增加對 distillation column 通常有什麼影響？","must":["fewer stages|理論板數可減","energy duty increase|能耗上升"],"nice":["minimum reflux"],"hint":"用更多內回流換較強 separation。","answer":"提高 reflux ratio 通常改善 internal contacting、可降低達同一 separation 所需 stages，但 condenser/reboiler duty 增加；接近 total reflux stages 最少。"},{"domain":"unitops","text":"minimum reflux ratio 的意義？","must":["minimum reflux for specified separation|達指定分離的最小回流"],"nice":["infinite stages"],"hint":"低於它無法達標。","answer":"minimum reflux 是在理想 infinite stages limit 下達指定 separation 所需最低 reflux；實際操作必須高於此值。"},{"domain":"unitops","text":"McCabe-Thiele method 主要用在哪裡？","must":["binary distillation|二元蒸餾","theoretical stages|理論級數"],"nice":["constant molar overflow"],"hint":"圖解法需要 VLE 與 operating lines。","answer":"McCabe-Thiele 是 binary distillation 的 graphical stage calculation method，常假設 constant molar overflow，利用 equilibrium curve 與 operating lines 步階求 stages。"},{"domain":"unitops","text":"absorption 中提高 solvent flow rate 通常如何影響吸收？","must":["increase absorption driving/capacity|吸收能力增加"],"nice":["solvent cost|downstream regeneration"],"hint":"太高會增加循環與再生負擔。","answer":"提高 liquid solvent rate 常增加 absorber capacity/降低 outlet solute，但需要更大 pumping/regeneration duty，並受 flooding 等 hydraulics 限制。"},{"domain":"unitops","text":"packed column 發生 flooding 是什麼？","must":["gas liquid flow interference|氣液相互阻塞","pressure drop sharply increase|壓降急升"],"nice":["entrainment"],"hint":"操作不能只追求大流量。","answer":"flooding 時 upward gas 阻礙 liquid downward flow，造成 liquid holdup 和 pressure drop 急增，separation/control 變差。"},{"domain":"unitops","text":"drying 的 constant-rate period 和 falling-rate period 差在哪？","must":["constant surface saturated|表面濕潤","falling internal transport limit|內部傳質受限"],"nice":["critical moisture"],"hint":"後期水分移到表面成為控制。","answer":"constant-rate period 表面近似持續濕潤，速率主要受外部 heat/mass transfer；低於 critical moisture 後進入 falling-rate，內部 moisture transport 越來越重要。"},{"domain":"unitops","text":"centrifugation 分離的核心驅動概念？","must":["centrifugal acceleration|離心加速度","density difference|密度差"],"nice":["particle size"],"hint":"把重力沉降加速。","answer":"centrifugation 以高 angular velocity 產生遠大於重力的 radial acceleration，使具有 density difference 的 particles/phases 更快分離。"},{"domain":"control","text":"proportional gain Kp 增加通常對 closed-loop response 有什麼影響？","must":["faster response|反應更快","offset decrease|穩態誤差下降"],"nice":["overshoot/instability increase"],"hint":"不是越大越好。","answer":"提高 Kp 通常加快 response、降低 offset，但過大會增加 overshoot/oscillation，甚至 destabilize。"},{"domain":"control","text":"integral action 為什麼能消除 steady-state offset？","must":["accumulate error|累積誤差","drive until error zero|持續修正"],"nice":["integral windup"],"hint":"只要 error 不為0，I項會繼續累積。","answer":"integral action 對 error 隨時間積分，只要 steady error 存在就持續改變 manipulated input，因此可消除 offset，但可能造成 windup/較慢 dynamics。"},{"domain":"control","text":"derivative action 的主要優點和缺點？","must":["anticipate rate change|反應變化率","noise sensitive|對雜訊敏感"],"nice":["damping"],"hint":"D 對高頻 noise 很敏感。","answer":"derivative action 對 error rate-of-change 反應，可增加 damping、預測趨勢，但會放大 measurement noise，常需 filtering。"},{"domain":"control","text":"first-order plus dead-time model 為什麼常用於 process control？","must":["simple approximation|簡化模型","gain time constant dead time"],"nice":["tuning"],"hint":"很多製程可用少數參數近似。","answer":"FOPDT 以 process gain、time constant、dead time 捕捉主要 dynamic behavior，便於 controller tuning 與比較，即使不是 exact model 也很實用。"},{"domain":"control","text":"Routh-Hurwitz criterion 用來判斷什麼？","must":["stability|穩定性","roots right half plane|右半平面根"],"nice":["characteristic equation"],"hint":"不用真的解所有 roots 也能判。","answer":"Routh-Hurwitz 由 characteristic polynomial coefficients 建表，判斷 right-half-plane roots 數量，進而分析 linear system stability。"},{"domain":"engmath","text":"一階線性 ODE 的 integrating factor 是用來做什麼？","must":["solve linear ODE|解一階線性微分方程","integrating factor"],"nice":["exact derivative"],"hint":"標準形式 y′+P(x)y=Q(x)。","answer":"對 y′+P(x)y=Q(x)，乘 integrating factor μ=e^{∫Pdx} 可把左側化為 d(μy)/dx，便於積分求解。"},{"domain":"engmath","text":"separation of variables 適用哪類 PDE？基本想法？","must":["assume product form|假設乘積解","separate variables|分離變數"],"nice":["boundary conditions"],"hint":"常見 heat/diffusion/wave equation。","answer":"對適合的 linear PDE 與 boundary conditions，可假設 u(x,t)=X(x)T(t)，把 PDE 分成多個 ODE，再用 eigenfunctions 組合解。"},{"domain":"engmath","text":"Taylor series 在工程近似中的用途？","must":["local approximation|局部近似","derivatives"],"nice":["linearization"],"hint":"小擾動 linearization 就靠一階展開。","answer":"Taylor series 用函數在某點的 derivatives 建立 local polynomial approximation；控制與 transport 常用 first-order expansion 線性化 nonlinear equations。"},{"domain":"engmath","text":"Jacobian matrix 在多變數系統中代表什麼？","must":["partial derivatives matrix|偏導數矩陣"],"nice":["linearization|coordinate transform"],"hint":"它描述局部輸入輸出敏感度。","answer":"Jacobian 是 vector-valued function 對各 variables 的 partial derivatives matrix，常用於 nonlinear system linearization、Newton method、coordinate transforms。"},{"domain":"engmath","text":"boundary condition 和 initial condition 有什麼差異？","must":["boundary spatial|空間邊界","initial time|初始時間"],"nice":["PDE uniqueness"],"hint":"熱傳/擴散常兩種都需要。","answer":"initial condition 指在起始 time 的 field；boundary conditions 指 spatial domain 邊界上的 value/flux/mixed constraints，兩者共同決定 PDE solution。"},{"domain":"instrument","text":"Beer-Lambert law 的形式與主要限制？","must":["A=epsilon b c|A=εbc","linear dilute range|線性稀溶液"],"nice":["stray light/chemical equilibrium"],"hint":"高濃度或散射時可能偏離。","answer":"A=εbc，在單一 absorbing species、均勻 dilute solution 與合適 optical conditions 下近似線性；高濃度、散射、化學平衡或 instrument stray light 可造成偏離。"},{"domain":"instrument","text":"HPLC 中 retention time 受哪些因素影響？","must":["stationary phase interaction|固定相作用","mobile phase composition|移動相"],"nice":["flow rate|temperature"],"hint":"不是 analyte 的固定常數。","answer":"retention time 取決於 analyte-stationary/mobile phase interactions、mobile-phase composition、flow rate、temperature、column chemistry 等，因此需在相同 method 下比較。"},{"domain":"instrument","text":"chromatography 中 resolution Rs 受哪些基本因素影響？","must":["selectivity|選擇性","efficiency|塔板效率","retention|保留"],"nice":["N alpha k"],"hint":"想 Purnell relation 三部分。","answer":"chromatographic resolution 受 column efficiency N、selectivity α、retention factor k 等共同影響；提高 plate number 或 selectivity 通常可改善 separation。"},{"domain":"instrument","text":"SEM 和 TEM 主要觀察資訊有什麼差異？","must":["SEM surface|表面形貌","TEM internal ultrastructure|內部/高解析"],"nice":["electron transmission"],"hint":"TEM 要電子穿透超薄樣品。","answer":"SEM 主要掃描 sample surface secondary/backscattered electrons，提供 surface morphology；TEM 讓 electrons 穿透薄樣品，可達更高 resolution 觀察內部結構/crystal information。"},{"domain":"instrument","text":"DLS 量測 particle size 的基本原理？","must":["Brownian motion|布朗運動","diffusion to hydrodynamic diameter|擴散換算水動力粒徑"],"nice":["Stokes Einstein"],"hint":"結果對大粒子很敏感。","answer":"DLS 分析 Brownian-motion-induced scattering intensity fluctuation，得到 translational diffusion coefficient，再由 Stokes-Einstein 換算 hydrodynamic diameter。"},{"domain":"organic","text":"SN1 和 SN2 reaction mechanism 的核心差異？","must":["SN1 carbocation two step|SN1碳正離子兩步","SN2 concerted one step|SN2一步協同"],"nice":["stereochemistry|substrate"],"hint":"三級基質偏 SN1、位阻小偏 SN2只是趨勢。","answer":"SN1 先離去形成 carbocation 再被 nucleophile 攻擊；SN2 是 nucleophile backside attack 與 leaving group departure 同步的一步反應，常伴 inversion。"},{"domain":"organic","text":"E1 和 E2 elimination 的核心差異？","must":["E1 carbocation|E1碳正離子","E2 concerted|E2一步協同"],"nice":["base strength|anti-periplanar"],"hint":"E2 需要 base 同步拔 H。","answer":"E1 經 carbocation intermediate 再 deprotonation；E2 是 strong base 抽 β-H 與 leaving group 離去同步的 concerted process，常要求 anti-periplanar geometry。"},{"domain":"organic","text":"carboxylic acid 為什麼通常比 alcohol 酸性強？","must":["resonance stabilized carboxylate|羧酸根共振穩定"],"nice":["inductive effect"],"hint":"比較共軛鹼。","answer":"carboxylate conjugate base 的 negative charge 可在兩個 oxygen 間 resonance delocalize，遠比 alkoxide 穩定，因此 carboxylic acid 通常更 acidic。"},{"domain":"personal","text":"如果教授問「你最近讀的一篇論文是什麼？」你會怎麼回答？","must":["paper question|研究問題","main finding|主要發現"],"nice":["why relevant|limitation"],"hint":"不要只背 title，要講你看懂的問題和結果。","answer":"用 30–60 秒說清楚：研究在問什麼、最重要的結果、你為什麼注意到它，以及你認為的一個 limitation/延伸問題。"},{"domain":"personal","text":"如果教授問「你最大的失敗是什麼？」你會怎麼避免變成負面答案？","must":["specific event|具體事件","what learned|學到什麼"],"nice":["changed behavior"],"hint":"重點是 failure 後你做了什麼。","answer":"選真實但可修正的事件，簡短說明原因、你的責任與處理，最後聚焦後續行為如何改變；不要甩鍋或只說情緒。"},{"domain":"personal","text":"如果教授問「你比較喜歡自己做還是合作？」怎麼答比較好？","must":["both|情境","communication|協作"],"nice":["independence"],"hint":"研究需要獨立執行也需要協作。","answer":"可說自己能獨立負責明確任務，也重視在設計、問題排查和跨技術時合作；用一個實驗室例子支持。"},{"domain":"personal","text":"如果教授問「研究所壓力很大，你確定撐得住嗎？」你怎麼回？","must":["evidence from past|過去證據","coping strategy|調適策略"],"nice":["seek help"],"hint":"不要只說我很能撐。","answer":"用過去同時處理課業/研究的例子，說明你會拆解問題、安排優先順序、維持休息並及時求助，而不是靠硬撐。"},{"domain":"personal","text":"如果教授問「你最想從研究所學到什麼？」","must":["research thinking|研究思考","specific skill/knowledge"],"nice":["independence"],"hint":"不要只說拿學位。","answer":"可以聚焦獨立提出問題、設計實驗、讀 paper、資料分析與某專業能力，並連結該所訓練。"},{"domain":"personal","text":"如果教授問「你如何判斷資訊是否可信？」","must":["primary source|原始文獻","methods/data|方法數據"],"nice":["replication|journal quality"],"hint":"不要只看搜尋排序或標題。","answer":"優先回到 primary literature/official source，檢查 methods、sample/control、statistics、是否被 independent studies 支持，再看 review/consensus。"},{"domain":"personal","text":"如果教授故意質疑你的研究價值，你會怎麼回應？","must":["acknowledge limitation|承認限制","state contribution|說明貢獻"],"nice":["future work"],"hint":"不要防衛性太強。","answer":"先承認目前 scope/limitation，再指出資料直接支持的 contribution 與下一步怎麼補，避免把 exploratory result 說得過大。"},{"domain":"personal","text":"如果教授問「你最想跟什麼樣的指導教授？」","must":["mentoring style|指導方式","research fit|研究契合"],"nice":["communication"],"hint":"不要回答「最好不要管我」。","answer":"可說希望研究方向契合、能定期討論且鼓勵逐漸獨立的指導方式，同時你也會主動準備與回報。"},{"domain":"project","text":"如果要證明 Pimozide 對 5-FU 的增敏效果不是單純 cell-cycle slowing，你會怎麼設計？","must":["cell cycle analysis|細胞週期分析","combination controls|合併對照"],"nice":["EdU|PI DNA content"],"hint":"先確認 Pimozide 是否大幅改變 proliferation state。","answer":"可做 PI/DAPI DNA-content flow 或 EdU incorporation 比較 Pimozide 單藥與 combination 的 cell-cycle/proliferation，再搭配 apoptosis/long-term viability；若只因 cell-cycle slowing，對 S-phase-active 5-FU 的解讀可能更複雜。"},{"domain":"project","text":"如果 Pimozide 增加 ROS，但 normal gastric cells 也同樣增加 ROS 且死亡，你會如何評估研究價值？","must":["selectivity concern|選擇性問題","therapeutic window|治療窗"],"nice":["dose optimization"],"hint":"抗癌不能只看 cancer cell kill。","answer":"這代表缺乏 tumor selectivity，臨床價值會受限；需比較 cancer/normal dose-response、mechanism 和 achievable exposure，尋找 therapeutic window 或特定 biomarker。"},{"domain":"project","text":"如果要把你的研究做成機制圖，你會把哪些箭頭畫成實線、哪些畫成虛線？","must":["direct evidence solid|直接證據實線","hypothesis dashed|推測虛線"],"nice":["ROS to sensitivity causal uncertain"],"hint":"把已量測與推測關係分開。","answer":"Pimozide→各 measured phenotype（viability、probe signals）可畫較直接；ROS→5-FU sensitization、Ca²⁺→ROS 等未做 intervention 的關係應用虛線/標註 proposed。"},{"domain":"project","text":"為什麼單一時間點的 flow 結果很難判斷事件先後順序？","must":["temporal order unknown|時間先後未知","single time point"],"nice":["time course"],"hint":"因果至少需要先後關係。","answer":"48 h 單一終點只能顯示同時存在的狀態，無法知道 Ca²⁺、膜電位、ROS、mass 哪個先發生；應做 time-course 或 live-cell kinetics。"},{"domain":"project","text":"如果要做 time-course 驗證機制，你會優先選哪些時間點？","must":["early and late time points|早晚時間點","before viability loss|存活下降前"],"nice":["1 3 6 12 24 48h"],"hint":"目的不是固定數字，而是捕捉先後。","answer":"可先做 1–6 h early signaling、12–24 h intermediate、48 h phenotype，並同時量 viability，找出 ROS/Ca²⁺ 是否在明顯 cell death 前先出現。"},{"domain":"project","text":"你如何區分「粒線體量增加」是 biogenesis 還是 damaged mitochondria 累積？","must":["biogenesis markers|粒線體生合成","mitophagy/turnover|粒線體自噬"],"nice":["PGC1a|TFAM|LC3/PINK1/Parkin"],"hint":"只有 NAO 增加無法區分。","answer":"需要搭配 mitochondrial biogenesis markers（PGC-1α/TFAM、mtDNA）、mitophagy/turnover markers（PINK1/Parkin、LC3 flux）與 morphology/function，才能區分生成增加或清除失衡。"},{"domain":"project","text":"如果 MitoTracker 與 NAO 都上升，怎麼避免把兩個訊號重複解讀？","must":["different probe dependencies|探針依賴不同","normalization"],"nice":["orthogonal assays"],"hint":"兩者都可能受 mitochondria amount 影響。","answer":"應承認兩者 signal 可能互相 confounded；可用 membrane-potential-specific TMRM/TMRE，並將 potential signal 對 mitochondrial mass marker 正規化或做 parallel orthogonal assays。"},{"domain":"project","text":"如果教授問「最值得先補哪個 control？」你會怎麼選？","must":["vehicle control|溶劑對照","normal cell/positive control"],"nice":["priority by claim"],"hint":"依目前缺口回答。","answer":"若原設計缺 DMSO vehicle，會優先補等體積 vehicle control 排除 solvent effect；之後再依 claim 加 normal cell、positive/negative probe controls 與 rescue。"},{"domain":"calc","text":"1 mM stock 要配成 10 μM、最終體積 10 mL，需要多少 stock？","must":["dilution|C1V1=C2V2"],"nice":["100 μL|0.1 mL"],"hint":"用 C1V1=C2V2，注意 mM 和 μM 換算。","answer":"V1 = (10 μM × 10 mL)/(1 mM) = 0.1 mL = 100 μL。"},{"domain":"calc","text":"2 mM stock 要配成 20 μM、最終體積 10 mL，需要多少 stock？","must":["dilution|C1V1=C2V2"],"nice":["100 μL|0.1 mL"],"hint":"用 C1V1=C2V2，注意 mM 和 μM 換算。","answer":"V1 = (20 μM × 10 mL)/(2 mM) = 0.1 mL = 100 μL。"},{"domain":"calc","text":"5 mM stock 要配成 50 μM、最終體積 10 mL，需要多少 stock？","must":["dilution|C1V1=C2V2"],"nice":["100 μL|0.1 mL"],"hint":"用 C1V1=C2V2，注意 mM 和 μM 換算。","answer":"V1 = (50 μM × 10 mL)/(5 mM) = 0.1 mL = 100 μL。"},{"domain":"calc","text":"10 mM stock 要配成 100 μM、最終體積 10 mL，需要多少 stock？","must":["dilution|C1V1=C2V2"],"nice":["100 μL|0.1 mL"],"hint":"用 C1V1=C2V2，注意 mM 和 μM 換算。","answer":"V1 = (100 μM × 10 mL)/(10 mM) = 0.1 mL = 100 μL。"},{"domain":"calc","text":"25 mM stock 要配成 250 μM、最終體積 10 mL，需要多少 stock？","must":["dilution|C1V1=C2V2"],"nice":["100 μL|0.1 mL"],"hint":"用 C1V1=C2V2，注意 mM 和 μM 換算。","answer":"V1 = (250 μM × 10 mL)/(25 mM) = 0.1 mL = 100 μL。"}];

const V15_NEW_SPECS=[{"domain":"physiology","text":"壓力受器反射如何在血壓突然下降時幫助維持血壓？","must":["壓力受器","交感","副交感","平均動脈壓"],"nice":["心率","總周邊阻力","負回饋"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"血壓突然下降時，頸動脈竇與主動脈弓的壓力受器放電減少，延腦心血管中樞因此提高交感、降低副交感活動，使心率、心肌收縮力與周邊血管阻力增加，藉此把平均動脈壓拉回來。這是快速的短期負回饋調節。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"前負荷、後負荷與心肌收縮力分別會怎麼影響搏出量？","must":["前負荷","後負荷","收縮力","搏出量"],"nice":["Frank-Starling"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"前負荷增加通常透過 Frank–Starling 機制提高搏出量；後負荷增加會讓心室射血更困難，因此在其他條件相同時使搏出量下降；心肌收縮力增加則能提高射血能力，使搏出量增加。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"為什麼過度換氣會使血液 pH 上升？","must":["過度換氣","二氧化碳","pH","呼吸性鹼中毒"],"nice":["碳酸緩衝"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"過度換氣會排出較多二氧化碳，使動脈二氧化碳分壓下降。碳酸緩衝系統的平衡因此朝消耗氫離子的方向移動，造成呼吸性鹼中毒，也就是血液 pH 上升。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"physiology","text":"如果腎絲球過濾率突然下降，腎臟有哪些機制可以幫助維持它？","must":["腎絲球過濾率","自我調節","緻密斑","腎素"],"nice":["出球小動脈"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"腎臟可透過自我調節維持腎絲球過濾率，包括入球小動脈的肌源性反應與緻密斑主導的腎小管－腎絲球回饋。當灌流下降時，腎素－血管張力素－醛固酮系統也可被活化，其中血管張力素 II 對出球小動脈的收縮有助於維持腎絲球毛細血管壓力，但過度活化也可能降低腎血流。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"physiology","text":"抗利尿激素為什麼可以增加尿液濃縮？","must":["抗利尿激素","集合管","水通透性","aquaporin-2"],"nice":["V2","腎髓質"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"抗利尿激素作用在集合管主細胞的 V2 受體，經由環磷酸腺苷訊號促使 aquaporin-2 插入頂端膜，提高水通透性。當腎髓質具有足夠的高滲透壓梯度時，水會被再吸收，使尿量下降而尿液更濃。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"逆流倍增機制的主要功能是什麼？","must":["亨利氏環","腎髓質","滲透壓梯度"],"nice":["集合管","抗利尿激素"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"亨利氏環利用降支對水通透、升支主動運輸鹽分但幾乎不透水的差異，再配合相反方向的液流，逐步建立腎髓質的高滲透壓梯度。這個梯度讓集合管在抗利尿激素存在時能大量再吸收水，形成濃縮尿。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"physiology","text":"通氣灌流比失衡為什麼會造成低血氧？","must":["通氣","灌流","低血氧"],"nice":["氣體交換"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"肺泡通氣與肺血流必須適當配對才能有效交換氣體。若某區域有血流卻通氣不足，血液離開該區時氧合不佳；即使其他區域通氣增加，也不一定能完全補償，因此整體動脈血氧會下降。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"肺表面活性物質如何降低肺泡塌陷的傾向？","must":["表面張力","肺泡","塌陷"],"nice":["Laplace","順應性"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"肺表面活性物質能降低肺泡液面的表面張力，尤其在肺泡變小時作用更明顯。依 Laplace 關係，降低表面張力可降低維持小肺泡開放所需的壓力，因此有助於防止肺泡塌陷並提高肺順應性。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"甲狀腺素的分泌如何受到負回饋調節？","must":["TRH","TSH","T3","T4","負回饋"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"下視丘分泌 TRH 刺激腦下垂體前葉分泌 TSH，TSH 再促進甲狀腺分泌 T3 與 T4。當血中 T3、T4 上升時，會回頭抑制下視丘與腦下垂體，降低 TRH 與 TSH，形成負回饋。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"physiology","text":"胰島素如何促進骨骼肌攝取葡萄糖？","must":["胰島素","GLUT4","骨骼肌","葡萄糖"],"nice":["肝醣"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"胰島素與受體結合後啟動訊號傳遞，使 GLUT4 囊泡移到骨骼肌細胞膜，增加葡萄糖進入細胞。進入的葡萄糖可用於能量代謝或肝醣合成，因此血糖會下降。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"化學突觸中，突觸前鈣離子進入為什麼重要？","must":["鈣離子","電壓閘控","突觸小泡","神經傳導物質"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"動作電位到達突觸前末端後會開啟電壓閘控鈣離子通道，鈣離子進入細胞後促進突觸小泡與細胞膜融合，釋放神經傳導物質。若沒有這個鈣離子訊號，化學突觸傳遞會大幅降低。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"physiology","text":"為什麼髓鞘可以提高動作電位傳導速度？","must":["髓鞘","膜電阻","膜電容","跳躍式傳導"],"nice":["郎飛結"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"髓鞘增加軸突膜的電阻並降低膜電容，使局部電流能傳得更遠、更快；動作電位主要在郎飛結重新產生，形成跳躍式傳導。因此髓鞘化可明顯提高傳導速度。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"physiology","text":"呼吸性酸中毒時，腎臟的代償方向是什麼？","must":["呼吸性酸中毒","氫離子","碳酸氫根","腎臟代償"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"呼吸性酸中毒通常來自二氧化碳滯留。腎臟會增加氫離子排泄、增加銨與可滴定酸的排出，並增加碳酸氫根的再吸收與新生，以提高血中碳酸氫根濃度，部分抵消 pH 下降。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"physiology","text":"平均動脈壓大致由哪些因素決定？","must":["平均動脈壓","心輸出量","總周邊阻力"],"nice":["心率","搏出量"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在簡化情況下，平均動脈壓可看成心輸出量與總周邊阻力共同決定。心輸出量又受心率與搏出量影響，因此血容量、心肌收縮力、血管張力等因素都能間接改變平均動脈壓。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"physiology","text":"骨骼肌收縮時，鈣離子最直接作用在哪個調控蛋白？","must":["鈣離子","troponin","tropomyosin","橫橋"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"骨骼肌細胞內鈣離子上升後會結合 troponin C，使 tropomyosin 移開，暴露 actin 上的 myosin 結合位點，之後才能進行橫橋循環與肌肉收縮。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"physiology","text":"平滑肌收縮為什麼不是由 troponin 主導？","must":["calmodulin","肌球蛋白輕鏈激酶","磷酸化"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"平滑肌缺乏典型的 troponin 調控系統。鈣離子會先與 calmodulin 結合，再活化肌球蛋白輕鏈激酶，使 myosin light chain 磷酸化，進而增加肌球蛋白 ATPase 活性並促進收縮。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"biochem","text":"競爭性抑制對 Km 與 Vmax 的典型影響是什麼？","must":["競爭性抑制","Km","Vmax"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"競爭性抑制劑和受質競爭酵素活性位，因此需要較高受質濃度才能達到相同速率，表觀 Km 上升；在受質濃度足夠高時可以克服抑制，所以 Vmax 通常不變。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"biochem","text":"為什麼酵素濃度增加通常會提高 Vmax，卻不直接改變 Km？","must":["酵素濃度","Vmax","Km"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Vmax 與可用的酵素活性位數量相關，所以在受質充足時，酵素濃度增加會提高最大反應速率。Km 主要反映特定酵素－受質系統的動力學特性，因此單純增加酵素量通常不會改變 Km。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"糖解作用中哪幾個步驟常被視為重要調控點？","must":["糖解作用","phosphofructokinase","pyruvate kinase"],"nice":["ATP","AMP"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"糖解作用的重要不可逆調控步驟包括 hexokinase 或 glucokinase、phosphofructokinase-1，以及 pyruvate kinase。其中 phosphofructokinase-1 常被視為主要速率調控點，會受到 ATP、AMP、citrate 等代謝狀態訊號調節。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"為什麼丙酮酸去氫酶複合體是醣類代謝的重要節點？","must":["丙酮酸","acetyl-CoA","檸檬酸循環","不可逆"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"丙酮酸去氫酶複合體把丙酮酸轉成 acetyl-CoA，將糖解作用與檸檬酸循環連接起來。這一步在哺乳類細胞中基本不可逆，因此會受到磷酸化、能量狀態與產物回饋嚴格調控。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"電子傳遞鏈與氧化磷酸化之間是怎麼偶聯的？","must":["電子傳遞鏈","質子梯度","ATP synthase","ATP"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"電子在粒線體內膜的電子傳遞鏈中傳遞時，部分複合體會把質子泵到膜間腔，建立質子電化學梯度。質子再經 ATP synthase 回流，這股能量驅動 ATP 合成，因此電子傳遞與 ATP 生成透過質子梯度偶聯。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"解偶聯劑會如何影響氧氣消耗與 ATP 生成？","must":["解偶聯","氧氣消耗","ATP","質子梯度"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"解偶聯劑讓質子不經 ATP synthase 就回到粒線體基質，消散質子梯度。電子傳遞鏈會為了維持梯度而加速，所以氧氣消耗可能上升，但 ATP 合成效率下降，能量更多以熱的形式散失。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"biochem","text":"NADH 和 NADPH 在細胞中的主要功能有什麼差別？","must":["NADH","NADPH","能量代謝","抗氧化"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"NADH 主要把還原當量送入能量代謝，例如電子傳遞鏈以產生 ATP；NADPH 則較常提供還原力給生合成與抗氧化系統，例如脂質合成與還原型穀胱甘肽再生。兩者的氧化還原角色相似，但代謝用途不同。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"磷酸戊糖途徑對細胞有哪兩個重要功能？","must":["NADPH","ribose-5-phosphate","核苷酸"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"磷酸戊糖途徑一方面產生 NADPH，供脂質合成與抗氧化防禦使用；另一方面產生 ribose-5-phosphate，供核苷酸合成。細胞可依需求調整這條路徑與糖解作用之間的碳流。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"biochem","text":"泛素－蛋白酶體系統如何決定蛋白質被降解？","must":["泛素","E3","蛋白酶體","蛋白質降解"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"目標蛋白通常先被泛素化，其中 E3 ubiquitin ligase 負責辨識特定受質並促進多泛素鏈形成。帶有適當泛素訊號的蛋白會被蛋白酶體辨識、解折疊並分解，因此這套系統能選擇性控制蛋白質半衰期。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"biochem","text":"蛋白質的一級、二級、三級與四級結構分別是什麼？","must":["一級結構","二級結構","三級結構","四級結構"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"一級結構是胺基酸序列；二級結構是局部的 α-helix、β-sheet 等規則構型；三級結構是單一多肽鏈的整體三維摺疊；四級結構則是多個多肽次單元組裝成的功能性複合體。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"biochem","text":"為什麼 pH 改變可能影響酵素活性？","must":["pH","質子化","活性位","酵素活性"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"pH 會改變胺基酸側鏈與受質的質子化狀態，因此可能影響活性位的電荷、受質結合與催化反應；極端 pH 還可能破壞蛋白質結構。所以多數酵素會有一個相對適合的 pH 範圍。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"biochem","text":"別構調節和競爭性抑制有什麼差別？","must":["別構調節","活性位","構形"],"nice":["合作性"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"競爭性抑制通常發生在活性位，抑制劑與受質直接競爭；別構調節則是分子結合在其他調控位點，改變酵素構形與活性。別構酵素常呈現合作性與 S 型速率曲線，不一定符合簡單 Michaelis–Menten 模型。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"β-氧化的主要功能與發生位置是什麼？","must":["β-氧化","粒線體基質","acetyl-CoA","NADH","FADH2"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"β-氧化主要在線粒體基質中逐步分解脂肪酸，每一輪切下兩個碳形成 acetyl-CoA，同時產生 NADH 與 FADH2。acetyl-CoA 可進入檸檬酸循環，而 NADH、FADH2 可供電子傳遞鏈使用。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"biochem","text":"尿素循環為什麼重要？","must":["氨","尿素循環","尿素","排氮"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"胺基酸分解會產生具有毒性的氨。尿素循環把含氮廢物轉成相對低毒、可由腎臟排出的尿素，因此是維持氮平衡與避免高氨血症的重要途徑。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"molbio","text":"DNA 複製為什麼需要 leading strand 與 lagging strand？","must":["5'","3'","leading strand","lagging strand","Okazaki"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"DNA polymerase 只能以 5' 到 3' 方向合成新鏈，而兩條模板是反向平行的。因此一條可朝複製叉方向連續合成成 leading strand，另一條只能分段形成 Okazaki fragments，再由連接酶接合成 lagging strand。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"PCR 的三個主要溫度步驟各在做什麼？","must":["變性","退火","延伸","primer","DNA polymerase"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"PCR 每個循環通常包含變性、退火與延伸。高溫變性把雙股 DNA 分開；降低溫度讓 primer 與模板配對；再提高到適合 DNA polymerase 的溫度進行新鏈延伸。重複多個循環後目標片段會被大量擴增。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"molbio","text":"qPCR 的 Ct 值較低通常代表什麼？","must":["Ct","起始模板量","閾值"],"nice":["內參","擴增效率"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在其他條件一致時，Ct 值較低代表螢光訊號較早達到設定閾值，通常表示起始模板量較高。不過 Ct 不能脫離擴增效率、內參與實驗品質單獨解讀。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"為什麼 qPCR 需要 housekeeping gene 或 reference gene？","must":["reference gene","正規化","穩定"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"reference gene 用來校正不同樣本之間 RNA 量、反轉錄效率與加樣差異，使目標基因表現能相對正規化。但前提是 reference gene 在實驗條件下必須相對穩定，不能因處理本身大幅改變。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"enhancer 和 promoter 的功能有什麼不同？","must":["promoter","enhancer","轉錄"],"nice":["DNA looping"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"promoter 位在轉錄起始附近，提供 RNA polymerase 與基本轉錄因子組裝的位置；enhancer 則可位在較遠的位置，透過特定轉錄因子與 DNA looping 增強目標基因轉錄。兩者都參與轉錄調控，但角色與位置彈性不同。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"alternative splicing 為什麼可以增加蛋白質多樣性？","must":["alternative splicing","exon","mRNA","isoform"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"同一個前驅 mRNA 可以選擇不同 exon 組合進入成熟 mRNA，因此一個基因能產生不同轉錄本，進一步翻譯成不同蛋白質 isoform。這讓細胞在不增加基因數目的情況下提高蛋白質多樣性。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"molbio","text":"miRNA 一般如何降低目標基因表現？","must":["miRNA","RISC","mRNA","翻譯"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"miRNA 會與 Argonaute 等蛋白形成 RISC，透過與目標 mRNA 的互補序列結合，抑制翻譯或促進 mRNA 去穩定化與降解，因此降低目標蛋白表現。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"CRISPR-Cas9 基因編輯的基本原理是什麼？","must":["guide RNA","Cas9","PAM","雙股斷裂","修復"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"guide RNA 會把 Cas9 導向與其互補、且鄰近 PAM 的 DNA 序列，Cas9 在該處造成雙股斷裂。細胞之後透過非同源末端接合或同源重組修復，研究者可利用這些修復路徑造成基因失活或特定序列修改。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"knockdown、knockout 與 rescue experiment 的目的有什麼差別？","must":["knockdown","knockout","rescue","因果"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"knockdown 是降低基因或蛋白表現但通常不是完全消失；knockout 則讓基因功能被移除。rescue experiment 是在功能缺失背景重新恢復目標基因或蛋白，若表型也恢復，就能更有力支持該分子和表型之間的因果關係。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"molbio","text":"Western blot 和 qPCR 的結果不一致時，可能有哪些原因？","must":["mRNA","蛋白質","翻譯","降解"],"nice":["normalization"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"qPCR 量的是 mRNA，而 Western blot 量的是蛋白質，兩者之間還有翻譯效率、蛋白質降解與修飾等層次。因此 mRNA 不變但蛋白下降，可能是翻譯被抑制或蛋白降解增加；也要先排除 normalization 與技術誤差。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"molbio","text":"DNA methylation 一般如何影響基因表現？","must":["DNA methylation","promoter","轉錄抑制","染色質"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在哺乳類 promoter 區域，CpG methylation 常和轉錄抑制相關，可能妨礙某些轉錄因子結合，或招募 methyl-CpG binding proteins 與抑制性染色質複合體，使染色質較不易被轉錄機器接近。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"molbio","text":"RNA-seq 可以回答什麼問題？它的主要限制有哪些？","must":["RNA-seq","轉錄體","批次效應","多重比較"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"RNA-seq 可在全轉錄體尺度比較不同條件下的 RNA 表現、轉錄本與剪接變化。限制包括樣本品質、測序深度、批次效應、分析流程與多重比較；而且 RNA 表現差異不等於蛋白功能一定改變。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"molbio","text":"ChIP 類實驗主要用來回答什麼問題？","must":["染色質免疫沉澱","抗體","DNA","轉錄因子"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"染色質免疫沉澱用抗體富集與特定蛋白結合的 DNA 片段，再用 qPCR 或定序分析其位置，因此可用來研究轉錄因子或組蛋白修飾在基因組上的結合與分布。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"molbio","text":"為什麼做基因過度表現時仍需要 vector control？","must":["vector control","轉染","對照"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"空載體本身的轉染操作、載體 DNA、抗生素選殖或轉染試劑都可能影響細胞。因此需要相同載體但不含目標基因的 vector control，才能把觀察到的差異較合理地歸因於目標基因過度表現。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"cellbio","text":"細胞凋亡與壞死在典型特徵上有什麼不同？","must":["細胞凋亡","壞死","caspase","膜完整性"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"細胞凋亡通常是受調控的程序性死亡，可見 caspase 活化、細胞縮小、膜 blebbing 與 DNA fragmentation，早期細胞膜完整性相對保留；典型壞死則常伴隨細胞腫脹、膜破裂與內容物外漏，較容易引發發炎。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"cellbio","text":"Annexin V/PI 染色如何大致區分早期凋亡與晚期死亡？","must":["Annexin V","PI","早期凋亡","膜完整性"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Annexin V 會結合外翻到細胞膜外側的 phosphatidylserine，而 PI 只有在膜完整性明顯受損時才容易進入。典型早期凋亡常是 Annexin V 陽性、PI 陰性；晚期凋亡或部分壞死則可能兩者皆陽性。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"cellbio","text":"自噬增加時，LC3-II 上升就一定代表 autophagic flux 增加嗎？","must":["LC3-II","autophagic flux","溶酶體"],"nice":["p62"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"不一定。LC3-II 上升可能是自噬體形成增加，也可能是自噬體無法順利與溶酶體融合或降解受阻而累積。要判斷 autophagic flux，通常要搭配 lysosomal inhibitor、p62 等指標比較動態變化。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"cellbio","text":"粒線體 fission 和 fusion 的平衡為什麼重要？","must":["fission","fusion","粒線體恆定"],"nice":["ROS"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"粒線體融合有助於內容物混合與功能互補，分裂則有助於粒線體分配與隔離受損區域。兩者失衡可能影響能量代謝、ROS、粒線體品質控制與細胞死亡，因此是粒線體恆定的一部分。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"cellbio","text":"ER stress 與 unfolded protein response 的目的為何？","must":["ER stress","未折疊蛋白反應","蛋白質恆定"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"當內質網中錯誤或未折疊蛋白累積時，未折疊蛋白反應會暫時降低新蛋白合成、增加分子伴護蛋白與降解能力，試圖恢復蛋白質恆定。若壓力過久或過強，訊號也可能轉向促進細胞死亡。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"cellbio","text":"細胞週期的 G1/S checkpoint 主要在檢查什麼？","must":["G1/S","DNA 損傷","p53","p21"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"G1/S checkpoint 會整合生長訊號、營養狀態與 DNA 損傷，決定細胞是否進入 DNA 複製階段。若 DNA 損傷嚴重，p53-p21 等路徑可抑制 cyclin-dependent kinase 活性，使細胞週期暫停以利修復。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"experiment","text":"technical replicate 和 biological replicate 為什麼不能互相取代？","must":["technical replicate","biological replicate","再現性"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"technical replicate 主要反映同一生物樣本在加樣、量測等技術層面的變異；biological replicate 則代表不同獨立生物樣本或獨立實驗的生物變異。增加 technical replicate 能提高量測穩定性，但不能取代真正的 biological replicate 來推論結果的再現性。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"experiment","text":"如果 flow cytometry 的所有樣本訊號都突然很低，你會先排查什麼？","must":["flow cytometry","染劑","儀器","positive control"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我會先確認染劑或抗體是否正確加入、保存與孵育條件是否合適，再看細胞數與 viability、儀器雷射與 detector 設定、補償與 gating 是否和前次一致，同時檢查 positive control。先排除共同的 technical error，再考慮生物差異。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"experiment","text":"flow cytometry 為什麼要做 compensation？","must":["compensation","光譜重疊","單色控制"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"不同螢光染料的 emission spectrum 可能重疊，因此某一 detector 會收到其他螢光的 spillover。compensation 是用單色控制估算並扣除這些光譜重疊，避免把串色誤判成真正的雙陽性訊號。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"experiment","text":"為什麼 gating strategy 必須一致且可重現？","must":["gating","一致","control"],"nice":["FMO"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"gating 直接決定哪些事件被納入定量。如果不同組別任意改 gate，可能人為製造差異。較好的做法是先用 control、FMO 或明確規則建立 gating strategy，再一致套用並保存分析流程。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"experiment","text":"Western blot 為什麼需要 loading control？","must":["loading control","正規化","上樣量"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"loading control 用來校正每個 lane 的總蛋白上樣量與轉膜差異，使目標蛋白訊號能做相對正規化。但 loading control 本身必須在處理條件下相對穩定，否則會導致錯誤 normalization。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"experiment","text":"如果 treatment 會改變 β-actin，還能拿它當 loading control 嗎？","must":["β-actin","loading control","穩定","total protein"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"不適合直接使用。若處理會改變 β-actin，本身就違反 loading control 應穩定的前提，正規化可能失真。應先驗證其他 housekeeping protein，或考慮 total protein normalization。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"experiment","text":"positive control 和 negative control 分別解決什麼問題？","must":["positive control","negative control","背景"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"positive control 用已知應該產生訊號的條件確認 assay 與試劑真的能工作；negative control 則提供背景或無特定效應的基準，用來判斷觀察到的訊號是否具有特異性。兩者一起能提高結果可解釋性。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"experiment","text":"為什麼不能只看 p-value 判斷結果重要不重要？","must":["p-value","effect size","confidence interval"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"p-value 主要描述在特定統計假設下資料與虛無假說的相容程度，不直接代表 effect size 或生物意義。樣本數很大時很小的差異也可能顯著，因此應一起看 effect size、confidence interval、資料分布與生物學重要性。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"experiment","text":"one-way ANOVA 和 two-way ANOVA 何時分別適合？","must":["one-way ANOVA","two-way ANOVA","interaction"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"one-way ANOVA 適合比較一個分類因子的多個組別；two-way ANOVA 同時處理兩個因子，除了各自的主要效應，也能檢查 interaction。若要同時分析 Pimozide concentration 與 treatment time，two-way ANOVA 通常比把每個時間點完全分開更完整。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"experiment","text":"如果一個數據點看起來像 outlier，可以直接刪掉嗎？","must":["outlier","排除規則","技術錯誤","透明"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"不能只因為它讓結果不好看就刪除。應先確認是否有預先定義的排除規則或可追溯的技術錯誤，例如加樣失敗、儀器異常；若無明確理由，應保留或用適當的敏感度分析呈現，並透明說明處理方式。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"experiment","text":"batch effect 是什麼？如何降低？","must":["batch effect","隨機化","control"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"batch effect 是不同日期、試劑批號、操作者或儀器批次造成的系統性差異，可能和真正 treatment effect 混在一起。可透過隨機化樣本分配、跨批放入共同 control、固定 protocol、記錄批次並在分析中納入 batch factor 來降低或校正。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"experiment","text":"為什麼 cell culture 要定期檢查 mycoplasma？","must":["mycoplasma","細胞培養","品質控制"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"mycoplasma 污染常不會讓培養液明顯混濁，但會改變細胞生長、代謝、基因表現與實驗反應，因此可能造成難以察覺的系統性偏差。定期檢測與隔離污染細胞是維持細胞實驗可信度的重要品質控制。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"thermo","text":"第一定律和第二定律各在限制什麼？","must":["第一定律","第二定律","能量守恆","熵"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"第一定律是能量守恆，說明能量可在熱、功與內能等形式間轉換但不會憑空產生或消失；第二定律則加入方向性與熵，限制哪些能量轉換能自發發生，並指出真實不可逆程序會產生熵。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"thermo","text":"什麼是 chemical potential？為什麼相平衡會用到它？","must":["chemical potential","Gibbs energy","相平衡"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"chemical potential 可視為某成分對系統 Gibbs energy 的偏莫耳貢獻，也反映物質轉移的熱力學驅動力。在相平衡時，同一成分在各相的 chemical potential 必須相等，否則該成分仍會跨相轉移。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"thermo","text":"fugacity 為什麼會被引入真實氣體熱力學？","must":["fugacity","真實氣體","chemical potential"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"理想氣體可直接用壓力描述 chemical potential 的濃度效應，但真實氣體在高壓等條件下偏離理想行為。fugacity 可視為修正後的有效壓力，讓真實氣體的 chemical potential 仍能用類似理想氣體的形式表達。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"thermo","text":"Raoult's law 何時比較適用？","must":["Raoult","理想溶液","partial pressure","activity coefficient"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Raoult's law 假設液相接近理想溶液，各成分的 partial pressure 等於液相 mole fraction 乘上純物質 vapor pressure。當分子間作用力相近、組成不太偏離理想行為時較適用；非理想系統通常需引入 activity coefficient。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"thermo","text":"Henry's law 和 Raoult's law 在用途上有什麼差異？","must":["Henry","Raoult","稀溶液","氣液平衡"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Raoult's law 常用來描述接近純成分或理想液體中的揮發性成分；Henry's law 常用來描述稀溶液中溶質的氣液平衡。兩者都是線性近似，但標準狀態與適用濃度區域不同。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"thermo","text":"Gibbs free energy 下降和自發性之間有什麼關係？","must":["Gibbs free energy","自發","定溫定壓","平衡"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在定溫定壓條件下，封閉系統若可自發往某方向變化，總 Gibbs free energy 會下降；平衡時達到局部最小值。這個判準有明確前提，不能脫離定溫定壓條件直接套用。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"thermo","text":"什麼是 partial molar property？","must":["partial molar","混合物","chemical potential"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"partial molar property 描述在固定溫度、壓力與其他成分莫耳數下，加入微量某成分對系統總性質造成的變化。chemical potential 就是 partial molar Gibbs energy，因此混合物熱力學常用偏莫耳量描述各成分貢獻。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"thermo","text":"bubble point 和 dew point 分別代表什麼？","must":["bubble point","dew point","氣液相平衡"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"bubble point 是液體混合物在給定壓力下開始產生第一個氣泡的條件；dew point 則是氣體混合物開始產生第一滴液體的條件。兩者都是氣液相平衡邊界，可用於蒸餾與相圖判讀。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"thermo","text":"什麼是 azeotrope？它為什麼影響傳統蒸餾？","must":["共沸物","氣相","液相","蒸餾"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"共沸物在特定組成下氣相與液相組成相同，因此經過一次平衡蒸發後組成不再被改變。傳統蒸餾依靠氣液組成差來分離，所以共沸點會形成分離極限，常需要改變壓力或使用其他分離方法。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"thermo","text":"可逆程序和不可逆程序在熵產生上有什麼差別？","must":["可逆","不可逆","熵產生"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"理想可逆程序的總熵產生為零；真實不可逆程序因有限溫差傳熱、摩擦、混合等機制會產生正的熵。熵產生越大通常表示能量品質損失越明顯。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"reaction","text":"反應級數一定等於化學計量係數嗎？","must":["反應級數","化學計量係數","elementary reaction"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"不一定。只有對單一步驟的 elementary reaction，速率式指數才可直接由分子性推得；對多步驟總反應，reaction order 必須由機制或實驗決定，不能直接照整體 stoichiometric coefficient 寫。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"reaction","text":"Arrhenius equation 說明了什麼？","must":["Arrhenius","rate constant","溫度","activation energy"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Arrhenius equation 描述 rate constant 對溫度的依賴。溫度提高通常會使更多分子具有足夠能量跨越 activation energy，因此 rate constant 增加；activation energy 越高，速率對溫度通常越敏感。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"reaction","text":"理想 CSTR 和 PFR 的濃度分布有何差異？","must":["CSTR","PFR","濃度分布","完全混合"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"理想 CSTR 完全混合，因此槽內組成等於出口組成；理想 PFR 沿流向幾乎沒有軸向混合，反應物濃度會隨位置連續改變。這個差異會影響同一 conversion 所需的 reactor volume。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"reaction","text":"為什麼正級數反應常見 PFR 比 CSTR 需要較小體積？","must":["PFR","CSTR","正級數","conversion"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"對正 reaction order，反應速率在高 reactant concentration 時較快。PFR 入口處能維持較高濃度並逐步消耗；CSTR 全槽都等於較低的出口濃度，因此平均反應速率通常較低，所以達到同 conversion 往往需要較大體積。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"reaction","text":"catalyst 會改變 equilibrium constant 嗎？","must":["catalyst","equilibrium constant","activation energy"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"不會。催化劑降低正向與逆向反應的 activation energy，使系統更快接近平衡，但不改變反應的 Gibbs energy difference，因此在相同溫度下不改變 equilibrium constant 或 equilibrium composition。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"reaction","text":"外部質傳限制和內部擴散限制如何影響觀察到的催化反應速率？","must":["外部質傳","內部擴散","catalyst","intrinsic"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"外部質傳限制發生在 bulk fluid 到 catalyst surface 的傳輸太慢；內部擴散限制則是 reactant 在 porous catalyst 內無法快速到達所有 active sites。兩者都會讓 observed rate 低於 intrinsic kinetic rate，因此若直接拿觀察速率擬合 kinetics 可能得到錯誤參數。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"reaction","text":"Thiele modulus 和 effectiveness factor 大致代表什麼？","must":["Thiele modulus","effectiveness factor","內部擴散"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Thiele modulus 比較顆粒內反應速率與擴散能力，值越大通常代表內部 diffusion limitation 越重要。effectiveness factor 則是實際顆粒總反應速率相對於假設整顆粒都處於表面條件時速率的比例，內擴散越嚴重通常越小。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"reaction","text":"連續反應 A→B→C 若 B 是目標產物，操作上要注意什麼？","must":["連續反應","B","停留時間","selectivity"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"因為 B 既是生成物又會繼續被消耗，停留時間太短會轉化不足，太長又會把 B 轉成 C。因此需要在 conversion 與 selectivity 之間找適當 residence time，並依反應級數與反應器型式選擇操作條件。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"reaction","text":"放熱反應器為什麼可能出現 thermal runaway？","must":["放熱反應","溫度","產熱","移熱","runaway"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"若放熱反應的 rate 隨溫度上升而快速增加，產熱會進一步升高溫度，形成正回饋；當 heat generation 超過 heat removal 時，就可能進入 thermal runaway。設計上要關注熱移除能力、冷卻失效與安全聯鎖。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"reaction","text":"space time 和 residence time 完全相同嗎？","must":["space time","residence time","reactor volume"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"space time 通常以 reactor volume 除以入口 volumetric flow rate 定義，是一個設計尺度；實際 residence time 則與流場、體積變化與非理想流動有關。在定密度、理想流動等簡化條件下兩者可能接近，但概念上不應完全混同。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"transport","text":"Reynolds number 的物理意義是什麼？","must":["Reynolds number","慣性力","黏滯力","層流"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Reynolds number 比較慣性力和黏滯力的相對重要性。值低時黏滯效應較強，流動較容易維持層流；值高時慣性效應增加，較容易出現不穩定與湍流。實際臨界值仍取決於幾何與邊界條件。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"transport","text":"Bernoulli equation 的使用有哪些重要假設？","must":["Bernoulli","穩態","不可壓縮","黏性耗散"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"最基本的 Bernoulli equation 常假設穩態、不可壓縮、沿同一流線且忽略黏性耗散，也沒有額外泵功或渦輪功。若存在摩擦、泵或高度複雜流動，需在機械能衡算中加入對應的 head loss 或 shaft work。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"為什麼管徑變小時壓降可能大幅增加？","must":["管徑","壓降","速度","摩擦"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在固定 volumetric flow rate 下，管徑變小會讓平均 velocity 上升，同時 length-to-diameter ratio 也變大。依流動區域不同，frictional pressure drop 對速度與直徑都很敏感，所以小幅縮小管徑可能造成明顯壓降增加。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"Fourier's law、Fick's law 和 Newtonian viscosity law 有什麼共同概念？","must":["Fourier","Fick","gradient","flux"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"三者都把 transport flux 和對應的 driving-force gradient 連結起來：Fourier's law 連結 heat flux 與 temperature gradient，Fick's law 連結 diffusive flux 與 concentration gradient，Newtonian viscosity law 則連結 shear stress 與 velocity gradient。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"Biot number 小代表什麼？","must":["Biot number","內部溫度梯度","lumped"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Biot number 比較物體內部導熱熱阻與表面對流熱阻。當 Biot number 很小時，內部溫度梯度相對不重要，物體可近似為 uniform temperature，因此可以使用 lumped-capacitance approximation。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"Nusselt number 大致代表什麼？","must":["Nusselt number","對流","導熱"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Nusselt number 比較對流熱傳與純導熱的相對效果，可視為 boundary layer 中 convection 強化 heat transfer 的程度。不同幾何與流動狀態會有不同 correlation，通常會以 Reynolds 與 Prandtl number 等表示。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"Sherwood number 在質傳中扮演什麼角色？","must":["Sherwood number","質傳","擴散"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Sherwood number 是質傳版的 Nusselt number，描述 convective mass transfer 相對於 molecular diffusion 的強化程度，常用來整理 mass-transfer coefficient 與 Reynolds、Schmidt number 的關係。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"為什麼 characteristic diffusion time 常和 L²/D 成正比？","must":["diffusion time","L²/D","擴散距離"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"擴散是一種隨距離平方變慢的傳輸過程。由 Fick diffusion equation 的尺度分析可得 characteristic time 約為 L²/D，因此擴散距離增加十倍時，所需時間可能增加約一百倍。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"transport","text":"邊界層變薄通常對熱傳或質傳有什麼影響？","must":["邊界層","gradient","heat-transfer coefficient","mass-transfer coefficient"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"邊界層變薄會讓溫度或濃度在較短距離內產生更大的 gradient，因此表面 heat flux 或 mass flux 通常增加，對應的 heat-transfer coefficient 或 mass-transfer coefficient 也會提高。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"transport","text":"scale-up 時為什麼不能只把設備尺寸等比例放大？","must":["scale-up","表面積體積比","dimensionless"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"設備放大後表面積對體積比、流動狀態、混合時間、熱傳與質傳尺度都會改變。若只做幾何等比例放大，Reynolds、Péclet 等 dimensionless groups 可能改變，導致實際傳輸與反應行為不同，因此要依主導機制選擇相似準則。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"unitops","text":"蒸餾的主要 driving force 是什麼？","must":["蒸餾","volatility","relative volatility"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"蒸餾利用各成分在氣液相間分配差異，也就是 volatility 的差異來分離。若 relative volatility 接近 1，氣液組成差很小，分離就需要更多 stages、更高 reflux 或改用其他方法。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"unitops","text":"reflux ratio 提高通常對蒸餾塔有什麼影響？","must":["reflux ratio","分離","能耗"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"提高 reflux ratio 通常能增加塔內氣液接觸與分離能力，因此在相同產品純度下可減少理論 stages；但同時會增加 reboiler 與 condenser 負荷，能耗與操作成本上升，所以存在分離效率與能耗的 trade-off。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"unitops","text":"吸收和吸附有什麼差別？","must":["吸收","吸附","bulk","表面"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"吸收是物質進入另一相的 bulk，例如氣體溶進液體；吸附則是物質累積在固體或液體表面。兩者機制不同，設備設計與等溫線、傳質模型也不同。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"unitops","text":"液液萃取為什麼需要考慮 distribution coefficient 和 selectivity？","must":["液液萃取","distribution coefficient","selectivity","溶劑"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"distribution coefficient 描述 solute 在兩相間的分配程度，值大表示溶質較容易進入萃取相；selectivity 則描述溶劑對目標成分相對於其他成分的偏好。好的 solvent 不只要有高分配能力，也要有足夠選擇性並容易回收。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"unitops","text":"filter cake 增厚時，過濾速率為什麼通常會下降？","must":["filter cake","阻力","壓差","流量"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"隨著 filter cake 厚度增加，液體必須通過更大的 porous resistance，因此在相同 pressure drop 下流量會下降。若要維持速率，就必須增加壓差，但也可能壓縮濾餅而讓阻力進一步上升。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"unitops","text":"逆流熱交換器為什麼常比並流更有效？","must":["逆流","temperature driving force","LMTD"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"逆流配置讓兩股流體沿設備長度保持較均勻、通常也較大的 temperature driving force，因此在相同端點條件下常具有較大的 LMTD，可用較小 heat-transfer area 達到同樣 duty，或在相同面積下達到更接近的出口溫度。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"unitops","text":"膜分離的 concentration polarization 是什麼？","must":["concentration polarization","膜","driving force","fouling"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"溶質被膜截留後可能在膜表面累積，形成比 bulk 更高的濃度，稱為 concentration polarization。它會降低有效 driving force、增加 osmotic pressure，並可能加劇 fouling，因此需用流速、攪拌或操作條件控制。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"unitops","text":"fluidized bed 的 minimum fluidization velocity 是什麼？","must":["fluidized bed","minimum fluidization velocity","drag force"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"當流體向上的 drag force 足以平衡床層顆粒的有效重量時，固定床開始轉為 fluidized state；對應的 superficial velocity 稱為 minimum fluidization velocity。再提高速度會改變床層膨脹與傳熱傳質，但過高可能造成 entrainment。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"unitops","text":"乾燥的 constant-rate period 和 falling-rate period 有什麼差異？","must":["constant-rate","falling-rate","外部質傳","內部水分"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"constant-rate period 常由表面保持濕潤、外部 heat/mass transfer 控制；當表面不再完全濕潤後進入 falling-rate period，內部 moisture diffusion 或 capillary transport 變得重要，乾燥速率會逐步下降。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"unitops","text":"結晶操作中 supersaturation 為什麼重要？","must":["supersaturation","nucleation","crystal growth"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"supersaturation 是結晶的主要 driving force。太低時 nucleation 與 crystal growth 太慢；太高則可能造成大量 primary nucleation，得到過多小晶體。操作時需要控制 supersaturation，平衡產率、粒徑與晶體品質。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"control","text":"proportional、integral、derivative 三種控制作用各自主要解決什麼？","must":["比例","積分","微分","steady-state error"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"比例作用對目前 error 立即反應；積分作用累積過去 error，能消除 steady-state offset，但過強會增加 oscillation 或 windup；微分作用根據 error 變化趨勢提供預測性阻尼，但對 measurement noise 很敏感。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"control","text":"為什麼 dead time 大會讓 feedback control 變困難？","must":["dead time","feedback","overshoot","oscillation"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"dead time 讓控制器的動作經過一段時間才反映到量測值，因此控制器看到的是過去的系統狀態。若增益設太積極，容易在回應尚未出現前持續修正，導致 overshoot 或 oscillation，因此可接受的 closed-loop speed 會受限制。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"control","text":"integral windup 是什麼？","must":["integral","actuator saturation","windup","anti-windup"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"當 actuator 已經飽和但 error 仍存在時，integral term 會持續累積，等系統離開飽和後仍造成過大的控制輸出與 overshoot，稱為 integral windup。常用 anti-windup 策略限制或回算積分項。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"control","text":"feedforward control 和 feedback control 有什麼差別？","must":["feedforward","feedback","disturbance","model"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"feedback 依據 output 與 setpoint 的 error 做修正，因此能處理未建模擾動，但一定是在偏差發生後才反應；feedforward 則量測 disturbance，利用模型預先補償，反應較快但依賴 disturbance measurement 與 model accuracy。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"control","text":"二階欠阻尼系統的 damping ratio 降低時，典型 step response 會怎麼變？","must":["damping ratio","overshoot","oscillation","settling"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在其他參數相近時，damping ratio 降低代表阻尼較弱，因此 step response 的 overshoot 與 oscillation 通常增加，settling behavior 變差；若接近或低於零，系統甚至可能出現持續振盪或不穩定。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"engmath","text":"Laplace transform 在工程問題中最常見的用途是什麼？","must":["Laplace transform","微分方程","s-domain","initial conditions"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"拉普拉斯轉換可以把時間域中的微分方程轉成 s 域的代數方程，使線性動態系統較容易求解，並能把 initial conditions 直接帶入。控制系統與暫態問題常先在 s-domain 求解，再用 inverse Laplace transform 回到 time domain。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"engmath","text":"ODE 和 PDE 的差別是什麼？","must":["ODE","PDE","independent variable"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"ODE 的未知函數只對一個 independent variable 取導數，例如只隨時間變化；PDE 則包含對兩個以上 independent variables 的偏導數，例如溫度同時隨位置與時間變化。傳熱、擴散與流體問題常自然形成 PDE。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"engmath","text":"initial condition 和 boundary condition 有什麼不同？","must":["initial condition","boundary condition","PDE"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"initial condition 指定系統在起始時間的狀態，常用於時間演化問題；boundary condition 則指定空間邊界上的值或通量。求解 PDE 時通常需要足夠的 initial 與 boundary conditions 才能得到唯一、物理合理的解。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"engmath","text":"eigenvalue 在動態系統穩定性分析中有什麼意義？","must":["eigenvalue","穩定性","real part"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"對線性系統而言，系統矩陣的 eigenvalues 決定自然模式的成長或衰減。連續時間系統若所有 eigenvalues 的 real part 都小於零，擾動通常會隨時間衰減；若有正實部 eigenvalue，對應模式會成長而造成不穩定。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"engmath","text":"線性化的好處與限制是什麼？","must":["線性化","operating point","非線性"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"線性化可在 operating point 附近把非線性模型近似成線性系統，方便做解析、控制設計與穩定性分析；限制是只在該點附近較可靠，若 perturbation 很大或系統有強非線性，線性模型可能失真。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"engmath","text":"數值積分的 step size 太大可能造成什麼問題？","must":["step size","accuracy","stability"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"step size 太大可能降低 accuracy，甚至讓某些 numerical method 產生 artificial instability，錯過快速動態；太小則會增加計算成本與 round-off accumulation。因此需做 step-size convergence 或 error control。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"instrument","text":"UV-Vis absorbance 和濃度之間的基本關係是什麼？","must":["Beer-Lambert","absorbance","concentration","standard curve"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"在適用範圍內，Beer–Lambert law 表示 absorbance 與 molar absorptivity、光徑長度和 concentration 成正比。因此可用 standard curve 定量，但高濃度、散射、化學平衡或儀器限制都可能造成偏離。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"instrument","text":"fluorescence measurement 為什麼通常比 absorbance 更敏感？","must":["fluorescence","absorbance","signal-to-noise","photobleaching"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"螢光量測是在相對低背景下偵測樣品放出的光，而吸光量測是在強入射光上看小幅下降，因此許多條件下 fluorescence 的 signal-to-noise ratio 更高。不過螢光也容易受 photobleaching、quenching 與環境因素影響。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"instrument","text":"HPLC 和 GC 選擇樣品時有什麼基本差別？","must":["HPLC","GC","volatility","熱穩定"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"GC 適合具有足夠 volatility 且能承受汽化溫度的化合物；HPLC 不要求樣品汽化，因此更適合非揮發性、極性較高或熱不穩定的化合物。兩者都靠 stationary phase 與 mobile phase 的差異交互作用達到分離。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"instrument","text":"FTIR 光譜主要提供哪一類資訊？","must":["FTIR","官能基","化學鍵","吸收峰"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"FTIR 量測分子對不同紅外頻率的吸收，可由特徵振動峰判斷官能基與化學鍵環境。它很適合比較材料反應前後的官能基變化，但單一峰位變化通常不能獨立證明完整反應機制。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"instrument","text":"SEM 和 TEM 在資訊上最大的差別是什麼？","must":["SEM","TEM","表面","內部","解析度"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"SEM 主要掃描樣品表面，常用來觀察 surface morphology，景深較大；TEM 讓電子穿透超薄樣品，可得到內部 ultrastructure 與更高空間解析度，但 sample preparation 通常更複雜。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"instrument","text":"LOD 和 LOQ 有什麼差別？","must":["LOD","LOQ","定量","背景"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"LOD 是能可靠區分訊號與背景的最低程度，表示『看得到』；LOQ 則要求在可接受 precision 與 accuracy 下進行定量，表示『能可靠算多少』。因此 LOQ 通常高於 LOD。","followups":[],"schools":null,"difficulty":"basic"},{"domain":"project","text":"為什麼你的粒線體相關實驗用 48 小時，但 Pimozide 與 5-FU 合併處理卻用 72 小時？","must":["48 小時","72 小時","低濃度","matched time"],"nice":["因果限制"],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"兩部分實驗目的不同。48 小時的粒線體相關實驗希望在細胞已出現明顯反應、但尚未因長時間處理造成過多死亡時觀察 Ca²⁺ 與粒線體訊號；合併處理則使用較低濃度 Pimozide，需要較長的 72 小時才能讓 5-FU 抑制效果與增敏差異更清楚。不過不同時間點使兩組結果只能建立關聯，不能直接證明同一時間軸上的因果，若重做我會補 matched time-point experiments。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"project","text":"為什麼合併處理的 Pimozide 濃度改成 1、2.5、5 μM，而不是沿用前面 5–50 μM？","must":["低濃度","單藥","動態範圍","5-FU sensitivity"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"前面的高濃度範圍主要用來建立 Pimozide 單藥的 concentration-與 time-response。若在合併 5-FU 時仍用已經能大幅降低 cell viability 的高濃度 Pimozide，會很難判斷額外下降是 5-FU sensitivity 增加，還是 Pimozide 本身已造成強烈抑制。因此合併實驗改用較低濃度，讓兩種藥物都保留可觀察的動態範圍。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"project","text":"不同 assay 使用不同濃度與時間，還能把結果串成同一個故事嗎？","must":["不同條件","evidence","關聯","rescue"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"可以把它們視為同一研究假說下的不同 evidence，但不能當成完全匹配的 mechanistic chain。CCK-8 先界定細胞反應範圍，48 小時低至中濃度用來觀察 Ca²⁺ 與粒線體變化，72 小時低濃度合併處理則看 5-FU response。這些結果支持關聯，但要證明『粒線體氧化壓力造成增敏』仍需 matched concentration/time 與 rescue experiment。","followups":[],"schools":null,"difficulty":"boss"},{"domain":"project","text":"你的題目寫『透過粒線體氧化壓力』，目前證據真的足以支持 through 嗎？","must":["不能直接證明","correlation","ROS scavenger","rescue","causality"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"目前還不足以直接證明 through。我的結果顯示 Pimozide 處理後粒線體氧化壓力增加，同時低濃度 Pimozide 合併 5-FU 時 cell viability 進一步下降，因此支持兩者可能有關，但仍屬 correlation。下一步應加入例如 NAC 或較偏粒線體的 ROS scavenger 做 rescue；若降低 ROS 後增敏效果也被逆轉，才更能支持 causality。","followups":[],"schools":null,"difficulty":"boss"},{"domain":"project","text":"為什麼 2.5 μM Pimozide + 0.5 μM 5-FU 的結果不能直接稱為 synergy？","must":["synergy","dose matrix","Bliss","Loewe","combination index"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"因為目前只是看到特定 combination 的 cell viability 顯著低於單獨處理，這能支持 enhanced inhibitory effect，但不能區分 additive、synergistic 或其他 interaction。要證明 synergy，應做較完整的 dose matrix，並使用 Bliss、Loewe 或 combination index 等方法分析藥物交互作用。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"project","text":"為什麼選 0.5 μM 5-FU 做低濃度合併實驗？","must":["低濃度","response window","單獨處理"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"選低濃度 5-FU 的目的，是讓 5-FU 單獨處理仍保留足夠 cell viability，不要先把細胞壓到太低，這樣才有空間觀察加入低濃度 Pimozide 後是否出現額外抑制。這個濃度設定主要是為了建立可比較的 response window，而不是代表臨床有效濃度。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"project","text":"為什麼 1 μM Pimozide + 5-FU 和 5-FU alone 沒有顯著差異，但 2.5 μM 有？","must":["1 μM","2.5 μM","顯著差異","dose-response"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"這表示在目前的 72 小時條件下，1 μM Pimozide 可能不足以在 5-FU 已有的抑制效果上造成可偵測的額外差異，而 2.5 μM 產生了較明顯的 additional effect。它也提醒我們 effect 可能有濃度門檻或非線性，但不能只靠兩個濃度就推完整 dose-response 或 synergy。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"project","text":"你怎麼排除 MitoSOX 訊號增加只是因為細胞狀態變差，而不是 Pimozide 的主要機制？","must":["secondary effect","較早時間點","ROS scavenger","intervention"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"目前不能完全排除。MitoSOX 增加可能是 Pimozide 直接影響粒線體 redox，也可能是細胞受到傷害後的 secondary effect。要區分可做較早 time point、使用不造成明顯 viability loss 的濃度，並用 antioxidant 或 mitochondrial ROS scavenger 做 intervention，看抑制 ROS 是否能改變後續 phenotype。","followups":[],"schools":null,"difficulty":"boss"},{"domain":"project","text":"15 μM MitoSOX 平均值比 10 μM 低，為什麼你沒有把它當成反例？","must":["15 μM","10 μM","變異","不宣稱 dose-dependent"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"15 μM 組平均值確實稍低於 10 μM，而且變異較大，所以我不會宣稱是嚴格的 dose-dependent increase。比較安全的解讀是各 Pimozide 組整體都高於 control，支持 mitochondrial oxidative stress 增加；15 μM 的非單調變化需要更多 biological replicates 才能判斷是變異、飽和或其他生物效應。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"project","text":"MitoTracker Deep Red 與 NAO 都可能受粒線體量影響，你怎麼解釋膜電位和總量結果？","must":["MitoTracker","NAO","limitation","TMRM","TOM20"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"這是目前方法上的重要 limitation。MitoTracker Deep Red 的累積受 membrane potential 影響，但也可能受到 mitochondrial mass 影響；NAO 主要和 cardiolipin-associated signal 有關，也不是絕對粒線體數量。現在可說兩者都顯示粒線體相關訊號上升，但若要分開 membrane potential 與 mass，應加入 TMRM/TMRE 等較專一的 potential assay，以及 TOM20、VDAC 或 mtDNA copy number 等 mass 指標。","followups":[],"schools":null,"difficulty":"boss"},{"domain":"project","text":"Shaw 2021 這篇 review 在你的簡報中扮演什麼角色？","must":["Shaw 2021","review","drug repurposing","背景"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Shaw 2021 是整理 diphenylbutylpiperidine 類抗精神病藥物抗癌老藥新用證據的 review，我引用它主要是建立 Pimozide 具有 anticancer repurposing potential 的背景。它不是 AGS 胃癌、也不是我這套粒線體實驗的直接證據，所以不能拿它來證明我的 mechanism。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"project","text":"Cai 2017 這篇論文大概在講什麼？和你的研究有什麼關係？","must":["Cai 2017","osteosarcoma","STAT3","catalase","ROS","5-FU"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"Cai 2017 在 human osteosarcoma model 研究 Pimozide，發現它可抑制 STAT3、降低 catalase、增加 ROS，並提高細胞對 5-FU 的抑制反應；研究也用 antioxidant 或 catalase 相關介入支持 ROS 參與其中。它提供了『Pimozide－ROS－5-FU response』的先驗依據，但癌種不是胃癌，所以我把它當成 hypothesis-generating evidence，而不是 AGS 的直接證明。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"project","text":"如果教授問：Cai 2017 已經做過 Pimozide + 5-FU，你的研究新意在哪裡？","must":["AGS","胃癌","粒線體","mechanistic hypothesis"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我的研究不是單純重複是否能和 5-FU 合併，而是把問題放到 AGS gastric cancer model，並特別觀察 intracellular Ca²⁺、mitochondrial membrane-potential-related signal、mitochondrial oxidative stress 與 mitochondrial mass-related signal，希望建立胃癌細胞中的粒線體層次線索。不過目前因果仍未完成，因此新意比較適合描述為在不同癌種中建立新的現象與 mechanistic hypothesis，而不是宣稱已證明完整 pathway。","followups":[],"schools":null,"difficulty":"boss"},{"domain":"project","text":"如果只用 AGS 一種胃癌細胞株，最大的限制是什麼？","must":["單一細胞株","heterogeneity","其他胃癌細胞株","正常胃上皮細胞"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"單一細胞株無法代表胃癌的 biological heterogeneity，也無法知道觀察到的效應是否只屬於 AGS 特定背景。後續應加入其他 gastric cancer cell lines，並加入 normal gastric epithelial cells 比較，才能更好評估可重現性與 cancer selectivity。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"project","text":"如果要把你的研究往下一步做，你最優先補哪個實驗？為什麼？","must":["rescue","NAC","MitoTEMPO","因果"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我會優先做 ROS rescue experiment，並把時間點和 concentration 和 5-FU combination 盡量匹配。原因是目前最大的證據缺口不是『有沒有 ROS 上升』，而是『ROS 是否真的造成 5-FU sensitivity 改變』；若加入 NAC 或 MitoTEMPO 後能逆轉增敏，才能直接提升因果證據。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"personal","text":"如果教授說你的專題不像傳統化工，你會怎麼回答？","must":["化工訓練","變因控制","量化","生物化工"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我會承認研究模型偏細胞生物，但我在設計與分析上一直使用化工訓練中的變因控制、濃度與時間尺度、量化比較和系統觀念。對我而言生物系統也是反應與傳輸耦合的複雜系統；若回到化工研究所，我希望把這些生醫經驗延伸到生物化工、材料或製程問題，而不是把兩邊完全切開。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"personal","text":"如果教授問：你的背景和本科生相比有缺口，為什麼還要錄取你？","must":["缺口","研究訓練","補強","跨領域"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我不會否認跨領域會有需要補強的基礎，但我的優勢是已經有實際研究訓練、能從不同領域理解問題，而且知道自己缺什麼、願意系統補足。我會用具體的實驗經驗、學習紀錄與問題處理方式證明自己不是只靠興趣轉換，而是已經投入並能持續學習。","followups":[],"schools":null,"difficulty":"hard"},{"domain":"personal","text":"如果研究方向和你原本期待的不一樣，你會怎麼決定是否繼續？","must":["研究興趣","彈性","溝通","長期方向"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我會先區分自己真正重視的是特定疾病題目，還是更高層次的研究問題與方法。如果核心問題、訓練價值和指導方式適合，即使題目不同我仍願意投入；若差異涉及長期方向或價值觀，我會先和指導老師溝通期待，再理性評估是否調整。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"personal","text":"你如何證明自己不是遇到困難就換方向？","must":["排查","證據","調整","不是逃避"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我會用實際經歷說明：遇到實驗失敗時，我的做法是先記錄、排查變因、查資料、和老師或學長姐討論，再決定是否修改方法；只有當證據顯示原方向不可行或資源不匹配時才調整。方向調整對我來說是基於證據的決策，不是逃避困難。","followups":[],"schools":null,"difficulty":"mid"},{"domain":"personal","text":"如果同時拿到化工和生醫研究所錄取，你會怎麼選？","must":["核心能力","研究方向","指導方式"],"nice":[],"hint":"先用一句話回答核心，再補機制、限制或例子。","answer":"我會依未來想培養的核心能力、實驗室研究方向、指導方式與資源做選擇，而不是只看校名。我目前的經驗橫跨化工與細胞研究，所以我會評估哪個環境最能把既有的定量訓練和我對細胞機制／生物應用的興趣結合起來。","followups":[],"schools":null,"difficulty":"hard"}];
