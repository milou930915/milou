<script>
'use strict';
const APP_VERSION='22.2.0';
// REVIEW_ENGINE_START
// Derived from answer history, so v20 records and cloud/JSON backups need no destructive migration.
const ReviewScheduler = (() => {
 const DAY=86400000, MINUTE=60000;
 const labels={new:'尚未練習',wrong:'答錯／不會',unclear:'需要補強',familiar:'大致會',mastered:'完全掌握',pending:'待複核'};
 const time=v=>typeof v==='number'?(Number.isFinite(v)?v:0):(Date.parse(v)||0);
 const recordTime=r=>time(r?.time);
 function family(q,questions){
  const id=q?.qid||q?.id;
  const source=questions.get(id);
  return q?.variantOf||source?.variantOf||id;
 }
 function classify(r){
  if(r.disputed)return 'pending';
  if(['wrong','unclear','familiar','mastered'].includes(r.mastery))return r.mastery;
  if(r.unknown||r.grade==='g1')return 'wrong';
  if(['g2','g3'].includes(r.grade))return 'unclear';
  if(['g4','g5'].includes(r.grade))return r.confidence==='低'?'pending':'familiar';
  return 'pending';
 }
 function index(questions,records,now=Date.now()){
  const byId=new Map(questions.map(q=>[q.id,q])), histories=new Map(), progress=new Map();
  for(const r of records){
   const key=family(r,byId);if(!key)continue;
   if(!histories.has(key))histories.set(key,[]);
   histories.get(key).push(r);
  }
  for(const [key,history] of histories){
   history.sort((a,b)=>recordTime(a)-recordTime(b)||String(a.id).localeCompare(String(b.id)));
   let prev=null,successes=0,lastSuccess=0;
   for(const r of history){
    const at=recordTime(r)||now, anchor=time(r.masteryAt)||at;
    let level=classify(r),days=0;
    const independent=r.grade==='g5'&&!r.guided&&r.hintUsed===false&&!r.disputed&&['高','中'].includes(r.confidence)&&!r.unknown;
    if(!r.mastery&&independent){
     if(!lastSuccess||at-lastSuccess>=DAY){successes++;lastSuccess=at;}
     if(successes>=2||prev?.level==='mastered')level='mastered';
    }else if(level!=='mastered'){successes=0;lastSuccess=0;}
    if(level==='mastered'){
     days=prev?.level==='mastered'?prev.intervalDays:14;
     if(prev?.level==='mastered'&&anchor-prev.lastAt>=DAY)days=days<30?30:60;
    }else if(level==='familiar')days=3;
    else if(level==='unclear')days=1;
    const due=level==='pending'?Infinity:anchor+(level==='wrong'?10*MINUTE:days*DAY);
    prev={key,level,due,lastAt:anchor,intervalDays:days,latest:r,attempts:history.length};
   }
   progress.set(key,prev);
  }
  return {byId,progress,now};
 }
 function info(q,idx){return idx.progress.get(family(q,idx.byId))||{key:family(q,idx.byId),level:'new',due:0,intervalDays:0,latest:null,attempts:0};}
 function pickQuestion(pool,idx,{formal=false,asked=[],recent=[],explicit=false,rng=Math.random}={}){
  const grouped=new Map();
  for(const q of pool){const key=family(q,idx.byId);if(asked.includes(key))continue;if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(q);}
  let entries=[...grouped].map(([key,qs])=>({key,qs,progress:info(qs[0],idx)}));
  // Keep the last concept out when there is an alternative, including reworded variants.
  if(recent.length&&entries.some(x=>!recent.slice(-3).includes(x.key)))entries=entries.filter(x=>!recent.slice(-3).includes(x.key));
  let selected=[];
  if(explicit)selected=entries;
  else{
   const fresh=entries.filter(x=>x.progress.level==='new');
   let due=entries.filter(x=>!['new','mastered','pending'].includes(x.progress.level)&&x.progress.due<=idx.now);
   if(formal&&!due.length&&!fresh.length)due=entries.filter(x=>!['new','mastered','pending'].includes(x.progress.level));
   const mastered=entries.filter(x=>x.progress.level==='mastered'&&(formal||x.progress.due<=idx.now));
   if(mastered.length&&(!fresh.length&&!due.length||rng()<.05))selected=mastered;
   else if(due.length&&(!fresh.length||rng()<.65))selected=due;
   else selected=fresh;
   // A formal exam can sample not-yet-due concepts, but never the same concept twice.
   if(!selected.length&&formal)selected=entries.filter(x=>!['mastered','pending'].includes(x.progress.level));
   if(!selected.length&&formal)selected=mastered;
  }
  if(!selected.length)return null;
  const weights=selected.map(x=>({wrong:4,unclear:2,familiar:1,new:1,mastered:1,pending:1}[x.progress.level]||1)*(x.progress.due&&x.progress.due<idx.now?1+Math.min(3,(idx.now-x.progress.due)/DAY):1));
  let ticket=rng()*weights.reduce((a,b)=>a+b,0),chosen=selected[selected.length-1];
  for(let i=0;i<selected.length;i++){ticket-=weights[i];if(ticket<0){chosen=selected[i];break;}}
  const core=chosen.qs.filter(q=>!q.variantOf),variants=chosen.qs.filter(q=>q.variantOf);
  const choices=core.length&&(!variants.length||rng()<.72)?core:variants;
  return choices[Math.floor(rng()*choices.length)];
 }
 function mergeRecords(a,b){
  const out=new Map();
  for(const r of [...(a||[]),...(b||[])]){
   if(!r?.id)continue;
   const old=out.get(r.id);if(!old){out.set(r.id,{...r});continue;}
   const newer=time(r.updatedAt||r.time)>time(old.updatedAt||old.time)?r:old;
   const merged={...old,...r,...newer};
   // A favorite on one device must not erase a newer mastery decision on the other.
   for(const [stamp,fields] of [['favoriteAt',['favorite']],['assessmentAt',['mastery','masteryAt','disputed']]]){
    const winner=time(r[stamp])>time(old[stamp])?r:old;
    if(winner[stamp]){merged[stamp]=winner[stamp];for(const field of fields){if(field in winner)merged[field]=winner[field];else delete merged[field];}}
   }
   out.set(r.id,merged);
  }
  return [...out.values()].sort((a,b)=>recordTime(b)-recordTime(a)||String(b.id).localeCompare(String(a.id)));
 }

function stableId(domain,text){let h=2166136261;const s=domain+'|'+text;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'q_'+(h>>>0).toString(36)}
function Q(domain,text,must=[],nice=[],hint='',answer='',followups=[],schools=null,difficulty=null){
 return {id:stableId(domain,text),domain,text,must:must.map(parseGroup),nice:nice.map(parseGroup),hint,answer,followups,schools,difficulty:difficulty||pick(['basic','mid','mid','hard','boss'])};
}
function parseGroup(x){return Array.isArray(x)?x:String(x).split('|').map(s=>s.trim()).filter(Boolean)}
function A(text){return text}

function generateCalcQuestions(){
 const arr=[];
 for(const c of [5,10,15,20]) for(const v of [100,200]){
   const nmol=c*v/1000;
   arr.push(Q('calc',`${c} μM 的藥物加在 ${v} μL 的單一 well 中，總莫耳數是多少？`,['nmol|奈莫耳'],[], 'μM × μL 可以直接換成 pmol：1 μM×1 μL=1 pmol。',A(`${c} μM × ${v} μL = ${c*v} pmol = ${nmol} nmol。`),[],['ntuche','nckuche','ccuche']));
 }
 for(const k of [0.1,0.2,0.5]){
  const t=(Math.log(2)/k).toFixed(2);
  arr.push(Q('calc',`一階反應速率常數 k = ${k} min⁻¹，半衰期約多少分鐘？`,['0.693|ln2'],[], '一階反應 t1/2 = ln2/k。',A(`t1/2 = 0.693/${k} ≈ ${t} min。`),[],['ntuche','nckuche','ccuche']));
 }
 return arr;
}

const V2_EXTENDED_SPECS=[{"domain":"physiology","text":"resting membrane potential 為什麼通常接近 K⁺ 的 equilibrium potential？","must":["K+ permeability|鉀離子通透性","leak channel|漏通道"],"nice":["Goldman|Nernst"],"hint":"靜止時膜對 K⁺ 的相對通透性通常較高。","answer":"靜止膜電位由多種離子與相對通透性共同決定，但許多細胞在靜止時對 K⁺ 的通透性最高，因此膜電位常接近 K⁺ 的平衡電位。"},{"domain":"physiology","text":"Na⁺/K⁺-ATPase 每次循環搬運哪些離子？它直接造成 action potential 嗎？","must":["3 Na|三個鈉","2 K|兩個鉀","ATP"],"nice":["maintain gradients|維持濃度梯度","不是直接 action potential"],"hint":"先答 stoichiometry，再區分「建立梯度」與「快速電位變化」。","answer":"Na⁺/K⁺-ATPase 每消耗 1 ATP 將 3 Na⁺送出、2 K⁺送入。它主要維持離子濃度梯度並小幅具 electrogenic effect；action potential 的快速變化主要由 voltage-gated ion channels 造成。"},{"domain":"physiology","text":"refractory period 為什麼能限制神經元的最高放電頻率？","must":["Na channel inactivation|鈉通道失活","absolute refractory|絕對不反應期"],"nice":["K conductance|鉀通透性"],"hint":"核心是電壓閘控 Na⁺ channel 的狀態。","answer":"action potential 後部分 Na⁺ channel 處於失活狀態，短時間內無法再次開啟，形成 absolute refractory period；之後 K⁺ conductance 仍較高，形成 relative refractory period，因此限制放電頻率。"},{"domain":"physiology","text":"交感神經刺激心臟時，心率與收縮力通常怎麼變？主要透過哪類 receptor？","must":["heart rate increase|心率上升","contractility increase|收縮力上升","beta1|β1"],"nice":["cAMP|PKA"],"hint":"心臟以 β1 adrenergic effect 為主。","answer":"交感刺激 β1 adrenergic receptor，經 Gs-cAMP-PKA 增加 pacemaker activity 與 Ca²⁺ handling，因此心率與收縮力通常上升。"},{"domain":"physiology","text":"Frank-Starling mechanism 的核心概念是什麼？","must":["preload|venous return|回心血量","stroke volume increase|搏出量增加"],"nice":["sarcomere length|肌節長度"],"hint":"不是神經反射，而是心肌本身的長度－張力關係。","answer":"在一定範圍內，心室舒張末期充盈增加使心肌纖維被拉長，提升收縮力量與 stroke volume，讓輸入與輸出匹配。"},{"domain":"physiology","text":"cardiac output 怎麼計算？哪些因素會改變它？","must":["heart rate|心率","stroke volume|搏出量"],"nice":["preload|afterload|contractility"],"hint":"先給 CO = HR × SV。","answer":"Cardiac output = heart rate × stroke volume。HR 受自主神經等調節；SV 受 preload、afterload 與 contractility 影響。"},{"domain":"physiology","text":"afterload 增加時，若其他條件不變，stroke volume 通常怎麼變？為什麼？","must":["stroke volume decrease|搏出量下降","ejection resistance|射血阻力"],"nice":["end systolic volume increase"],"hint":"想成心室要對抗更高壓力射血。","answer":"afterload 增加代表心室射血阻力上升，在其他條件相同時通常使 ejecting volume 減少、end-systolic volume 上升，因此 stroke volume 下降。"},{"domain":"physiology","text":"GFR 主要受哪些 Starling forces 影響？","must":["glomerular capillary hydrostatic pressure|腎小球毛細血管靜水壓","Bowman pressure|Bowman囊壓","oncotic pressure|膠體滲透壓"],"nice":["Kf"],"hint":"至少說出促進與反對 filtration 的壓力。","answer":"GFR 取決於 filtration coefficient Kf 與淨過濾壓。腎小球毛細血管靜水壓促進過濾；Bowman 囊靜水壓與血漿膠體滲透壓主要反對過濾。"},{"domain":"physiology","text":"ADH 增加時，collecting duct 對水的通透性如何改變？","must":["AQP2|aquaporin 2","water permeability increase|水通透性上升"],"nice":["V2 receptor|cAMP"],"hint":"重點是 apical AQP2 插入。","answer":"ADH 經 V2 receptor-cAMP/PKA 促進 AQP2 插入 collecting duct principal cell 的 apical membrane，提高水通透性與水回收。"},{"domain":"physiology","text":"aldosterone 主要作用在哪些細胞？對 Na⁺ 與 K⁺ 有什麼影響？","must":["principal cell|主細胞","Na reabsorption increase|鈉回收增加","K secretion increase|鉀分泌增加"],"nice":["ENaC|NaK ATPase"],"hint":"distal nephron principal cells 是常見答案。","answer":"aldosterone 在 distal nephron principal cells 增加 ENaC 與 Na⁺/K⁺-ATPase 等作用，促進 Na⁺ reabsorption，並增加 K⁺ secretion。"},{"domain":"physiology","text":"RAAS 在血壓降低時怎麼被啟動？","must":["renin|腎素","angiotensin II","aldosterone"],"nice":["vasoconstriction|Na retention"],"hint":"從 renin 開始串起來。","answer":"腎灌流壓下降、交感刺激或 macula densa NaCl 下降可促進 renin。renin 形成 Ang I，再經 ACE 形成 Ang II，引起 vasoconstriction 並促進 aldosterone 等，增加 Na⁺/水 retention 與血壓。"},{"domain":"physiology","text":"respiratory acidosis 最基本的原因是什麼？腎臟如何代償？","must":["CO2 retention|二氧化碳滯留","hypoventilation|低通氣"],"nice":["HCO3 reabsorption|bicarbonate retention","H secretion"],"hint":"先分 primary respiratory change 和 renal compensation。","answer":"respiratory acidosis 的 primary disturbance 是 CO₂ 上升，常見於 hypoventilation。慢性時腎臟增加 H⁺ 排泄與 HCO₃⁻ reabsorption／新生作為代償。"},{"domain":"physiology","text":"metabolic acidosis 時呼吸系統如何快速代償？","must":["hyperventilation|過度換氣","CO2 decrease|二氧化碳下降"],"nice":["Kussmaul"],"hint":"降低 CO₂ 以把 pH 拉回。","answer":"metabolic acidosis 時 chemoreceptor 促進 ventilation，降低 PaCO₂，藉 bicarbonate buffer system 把 pH 往正常方向拉回。"},{"domain":"physiology","text":"氧合血紅素 dissociation curve 右移代表什麼？哪些因素會造成右移？","must":["affinity decrease|氧親和力下降","oxygen unloading increase|釋氧增加"],"nice":["CO2 increase|H+ increase|temperature increase|2,3-BPG"],"hint":"先講 right shift 的生理意義。","answer":"右移表示 Hb 對 O₂ 親和力下降、組織釋氧較容易；CO₂/H⁺ 上升、溫度上升、2,3-BPG 增加等可促進右移。"},{"domain":"physiology","text":"surfactant 的生理功能是什麼？缺乏時會發生什麼？","must":["surface tension decrease|表面張力下降","alveolar collapse|肺泡塌陷"],"nice":["type II pneumocyte|compliance"],"hint":"用 Laplace law 思考小肺泡。","answer":"surfactant 由 type II pneumocyte 產生，降低 alveolar surface tension，提高 compliance 並減少小肺泡塌陷。缺乏時呼吸功增加且易 atelectasis。"},{"domain":"physiology","text":"中樞與周邊 chemoreceptor 在呼吸調控上主要感受到什麼？","must":["central CO2|H+ CSF","peripheral O2|CO2|pH"],"nice":["carotid body"],"hint":"中樞主要間接感受 CO₂ 造成的 CSF H⁺。","answer":"central chemoreceptors 主要反映 CO₂ 穿過 BBB 後造成的 CSF H⁺；peripheral chemoreceptors 位於 carotid/aortic bodies，可感受低 PaO₂、CO₂ 與 pH。"},{"domain":"physiology","text":"insulin 如何降低血糖？請至少說兩個作用。","must":["glucose uptake increase|葡萄糖攝取","glycogen synthesis increase|肝醣合成"],"nice":["gluconeogenesis decrease|lipogenesis"],"hint":"可從 muscle/adipose GLUT4 與 liver metabolism 回答。","answer":"insulin 促進 muscle/adipose GLUT4-mediated glucose uptake，增加 glycogen synthesis，抑制 hepatic gluconeogenesis/glycogenolysis，並促進脂質儲存，整體降低血糖。"},{"domain":"physiology","text":"glucagon 在低血糖時做什麼？主要作用器官是哪裡？","must":["liver|肝臟","glycogenolysis|肝醣分解","gluconeogenesis|糖質新生"],"nice":["cAMP"],"hint":"glucagon 對 skeletal muscle 沒有同等主要直接作用。","answer":"glucagon 主要作用於 liver，透過 cAMP/PKA 促進 glycogenolysis 與 gluconeogenesis，提高血糖。"},{"domain":"physiology","text":"HPA axis 的基本路徑與 cortisol 的負回饋怎麼運作？","must":["CRH","ACTH","cortisol"],"nice":["negative feedback|負回饋"],"hint":"三層軸：hypothalamus→pituitary→adrenal cortex。","answer":"hypothalamus 分泌 CRH，刺激 anterior pituitary ACTH，再促進 adrenal cortex cortisol。cortisol 對 hypothalamus 與 pituitary 負回饋。"},{"domain":"physiology","text":"synaptic transmission 中 Ca²⁺ 為什麼重要？","must":["voltage gated Ca channel|電壓閘控鈣通道","vesicle fusion|囊泡融合"],"nice":["SNARE|neurotransmitter release"],"hint":"presynaptic terminal depolarization 後 Ca²⁺ influx 是觸發點。","answer":"動作電位到 presynaptic terminal 後打開 voltage-gated Ca²⁺ channels，Ca²⁺ influx 促進 synaptic vesicle 與 membrane fusion，釋放 neurotransmitter。"},{"domain":"physiology","text":"EPSP 和 IPSP 的差別是什麼？","must":["depolarize|去極化","hyperpolarize|抑制 firing"],"nice":["Cl|K"],"hint":"不要說 EPSP 一定會產生 action potential。","answer":"EPSP 讓 postsynaptic membrane potential 更接近 threshold，提高 firing 機率；IPSP 使其遠離 threshold 或產生 shunting inhibition，降低 firing 機率。"},{"domain":"physiology","text":"skeletal muscle excitation-contraction coupling 的大致流程？","must":["action potential","T tubule","SR Ca release|肌漿網釋鈣"],"nice":["troponin"],"hint":"從 sarcolemma/T-tubule 接到 SR。","answer":"肌膜 action potential 進入 T-tubule，啟動 voltage sensor 與 SR Ca²⁺ release，Ca²⁺ 結合 troponin C，讓 actin-myosin cross-bridge cycling 進行。"},{"domain":"physiology","text":"smooth muscle 和 skeletal muscle 的 Ca²⁺ 調控有何一個核心差異？","must":["calmodulin|MLCK","troponin absent|無troponin"],"nice":["myosin light chain"],"hint":"smooth muscle 主要走 Ca²⁺-calmodulin-MLCK。","answer":"smooth muscle 中 Ca²⁺ 結合 calmodulin，活化 MLCK 並 phosphorylate myosin light chain；skeletal muscle 主要以 Ca²⁺-troponin 調節 thin filament。"},{"domain":"physiology","text":"homeostasis 和 steady state 是完全一樣的概念嗎？","must":["不完全相同|不是","regulated variables|調控"],"nice":["energy required|dynamic"],"hint":"homeostasis 強調 regulated internal environment。","answer":"steady state 表示某些量平均不隨時間變；homeostasis 強調生物系統主動調控內環境在可接受範圍，常需要能量且可存在持續 flux。"},{"domain":"physiology","text":"如果 extracellular K⁺ 顯著升高，resting membrane potential 通常往哪個方向變？","must":["depolarize|去極化","K gradient decrease|鉀梯度下降"],"nice":["Nernst"],"hint":"外 K⁺ 上升使 K⁺ equilibrium potential 變得較不負。","answer":"extracellular K⁺ 上升會減小 K⁺ concentration gradient，使 E_K 變得較不負；因靜止膜對 K⁺ 通透性高，resting membrane potential 通常 depolarize。"},{"domain":"physiology","text":"如果一個細胞的 Na⁺ channel 無法 inactivate，action potential 可能出現什麼問題？","must":["repolarization delayed|復極延遲","persistent Na current|持續鈉流"],"nice":["excitability altered"],"hint":"持續 inward Na⁺ current 會讓膜電位難以正常回復。","answer":"Na⁺ channel 無法正常 inactivate 會造成持續 inward current，延長 depolarization、干擾 repolarization 與 refractory behavior。"},{"domain":"physiology","text":"什麼是 mean arterial pressure？臨床上常用什麼近似關係？","must":["MAP","diastolic + one third pulse pressure|舒張壓+1/3脈壓"],"nice":["cardiac output x TPR"],"hint":"正常心率下可用 DBP + 1/3(SBP-DBP)。","answer":"MAP 代表一個 cardiac cycle 的平均 arterial pressure。正常心率下常近似 DBP + 1/3 pulse pressure；系統層面 MAP 約與 CO × total peripheral resistance 有關。"},{"domain":"biochem","text":"competitive inhibitor 對 Km 與 Vmax 的典型影響？","must":["Km increase|Km上升","Vmax unchanged|Vmax不變"],"nice":["high substrate overcome"],"hint":"可從 active site competition 理解。","answer":"competitive inhibitor 和 substrate 競爭 active site，表觀 Km 上升；足夠高 substrate 可克服，因此 Vmax 典型上不變。"},{"domain":"biochem","text":"pure noncompetitive inhibition 對 Km 與 Vmax 的典型影響？","must":["Vmax decrease|Vmax下降","Km unchanged|Km不變"],"nice":["allosteric"],"hint":"注意真實 mixed inhibition 不一定 Km 不變。","answer":"純 noncompetitive inhibition 降低有效 enzyme activity，因此 Vmax 下降；對 substrate affinity 的影響在理想純型下抵消，Km 不變。"},{"domain":"biochem","text":"uncompetitive inhibitor 對 Km 與 Vmax 的典型影響？","must":["Km decrease|Km下降","Vmax decrease|Vmax下降"],"nice":["ES complex"],"hint":"它 preferentially bind ES complex。","answer":"uncompetitive inhibitor 只和 ES complex 結合，使 Vmax 與表觀 Km 都下降。"},{"domain":"biochem","text":"為什麼 ATP/ADP ratio 可以反映細胞能量狀態？","must":["ATP high energy|高能量","ADP signals demand|能量需求"],"nice":["AMPK"],"hint":"比值反映能量供需平衡。","answer":"ATP 高而 ADP/AMP 低通常表示能量充足；ATP 降低、ADP/AMP 增加會啟動如 AMPK 的能量壓力反應。"},{"domain":"biochem","text":"AMPK 被活化時，對 anabolic 與 catabolic pathway 一般有什麼方向性影響？","must":["catabolic increase|分解代謝增加","anabolic decrease|合成代謝下降"],"nice":["ATP restoration"],"hint":"AMPK 的目標是恢復 ATP。","answer":"AMPK 在能量不足時促進產 ATP 的 catabolic pathways，並抑制耗 ATP 的 anabolic pathways，以恢復能量平衡。"},{"domain":"biochem","text":"NAD⁺/NADH ratio 為什麼重要？","must":["redox state|氧化還原狀態","electron transfer|電子轉移"],"nice":["metabolic flux"],"hint":"很多 dehydrogenase reaction 依賴這個 ratio。","answer":"NAD⁺/NADH ratio 反映細胞 redox state，影響 dehydrogenase reactions、TCA、glycolysis 與 mitochondrial electron transfer 等代謝方向。"},{"domain":"biochem","text":"substrate-level phosphorylation 和 oxidative phosphorylation 差在哪？","must":["direct phosphate transfer|直接磷酸轉移","ETC proton gradient|電子傳遞鏈質子梯度"],"nice":["ATP"],"hint":"一個不需呼吸鏈，一個依賴 chemiosmosis。","answer":"substrate-level phosphorylation 由高能中間物直接把 phosphate 轉給 ADP；oxidative phosphorylation 由 ETC 建立 proton motive force 驅動 ATP synthase。"},{"domain":"biochem","text":"pyruvate 在有氧與缺氧條件下可能走哪些主要方向？","must":["acetyl-CoA|乙醯輔酶A","lactate|乳酸"],"nice":["PDH|NAD regeneration"],"hint":"缺氧時 lactate formation 可再生 NAD⁺。","answer":"有氧時 pyruvate 常由 PDH 轉為 acetyl-CoA 進 TCA；缺氧或高 glycolytic flux 時可由 LDH 轉 lactate 並再生 NAD⁺。"},{"domain":"biochem","text":"PDH complex 為什麼是 glycolysis 與 TCA 的重要連接點？","must":["pyruvate to acetyl-CoA|丙酮酸轉乙醯輔酶A"],"nice":["irreversible|regulation"],"hint":"它把 cytosolic glycolysis 的 carbon 送入 mitochondrial TCA。","answer":"PDH 將 pyruvate oxidative decarboxylation 成 acetyl-CoA，連接 glycolysis 與 TCA，且是高度調控、近不可逆的重要代謝節點。"},{"domain":"biochem","text":"脂肪酸 beta-oxidation 的主要產物有哪些？","must":["acetyl-CoA","NADH","FADH2"],"nice":["mitochondria"],"hint":"它同時供給 TCA 與 ETC。","answer":"beta-oxidation 每一循環產生 acetyl-CoA、NADH 與 FADH₂；前者進 TCA 或 ketogenesis，還原當量進 ETC。"},{"domain":"biochem","text":"citrate 在代謝調控上除了 TCA intermediate 還能傳達什麼訊號？","must":["energy abundance|能量充足"],"nice":["PFK inhibition|fatty acid synthesis"],"hint":"高 citrate 常暗示 carbon/energy 充足。","answer":"citrate 可從 mitochondria 輸出供 lipid synthesis，且高 citrate 可抑制 PFK-1 等，反映能量與 biosynthetic precursor 充足。"},{"domain":"biochem","text":"ROS 中 superoxide、hydrogen peroxide 的反應性與訊號角色可以完全等同嗎？","must":["不同|not identical","superoxide|H2O2"],"nice":["H2O2 signaling"],"hint":"不同 ROS 的位置、半衰期與反應性不同。","answer":"superoxide 與 H₂O₂ 是不同 ROS；superoxide 帶電且反應特性不同，H₂O₂ 較穩定、可跨距離參與 redox signaling，因此不能把所有 ROS 視為同一訊號。"},{"domain":"biochem","text":"SOD 和 catalase 分別處理哪些 ROS？","must":["SOD superoxide to H2O2","catalase H2O2 to water oxygen"],"nice":[],"hint":"先把 superoxide 轉 H₂O₂，再清除 H₂O₂。","answer":"SOD 將 superoxide dismutate 成 H₂O₂；catalase 再把 H₂O₂ 分解成水與氧。"},{"domain":"biochem","text":"glutathione redox system 中 GSH 與 GSSG 代表什麼？","must":["GSH reduced|還原型","GSSG oxidized|氧化型"],"nice":["glutathione peroxidase|NADPH"],"hint":"GSH/GSSG ratio 常作 redox indicator。","answer":"GSH 是 reduced glutathione，可供 glutathione peroxidase 清除 peroxide 後形成 GSSG；GSH/GSSG ratio 可反映 cellular redox status。"},{"domain":"biochem","text":"Nrf2 在 oxidative stress 下為什麼會活化？","must":["Keap1|Nrf2 stabilization|穩定化"],"nice":["antioxidant response element|ARE"],"hint":"oxidative modification of Keap1 會降低 Nrf2 degradation。","answer":"正常時 Keap1 促進 Nrf2 ubiquitination/degradation；oxidative/electrophilic stress 改變 Keap1 後，Nrf2 累積進核，啟動 ARE-dependent antioxidant genes。"},{"domain":"molbio","text":"transcription 和 translation 在真核細胞分別主要發生在哪裡？","must":["nucleus|細胞核","cytoplasm|細胞質"],"nice":["ribosome|ER"],"hint":"mRNA processing 也在 nucleus。","answer":"真核 transcription 主要在 nucleus，mRNA 經 processing/export 後在 cytosolic ribosome 或 rough ER-associated ribosome translation。"},{"domain":"molbio","text":"mRNA splicing 的基本作用是什麼？","must":["intron removal|移除內含子","exon ligation|外顯子連接"],"nice":["spliceosome"],"hint":"alternative splicing 可產生多種 isoform。","answer":"splicing 由 spliceosome 等 machinery 去除 introns、連接 exons；alternative splicing 可使同一 gene 產生不同 mRNA/protein isoforms。"},{"domain":"molbio","text":"enhancer 和 promoter 的基本差異？","must":["enhancer distal regulatory|遠端調控","promoter transcription start|轉錄起始附近"],"nice":["transcription factors"],"hint":"enhancer 可距離遠且 orientation 具彈性。","answer":"promoter 位於 transcription start 附近並招募 basal transcription machinery；enhancer 可較遠，經 TF/coactivator 與 chromatin looping 增強 transcription。"},{"domain":"molbio","text":"epigenetic regulation 常見有哪些機制？","must":["DNA methylation|DNA甲基化","histone modification|組蛋白修飾"],"nice":["chromatin accessibility|ncRNA"],"hint":"不改變 DNA sequence 但改變 gene expression state。","answer":"常見包括 DNA methylation、histone modifications、chromatin remodeling 與部分 non-coding RNA regulation，改變 chromatin accessibility／gene expression 而不改變 DNA sequence。"},{"domain":"molbio","text":"DNA methylation 在 promoter 區增加時，gene expression 常見趨勢？","must":["decrease|下降","transcription repression|轉錄抑制"],"nice":["context dependent"],"hint":"先講典型趨勢，再保留例外。","answer":"許多 promoter/CpG island hypermethylation 與 reduced transcription 有關，透過阻礙 TF 或招募 repressive chromatin machinery；但實際效果依基因位置與 context。"},{"domain":"molbio","text":"siRNA 和 miRNA 的基本差異可以怎麼說？","must":["siRNA near perfect complement|高度互補","miRNA partial complement|部分互補"],"nice":["RISC|mRNA degradation|translation repression"],"hint":"兩者都可進 RISC。","answer":"siRNA 常與 target 高度互補並促進 mRNA cleavage；miRNA 常以部分互補調控多個 targets，造成 translation repression 或 mRNA destabilization。"},{"domain":"molbio","text":"northern blot、southern blot、western blot 分別主要偵測什麼？","must":["Northern RNA","Southern DNA","Western protein"],"nice":[],"hint":"這是經典快問題。","answer":"Northern blot 偵測 RNA，Southern blot 偵測 DNA，Western blot 偵測 protein。"},{"domain":"molbio","text":"PCR 出現多條非特異 band，你會先從哪些條件調整？","must":["annealing temperature|退火溫度","primer specificity|引子專一性"],"nice":["Mg2+|cycle number"],"hint":"先檢查 primer 與 annealing。","answer":"可提高/優化 annealing temperature、重新設計更 specific primer、調整 Mg²⁺、template amount、cycle number 或使用 hot-start polymerase。"},{"domain":"molbio","text":"PCR 沒有任何 band，你會怎麼系統排查？","must":["positive control|陽性對照","template|primer|polymerase"],"nice":["annealing|gel"],"hint":"先確認 assay/電泳系統，再逐項檢查。","answer":"先確認 positive control 與 gel/staining 正常，再檢查 template quality/amount、primer、polymerase/master mix、annealing temperature、cycling program 與 pipetting。"},{"domain":"molbio","text":"housekeeping gene 可以永遠直接拿來做 qPCR normalization 嗎？","must":["不一定|不是","stability validation|穩定性驗證"],"nice":["multiple reference genes"],"hint":"處理條件可能改變 housekeeping gene。","answer":"不可以假設永遠穩定。reference gene 應在特定 cell/treatment 下驗證 expression stability，必要時使用多個 reference genes。"},{"domain":"cellbio","text":"lysosome 的主要功能？","must":["degradation|降解","acidic|酸性"],"nice":["autophagy|endocytosis"],"hint":"它是 acidic degradative compartment。","answer":"lysosome 維持酸性環境並含多種 hydrolases，降解 endocytosed cargo、damaged organelles 與 autophagic material，再回收 building blocks。"},{"domain":"cellbio","text":"proteasome 和 lysosome 在蛋白／胞器降解上有什麼典型差異？","must":["proteasome ubiquitinated proteins|泛素蛋白","lysosome organelles|膜性/胞器"],"nice":["autophagy"],"hint":"不要說完全互斥。","answer":"proteasome 主要處理許多 ubiquitinated soluble proteins；lysosome 可經 endocytosis/autophagy 處理 membrane proteins、macromolecules 與 organelles，兩系統有交互作用。"},{"domain":"cellbio","text":"mitochondrial fission 和 fusion 為什麼重要？","must":["quality control|品質控制","network dynamics|動態"],"nice":["DRP1|MFN|OPA1"],"hint":"它們不是單純形態變化。","answer":"fusion 可混合 mitochondrial contents、支持功能互補；fission 有助分配與隔離受損部分並配合 mitophagy，兩者平衡維持 mitochondrial homeostasis。"},{"domain":"cellbio","text":"mitophagy 是什麼？為什麼和 mitochondrial quality control 有關？","must":["selective autophagy|選擇性自噬","damaged mitochondria removal|移除受損粒線體"],"nice":["PINK1|Parkin"],"hint":"把受損 mitochondria 送進 lysosome。","answer":"mitophagy 是選擇性清除受損或多餘 mitochondria 的 autophagy，避免 dysfunctional organelles 累積與過量 ROS，是 mitochondrial quality control 的一環。"},{"domain":"cellbio","text":"ER 和 mitochondria 的接觸區域可能參與哪些功能？","must":["Ca transfer|鈣離子轉移","lipid transfer|脂質轉移"],"nice":["MAM|stress signaling"],"hint":"可用 MAM 概念回答。","answer":"ER-mitochondria contact sites/MAMs 參與 Ca²⁺ transfer、lipid exchange、metabolism、fission 與 stress/apoptotic signaling。"},{"domain":"cellbio","text":"cell cycle G1/S checkpoint 主要在防什麼？","must":["DNA damage|DNA損傷","S phase entry|進入S期"],"nice":["p53|Rb"],"hint":"DNA 未準備好不應複製。","answer":"G1/S checkpoint 評估 growth signal、DNA integrity 等，避免 damaged DNA 進入 replication；p53-p21、Rb/E2F 是常見調控軸。"},{"domain":"cellbio","text":"p53 活化後可能造成哪些細胞結果？","must":["cell cycle arrest|細胞週期停滯","apoptosis"],"nice":["DNA repair|senescence"],"hint":"依 damage/context 可有不同 outcome。","answer":"p53 可誘導 p21 等造成 cell-cycle arrest、促進 DNA repair；若損傷嚴重可促進 apoptosis 或 senescence。"},{"domain":"cellbio","text":"epithelial-mesenchymal transition 的典型 marker 變化？","must":["E-cadherin decrease|E-cadherin下降","vimentin increase|vimentin上升"],"nice":["N-cadherin|migration"],"hint":"這是典型趨勢，不是單一 marker 就能證明 EMT。","answer":"EMT 常伴隨 E-cadherin/epithelial markers 下降、N-cadherin/vimentin 等 mesenchymal markers 上升，以及 migration/invasion phenotype 改變；應多指標驗證。"},{"domain":"cellbio","text":"cancer stem cell marker 增加就能證明 stemness 增加嗎？","must":["不能|不可以","functional assay|功能性驗證"],"nice":["sphere formation|tumor initiation"],"hint":"marker ≠ function。","answer":"不能只靠單一 surface marker。應搭配 sphere formation、self-renewal、differentiation 或 tumor-initiation 等 functional assays，再談 stemness。"},{"domain":"cellbio","text":"receptor internalization 對 signaling 可能有什麼影響？","must":["signal attenuation|訊號衰減","recycling|degradation"],"nice":["endosomal signaling"],"hint":"內吞不一定只等於關閉訊號。","answer":"receptor internalization 可將 receptor recycle、送 lysosome degradation 以降低訊號，也可能在 endosome 持續或改變 signaling output。"},{"domain":"cellbio","text":"細胞膜 fluidity 受哪些因素影響？","must":["cholesterol|膽固醇","fatty acid saturation|脂肪酸飽和度"],"nice":["temperature|chain length"],"hint":"unsaturated fatty acid 增加通常提高 fluidity。","answer":"membrane fluidity 受 temperature、fatty-acid saturation/chain length 與 cholesterol 等影響；cholesterol 對 fluidity 有 buffer effect。"},{"domain":"experiment","text":"biological replicate 和 technical replicate 有什麼差異？","must":["biological independent samples|獨立生物樣本","technical repeated measurement|技術重複"],"nice":["generalizability"],"hint":"technical replicate 不能取代 independent biological replicate。","answer":"biological replicates 是獨立樣本／獨立實驗，反映 biological variability；technical replicates 是同一樣本的重複測量，主要估計 assay/pipetting variation。"},{"domain":"experiment","text":"SD 和 SEM 分別代表什麼？","must":["SD data variability|資料離散","SEM uncertainty of mean|平均估計不確定性"],"nice":["SEM=SD/sqrt n"],"hint":"不要把 SEM 當成樣本離散程度。","answer":"SD 描述 observations 的 spread；SEM = SD/√n，描述 sample mean 對 population mean 的估計精確度。"},{"domain":"experiment","text":"one-way ANOVA 什麼情況適用？為什麼不能用很多次 t-test 取代？","must":["three or more groups|多組","type I error|第一型錯誤累積"],"nice":["post hoc"],"hint":"ANOVA 先測整體，再做 post-hoc。","answer":"one-way ANOVA 用於一個 factor、多組平均值比較。多次 pairwise t-tests 會膨脹 family-wise type I error，因此通常先 ANOVA 再適當 post-hoc。"},{"domain":"experiment","text":"two-way ANOVA 比 one-way 多回答什麼？","must":["two factors|兩因子","interaction|交互作用"],"nice":["main effects"],"hint":"例如 concentration × time。","answer":"two-way ANOVA 可同時檢驗兩個 factors 的 main effects 與 interaction，例如 drug concentration、time 及 concentration×time interaction。"},{"domain":"experiment","text":"normalization 的目的什麼？什麼時候 normalization 反而可能造成誤導？","must":["control technical variation|控制技術差異"],"nice":["reference instability|reference受處理影響"],"hint":"reference 本身若不穩定，normalization 會出錯。","answer":"normalization 用 reference/control 修正 loading、sample amount 等差異；若 reference 被 treatment 改變或 denominator 接近零，就可能導入 bias。"},{"domain":"experiment","text":"flow cytometry 的 gating strategy 為什麼要事先合理設計？","must":["exclude debris|排除碎片","singlets|單細胞"],"nice":["live cells|controls"],"hint":"gating 會直接影響定量結果。","answer":"合理 gating 通常逐步排 debris、doublets、dead cells，再分析 target population；門檻應依 controls 設定並一致應用，避免主觀挑結果。"},{"domain":"experiment","text":"flow cytometry 中 unstained control、single-color control 各有什麼用途？","must":["unstained background|背景自體螢光","single color compensation|補償"],"nice":["voltage setup"],"hint":"不同 control 回答不同問題。","answer":"unstained control 幫助了解 autofluorescence/background；single-color controls 用於估計 spectral spillover 並做 compensation。"},{"domain":"experiment","text":"FMO control 是什麼？什麼情況特別有用？","must":["fluorescence minus one|少一色","gating dim positive|弱陽性 gating"],"nice":["multicolor"],"hint":"尤其多色且 population boundary 不清時。","answer":"FMO 包含除目標 marker 外所有 fluorophores，可估計其他 channel spillover/spreading 對該 channel 的背景，幫助設定弱陽性 gate。"},{"domain":"experiment","text":"fluorescence probe 的訊號增加，為什麼不一定等於 analyte 絕對濃度按比例增加？","must":["probe nonlinearity|非線性","loading|environment"],"nice":["saturation|photobleaching"],"hint":"fluorescence 是 measurement model，不是必然絕對濃度。","answer":"probe loading、binding affinity、dynamic range、saturation、photobleaching、pH/環境與 instrument setting 都可能影響 fluorescence，因此未校正時多是相對訊號。"},{"domain":"experiment","text":"如何判斷一個結果是 technical artifact 還是 biological effect？","must":["controls|對照","independent repeats|獨立重複"],"nice":["orthogonal assay|另一方法"],"hint":"靠設計排除，不靠直覺。","answer":"檢查 controls、reagent/instrument、batch、cell state，做 independent biological repeats，並用 orthogonal assay 驗證同一 biological conclusion。"},{"domain":"experiment","text":"如果同一實驗第一次顯著、第二次不顯著，你會怎麼處理？","must":["look at effect size|效果量","variation|變異","repeat independent"],"nice":["pool preplanned|power"],"hint":"不要只挑有顯著那次。","answer":"先比較 effect direction/size、variance、sample quality 與 protocol differences；依預先設計做足 independent replicates，再用適當統計整體分析，不應選擇性報告。"},{"domain":"experiment","text":"為什麼不能只根據 p value 排實驗結果的重要性？","must":["effect size|效果量","confidence interval|信賴區間"],"nice":["biological relevance"],"hint":"p 值受 sample size 影響。","answer":"p value 是在 null model 下的資料相容性指標，不代表 effect magnitude 或 biological importance；應結合 effect size、CI、reproducibility 與 biological context。"},{"domain":"experiment","text":"如果教授問你「這個實驗的 positive control 是什麼」但你原實驗沒有，你怎麼回答較好？","must":["誠實|honest","limitation|限制"],"nice":["propose appropriate control"],"hint":"不能虛構。","answer":"應直接說原實驗沒有設這個 positive control，這是限制；再說明若重做會加入什麼已知能產生預期反應的 control 來驗證 assay。"},{"domain":"experiment","text":"Western blot 出現整條背景很高，你會怎麼排查？","must":["blocking|封閉","antibody too concentrated|抗體太濃","washing|洗滌"],"nice":["exposure|membrane"],"hint":"先看 antibody dilution、blocking、wash、exposure。","answer":"可檢查 primary/secondary antibody dilution、blocking reagent/time、washing、sample amount、membrane handling 與 exposure，並用 no-primary control 判斷 secondary background。"},{"domain":"experiment","text":"Western blot 看不到 target band，但 loading control 正常，可能有哪些原因？","must":["target low expression|低表現","antibody issue|抗體問題"],"nice":["transfer size|lysis|exposure"],"hint":"loading control 正常表示不是所有步驟都失敗。","answer":"可能 target abundance 低、primary antibody/epitope 問題、lysis buffer 不適合、protein degradation、transfer 對特定分子量不佳或 exposure 不足。"},{"domain":"experiment","text":"cell culture 的 confluency 為什麼可能影響實驗結果？","must":["cell cycle|增殖狀態","contact inhibition|接觸抑制"],"nice":["metabolism|signaling"],"hint":"過密與過稀都可能改變 phenotype。","answer":"confluency 影響 proliferation, nutrient availability, contact signaling, metabolism 與 drug response，因此 treatment 前應盡量一致。"},{"domain":"experiment","text":"為什麼不同 passage 的細胞實驗最好記錄並控制？","must":["phenotypic drift|表型漂移","reproducibility|可重現性"],"nice":["senescence|selection"],"hint":"passage 是重要 batch variable。","answer":"長期 passage 可累積 genetic/epigenetic drift、selection 或 senescence-like changes；控制 passage range 可提高 reproducibility。"},{"domain":"thermo","text":"Clausius-Clapeyron equation 可以用來描述什麼？","must":["vapor pressure|蒸氣壓","temperature|溫度"],"nice":["enthalpy vaporization|汽化熱"],"hint":"它連結相平衡壓力與溫度。","answer":"Clausius-Clapeyron 關係描述 phase-equilibrium pressure 隨 temperature 的變化；在簡化假設下可由 vapor pressure-temperature data 估算 ΔH_vap。"},{"domain":"thermo","text":"critical point 的物理意義是什麼？","must":["liquid gas indistinguishable|氣液無法區分","critical temperature|pressure"],"nice":["supercritical"],"hint":"到了 critical point 氣液相界面消失。","answer":"critical point 是 liquid 與 vapor 性質趨於相同、共存曲線終點；高於 critical T/P 可形成 supercritical fluid，無典型液氣界面。"},{"domain":"thermo","text":"triple point 是什麼？","must":["solid liquid vapor coexist|固液氣共存"],"nice":["unique T P"],"hint":"單一純物質三相共存。","answer":"triple point 是純物質 solid, liquid, vapor 三相同時 equilibrium 的特定 temperature/pressure。"},{"domain":"thermo","text":"compressibility factor Z=1、>1、<1 大致代表什麼？","must":["Z=PV/nRT","ideal Z1"],"nice":["attraction|repulsion"],"hint":"Z 偏離 1 反映 real-gas nonideality。","answer":"Z=PV/nRT；Z=1 為 ideal-gas behavior。Z<1 常表示 attractive interactions 使體積/壓力效應較低，Z>1 常在 repulsive/excluded-volume effect 佔優。"},{"domain":"thermo","text":"Maxwell relation 的價值是什麼？","must":["thermodynamic derivatives|熱力導數","measurable properties|可測量性"],"nice":["from fundamental equations"],"hint":"把難量的 derivative 轉成較可量的量。","answer":"Maxwell relations 由 thermodynamic potentials 的 exact differential 推得，可把 entropy/chemical-potential 等不易直接量的 derivatives 轉成 P,V,T 等可測 derivatives。"},{"domain":"thermo","text":"partial molar property 是什麼？為什麼 mixture 需要它？","must":["change per mole added|加入一莫耳造成變化","composition dependent|組成相關"],"nice":["chemical potential"],"hint":"mixture property 不是單純純物質值相加。","answer":"partial molar property 是在 T,P 與其他成分量固定下，加入微量某成分對 mixture extensive property 的 marginal contribution；chemical potential 就是 partial molar Gibbs energy。"},{"domain":"thermo","text":"ideal solution 中 mixing enthalpy 和 mixing volume 的典型值？","must":["Delta H mix zero|混合焓零","Delta V mix zero|混合體積零"],"nice":["entropy positive"],"hint":"ideal solution 仍有 entropy of mixing。","answer":"ideal solution 假設 unlike/like interactions 相似，因此 ΔH_mix≈0、ΔV_mix≈0；但 random mixing 造成 ΔS_mix>0。"},{"domain":"thermo","text":"azeotrope 在 activity coefficient 模型上通常反映什麼非理想性？","must":["strong nonideality|強非理想","relative volatility one|相對揮發度1"],"nice":["positive negative deviation"],"hint":"它可能由正偏差或負偏差形成。","answer":"azeotrope 來自顯著 liquid-phase nonideality，使某 composition 下 vapor 與 liquid composition 相同、relative volatility 接近 1，simple distillation 受限制。"},{"domain":"thermo","text":"Joule-Thomson effect 是什麼？","must":["enthalpy constant|等焓節流","temperature change|溫度變化"],"nice":["inversion temperature"],"hint":"throttling valve 常近似 steady isenthalpic。","answer":"Joule-Thomson effect 指 real gas 在 throttling/porous plug 等近 isenthalpic expansion 時 temperature 改變；冷卻或升溫取決於狀態與 inversion temperature。"},{"domain":"thermo","text":"對 ideal gas 做 throttling，溫度理想情況下會怎麼變？","must":["temperature unchanged|溫度不變","enthalpy only T|焓只與溫度"],"nice":[],"hint":"ideal gas h=h(T)，而 throttling 近似 h constant。","answer":"ideal gas enthalpy 只依 temperature。若 throttling 過程 h1≈h2，則 ideal gas 的 T1≈T2，所以無 Joule-Thomson temperature change。"},{"domain":"thermo","text":"exergy 和 energy 的概念差在哪？","must":["energy conserved|能量守恆","exergy work potential|可用功潛力"],"nice":["destroyed by irreversibility"],"hint":"exergy 會因不可逆而 destroyed。","answer":"energy obeys conservation；exergy 衡量相對環境能轉成 useful work 的最大潛力，irreversibility 造成 exergy destruction。"},{"domain":"thermo","text":"entropy generation 和 irreversibility 的關係？","must":["entropy generation >=0|熵產生非負","irreversibility"],"nice":["lost work"],"hint":"reversible process S_gen=0。","answer":"第二定律下 isolated total entropy generation≥0；reversible limit 為 0。S_gen 越大代表 irreversibility 越強，對應更多 lost work/exergy destruction。"},{"domain":"thermo","text":"為什麼 phase equilibrium 時各相中同一成分的 chemical potential 要相等？","must":["no net transfer|無淨傳遞","chemical potential equality|化學勢相等"],"nice":["Gibbs minimization"],"hint":"不相等就存在 transfer driving force。","answer":"若同一 component 在兩相的 chemical potential 不同，物質轉移可降低總 Gibbs free energy；平衡時 transfer driving force 消失，因此 μ_i^α=μ_i^β。"},{"domain":"thermo","text":"Henry’s law 常用在什麼情況？","must":["dilute solute|稀溶質","gas solubility|氣體溶解"],"nice":["partial pressure proportional concentration"],"hint":"與 Raoult’s law 的標準態不同。","answer":"Henry’s law 常描述 dilute solute/gas 在液相低濃度區的平衡，partial pressure 與液相 concentration/mole fraction 近似成正比。"},{"domain":"thermo","text":"Cp 和 Cv 為什麼 ideal gas 有 Cp-Cv=R？","must":["enthalpy U+PV","ideal gas PV=nRT"],"nice":["per mole"],"hint":"由 h=u+RT 推得。","answer":"對 ideal gas，molar h=u+RT；對 T 微分得到 Cp=Cv+R，因此 Cp-Cv=R。"},{"domain":"thermo","text":"adiabatic reversible compression 對 ideal gas 的溫度有什麼影響？","must":["temperature increase|溫度上升","work input|輸入功"],"nice":["isentropic"],"hint":"壓縮做功提高 internal energy。","answer":"reversible adiabatic/isentropic compression 對 gas 做 work 且無 heat loss，因此 ideal-gas internal energy/temperature 上升。"},{"domain":"thermo","text":"heat capacity 會不會一定是常數？","must":["不一定|不是","temperature dependent|溫度相關"],"nice":["phase"],"hint":"工程計算常用平均或多項式 Cp(T)。","answer":"Cp/Cv 可隨 temperature、phase、composition 變化；窄溫區可近似常數，寬溫區通常需 Cp(T) integration。"},{"domain":"thermo","text":"為什麼理想氣體的 internal energy 只和溫度有關？","must":["no intermolecular potential|忽略分子間位能","kinetic energy|動能"],"nice":[],"hint":"ideal gas 假設沒有分子間作用能。","answer":"ideal gas 忽略 intermolecular potential energy，internal energy 主要取決於 molecular degrees of freedom 的 kinetic/internal modes，因此對固定組成 U=U(T)。"},{"domain":"thermo","text":"相圖中的 lever rule 用來做什麼？","must":["phase fraction|相比例","two phase region|兩相區"],"nice":["composition balance"],"hint":"本質是總組成 mass balance。","answer":"在 binary two-phase region，lever rule 由 overall composition 與兩相 equilibrium compositions 的線段比例計算各 phase fraction，本質是 component material balance。"},{"domain":"thermo","text":"dew point calculation 和 bubble point calculation 的已知條件通常有何不同？","must":["dew vapor composition known|露點給氣相組成","bubble liquid composition known|泡點給液相組成"],"nice":["T or P solve"],"hint":"一個從 vapor first liquid，一個從 liquid first vapor。","answer":"bubble point 從已知 liquid composition 找第一個 vapor bubble 的 T/P；dew point 從已知 vapor composition 找第一滴 liquid 的 T/P。"},{"domain":"thermo","text":"real solution 為什麼需要 activity 而不是直接用 mole fraction？","must":["nonideal interactions|非理想作用","activity coefficient|活性係數"],"nice":["chemical potential"],"hint":"a_i=γ_i x_i 是常見 liquid form。","answer":"mole fraction 只反映 composition；activity 透過 γ_i 修正 molecular interactions，使 chemical potential/phase-equilibrium equations 能描述 nonideal solution。"},{"domain":"thermo","text":"equilibrium constant K 與 standard Gibbs free energy 的關係？","must":["Delta G standard = -RT ln K|ΔG°=-RTlnK"],"nice":["temperature dependent"],"hint":"K 取決於 temperature。","answer":"在指定 standard state 下 ΔG°=-RT ln K，因此 K>1 對應 ΔG°<0；K 隨 temperature 可依 van’t Hoff relation 改變。"},{"domain":"reaction","text":"對一階反應，rate constant 的單位是什麼？","must":["1/time|時間負一次方"],"nice":[],"hint":"反應級數決定 k 的單位。","answer":"若 -r_A=k C_A，rate 單位是 concentration/time，因此 k 的單位為 1/time。"},{"domain":"reaction","text":"對二階反應 rate = k C_A²，k 的單位是什麼？","must":["1/(concentration time)|濃度負一次時間負一次"],"nice":[],"hint":"做 dimensional analysis。","answer":"rate 單位是 concentration/time，除以 C² 後 k 單位為 1/(concentration·time)。"},{"domain":"reaction","text":"conversion X_A 的定義是什麼？","must":["moles reacted / feed moles|反應掉/進料"],"nice":["F_A0-F_A over F_A0"],"hint":"flow reactor 常寫 X=(F_A0-F_A)/F_A0。","answer":"conversion 是 feed reactant A 被消耗的比例；steady flow 常寫 X_A=(F_A0-F_A)/F_A0。"},{"domain":"reaction","text":"yield 和 selectivity 為什麼在 parallel reactions 很重要？","must":["desired product|目標產物","competing products|競爭反應"],"nice":["temperature residence time"],"hint":"高 conversion 不等於高 desired yield。","answer":"parallel reactions 下 reactant 可能生成 desired/undesired products；selectivity 描述相對偏向目標路徑，yield 結合產物生成與 feed basis，高 conversion 不保證高 desired product。"},{"domain":"reaction","text":"如果 parallel reactions 的 desired reaction activation energy 較高，提高溫度可能對 selectivity 有什麼影響？","must":["desired rate more temperature sensitive|目標反應更敏感"],"nice":["Arrhenius ratio"],"hint":"比較 k1/k2 的 temperature dependence。","answer":"Arrhenius 下較高 Ea 的 rate constant 對 T 更敏感；若 desired pathway Ea 較高，提高 T 可能提高 k_desired/k_undesired，改善 selectivity，前提是 kinetics/transport 不改變主導。"},{"domain":"reaction","text":"CSTR steady-state mole balance 的基本形式？","must":["input-output+generation=0|輸入-輸出+生成=0"],"nice":["F_A0-F_A+r_A V=0"],"hint":"accumulation=0。","answer":"steady CSTR 對 A：0=F_A0-F_A+r_A V；若 r_A 為負的 disappearance convention，要注意符號。"},{"domain":"reaction","text":"PFR 設計式 dF_A/dV = r_A 的物理意義？","must":["differential mole balance|微分莫耳衡算","rate changes along reactor|速率沿程變"],"nice":[],"hint":"把 reactor 切成微小 dV。","answer":"PFR 對 infinitesimal reactor volume 做 steady mole balance，得到 dF_A/dV=r_A；因 concentration/T 可能沿程變，r_A 也隨 V 變。"},{"domain":"reaction","text":"batch reactor 做非恆體積反應時，為什麼不能直接用固定 V 的濃度式？","must":["volume changes|體積改變","concentration relation changes|濃度關係改變"],"nice":["moles balance"],"hint":"需追蹤 N_i 與 V(t)。","answer":"若 gas reaction/phase change 造成 V 隨 conversion/time 變，C_A=N_A/V 不再只由 N_A 決定，固定-volume integrated law 會失效。"},{"domain":"reaction","text":"space velocity 和 space time 的關係？","must":["inverse|倒數"],"nice":["SV=v0/V","tau=V/v0"],"hint":"在同一基準與 steady feed 下。","answer":"space time τ=V/v₀；space velocity SV=v₀/V，所以在一致定義下互為倒數。"},{"domain":"reaction","text":"residence time distribution 為什麼重要？","must":["nonideal flow|非理想流動","mixing|bypass|dead zone"],"nice":["E curve"],"hint":"它連接 real reactor 與 ideal models。","answer":"RTD 描述流體元素在 reactor 中停留時間分布，可診斷 bypass、dead zones、mixing 等 nonidealities，並協助預測反應 performance。"},{"domain":"reaction","text":"CSTR 出現 multiple steady states 可能和什麼耦合有關？","must":["exothermic reaction|放熱反應","heat generation removal|生熱散熱"],"nice":["nonlinear kinetics"],"hint":"典型 nonisothermal CSTR。","answer":"exothermic CSTR 中 Arrhenius kinetics 使 heat generation 隨 T 非線性上升，而 cooling heat removal 有另一條曲線，交點可能多個，因此有 multiple steady states/ignition-extinction。"},{"domain":"reaction","text":"effectiveness factor η < 1 代表什麼？","must":["internal diffusion limitation|內部擴散限制","observed lower than intrinsic|表觀低於本徵"],"nice":["Thiele modulus"],"hint":"顆粒內不是所有 catalyst volume 同等利用。","answer":"η 定義 actual overall rate 相對於假設整顆粒都在 surface condition 下 intrinsic rate；η<1 表示 internal diffusion 造成 catalyst utilization 不完全。"},{"domain":"reaction","text":"Thiele modulus 大通常代表什麼？","must":["reaction faster relative diffusion|反應相對擴散快","internal gradients|內部梯度"],"nice":["effectiveness factor low"],"hint":"φ 大→ diffusion limitation 更明顯。","answer":"Thiele modulus 比較 intrinsic reaction rate 與 intraparticle diffusion；φ 大表示 reaction 相對快、濃度在 particle 內下降明顯，η 往往降低。"},{"domain":"reaction","text":"external mass transfer limitation 和 internal diffusion limitation 怎麼區分？","must":["film resistance|外膜阻力","pore diffusion|孔內擴散"],"nice":["stirring speed|particle size"],"hint":"改 agitation vs particle size 可提供線索。","answer":"external limitation 發生 bulk-to-particle surface film；internal limitation 發生 particle pores。提高 fluid velocity/agitation 主要減 external resistance；減小 particle size 常減 internal diffusion distance。"},{"domain":"reaction","text":"催化反應看到 apparent activation energy 明顯降低，可能暗示什麼？","must":["transport limitation|傳輸限制"],"nice":["diffusion control"],"hint":"不一定是 intrinsic chemistry 的 Ea 真的變小。","answer":"若觀察到的 rate 被 mass transfer/diffusion control，temperature dependence 可弱於 intrinsic kinetics，造成 lower apparent Ea；也需排除 mechanism change。"},{"domain":"reaction","text":"如果反應是零階，conversion 對 concentration 的敏感性如何？","must":["rate independent concentration|速率與濃度無關"],"nice":["until depletion"],"hint":"在零階適用區域。","answer":"零階 rate≈k，在該 kinetics range 對 reactant concentration 不敏感；但接近 depletion 或 mechanism/regime 改變後不再適用。"},{"domain":"reaction","text":"pseudo-first-order approximation 什麼時候合理？","must":["one reactant large excess|一反應物大量過量"],"nice":["constant concentration"],"hint":"把 k[B] 合併成 k_obs。","answer":"二分子 rate=k[A][B] 中若 B 大量 excess、反應期間 [B] 幾乎不變，可定義 k_obs=k[B]，對 A 呈 pseudo-first-order。"},{"domain":"reaction","text":"Eley-Rideal 和 Langmuir-Hinshelwood 機制的差異？","must":["surface reaction|表面反應","one vs both adsorbed|一個或兩個吸附"],"nice":["heterogeneous catalysis"],"hint":"都屬 heterogeneous catalysis models。","answer":"Langmuir-Hinshelwood 常假設兩反應物都 adsorb 後在 surface reaction；Eley-Rideal 則一個 adsorbed species 和 gas/liquid-phase species 直接反應。"},{"domain":"reaction","text":"rate-determining step 的概念是什麼？","must":["slow step controls overall rate|慢步主導總速率"],"nice":["pre-equilibrium"],"hint":"機制中最慢／阻力最大步驟。","answer":"多步 mechanism 中 overall rate 對某一步最敏感；在適用近似下該 slow step 控制 rate expression，但真實機制可有多個 comparable resistances。"},{"domain":"reaction","text":"催化劑提高反應速率的本質？","must":["lower activation barrier|較低活化能途徑","alternative pathway|替代路徑"],"nice":["equilibrium unchanged"],"hint":"改 kinetics，不改 ΔG equilibrium。","answer":"catalyst 提供較低 activation free-energy barrier 的 alternative pathway，使 forward/reverse 都更快，但不改 reactant/product thermodynamic state 或 equilibrium constant。"},{"domain":"transport","text":"Navier-Stokes equation 本質上是哪個守恆定律？","must":["momentum conservation|動量守恆"],"nice":["Newton second law"],"hint":"可看成流體版本 F=ma。","answer":"Navier-Stokes 是 continuum fluid 的 momentum balance，將 inertia、pressure、viscous、body force 等項連結。"},{"domain":"transport","text":"fully developed pipe flow 代表什麼？","must":["velocity profile no axial shape change|速度剖面沿軸不再改變"],"nice":["du/dx zero profile"],"hint":"不是說 velocity=0。","answer":"fully developed 表示 velocity profile shape 不再隨 axial position 改變；壓力仍可沿程下降，流體仍有速度。"},{"domain":"transport","text":"laminar pipe flow 的 velocity profile 典型形狀？","must":["parabolic|拋物線"],"nice":["center max twice average"],"hint":"圓管 Poiseuille flow。","answer":"steady incompressible Newtonian fully developed laminar circular-pipe flow 為 parabolic profile，中心速度為平均速度的 2 倍。"},{"domain":"transport","text":"Darcy friction factor 在 laminar circular pipe 中和 Reynolds number 的關係？","must":["64/Re"],"nice":[],"hint":"注意 Darcy，不是 Fanning。","answer":"對 fully developed laminar circular pipe，Darcy friction factor f_D=64/Re。Fanning factor 是 16/Re。"},{"domain":"transport","text":"pump cavitation 為什麼發生？","must":["local pressure below vapor pressure|局部壓力低於蒸氣壓","vapor bubbles collapse|氣泡潰滅"],"nice":["NPSH"],"hint":"入口條件與 NPSH 很重要。","answer":"當 pump inlet/local pressure 低於 liquid vapor pressure 會形成 vapor bubbles，進入高壓區後 collapse，造成噪音、erosion、performance loss。"},{"domain":"transport","text":"NPSH available 和 cavitation 的關係？","must":["NPSHa > NPSHr|可用大於需求"],"nice":["margin"],"hint":"需保留 safety margin。","answer":"為避免 cavitation，system 提供的 NPSH available 應高於 pump 所需 NPSH required，通常另留 margin。"},{"domain":"transport","text":"natural convection 和 forced convection 差在哪？","must":["buoyancy|浮力","fan pump|風扇幫浦"],"nice":["Grashof/Reynolds"],"hint":"驅動來源不同。","answer":"natural convection 由 density difference/buoyancy 驅動；forced convection 由 fan/pump/external flow 驅動。"},{"domain":"transport","text":"overall heat-transfer coefficient U 為什麼包含多個 resistance？","must":["series resistances|串聯熱阻","convection conduction fouling"],"nice":["1/U sum resistance"],"hint":"壁兩側對流、壁導熱、污垢等都會限制。","answer":"實際 heat exchanger 熱流跨越 hot-side convection、wall conduction、fouling、cold-side convection 等 serial resistances，因此用 overall U 彙整。"},{"domain":"transport","text":"fouling 對 heat exchanger performance 通常有什麼影響？","must":["thermal resistance increase|熱阻增加","U decrease|總傳熱係數下降"],"nice":["pressure drop increase"],"hint":"可能同時造成 flow resistance。","answer":"fouling layer 增加 thermal resistance，使 U 下降、同面積 heat duty 降低；也可能縮小 flow area 並增加 pressure drop。"},{"domain":"transport","text":"LMTD method 和 effectiveness-NTU method 何時各較方便？","must":["LMTD terminal temperatures known|端點溫度已知","NTU outlet unknown|出口未知"],"nice":["heat exchanger design"],"hint":"LMTD 常用已知 inlet/outlet；ε-NTU 常只知 inlet。","answer":"若四個 terminal temperatures 可知，LMTD 直接；若 outlet temperatures 未知但 UA/flow capacities 已知，effectiveness-NTU 常較方便。"},{"domain":"transport","text":"unsteady heat conduction 中 Fourier number 的物理意義？","must":["thermal diffusion time ratio|熱擴散時間尺度"],"nice":["alpha t/L2"],"hint":"Fo 大表示熱已擴散更深入。","answer":"Fo=αt/L²，比較 diffusion time progress 與 geometry length scale；Fo 越大表示 transient heat diffusion 發展更充分。"},{"domain":"transport","text":"Péclet number 的物理意義？","must":["convection/diffusion|對流相對擴散"],"nice":["RePr or ReSc"],"hint":"可分 heat/mass Péclet。","answer":"Péclet number 比較 advective transport 與 diffusive transport；Pe 大表示 convection/advection 相對 dominant。"},{"domain":"transport","text":"對流質傳的 concentration boundary layer 是什麼？","must":["near-surface concentration gradient|表面附近濃度梯度區"],"nice":["mass transfer coefficient"],"hint":"和 velocity/thermal boundary layer 類比。","answer":"species 在 surface 與 bulk 間的 concentration change 集中於 boundary layer；其厚度與 flow/diffusivity 影響 mass-transfer coefficient。"},{"domain":"transport","text":"對 steady diffusion through stagnant film，film thickness 增加會如何影響 flux？","must":["flux decrease|通量下降","inverse thickness|厚度反比"],"nice":["Fick law"],"hint":"同樣 concentration difference 下。","answer":"Fick-like steady film model J≈D ΔC/L，因此 L 增加在其他條件相同時 flux 下降。"},{"domain":"unitops","text":"distillation column 中 reboiler 和 condenser 各自扮演什麼角色？","must":["reboiler vapor generation|再沸器產生蒸氣","condenser liquid reflux|冷凝回流"],"nice":["energy input removal"],"hint":"它們提供內部 vapor/liquid traffic。","answer":"reboiler 提供 boil-up/vapor 與 heat input；condenser 移除 heat、凝結 overhead vapor，部分作 distillate、部分作 reflux。"},{"domain":"unitops","text":"McCabe-Thiele method 的主要假設與用途？","must":["binary distillation|二元蒸餾","equilibrium stages|理論級"],"nice":["constant molar overflow"],"hint":"用圖解估 stages/reflux。","answer":"McCabe-Thiele 用於 binary distillation 的 equilibrium-stage graphical design，常假設 constant molar overflow，配合 VLE curve 與 operating lines 求 stage number。"},{"domain":"unitops","text":"minimum reflux ratio 的意義？","must":["infinite stages|無限級數","lowest reflux feasible|最低回流"],"nice":["pinch"],"hint":"R 接近 Rmin 時 stage number 急升。","answer":"Rmin 是指定 separation 下理論可行最低 reflux；在 R=Rmin 的 ideal limit 出現 pinch，需無限 stages，因此實際設計 R>Rmin。"},{"domain":"unitops","text":"packed absorption column 中 flooding 是什麼？","must":["gas flow too high|氣速過高","liquid holdup|壓降急升"],"nice":["capacity limit"],"hint":"流體互相阻礙。","answer":"當 gas velocity 太高，liquid downward flow 被嚴重阻礙、holdup/pressure drop 急升，即 flooding，代表 column capacity limit。"},{"domain":"unitops","text":"adsorption isotherm 的用途？Langmuir model 的核心假設之一？","must":["equilibrium loading vs concentration|平衡吸附量","monolayer|單層"],"nice":["finite identical sites"],"hint":"Langmuir 常假設 finite equivalent sites。","answer":"isotherm 描述 equilibrium adsorbed amount 與 fluid concentration/pressure；Langmuir 假設有限相同 sites、monolayer coverage 且典型無 lateral interaction。"},{"domain":"unitops","text":"reverse osmosis 的主要 driving force？","must":["pressure greater osmotic pressure|壓力超過滲透壓"],"nice":["semipermeable membrane"],"hint":"壓力把 solvent 往反自然滲透方向推。","answer":"RO 對 concentrated side 施加高於 osmotic pressure difference 的 hydraulic pressure，使 solvent 通過 semipermeable membrane，solute 被大幅截留。"},{"domain":"unitops","text":"ultrafiltration 和 reverse osmosis 的分離尺度/機制有何大致差異？","must":["UF size exclusion|尺寸篩分","RO solution diffusion|離子小分子截留"],"nice":["pressure"],"hint":"UF pores 較大，RO membrane 更緻密。","answer":"UF 多依 porous membrane/size exclusion 截留 macromolecules/colloids；RO 用緻密膜以 solution-diffusion 等機制截留 salts/small solutes，所需 pressure 通常更高。"},{"domain":"unitops","text":"drying process 常同時涉及哪兩類傳輸？","must":["heat transfer|熱傳","mass transfer|質傳"],"nice":["internal diffusion"],"hint":"供熱蒸發 + moisture removal。","answer":"drying 需要 heat transfer 提供 latent/sensible energy，也需要 mass transfer 將 moisture 從 material interior/surface 帶到 gas phase。"},{"domain":"unitops","text":"crystallization 的 supersaturation 為什麼重要？","must":["driving force|驅動力","nucleation growth|成核晶體成長"],"nice":["metastable zone"],"hint":"太高可能大量 nucleation。","answer":"supersaturation 是 crystallization driving force；程度與產生方式控制 nucleation/growth balance，影響 crystal size distribution 與 purity。"},{"domain":"unitops","text":"centrifugation 的分離原理？","must":["density difference|密度差","centrifugal force|離心場"],"nice":["settling velocity"],"hint":"相當於強化重力沉降。","answer":"centrifuge 用高 centrifugal acceleration 放大不同 density/size particle or phase 的 settling tendency，加速固液或液液分離。"},{"domain":"control","text":"feedback control 的優點與一個可能缺點？","must":["disturbance rejection|擾動抑制","measurement feedback|回授"],"nice":["instability|oscillation"],"hint":"優點不是免費的。","answer":"feedback 可補償 disturbances/model uncertainty、降低 offset，但不當 tuning/delay/noise 可造成 oscillation、instability 或 actuator stress。"},{"domain":"control","text":"feedforward control 和 feedback control 差在哪？","must":["measure disturbance|量測擾動","measure output error|量測輸出誤差"],"nice":["combine"],"hint":"feedforward 要有 disturbance measurement/model。","answer":"feedforward 在 disturbance 影響 output 前根據 disturbance/model 先補償；feedback 根據 output-setpoint error 事後修正，兩者常結合。"},{"domain":"control","text":"dead time 對控制系統為什麼麻煩？","must":["delay|延遲","phase lag|相位落後"],"nice":["stability margin"],"hint":"controller 看見效果太晚。","answer":"dead time 使 input change 的 output response 延遲，引入 phase lag、降低 stability margin，使 aggressive control 更容易 oscillate。"},{"domain":"control","text":"integral windup 是什麼？","must":["actuator saturation|致動器飽和","integral accumulates|積分持續累積"],"nice":["anti-windup"],"hint":"長時間飽和後 recovery 會變慢。","answer":"actuator saturated 時 error 仍讓 integral term 累積，解除 saturation 後控制器仍過度驅動造成 overshoot/slow recovery；anti-windup 可限制或回算 integral。"},{"domain":"control","text":"一階系統 step response 的 2τ、3τ、4τ 大約到最終值多少？","must":["86.5%|95%|98%"],"nice":["63.2 at 1tau"],"hint":"可用 1-e^{-t/τ}。","answer":"一階 normalized response=1-e^{-t/τ}：1τ=63.2%、2τ≈86.5%、3τ≈95.0%、4τ≈98.2%。"},{"domain":"control","text":"second-order underdamped system 的 damping ratio 變小會怎樣？","must":["overshoot increase|超越量增加","oscillation increase|振盪增加"],"nice":["settling"],"hint":"ζ 越小越 oscillatory。","answer":"對標準二階 underdamped system，damping ratio ζ 降低通常使 overshoot 與 oscillation 增加，settling behavior 變差。"},{"domain":"engmath","text":"線性 ODE 的 superposition principle 什麼時候成立？","must":["linear homogeneous|線性齊次"],"nice":["sum solutions"],"hint":"非線性系統通常不成立。","answer":"對 linear homogeneous differential equations，solutions 的線性組合仍是 solution；有 forcing 時可對 response 使用 linear superposition。"},{"domain":"engmath","text":"separation of variables 常用於哪類 PDE 問題？","must":["PDE|偏微分","product solution|乘積形式"],"nice":["boundary conditions|eigenfunctions"],"hint":"典型 heat/diffusion/wave equation。","answer":"在 geometry/BC 適合且 PDE 可分離時，假設 solution 為各 independent variables 函數乘積，把 PDE 化成多個 ODE，常用於 heat/diffusion/wave equations。"},{"domain":"engmath","text":"dimension analysis 中 Buckingham Pi theorem 的核心概念？","must":["dimensionless groups|無因次群","n-k groups"],"nice":["reduce variables"],"hint":"n variables、k independent dimensions → n-k Π groups。","answer":"Buckingham Π theorem 說 n 個 dimensional variables 若涉及 k 個 independent fundamental dimensions，可重組成 n-k 個 independent dimensionless groups。"},{"domain":"engmath","text":"Taylor series 在工程近似上有什麼用途？","must":["local approximation|局部近似","derivatives|導數"],"nice":["linearization"],"hint":"小 perturbation 可用 first-order linearization。","answer":"Taylor series 用 function 在 operating point 的 derivatives 做 local approximation；保留 first-order 常形成 linearized model，方便 control/perturbation analysis。"},{"domain":"instrument","text":"FTIR 主要反映什麼資訊？","must":["molecular vibrations|分子振動","functional groups|官能基"],"nice":["absorption wavenumber"],"hint":"不是直接給完整分子結構。","answer":"FTIR 測 infrared absorption 造成 molecular vibrational transitions，不同 bond/functional groups 在特定 wavenumber 有 characteristic bands，可做官能基與化學環境判讀。"},{"domain":"instrument","text":"XRD peak position 和 peak width 可以分別提供哪些資訊？","must":["d spacing|晶面距","crystallite size|晶粒尺寸"],"nice":["strain"],"hint":"位置由 Bragg law；寬化可受 size/strain。","answer":"peak position 對應 lattice d-spacing/phase；peak broadening 可和 small crystallite size、microstrain、instrument broadening 等有關，Scherrer equation 可估 crystallite size。"},{"domain":"instrument","text":"SEM 和 TEM 的主要差異？","must":["surface morphology|表面形貌","internal ultrastructure|內部高解析"],"nice":["electron beam"],"hint":"TEM 通常需更薄 specimen。","answer":"SEM 掃描 surface/near-surface secondary/backscattered electrons 看 morphology；TEM 讓 electrons 穿過超薄 specimen，可提供更高 resolution 的 internal structure/diffraction information。"},{"domain":"instrument","text":"TGA 和 DSC 各自主要量什麼？","must":["TGA mass change|質量變化","DSC heat flow|熱流"],"nice":["thermal stability|transition"],"hint":"兩者常搭配材料分析。","answer":"TGA 追蹤 sample mass 隨 T/time 變化，適合 decomposition/moisture；DSC 測 sample-reference heat-flow difference，觀察 melting, glass transition, crystallization 等。"},{"domain":"instrument","text":"BET analysis 常用來估什麼材料性質？","must":["specific surface area|比表面積"],"nice":["gas adsorption|pore"],"hint":"由 gas adsorption isotherm。","answer":"BET model 由 gas adsorption data 估 specific surface area，常搭配 pore analysis 評估 porous catalysts/adsorbents。"},{"domain":"instrument","text":"zeta potential 可以反映什麼？","must":["surface charge related|表面電性","colloidal stability|膠體穩定性"],"nice":["electrophoretic mobility"],"hint":"絕對值大常意味 electrostatic stabilization 較強，但依 system。","answer":"zeta potential 由 electrophoretic mobility 等推估 slipping plane potential，反映 particle surface/interfacial charge environment，可作 colloidal stability 的一項指標。"},{"domain":"instrument","text":"rheometer 和簡單 viscometer 的資訊量有什麼差異？","must":["shear rate dependent|剪切速率","viscoelasticity|黏彈性"],"nice":["oscillation"],"hint":"rheometer 可做 flow curve 和 oscillatory tests。","answer":"簡單 viscometer 多給特定條件 viscosity；rheometer 可控制 shear stress/rate、做 flow curve、yield behavior 與 oscillatory G′/G″ 等 viscoelastic characterization。"},{"domain":"organic","text":"酸鹼強弱和共軛鹼穩定性有什麼關係？","must":["stronger acid more stable conjugate base|強酸共軛鹼較穩定"],"nice":["resonance|electronegativity"],"hint":"能穩定 negative charge 的因素通常增強 acidity。","answer":"酸越容易失去 H⁺，其 conjugate base 越需要被 stabilization；resonance、electronegativity、inductive effect、orbital hybridization 等可穩定負電荷並提高 acidity。"},{"domain":"organic","text":"resonance stabilization 為什麼會影響 acidity？","must":["delocalize charge|電荷離域","conjugate base stable|共軛鹼穩定"],"nice":[],"hint":"例如 carboxylate。","answer":"若 deprotonation 後的 negative charge 可 resonance delocalization，共軛鹼能量降低，因此 parent acid 通常更 acidic。"},{"domain":"personal","text":"如果教授問「你對我們實驗室知道多少？」你會怎麼回答才不會只像背官網？","must":["具體研究問題|specific research","你的連結|fit"],"nice":["一篇近期論文|方法"],"hint":"先說你真正理解的研究問題，再連到你的能力／興趣。","answer":"不要只列設備或題目名稱；應說明你理解該 lab 在解決什麼問題、你特別被哪個機制/方法吸引，以及你的既有經驗能接上什麼、還想補什麼。"},{"domain":"personal","text":"如果教授說「你的專題不是你一個人做的，那你的貢獻到底是什麼？」你怎麼回答？","must":["具體負責項目|你的貢獻","不要搶功"],"nice":["數據分析|操作|寫作"],"hint":"把「團隊成果」和「個人負責」分開。","answer":"清楚列出自己真正做的操作、數據整理/分析、文獻比較、報告撰寫與問題排查；屬於學長姐或老師的部分要誠實說明。"},{"domain":"personal","text":"如果教授問你研究所最怕遇到什麼，你會怎麼回答？","must":["真實風險|應對策略"],"nice":["求助|紀錄"],"hint":"不要只說「我不怕」。","answer":"可以說最擔心長期實驗不穩定或知識不足，但會透過系統化紀錄、先做小規模驗證、主動討論與持續補基礎降低風險。"},{"domain":"personal","text":"你會怎麼判斷一個研究題目值不值得做？","must":["重要性|novelty|feasibility"],"nice":["可驗證 hypothesis|資源"],"hint":"兼顧科學問題與可執行性。","answer":"可從 scientific/clinical/engineering importance、現有 knowledge gap、是否形成可驗證 hypothesis、方法/時間/資源 feasibility 與預期 contribution 判斷。"},{"domain":"personal","text":"如果指導教授要求你做一個你不熟悉的技術，你會怎麼開始？","must":["文獻/SOP|學習","請教熟悉者|pilot"],"nice":["安全|紀錄"],"hint":"先理解原理再做小規模。","answer":"先查原理、SOP與安全風險，向熟悉的人學習，從 positive control/pilot 開始，完整記錄條件，確認可重現後再進正式樣本。"},{"domain":"personal","text":"如果同組同學和你對數據解讀不同，你會怎麼處理？","must":["回到原始數據|證據","討論假設"],"nice":["盲性分析|第三方"],"hint":"不要把 disagreement 當人際衝突。","answer":"先共同確認 raw data、分析流程與各自假設，列出哪些說法被資料直接支持、哪些是推論；必要時用額外分析/實驗或請 PI/第三方討論。"},{"domain":"personal","text":"你如何確保自己不會因為期待某個結果而挑數據？","must":["predefined criteria|事先標準","all data|完整紀錄"],"nice":["blinding|reproducibility"],"hint":"研究誠信題。","answer":"事先設定 inclusion/exclusion 與 analysis criteria，保留 raw data、記錄失敗與異常原因，必要時 blinded analysis，並以 independent repeats/controls 驗證。"},{"domain":"personal","text":"如果教授問「你最不喜歡哪一門課？」你會怎麼答？","must":["誠實|反思"],"nice":["如何補強"],"hint":"不要攻擊課程或老師。","answer":"可以說某類課一開始較難投入，說明原因與你後來如何調整學習方式；重點是展現自我覺察與改善，不是抱怨。"},{"domain":"personal","text":"你偏好理論研究還是實驗研究？為什麼？","must":["偏好理由|experience"],"nice":["仍能接受另一面"],"hint":"避免把自己框死。","answer":"可以說目前更喜歡實驗因為能從數據修正假說，同時也認為理論/模型對設計與解釋不可缺，願意補足。"},{"domain":"personal","text":"如果你加入實驗室後發現題目和想像不同，你會怎麼辦？","must":["先溝通|了解目標","彈性"],"nice":["尋找共同興趣"],"hint":"先理解研究脈絡，不要立刻否定。","answer":"先和 PI 釐清題目的 scientific rationale、訓練價值與期待，找出和自己核心興趣可連結的部分；若長期 mismatch 再理性討論調整。"},{"domain":"project","text":"為什麼你用 AGS，而沒有同時放正常胃上皮細胞？","must":["single cell line limitation|單一細胞株限制","normal control needed|正常細胞對照"],"nice":["selectivity/toxicity"],"hint":"承認目前 scope。","answer":"AGS 可以作為人類胃癌模型，但目前只有單一癌細胞株，而且缺少正常胃上皮細胞作為對照，因此會限制我們判斷藥物對癌細胞的選擇性，以及結果能否推廣到其他胃癌細胞。後續可以加入其他胃癌細胞株與正常胃上皮細胞進一步比較。"},{"domain":"project","text":"如果換另一株胃癌細胞，結果不一樣，你會怎麼解釋？","must":["cell line heterogeneity|細胞株異質性","molecular background"],"nice":["repeat|biomarker"],"hint":"不同 mutation/signaling/metabolic state 可能改變藥物反應。","answer":"不同 cell lines 的 genetic/epigenetic background、drug transport/metabolism、mitochondrial state 等不同，結果差異可能是真實 biological heterogeneity；應先驗證操作並比較可解釋 biomarker。"},{"domain":"project","text":"為什麼你不能只看 MitoSOX 就說「粒線體氧化壓力是主因」？","must":["correlation not causation|相關非因果","single probe limitation|單一探針限制"],"nice":["rescue|orthogonal assay"],"hint":"同時有 measurement 與 causality 兩層限制。","answer":"MitoSOX 只提供 mitochondrial superoxide-related relative signal，且和 5-FU effect 同時變化只代表 association；要用 antioxidant/rescue 與其他 redox assays 看功能結果是否被逆轉。"},{"domain":"project","text":"如果 MitoTEMPO 能降低 MitoSOX，但 combination cell viability 完全沒救回來，你怎麼解讀？","must":["ROS not necessary|ROS可能非必要因果","downstream independent"],"nice":["alternative mechanism"],"hint":"這是因果驗證的反例。","answer":"表示 mitochondrial superoxide 增加可能是伴隨現象，或不是 5-FU sensitization 的必要驅動；應確認 MitoTEMPO dose/target engagement 後，再檢查 Ca²⁺、DNA damage、STAT3、apoptosis 等替代機制。"},{"domain":"project","text":"如果 NAC 反而讓細胞更差，這個結果怎麼辦？","must":["NAC pleiotropic|非專一性作用","dose toxicity|劑量效應"],"nice":["multiple antioxidants"],"hint":"NAC 不是純粹「ROS off switch」。","answer":"先檢查 NAC 本身 toxicity、pH/interaction 與 treatment sequence；NAC 有 pleiotropic/redox effects，不能僅靠一種 antioxidant 下結論，可用 MitoTEMPO、genetic antioxidant manipulation 等交叉驗證。"},{"domain":"project","text":"你怎麼證明 5-FU sensitivity 的變化不是單純因為 Pimozide 自己就很毒？","must":["low dose combination|低劑量","single agent controls|單藥對照"],"nice":["interaction analysis"],"hint":"要比較相同 dose 的 single agents。","answer":"用低劑量 Pimozide、5-FU 單獨與 combination 並列，可先看 combination 是否低於各單藥；但若要區分 additive/synergistic，仍需完整 dose matrix 與 interaction model。"},{"domain":"project","text":"如果要做 5-FU resistance model，你會怎麼建立？","must":["gradual exposure|逐步增加藥物","long term selection|長期選殖"],"nice":["confirm IC50 shift|穩定性"],"hint":"不能只處理一次就叫 resistant。","answer":"可長期以 sublethal 5-FU exposure、逐步提高濃度選出 surviving population，休藥後再以 dose-response 確認 IC50/response 穩定上移，並比較 parental/resistant phenotype。"},{"domain":"project","text":"你目前的結果中，哪一個你認為證據最強？哪一個最需要保守？","must":["evidence hierarchy|證據強弱","limitations"],"nice":["CCK8 combination vs probe interpretation"],"hint":"考的是你能否批判自己資料。","answer":"可說 CCK-8 在相同條件下的 viability/combination difference 是直接量到的 phenotype；「through mitochondrial oxidative stress」因果最需要保守，probe 對膜電位/質量等也需 orthogonal validation。"},{"domain":"project","text":"如果老師要你把這個研究縮成一個最關鍵的 follow-up experiment，你選哪個？","must":["causality test|因果驗證","ROS rescue"],"nice":["MitoTEMPO/NAC + 5FU"],"hint":"優先補最核心 claim 的缺口。","answer":"我會做 mitochondrial ROS rescue：Pimozide±5-FU 加 MitoTEMPO（或至少 antioxidant comparator），同時量 MitoSOX 與 viability/apoptosis；若抑制 ROS 同時逆轉 sensitization，才更支持 causality。"},{"domain":"project","text":"你會怎麼把目前 in vitro 結果往臨床意義推進？","must":["additional cell lines|更多細胞株","normal cells|正常細胞","in vivo|動物"],"nice":["PK/clinically achievable concentration"],"hint":"先補可重現性、安全性，再談體內。","answer":"先在多個 gastric cancer lines 與 normal cells 驗證 efficacy/selectivity，確認 clinically achievable concentration/PK relevance，再做 organoid/xenograft 等 in vivo-like models 與 toxicity，最後才談臨床轉譯。"}];
const v2ExtendedQuestions=V2_EXTENDED_SPECS.map(s=>Q(s.domain,s.text,s.must,s.nice,s.hint,A(s.answer),[]));
function makeQuestionVariants(base){
 const p1=['教授換一個問法：','請先給結論，再從機制說明：','如果口試只給你 30 秒，請抓核心回答：'];
 const p2=['教授接著追問同一概念：','請不要背定義，改用「為什麼」回答：','如果換成實驗／工程判斷題，你會怎麼解釋：'];
 const out=[];
 base.forEach((q,i)=>{
   const v1=Q(q.domain,p1[i%p1.length]+q.text,q.must.map(g=>g.join('|')),q.nice.map(g=>g.join('|')),q.hint,q.answer,q.followups,q.schools,q.difficulty);v1.variantOf=q.id;out.push(v1);
   const v2=Q(q.domain,p2[i%p2.length]+q.text,q.must.map(g=>g.join('|')),q.nice.map(g=>g.join('|')),q.hint,q.answer,q.followups,q.schools,q.difficulty);v2.variantOf=q.id;out.push(v2);
 });
 return out;
}


const V4_NEW_SPECS=[{"domain":"physiology","text":"Nernst equation 主要用來計算什麼？","must":["單一離子|single ion","equilibrium potential|平衡電位"],"nice":["濃度比|valence"],"hint":"它針對單一離子的平衡電位，不是直接給整個膜電位。","answer":"Nernst equation 依溫度、離子價數與膜兩側濃度比估算單一離子的 equilibrium potential；實際 membrane potential 還取決於多種離子的相對通透性。"},{"domain":"physiology","text":"Goldman-Hodgkin-Katz equation 和 Nernst equation 最大差異是什麼？","must":["多種離子|multiple ions","permeability|通透性"],"nice":["Nernst single ion"],"hint":"把「單一離子」和「多離子＋相對通透性」分清楚。","answer":"Nernst equation 處理單一離子的 equilibrium potential；GHK equation 可同時考慮多種離子及其相對 permeability，更接近真實 membrane potential。"},{"domain":"physiology","text":"如果 extracellular Na⁺ 顯著下降，action potential 的 peak 通常會怎麼變？","must":["peak decrease|峰值下降","Na driving force|鈉驅動力下降"],"nice":["depolarization"],"hint":"想 voltage-gated Na⁺ channel 開啟時的 driving force。","answer":"細胞外 Na⁺ 降低會降低 Na⁺ electrochemical driving force，因此典型快速 Na⁺ action potential 的 overshoot/peak 會下降。"},{"domain":"physiology","text":"absolute refractory period 和 relative refractory period 的差異？","must":["absolute 無法再觸發|不能再觸發","relative 需要更強刺激|較強刺激"],"nice":["Na inactivation|K conductance"],"hint":"先講能不能再觸發，再補離子通道原因。","answer":"absolute refractory period 主要因 Na⁺ channel inactivation，幾乎不能再產生新 action potential；relative refractory period 時部分 Na⁺ channel 已恢復但 K⁺ conductance 仍高，需要更強刺激。"},{"domain":"physiology","text":"parasympathetic stimulation 對心率通常有什麼影響？主要 receptor 是什麼？","must":["heart rate decrease|心率下降","M2|muscarinic M2"],"nice":["Gi|cAMP"],"hint":"心臟副交感主要看 SA node M2。","answer":"迷走神經釋放 acetylcholine 作用於 M2 muscarinic receptor，降低 cAMP、增加 K⁺ conductance，使 SA node firing rate 下降，因此心率降低。"},{"domain":"physiology","text":"preload 增加通常如何影響 stroke volume？","must":["stroke volume increase|搏出量增加","Frank-Starling"],"nice":["venous return"],"hint":"前提是仍在生理範圍。","answer":"在生理範圍內 preload/venous return 增加會增加 end-diastolic filling，透過 Frank-Starling mechanism 提高 stroke volume。"},{"domain":"physiology","text":"心肌 contractility 增加時，end-systolic volume 通常如何變化？","must":["ESV decrease|收縮末期容積下降","stroke volume increase|搏出量增加"],"nice":["ejection fraction"],"hint":"想像同樣 preload 下射得更乾淨。","answer":"contractility 增加時心室可在相同負荷下排出更多血，通常使 end-systolic volume 下降、stroke volume 與 ejection fraction 上升。"},{"domain":"physiology","text":"Poiseuille law 告訴我們血管半徑對流量有多敏感？","must":["radius fourth power|半徑四次方"],"nice":["resistance inverse r4"],"hint":"這是為什麼小動脈調節很有效。","answer":"理想層流下 flow 與 radius 的四次方成正比、resistance 與 radius 的四次方成反比，因此血管半徑小改變即可大幅改變阻力與流量。"},{"domain":"physiology","text":"為什麼 arteriole 是全身血管阻力的重要調節位置？","must":["small radius|半徑小","smooth muscle|平滑肌調節"],"nice":["TPR|Poiseuille"],"hint":"把結構和可調節性連起來。","answer":"arteriole 半徑小且具有可調節的 smooth muscle tone，因此依 Poiseuille relation，半徑變化可顯著改變 total peripheral resistance 與局部血流。"},{"domain":"physiology","text":"腎臟的 tubuloglomerular feedback 大致怎麼運作？","must":["macula densa|緻密斑","NaCl delivery|NaCl"],"nice":["afferent arteriole|renin"],"hint":"先講偵測 distal NaCl，再講調整 GFR。","answer":"macula densa 感受 distal tubular NaCl delivery；當 NaCl 過高時可促進 afferent arteriolar constriction、降低 GFR，過低時則有相反方向並可促進 renin。"},{"domain":"physiology","text":"proximal tubule 主要重吸收哪些物質？","must":["Na|鈉","water|水","glucose|葡萄糖"],"nice":["bicarbonate|amino acid"],"hint":"不用背全部百分比，先抓主要角色。","answer":"proximal tubule 大量重吸收 Na⁺與水，正常情況也幾乎回收所有 glucose/amino acids，並重吸收大量 bicarbonate 等，是 bulk reabsorption 的主要部位。"},{"domain":"physiology","text":"loop of Henle 的 countercurrent multiplier 有什麼功能？","must":["medullary osmotic gradient|髓質滲透梯度","concentrate urine|濃縮尿液"],"nice":["ascending impermeable water"],"hint":"重點是建立 medullary gradient。","answer":"loop of Henle 利用 descending/ascending limb 不同通透性建立 renal medullary osmotic gradient，讓 collecting duct 在 ADH 存在時能有效回收水並濃縮尿液。"},{"domain":"physiology","text":"為什麼 thick ascending limb 常被稱為 diluting segment？","must":["NaCl reabsorption|NaCl重吸收","water impermeable|不透水"],"nice":["NKCC2"],"hint":"鹽被拿走、水跟不上。","answer":"thick ascending limb 主動重吸收 NaCl，但對水相對不通透，因此 tubular fluid 被稀釋，故稱 diluting segment。"},{"domain":"physiology","text":"pulmonary ventilation 和 alveolar ventilation 有什麼差別？","must":["dead space|死腔","alveolar ventilation excludes dead space|肺泡通氣扣除死腔"],"nice":["tidal volume"],"hint":"不是每一口氣都全部參與 gas exchange。","answer":"minute ventilation 是 tidal volume × respiratory rate；alveolar ventilation 要扣除 anatomic dead space，較直接反映實際參與 gas exchange 的新鮮氣體。"},{"domain":"physiology","text":"V/Q mismatch 是什麼？為什麼會造成低血氧？","must":["ventilation perfusion mismatch|通氣灌流不匹配","oxygenation impairment|氧合下降"],"nice":["shunt|dead space"],"hint":"一邊有氣沒血或有血沒氣都會降低效率。","answer":"V/Q mismatch 指肺泡 ventilation 與 perfusion 不匹配；低 V/Q 區血液氧合不足，高 V/Q 區又不能完全補償，因此常造成 hypoxemia。"},{"domain":"physiology","text":"Bohr effect 在說什麼？","must":["CO2/H+ increase|二氧化碳或氫離子上升","Hb affinity decrease|血紅素親和力下降"],"nice":["right shift|tissue unloading"],"hint":"組織代謝旺盛時更容易放氧。","answer":"Bohr effect 指 CO₂/H⁺增加使 hemoglobin 對 O₂ affinity 降低，oxygen dissociation curve 右移，促進組織釋氧。"},{"domain":"physiology","text":"thyroid hormone 對 basal metabolic rate 通常有什麼影響？","must":["increase basal metabolic rate|基礎代謝率上升"],"nice":["heat production|sympathetic sensitivity"],"hint":"甲狀腺素通常提高能量消耗。","answer":"thyroid hormone 可增加多組織代謝相關基因與耗氧，通常提高 basal metabolic rate 和 heat production，並增加 catecholamine sensitivity。"},{"domain":"physiology","text":"cortisol 在壓力反應中的主要代謝作用有哪些？","must":["gluconeogenesis increase|糖質新生增加","protein/lipid mobilization|蛋白脂質動員"],"nice":["anti-inflammatory"],"hint":"先抓維持血糖與提供底物。","answer":"cortisol 促進 hepatic gluconeogenesis，增加周邊蛋白質與脂質底物動員，並具抗發炎/免疫調節作用，協助長期 stress response。"},{"domain":"physiology","text":"insulin receptor 屬於哪一類 receptor？","must":["receptor tyrosine kinase|受體酪胺酸激酶"],"nice":["PI3K Akt"],"hint":"不是 GPCR。","answer":"insulin receptor 是 receptor tyrosine kinase；ligand binding 促進 receptor phosphorylation 並啟動 IRS-PI3K-Akt 等 downstream signaling。"},{"domain":"physiology","text":"neuron 的 temporal summation 和 spatial summation 差在哪？","must":["temporal same input repeated|時間總和","spatial multiple inputs|空間總和"],"nice":["postsynaptic potentials"],"hint":"一個是時間上疊加，一個是不同突觸一起來。","answer":"temporal summation 是同一/相近輸入快速連續發生而疊加；spatial summation 是多個不同 synaptic inputs 同時在 postsynaptic neuron 疊加。"},{"domain":"physiology","text":"myelination 為什麼能增加 conduction velocity？","must":["saltatory conduction|跳躍傳導","increase membrane resistance|提高膜阻抗"],"nice":["nodes of Ranvier"],"hint":"action potential 主要在 node 更新。","answer":"myelin 提高 membrane resistance、降低 capacitance，使電流在 internode 傳得更遠更快，action potential 主要在 nodes of Ranvier 再生，形成 saltatory conduction。"},{"domain":"physiology","text":"NMJ 中 acetylcholinesterase 的功能是什麼？","must":["degrade acetylcholine|分解乙醯膽鹼","terminate signal|終止訊號"],"nice":["recycle choline"],"hint":"若不清除 ACh，肌肉會持續被刺激。","answer":"acetylcholinesterase 快速水解 synaptic cleft 中的 acetylcholine，終止 neuromuscular signal，並讓 choline 回收利用。"},{"domain":"physiology","text":"skeletal muscle 的 length-tension relationship 在說什麼？","must":["actin myosin overlap|肌絲重疊","optimal length|最佳長度"],"nice":["force"],"hint":"太短或太長都不理想。","answer":"active force 取決於 actin-myosin overlap；在最佳 sarcomere length 交聯機會最多，過短或過長都降低可形成的 cross-bridges。"},{"domain":"physiology","text":"為什麼 severe hypocalcemia 可能提高神經肌肉興奮性？","must":["threshold easier|閾值降低","Na channel stability|鈉通道"],"nice":["tetany"],"hint":"細胞外 Ca²⁺也會影響 Na channel gating。","answer":"低 extracellular Ca²⁺可降低 voltage-gated Na⁺ channel 的 activation threshold，使 membrane excitability 增加，嚴重時可出現 tetany。"},{"domain":"biochem","text":"Michaelis-Menten equation 中 Km 的意義是什麼？","must":["Vmax half|一半最大速率","substrate concentration|受質濃度"],"nice":["affinity inverse caution"],"hint":"不要把 Km 永遠直接等同 affinity。","answer":"在簡單 Michaelis-Menten 系統中，Km 是 reaction velocity 達 Vmax/2 時的 substrate concentration；它和 binding/turnover 都有關，不能在所有情況下簡化成純 affinity。"},{"domain":"biochem","text":"kcat 代表什麼？","must":["turnover number|轉換數","substrate per enzyme per time|每個酵素每時間轉化受質"],"nice":["Vmax/Et"],"hint":"它是酵素飽和時的催化效率速度尺度。","answer":"kcat = Vmax/[E]total，代表 substrate 飽和時每個 active enzyme site 單位時間可轉換的 substrate 分子數。"},{"domain":"biochem","text":"kcat/Km 常被用來描述什麼？","must":["catalytic efficiency|催化效率"],"nice":["low substrate"],"hint":"它同時含催化速度與 substrate 使用能力。","answer":"kcat/Km 常作為低 substrate 條件下的 catalytic efficiency 指標，可比較不同 enzyme-substrate pairs。"},{"domain":"biochem","text":"allosteric enzyme 為什麼可能不符合簡單 Michaelis-Menten kinetics？","must":["cooperativity|協同性","multiple subunits|多亞基"],"nice":["sigmoidal"],"hint":"典型圖可能是 S-shaped。","answer":"allosteric enzymes 常有 subunit interaction/cooperativity，因此 velocity-substrate curve 可能呈 sigmoidal，而非簡單 Michaelis-Menten hyperbola。"},{"domain":"biochem","text":"glycolysis 的主要不可逆調控步驟有哪些？","must":["hexokinase/glucokinase","PFK-1","pyruvate kinase"],"nice":["ATP citrate"],"hint":"至少要抓 PFK-1。","answer":"glycolysis 主要不可逆步驟由 hexokinase/glucokinase、PFK-1、pyruvate kinase 催化；其中 PFK-1 是重要 rate-controlling point。"},{"domain":"biochem","text":"PFK-1 受到 ATP 和 AMP 怎麼調節？","must":["ATP inhibit|ATP抑制","AMP activate|AMP活化"],"nice":["citrate|F2,6BP"],"hint":"反映細胞能量狀態。","answer":"高 ATP 通常 allosterically inhibit PFK-1，AMP/ADP 則支持低能量狀態並促進 glycolysis；F2,6BP 也是強 activator。"},{"domain":"biochem","text":"TCA cycle 最主要的功能是什麼？","must":["NADH/FADH2|還原當量","acetyl CoA oxidation|乙醯輔酶A氧化"],"nice":["biosynthetic intermediates"],"hint":"不是只為了直接產 ATP。","answer":"TCA cycle 氧化 acetyl-CoA 並產生 NADH、FADH₂ 與 GTP/ATP，將電子提供給 ETC，同時也提供多種 biosynthetic intermediates。"},{"domain":"biochem","text":"ETC 的 proton gradient 最後怎麼被利用？","must":["ATP synthase","proton motive force|質子動力"],"nice":["oxidative phosphorylation"],"hint":"質子回流是 ATP 合成的直接耦合。","answer":"Complex I/III/IV pump protons 建立 electrochemical gradient；H⁺ 經 ATP synthase 回流驅動 ADP + Pi 合成 ATP。"},{"domain":"biochem","text":"uncoupler 對 oxygen consumption 和 ATP synthesis 會有什麼典型影響？","must":["oxygen consumption increase|耗氧上升","ATP decrease|ATP下降"],"nice":["proton gradient dissipate|熱"],"hint":"uncoupler 讓電子傳遞和 ATP 合成解耦。","answer":"uncoupler dissipates proton gradient，使 ETC 為維持 gradient 而加速、oxygen consumption 可增加，但 ATP synthesis efficiency 下降且能量以熱散失。"},{"domain":"biochem","text":"Complex IV 被抑制時 ETC 會發生什麼？","must":["electron flow stop|電子流受阻","oxygen reduction decrease|氧還原停止"],"nice":["ATP decrease|NADH accumulate"],"hint":"末端接受者用不了，前面會塞車。","answer":"Complex IV inhibition 阻止 electron transfer to O₂，造成 upstream carriers reduced、NADH 累積、proton pumping 與 oxidative phosphorylation 下降。"},{"domain":"biochem","text":"NADPH 在細胞中最常扮演什麼角色？","must":["reducing power|還原力","antioxidant biosynthesis|抗氧化/生合成"],"nice":["glutathione|PPP"],"hint":"和 NADH 的能量代謝角色區分。","answer":"NADPH 主要提供 reductive biosynthesis 與 antioxidant defense 的 reducing power，例如維持 glutathione reduced state；pentose phosphate pathway 是重要來源。"},{"domain":"biochem","text":"pentose phosphate pathway 的兩個主要產物／功能？","must":["NADPH","ribose-5-phosphate"],"nice":["antioxidant|nucleotide synthesis"],"hint":"一個是還原力，一個是核苷酸前驅物。","answer":"PPP oxidative phase 產生 NADPH，non-oxidative reactions 可提供 ribose-5-phosphate/糖磷酸中間物，支援 antioxidant defense 與 nucleotide synthesis。"},{"domain":"biochem","text":"protein denaturation 和 protein hydrolysis 有什麼不同？","must":["denaturation structure loss|結構改變","hydrolysis peptide bond break|胜肽鍵斷裂"],"nice":["primary structure"],"hint":"變性不一定切斷 peptide bonds。","answer":"denaturation 主要破壞 secondary/tertiary/quaternary interactions 而使功能喪失，通常不切 primary peptide bonds；hydrolysis 則切斷 peptide bond。"},{"domain":"biochem","text":"disulfide bond 在蛋白質結構中的作用？","must":["stabilize structure|穩定結構","cysteine"],"nice":["oxidizing environment"],"hint":"常見於分泌蛋白。","answer":"兩個 cysteine thiol 氧化形成 disulfide bond，可穩定 protein tertiary/quaternary structure，尤其 extracellular/secreted proteins 常見。"},{"domain":"biochem","text":"ubiquitin-proteasome system 的基本流程？","must":["ubiquitin tag|泛素標記","proteasome degradation|蛋白酶體降解"],"nice":["E1 E2 E3"],"hint":"E3 多決定 substrate specificity。","answer":"target proteins 經 E1/E2/E3 ubiquitination，特定 polyubiquitin chain 可引導至 26S proteasome 進行 ATP-dependent degradation。"},{"domain":"molbio","text":"DNA polymerase 為什麼只能 5′→3′ 合成 DNA？","must":["add to 3OH|加到3端羥基","5 to 3"],"nice":["dNTP energy"],"hint":"核心是 incoming dNTP 接到 growing strand 的 3′-OH。","answer":"DNA polymerase 將 incoming dNTP 的 alpha phosphate 接到 growing strand 3′-OH，因此新鏈只能 5′→3′ 延伸。"},{"domain":"molbio","text":"leading strand 和 lagging strand 為什麼合成方式不同？","must":["antiparallel|反平行","Okazaki fragments|岡崎片段"],"nice":["replication fork"],"hint":"DNA polymerase 只能 5′→3′。","answer":"因兩股 template antiparallel 且 polymerase 只能 5′→3′ 合成，leading strand 可連續朝 fork 合成，lagging strand 必須以 Okazaki fragments 不連續合成。"},{"domain":"molbio","text":"telomerase 的功能是什麼？","must":["extend telomere|延長端粒","reverse transcriptase|逆轉錄酶"],"nice":["RNA template"],"hint":"解決 chromosome end replication problem。","answer":"telomerase 是 RNA-dependent DNA polymerase/reverse transcriptase，利用自身 RNA template 延長 chromosome ends，部分補償 telomere shortening。"},{"domain":"molbio","text":"enhancer 和 promoter 的差異？","must":["enhancer regulatory|增強子調控","promoter transcription initiation|啟動子起始"],"nice":["distance/orientation"],"hint":"promoter 近轉錄起始，enhancer 可較遠。","answer":"promoter 是 RNA polymerase/transcription machinery 組裝和起始的重要 DNA region；enhancer 可在較遠位置透過 transcription factors/chromatin looping 增強 transcription。"},{"domain":"molbio","text":"alternative splicing 為什麼能增加蛋白質多樣性？","must":["different exon combinations|不同外顯子組合","same gene multiple isoforms|同基因多異構體"],"nice":["spliceosome"],"hint":"同一 pre-mRNA 可產生不同成熟 mRNA。","answer":"alternative splicing 選擇不同 exon inclusion/exclusion，使同一 gene 的 pre-mRNA 形成多種 mRNA/protein isoforms。"},{"domain":"molbio","text":"miRNA 大致如何抑制 gene expression？","must":["RISC","mRNA degradation|translation repression"],"nice":["partial complementarity"],"hint":"通常在 post-transcriptional level。","answer":"miRNA 載入 RISC 後和 target mRNA 配對，促進 mRNA degradation/deadenylation 或抑制 translation，降低 protein expression。"},{"domain":"molbio","text":"qPCR 的 Ct/Cq 值越低通常代表什麼？","must":["more starting template|起始模板較多","earlier
