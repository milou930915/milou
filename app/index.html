Tracker Deep Red","zh":"粒線體深紅追蹤探針","meaning":"幫助標記粒線體；亮度受膜電位、含量和染色條件共同影響。"},{"en":"NAO","zh":"壬基吖啶橙","meaning":"與心磷脂結合相關的染劑；變亮不能單獨證明粒線體變多。"},{"en":"NAC","zh":"乙醯半胱胺酸","meaning":"可影響細胞抗氧化與還原環境；本身有多種作用，回復結果需對照驗證。"},{"en":"ROS","zh":"活性氧物種","meaning":"一群反應性較高的含氧分子，少量可參與訊號，過量可能造成損傷。"},{"en":"oxidative stress","zh":"氧化壓力","meaning":"氧化作用超過抗氧化調節能力，可能破壞蛋白、脂質或核酸。"},{"en":"mitochondria","zh":"粒線體","meaning":"參與能量轉換、代謝與細胞命運的胞器，具有內外兩層膜。"},{"en":"membrane potential","zh":"膜電位","meaning":"膜兩側的電位差，像跨膜的電壓；離子分布與通道影響它。"},{"en":"cardiolipin","zh":"心磷脂","meaning":"粒線體內膜的重要磷脂，與膜結構及呼吸鏈功能有關。"},{"en":"apoptosis","zh":"細胞凋亡","meaning":"有調控的細胞死亡途徑，常出現細胞縮小與蛋白酶連鎖活化。"},{"en":"necrosis","zh":"壞死","meaning":"常伴細胞膜破裂與內容物外漏的死亡表現；部分壞死也可受調控。"},{"en":"autophagy","zh":"自噬","meaning":"細胞把物質包起來送去溶體分解並回收，不一定代表細胞死亡。"},{"en":"autophagic flux","zh":"自噬通量","meaning":"整段自噬流程完成回收的速度，不是某一時點有幾個囊泡。"},{"en":"mitophagy","zh":"粒線體自噬","meaning":"以自噬方式選擇性清除粒線體，參與胞器品質維護。"},{"en":"lysosome","zh":"溶體","meaning":"具有酸性環境及分解酶的胞器，負責消化與回收。"},{"en":"BAX","zh":"促凋亡蛋白巴克斯","meaning":"可與相關蛋白一起讓粒線體外膜通透化，促進內源性凋亡。"},{"en":"BAK","zh":"促凋亡蛋白巴克","meaning":"與巴克斯同屬促外膜通透化的蛋白，需區分活化與總表現量。"},{"en":"caspase","zh":"半胱天冬酶","meaning":"可以切割蛋白的酵素家族，其中部分負責啟動或執行凋亡。"},{"en":"cytochrome c","zh":"細胞色素丙","meaning":"正常協助電子傳遞；釋出到細胞質後可參與凋亡小體組裝。"},{"en":"Annexin V","zh":"膜聯蛋白五","meaning":"可結合外露的磷脂醯絲胺酸，常搭配膜完整性染劑判讀凋亡。"},{"en":"PI","zh":"碘化丙啶","meaning":"完整細胞膜通常阻擋此染劑；進入細胞後可與核酸結合。"},{"en":"flow cytometry","zh":"流式細胞分析","meaning":"讓細胞逐一通過偵測區，量散射及螢光，分析不同細胞族群。"},{"en":"gating","zh":"圈選分析","meaning":"依訊號條件逐步挑選要比較的細胞，像先排除碎屑再看單細胞。"},{"en":"FSC","zh":"前向散射光","meaning":"常與細胞大小相關，也受形狀與折射率影響。"},{"en":"SSC","zh":"側向散射光","meaning":"常與細胞內部複雜度或顆粒度相關。"},{"en":"compensation","zh":"螢光補償","meaning":"修正一種染劑訊號進入另一偵測通道造成的混合。"},{"en":"FMO","zh":"缺一色螢光對照","meaning":"多色染色中只缺少某一染劑，用來協助設定該色的陽性邊界。"},{"en":"vehicle control","zh":"溶劑對照","meaning":"含相同終濃度溶劑但沒有目標藥物，排除溶劑造成的變化。"},{"en":"positive control","zh":"陽性對照","meaning":"已知應出現目標訊號的組別，確認方法能偵測得到。"},{"en":"negative control","zh":"陰性對照","meaning":"預期不出現特定反應的組別，幫助判定背景或非特異訊號。"},{"en":"biological replicate","zh":"生物重複","meaning":"來自獨立實驗單位的重複，用來估計生物或批次間變異。"},{"en":"technical replicate","zh":"技術重複","meaning":"同一樣品重複量測，主要反映量測與操作誤差。"},{"en":"SD","zh":"標準差","meaning":"描述一組觀察值本身有多分散。"},{"en":"SEM","zh":"平均值的標準誤","meaning":"描述樣本平均值估計母群平均的不確定性；獨立樣本下常以標準差除以樣本數平方根估算，不能取代樣本分散程度。"},{"en":"p-value","zh":"顯著性機率","meaning":"在虛無假設與模型假設下，觀察到目前或更極端結果的機率。"},{"en":"confidence interval","zh":"信賴區間","meaning":"依指定抽樣方法建立的估計範圍，用來呈現參數估計的不確定性。"},{"en":"normalization","zh":"正規化","meaning":"把結果相對於合理基準調整，減少不希望比較的差異。"},{"en":"synergy","zh":"協同作用","meaning":"合併效應超過所選相加參考模型的預期，需要模型與劑量資料。"},{"en":"correlation","zh":"相關性","meaning":"兩個量一起變動，但不保證其中一個造成另一個。"},{"en":"causality","zh":"因果關係","meaning":"改變某因素會造成結果改變，需結合介入、時間順序與替代解釋。"},{"en":"rescue experiment","zh":"回復實驗","meaning":"阻斷或補回候選因子，觀察原本變化能否恢復，以測試機制。"},{"en":"IC50","zh":"半最大抑制濃度","meaning":"在指定時間與分析條件下，使定義的反應降低一半的濃度。"},{"en":"transcription","zh":"轉錄","meaning":"以核酸模板產生核糖核酸的過程。"},{"en":"translation","zh":"轉譯","meaning":"核糖體讀取信使核糖核酸，合成胺基酸鏈的過程。"},{"en":"promoter","zh":"啟動子","meaning":"協助轉錄起始複合體定位的核酸區域。"},{"en":"enhancer","zh":"增強子","meaning":"可透過轉錄因子與染色質接觸調節轉錄的序列。"},{"en":"splicing","zh":"剪接","meaning":"移除內含子並連接外顯子，形成成熟訊息的加工步驟。"},{"en":"PCR","zh":"聚合酶連鎖反應","meaning":"用重複溫度循環讓特定核酸片段大量增加。"},{"en":"qPCR","zh":"即時定量聚合酶連鎖反應","meaning":"逐循環量螢光，利用擴增曲線估計起始模板量。"},{"en":"RT-qPCR","zh":"反轉錄即時定量核酸擴增","meaning":"先把核糖核酸轉成互補核酸，再進行定量擴增。"},{"en":"Ct","zh":"閾值循環數","meaning":"螢光首次超過設定門檻的循環位置；條件相同時越低通常起始模板越多。"},{"en":"primer","zh":"引子","meaning":"提供聚合酶開始延長的位置，並界定要擴增的序列。"},{"en":"Western blot","zh":"西方墨點法","meaning":"先分離蛋白再用抗體偵測，提供目標蛋白大小與相對含量線索。"},{"en":"loading control","zh":"上樣內參","meaning":"用於校正上樣差異的基準，必須確認在比較條件中穩定。"},{"en":"knockdown","zh":"基因敲低","meaning":"降低目標的轉錄產物或蛋白量，通常不是完全移除基因。"},{"en":"knockout","zh":"基因剔除","meaning":"以基因組操作破壞目標功能，仍需驗證是否真的失去功能。"},{"en":"ATP","zh":"三磷酸腺苷","meaning":"常用於能量耦合的分子，可把供能反應連接到需要能量的反應。"},{"en":"NADH","zh":"還原型菸醯胺腺嘌呤二核苷酸","meaning":"攜帶高能電子的輔酶，可將電子交給呼吸鏈。"},{"en":"Km","zh":"米氏常數","meaning":"在米氏模型中反應初速達最大值一半時的受質濃度。"},{"en":"Vmax","zh":"最大反應速率","meaning":"固定酵素量下，受質充分時可接近的最大初速。"},{"en":"competitive inhibition","zh":"競爭性抑制","meaning":"抑制劑與受質競爭結合游離酵素；理想模型中可被高受質濃度克服。"},{"en":"oxidative phosphorylation","zh":"氧化磷酸化","meaning":"用電子傳遞建立跨膜質子差，再帶動三磷酸腺苷合成。"},{"en":"electron transport chain","zh":"電子傳遞鏈","meaning":"把電子逐步傳向氧的蛋白與載體系統，其中部分步驟可驅動質子運輸。"},{"en":"proton gradient","zh":"質子梯度","meaning":"膜兩邊質子的濃度差；與電位差一起構成質子動力勢。"},{"en":"homeostasis","zh":"體內恆定","meaning":"透過持續調節把內在變數維持在可運作範圍，並非永遠完全不變。"},{"en":"action potential","zh":"動作電位","meaning":"可沿可興奮細胞膜傳播的快速電位變化。"},{"en":"depolarization","zh":"去極化","meaning":"膜內相對膜外變得較不負；不一定已達正值。"},{"en":"repolarization","zh":"再極化","meaning":"膜電位從去極化狀態回到較負的方向。"},{"en":"refractory period","zh":"不反應期","meaning":"一次放電後暫時不能再放電，或需要較強刺激的時間。"},{"en":"RAAS","zh":"腎素－血管張力素－醛固酮系統","meaning":"在低灌流等情況下，透過血管收縮和保鈉保水幫助維持循環。"},{"en":"ADH","zh":"抗利尿激素","meaning":"增加集尿管水通透性，協助身體保留水。"},{"en":"GFR","zh":"腎絲球過濾率","meaning":"單位時間由腎絲球過濾進入腎小管的液體體積。"},{"en":"cardiac output","zh":"心輸出量","meaning":"每分鐘心室泵出的血量，等於心率乘每次搏出量。"},{"en":"preload","zh":"前負荷","meaning":"心室收縮前肌纖維受到的伸展程度，常用舒張末期充盈指標近似。"},{"en":"afterload","zh":"後負荷","meaning":"心室射血時必須克服的負荷，不能只用一個壓力概括所有情況。"},{"en":"chemical potential","zh":"化學勢","meaning":"在指定條件下，增加少量某成分對自由能的影響，決定物質轉移趨勢。"},{"en":"fugacity","zh":"逸度","meaning":"以類似壓力的量修正真實氣體偏離理想氣體的行為。"},{"en":"activity coefficient","zh":"活度係數","meaning":"描述混合物偏離理想狀態的修正因子，需搭配標準態使用。"},{"en":"enthalpy","zh":"焓","meaning":"內能加壓力乘體積，常用於流動系統能量衡算。"},{"en":"entropy","zh":"熵","meaning":"與能量分散及可用微觀狀態有關，也是判斷不可逆方向的重要量。"},{"en":"Gibbs free energy","zh":"吉布斯自由能","meaning":"定溫定壓及適當功條件下，用來判斷自發方向和平衡的熱力學量。"},{"en":"CSTR","zh":"連續攪拌槽反應器","meaning":"理想模型中完全混合，所以槽內濃度等於出口濃度。"},{"en":"PFR","zh":"塞流反應器","meaning":"理想模型中物料沿流向前進，濃度可沿長度變化且無軸向混合。"},{"en":"conversion","zh":"轉化率","meaning":"投入的某反應物中，已被反應消耗的比例。"},{"en":"selectivity","zh":"選擇性","meaning":"在多條反應途徑中，生成目標產物相對於其他產物的程度。"},{"en":"activation energy","zh":"活化能","meaning":"描述速率常數對溫度敏感程度的參數，與反應能障相關。"},{"en":"residence time","zh":"停留時間","meaning":"流體在設備內停留的時間；實際系統可能有一整個時間分布。"},{"en":"Reynolds number","zh":"雷諾數","meaning":"比較流動中慣性與黏性影響的無因次數。"},{"en":"Biot number","zh":"畢歐數","meaning":"比較物體內部傳導與表面對流熱阻的無因次數。"},{"en":"mass-transfer coefficient","zh":"質傳係數","meaning":"把物質通量連接到兩處濃度差的工程係數，受流動與幾何影響。"},{"en":"diffusion","zh":"擴散","meaning":"分子隨機運動在濃度或化學勢差下形成淨傳遞。"},{"en":"reflux ratio","zh":"回流比","meaning":"回流入塔的液體流率相對於餾出液流率的比值。"},{"en":"flooding","zh":"液泛","meaning":"塔內氣流阻礙液體向下，造成液體滯留與壓降急增。"},{"en":"concentration polarization","zh":"濃差極化","meaning":"膜附近的溶質濃度偏離主流體，降低有效分離驅動力。"},{"en":"PID","zh":"比例積分微分控制","meaning":"分別使用現在誤差、累積誤差及變化趨勢來調整系統。"},{"en":"negative feedback","zh":"負回授","meaning":"把量到的偏差回送控制端，採取抵消偏差的動作。"},{"en":"dead time","zh":"純延遲","meaning":"輸入改變後，輸出要等待一段時間才開始出現反應。"},{"en":"transfer function","zh":"轉移函數","meaning":"線性時不變系統在零初始條件下，轉換後輸出與輸入的比。"},{"en":"overshoot","zh":"超越量","meaning":"暫態反應曾超過最後目標值的程度。"},{"en":"Laplace transform","zh":"拉普拉斯轉換","meaning":"把時間域函數與微分方程轉成較易代數處理的形式。"},{"en":"boundary condition","zh":"邊界條件","meaning":"指定空間邊緣的值或通量，幫助決定方程的解。"},{"en":"eigenvalue","zh":"特徵值","meaning":"描述特定方向受線性變換縮放的量；動態模型中可反映成長或衰減。"},{"en":"HPLC","zh":"高效液相層析","meaning":"利用樣品與固定相、液體移動相作用不同來分離成分。"},{"en":"XRD","zh":"Ｘ光繞射","meaning":"利用晶體對Ｘ光的干涉圖樣推測晶相、晶面間距與結構資訊。"},{"en":"DLS","zh":"動態光散射","meaning":"由布朗運動造成的散射強度波動估計流體動力學粒徑。"},{"en":"FTIR","zh":"傅立葉轉換紅外光譜","meaning":"利用分子振動吸收，提供官能基與化學環境線索。"},{"en":"dehydrogenase","zh":"脫氫酶","meaning":"幫助把電子與氫從底物移走的酵素，常參與代謝中的氧化還原反應。"},{"en":"WST-8","zh":"水溶性四唑鹽八號","meaning":"細胞活性試劑中的顯色受質，被還原後形成可量吸光的甲臢產物。"},{"en":"metabolic activity","zh":"代謝活性","meaning":"細胞進行化學反應的活躍程度；同樣細胞數不一定有相同代謝活性。"},{"en":"overall heat-transfer coefficient","zh":"總傳熱係數","meaning":"把內外對流、壁面導熱及汙垢等熱阻合併成一個係數；計算時必須使用一致的基準面積。"},{"en":"resting membrane potential","zh":"靜止膜電位","meaning":"細胞未產生動作電位時膜內外的電位差，由離子濃度梯度與相對通透性共同決定。"},{"en":"noncompetitive inhibition","zh":"非競爭性抑制","meaning":"純非競爭性抑制劑對游離酵素與酵素受質複合體親和力相同，使最大速率降低而米氏常數不變。"},{"en":"countercurrent multiplier","zh":"逆流倍增機制","meaning":"亨利氏環兩支水與鹽通透性不同，配合相反流向，把局部濃度差累積為腎髓質縱向滲透梯度。"},{"en":"pentose phosphate pathway","zh":"磷酸戊糖途徑","meaning":"葡萄糖六磷酸的另一條代謝路徑，供應還原力與核苷酸所需的五碳糖。"},{"en":"joule-thomson coefficient","zh":"焦耳－湯姆遜係數","meaning":"固定焓時溫度對壓力的變化率；其正負決定節流降壓時冷卻或升溫。"},{"en":"receptor tyrosine kinase","zh":"受體酪胺酸激酶","meaning":"配體活化後促進酪胺酸磷酸化的膜受體，提供下游訊號蛋白的結合與活化位置。"},{"en":"Frank-Starling mechanism","zh":"法蘭克－史達林機制","meaning":"在生理範圍內，舒張期心室充盈增加會提高肌纖維拉伸與收縮輸出，讓心臟配合回流量。"},{"en":"receptor internalization","zh":"受體內吞","meaning":"細胞把膜上受體移入囊泡；之後可能回收至膜面或送去降解，因此能改變訊號強度與持續時間。"},{"en":"distribution coefficient","zh":"分配係數","meaning":"平衡時物質在兩個相中的總濃度比；會受酸鹼解離、溶劑與溫度影響。"},{"en":"Newtonian viscosity law","zh":"牛頓黏度定律","meaning":"剪應力與速度梯度成正比，比例常數為動力黏度；固定條件下牛頓流體的黏度不隨剪切速率改變。"},{"en":"fluorescence intensity","zh":"螢光強度","meaning":"偵測器收到的放光訊號，除目標量外也受染劑、儀器、背景與光漂白影響，不能直接等同絕對濃度。"},{"en":"mean arterial pressure","zh":"平均動脈壓","meaning":"一個心動週期中的時間平均動脈壓；正常心率下常以舒張壓加三分之一脈壓估算。"},{"en":"equilibrium potential","zh":"平衡電位","meaning":"對某種離子而言，電力與濃度擴散力互相抵銷、沒有淨流動時的膜電位。"},{"en":"synaptic transmission","zh":"突觸傳遞","meaning":"神經元透過化學傳遞物或電耦合影響下一個細胞；化學突觸通常涉及鈣離子促進囊泡釋放。"},{"en":"phosphofructokinase-1","zh":"磷酸果糖激酶一","meaning":"催化果糖六磷酸變成果糖一、六雙磷酸，是糖解作用重要的能量狀態調控點。"},{"en":"equilibrium constant","zh":"平衡常數","meaning":"特定溫度下平衡時產物與反應物活度的比值，指數取化學計量係數；描述平衡位置而非反應快慢。"},{"en":"alternative splicing","zh":"選擇性剪接","meaning":"同一段前驅核糖核酸採用不同外顯子組合，讓一個基因產生不同成熟轉錄本。"},{"en":"multiple comparisons","zh":"多重比較","meaning":"同一分析同時檢查多個差異，會提高至少一次偽陽性的機會；須依目的選擇適當校正方法。"},{"en":"effectiveness factor","zh":"有效因子","meaning":"催化顆粒的實際總反應速率，除以整顆都處於指定表面條件時的理想速率；反映內部傳遞限制。"},{"en":"Langmuir-Hinshelwood","zh":"蘭格繆爾－欣謝爾伍德","meaning":"反應物先吸附在催化表面，再由表面物種反應的模型；速率式取決於吸附假設與控制步驟。"},{"en":"single-color control","zh":"單色對照","meaning":"只含一種螢光標記的樣本，用於估計該染劑流入其他偵測通道的訊號並設定補償。"},{"en":"thick ascending limb","zh":"粗上升支","meaning":"亨利氏環中主動再吸收鹽、對水通透性很低的區段，能稀釋管液並協助建立髓質梯度。"},{"en":"alveolar ventilation","zh":"肺泡通氣量","meaning":"每分鐘真正到達可交換氣體肺泡的有效新鮮空氣量，等於潮氣量扣除死腔量後乘呼吸頻率。"},{"en":"basal metabolic rate","zh":"基礎代謝率","meaning":"在清醒、休息、空腹且適溫等標準條件下，維持基本生理活動所需的能量消耗速率。"},{"en":"acetylcholinesterase","zh":"乙醯膽鹼酯酶","meaning":"快速水解突觸間隙中的乙醯膽鹼，終止傳遞並避免肌肉或其他效應細胞持續受刺激。"},{"en":"minimum fluidization","zh":"最小流化","meaning":"流體向上的阻力剛好平衡顆粒扣除浮力後的重量，固定床開始轉為流化床的臨界狀態。"},{"en":"protein degradation","zh":"蛋白質降解","meaning":"將蛋白質拆成較小片段或胺基酸的過程，參與品質管制、訊號終止與物質回收。"},{"en":"relative volatility","zh":"相對揮發度","meaning":"兩成分汽液平衡分配比的比值；離一越遠通常越容易以蒸餾分離，且可能隨組成與溫度改變。"},{"en":"temporal summation","zh":"時間總和","meaning":"同一突觸短時間內連續產生的突觸後電位疊加，影響是否達到動作電位閾值。"},{"en":"bernoulli equation","zh":"伯努力方程式","meaning":"理想穩態、不可壓縮、無黏性流沿流線的機械能守恆；實際系統須納入泵功與摩擦損失。"},{"en":"lumped capacitance","zh":"集總熱容法","meaning":"把物體內部視為同一溫度，只追蹤隨時間的變化；常以畢奧數遠小於一判斷內部熱阻可否忽略。"},{"en":"Clausius-Clapeyron","zh":"克勞修斯－克拉佩龍","meaning":"在蒸氣近似理想氣體且液體體積可忽略等條件下，連結飽和蒸氣壓、溫度與相變潛熱的關係式。"},{"en":"oxygen consumption","zh":"耗氧量","meaning":"細胞或組織消耗氧的量或速率；呼吸測試中可反映電子傳遞，但須區分粒線體與其他耗氧來源。"},{"en":"parallel reactions","zh":"平行反應","meaning":"同一反應物經不同路徑生成不同產物，選擇率由各路徑速率及操作條件共同決定。"},{"en":"pseudo-first-order","zh":"擬一階","meaning":"其中一個反應物大量過量、濃度近似不變時，將其併入表觀速率常數，使速率看似只依賴另一反應物。"},{"en":"integrating factor","zh":"積分因子","meaning":"乘上微分方程後，讓左側成為某個乘積的完整導數或使方程恰當的函數，方便積分求解。"},{"en":"metabolic acidosis","zh":"代謝性酸中毒","meaning":"主要由碳酸氫根下降或非揮發酸增加造成的酸化傾向；呼吸代償可降低二氧化碳，但未必完全校正酸鹼值。"},{"en":"secondary antibody","zh":"二級抗體","meaning":"辨認一級抗體的抗體，常攜帶螢光或酵素標記以放大與顯示訊號。"},{"en":"phase equilibrium","zh":"相平衡","meaning":"多個相共存且沒有宏觀淨物質轉移的狀態；相同成分在各相的化學勢相等。"},{"en":"hyperpolarization","zh":"過極化","meaning":"膜電位變得比原先更負，常由鉀離子外流或氯離子流動等造成，方向仍需看離子平衡電位。"},{"en":"spatial summation","zh":"空間總和","meaning":"不同突觸同時產生的電位變化在細胞上整合，共同影響起始區是否達到閾值。"},{"en":"nonsense mutation","zh":"無義突變","meaning":"把原本編碼胺基酸的密碼子改為終止密碼子，可能造成提早終止或轉錄本被清除。"},{"en":"missense mutation","zh":"錯義突變","meaning":"核酸序列改變使某個密碼子編碼不同胺基酸；影響需依蛋白位置與功能判斷。"},{"en":"effectiveness-NTU","zh":"有效度與傳熱單元數法","meaning":"利用最大可能熱傳量的比例與無因次換熱能力，計算熱交換器表現，適合出口溫度未知時使用。"},{"en":"Hurwitz criterion","zh":"赫維茲判據","meaning":"利用特徵多項式係數構成的行列式判斷根是否都在左半平面，適用於連續線性系統的穩定性分析。"},{"en":"original research","zh":"原始研究","meaning":"作者提出新資料、方法或分析的研究報告；與統整既有文獻的綜述不同。"},{"en":"hydrogen peroxide","zh":"過氧化氫","meaning":"可參與氧化還原訊號的活性氧物種；它本身不是自由基，過量或特定金屬存在時可能造成傷害。"},{"en":"oncotic pressure","zh":"膠體滲透壓","meaning":"主要由不能自由穿過血管壁的蛋白質產生的滲透作用，影響液體在血管與組織間的分布。"},{"en":"vasoconstriction","zh":"血管收縮","meaning":"血管平滑肌收縮使管徑縮小，常提高局部阻力；對血流與血壓的影響取決於整體循環條件。"},{"en":"hyperventilation","zh":"過度換氣","meaning":"肺泡通氣超過代謝產生二氧化碳的需要，使動脈二氧化碳下降，不能只由呼吸頻率判斷。"},{"en":"goldman equation","zh":"高德曼膜電位方程式","meaning":"把多種離子的膜通透性與膜內外濃度一起納入，用來估算穩態膜電位。"},{"en":"Fick’s first law","zh":"菲克第一定律","meaning":"擴散通量與濃度梯度成正比且方向由高往低；比例常數是擴散係數。"},{"en":"Beer-Lambert law","zh":"比爾－朗伯定律","meaning":"理想測量範圍內，吸光度與吸光物濃度及光徑長成正比；散射、過濃或化學平衡變化可能造成偏離。"},{"en":"Taylor expansion","zh":"泰勒展開","meaning":"在某點附近利用函數及其各階導數建立多項式近似，近似範圍與誤差需要另行檢查。"},{"en":"Michaelis-Menten","zh":"米氏－曼騰","meaning":"在適當初速與準穩態條件下，以最大速率和米氏常數描述酵素反應速率隨受質濃度的變化。"},{"en":"diluting segment","zh":"稀釋段","meaning":"腎元中能再吸收溶質卻不易讓水跟隨的區段，使管液濃度下降。"},{"en":"insulin receptor","zh":"胰島素受體","meaning":"具酪胺酸激酶活性的膜受體，活化後調節葡萄糖利用、代謝與生長相關訊號。"},{"en":"throttling valve","zh":"節流閥","meaning":"利用局部阻力降壓的裝置；絕熱、無軸功且動位能可忽略時，入口與出口的比焓近似相同。"},{"en":"primary antibody","zh":"一級抗體","meaning":"直接辨認待測抗原的抗體，特異性與結合條件會影響實驗訊號可信度。"},{"en":"sherwood number","zh":"舍伍德數","meaning":"對流質傳相對於分子擴散的無因次指標，常寫成質傳係數乘特徵長度再除擴散係數。"},{"en":"collecting duct","zh":"集尿管","meaning":"接收多個腎元管液並調整最終水分與電解質排出的部位，其水通透性受抗利尿激素調節。"},{"en":"hypoventilation","zh":"低通氣","meaning":"肺泡通氣不足以排除代謝產生的二氧化碳，使動脈二氧化碳上升。"},{"en":"gene expression","zh":"基因表現","meaning":"由基因資訊產生功能性核糖核酸或蛋白質的過程，可在轉錄、轉錄後及轉譯等層級調控。"},{"en":"phosphorylation","zh":"磷酸化","meaning":"把磷酸基加到分子上的反應；蛋白質磷酸化可能活化、抑制或改變位置，不能一律視為活化。"},{"en":"superoxide","zh":"超氧陰離子","meaning":"氧分子接受一個電子形成的自由基型活性氧物種，可被超氧歧化酶轉為過氧化氫。"},{"en":"cell viability","zh":"細胞活性","meaning":"細胞存活狀態的量測概念；不同方法觀察代謝、膜完整性或增殖能力，結果不一定完全等同。"},{"en":"CD24","zh":"第二十四型分化群抗原","meaning":"細胞表面的醣蛋白標記；表現意義隨細胞與疾病情境改變，單一訊號不能證明幹性。"},{"en":"CD44","zh":"第四十四型分化群抗原","meaning":"參與細胞黏附及訊號傳遞的膜蛋白，常用於表型分析；須搭配其他標記與功能實驗判讀。"},{"en":"Pi","zh":"無機磷酸","meaning":"游離的無機磷酸根，參與能量代謝與磷酸化反應，和染劑縮寫及等電點不同。"},{"en":"pI","zh":"等電點","meaning":"分子的平均淨電荷為零時的酸鹼值，常用於理解蛋白電荷、溶解性與等電聚焦。"},{"en":"μm","zh":"微米","meaning":"長度單位，等於百萬分之一公尺；小寫字母代表長度而非莫耳濃度。"},{"en":"μM","zh":"微莫耳每公升","meaning":"濃度單位，等於每公升含百萬分之一莫耳的溶質。"},{"en":"mm","zh":"毫米","meaning":"長度單位，等於千分之一公尺。"},{"en":"mM","zh":"毫莫耳每公升","meaning":"濃度單位，等於每公升含千分之一莫耳的溶質。"},{"en":"renin","zh":"腎素","meaning":"腎臟釋放的蛋白酶，切開肝臟產生的血管張力素原，啟動調整血壓與鹽水平衡的連鎖反應。"},{"en":"angiotensin","zh":"血管張力素","meaning":"由前驅物逐步切割形成的胜肽；其中第二型可促進血管收縮及醛固酮分泌。"},{"en":"aldosterone","zh":"醛固酮","meaning":"腎上腺皮質分泌的類固醇激素，促進遠端腎元再吸收鈉並分泌鉀，水分保留仍受其他條件影響。"},{"en":"macula densa","zh":"緻密斑","meaning":"腎元末段粗上升支附近的一群感測細胞，偵測管液氯化鈉輸送並參與調整腎素與腎絲球過濾。"},{"en":"reabsorption","zh":"再吸收","meaning":"已進入腎小管管液的水或溶質重新回到血液的過程，與由血液分泌進管液的方向相反。"},{"en":"absorption","zh":"吸收","meaning":"物質進入另一個相的內部或穿過生物組織進入體內的過程；需依單元操作或生理情境判讀。"},{"en":"reaction order","zh":"反應級數","meaning":"速率式中濃度項的指數；通常由實驗決定，不可直接照總反應式的係數推定。"},{"en":"arrhenius","zh":"阿瑞尼士關係","meaning":"描述速率常數對溫度的依賴，以前指數因子、活化能與絕對溫度連結反應速率的變化。"},{"en":"rate law","zh":"速率式","meaning":"用濃度、溫度及速率常數等量描述反應速率的數學關係；適用形式需要實驗或機制假設支持。"},{"en":"activation","zh":"活化","meaning":"使分子或系統進入可發揮作用或可反應狀態；具體條件可能是能量輸入、結合或化學修飾。"},{"en":"energy","zh":"能量","meaning":"描述系統作功、傳熱與狀態改變能力的物理量；總量守恆不代表所有能量都能轉成有用功。"},{"en":"equation","zh":"方程式","meaning":"以等號表達量之間關係的數學式；使用時須確認變數定義、單位與成立條件。"}],"lessons":[{"id":"cck","title":"細胞活性試劑：從代謝到吸光值","keys":["CCK-8","WST-8"],"scope":"project experiment methods","steps":[{"title":"活細胞提供還原力","detail":"細胞的脫氫酶系統與電子傳遞媒介，使水溶性四唑鹽被還原；起點是代謝相關還原能力。"},{"title":"生成水溶性色素","detail":"還原後形成橘色甲臢產物。相同條件與適當線性範圍內，產物量可反映活細胞相關的代謝活性。"},{"title":"量吸光並扣背景","detail":"量測約四百五十奈米吸光值，設培養液空白、溶劑對照，並檢查藥物本身是否有顏色或還原干擾。"},{"title":"計算相對活性","detail":"處理組扣空白後的吸光值，除以溶劑對照扣空白後的吸光值，再乘百分之百。"},{"title":"用另一方法確認","detail":"下降可能來自細胞減少、增殖變慢或每個細胞代謝變弱；用細胞計數、增殖或凋亡測定區分。"}],"limit":"吸光值下降本身不能證明細胞凋亡，也不能單獨證明藥物協同作用。","check":"為什麼同樣細胞數仍可能出現不同吸光值？","source":{"label":"原廠細胞活性試劑說明","url":"https://www.dojindo.com/manual/CK04/"}},{"id":"calcium-probe","title":"胞內鈣離子：探針如何變亮","keys":["Fluo-4","胞內鈣","intracellular Ca"],"scope":"project experiment","steps":[{"title":"探針進入細胞","detail":"可穿膜形式進入細胞後，酯酶切除保護基，使具有鈣離子反應性的探針留在細胞內。"},{"title":"鈣離子結合探針","detail":"游離鈣離子與探針結合後，螢光增強。它是單波長探針，亮度也受負載量與細胞狀態影響。"},{"title":"固定量測條件","detail":"各組維持相同負載、溫度、等待時間與儀器設定，並排除死細胞與染色背景。"},{"title":"判讀胞內鈣訊號","detail":"可比較胞內游離鈣相關訊號；未做定位或校正時，不能直接報粒線體鈣濃度或絕對濃度。"}],"limit":"不能只憑全細胞螢光把鈣離子的來源定位到粒線體。","check":"如何區分鈣訊號增加與探針負載量增加？","source":{"label":"原廠鈣離子探針說明","url":"https://www.thermofisher.com/us/en/home/industrial/pharma-biopharma/drug-discovery-development/target-and-lead-identification-and-validation/g-protein-coupled/cell-based-second-messenger-assays/fluo-4-am-fluo-4-nw-calcium-indicators.html"}},{"id":"mito-probe","title":"粒線體染劑：亮度不等於單一功能","keys":["MitoSOX","MitoTracker","NAO","TMRE","TMRM","JC-1","粒線體數量","mitochondrial mass"],"scope":"project experiment cellbio","steps":[{"title":"先分清探針用途","detail":"超氧陰離子探針追蹤氧化相關訊號；深紅追蹤染劑常用於標記粒線體；壬基吖啶橙與心磷脂相關。三者不能互相代替。"},{"title":"分辨訊號的來源","detail":"探針進入與累積、膜電位、粒線體含量及細胞狀態，都可能影響亮度；讀值是多個因素的總結果。"},{"title":"檢查染色與圈選","detail":"保持染色條件一致，使用未染色與適當陽性對照，排除碎屑、雙聯體及死細胞。"},{"title":"用獨立指標拆解","detail":"若要談膜電位，搭配膜電位染劑與去極化對照；若要談總量，搭配粒線體蛋白、核酸拷貝數或影像定量。"}],"limit":"深紅訊號變強不能直接等同膜電位上升；超氧探針的總紅光也不是所有活性氧的絕對濃度。","check":"如果染劑變亮，但粒線體蛋白量不變，還有哪些可能？","source":{"label":"原廠粒線體探針手冊","url":"https://assets.thermofisher.com/TFS-Assets/LSG/manuals/mp07510.pdf"}},{"id":"causality","title":"把研究相關性推進到因果證據","keys":["因果","causality","rescue","NAC","MitoTEMPO","through","mechanistic","證據","證明"],"scope":"project experiment","steps":[{"title":"描述已觀察結果","detail":"把實際量到的活性、鈣離子、氧化訊號與藥物反應分開描述；先確認重複性及測量限制。"},{"title":"確認先後順序","detail":"以時間序列檢查候選機制是否先於下游變化，避免把大量細胞死亡後的現象當成起因。"},{"title":"介入候選機制","detail":"用抑制、清除或基因操作降低候選因子；先確認介入有作用，而且不是介入本身造成毒性。"},{"title":"觀察下游能否回復","detail":"若候選因子被降低後，藥物敏感性或存活指標也部分回復，才增加其中介角色的支持。"},{"title":"排除替代解釋","detail":"使用不同原理的第二種介入並設單獨用藥、溶劑及介入對照；結果不一致時重新檢查假說。"}],"limit":"這張圖是因果驗證的實驗流程，不表示匹莫齊特在你的細胞中已被證明透過此機制作用。","check":"氧化訊號下降卻沒有恢復存活，能推翻所有氧化壓力作用嗎？","source":null},{"id":"synergy","title":"合併用藥：如何判斷相加或協同","keys":["synergy","synerg","Bliss","Loewe","合併","combination"],"scope":"project experiment","steps":[{"title":"量兩藥單獨反應","detail":"在相同細胞與時間條件下，取得各藥的濃度反應曲線與不確定性。"},{"title":"建立合併劑量矩陣","detail":"讓兩種藥都包含多個濃度，並保留單藥、未處理及溶劑對照，避免只看一個組合。"},{"title":"設定相加參考模型","detail":"依問題選擇布利斯獨立作用或洛威相加等模型；模型定義不同，不能任選最有利的結果。"},{"title":"比較觀察與預期","detail":"比較實際合併效應與模型預期效應，呈現重複實驗及信賴區間，再判斷是否支持協同。"}],"limit":"合併組比任一單藥更低，只能先說抑制較強，不能直接稱為協同或機制證據。","check":"為什麼合併組效果最強，仍可能只是相加？","source":null},{"id":"flow","title":"流式分析：從事件到可信的細胞族群","keys":["flow cytometry","gating","FSC","SSC","FMO","compensation","流式","doublet"],"scope":"cellbio experiment project","steps":[{"title":"先看細胞與碎屑","detail":"以前向及側向散射觀察大小與內部複雜度的相關分布，設定合理細胞範圍。散射不是精確細胞大小量尺。"},{"title":"排除雙聯體與死細胞","detail":"利用脈衝面積、高度或寬度分開單細胞；用合適活死染劑排除膜受損細胞。"},{"title":"處理背景與光譜溢漏","detail":"未染色組看自體螢光；單色組估計螢光補償；缺一色組協助多色面板的陽性邊界。"},{"title":"固定規則比較組別","detail":"事先設定並一致套用圈選邏輯，報告百分比或螢光統計量，同時檢查分布形狀與細胞數。"}],"limit":"補償修正光譜溢漏，不能消除所有染色展寬；同型對照也不能取代缺一色對照。","check":"右移是每個細胞都變亮，還是出現新的高訊號族群？","source":null},{"id":"apoptosis","title":"內源性凋亡：由粒線體啟動的連鎖反應","keys":["apoptosis","apoptosome","BAX","BAK","caspase","細胞凋亡"],"scope":"cellbio biochem project experiment","steps":[{"title":"細胞感受損傷壓力","detail":"核酸損傷或其他壓力會改變促凋亡與抗凋亡蛋白間的平衡；不是所有壓力都必然造成凋亡。"},{"title":"粒線體外膜通透化","detail":"促凋亡孔洞形成蛋白寡聚化，使細胞色素丙等蛋白從粒線體膜間腔釋放到細胞質。"},{"title":"組裝凋亡小體","detail":"細胞色素丙結合凋亡蛋白酶活化因子，在核苷酸參與下形成凋亡小體並活化第九型半胱天冬酶。"},{"title":"啟動執行者酵素","detail":"第九型半胱天冬酶活化第三與第七型執行者，切割蛋白與調節核酸分解，產生典型凋亡變化。"},{"title":"用多個層級確認","detail":"結合膜聯蛋白染色、膜完整性、半胱天冬酶活性或裂解蛋白及形態，避免只依單一讀值。"}],"limit":"外源性死亡受體途徑通常由第八型半胱天冬酶起始，之後可與粒線體途徑交互作用。","check":"第八與第九型半胱天冬酶分別在哪條路徑啟動？","source":null},{"id":"autophagy","title":"自噬：形成囊泡到完成回收","keys":["autophagy","autophag","mitophagy","LC3","p62","自噬"],"scope":"cellbio biochem project","steps":[{"title":"隔離待回收物","detail":"隔離膜包覆受損蛋白或胞器，逐漸延伸；粒線體自噬是選擇性處理粒線體的一種情形。"},{"title":"形成雙膜自噬體","detail":"膜封閉後形成自噬體，將貨物與細胞質隔離。自噬標誌累積只代表某一時點的量。"},{"title":"與溶體融合","detail":"自噬體與含酸性水解酶的溶體融合，形成自噬溶體，進行分解。"},{"title":"分解並回收成分","detail":"小分子產物再供細胞利用。比較有無溶體阻斷的條件，才能更接近判斷通量是否真的增加。"}],"limit":"自噬體變多可能是形成加快，也可能是降解堵塞；自噬不一定代表細胞死亡。","check":"如何區分自噬變活躍和回收出口被堵住？","source":null},{"id":"pcr","title":"核酸擴增：三個溫度步驟如何重複","keys":["PCR","primer","polymerase chain"],"scope":"molbio experiment methods","steps":[{"title":"準備模板與引子","detail":"模板提供待複製序列，成對引子界定片段；聚合酶需要引子的三端羥基才能延長。"},{"title":"高溫分開雙股","detail":"變性步驟讓雙股核酸分開，成為可被複製的單股模板。"},{"title":"降溫讓引子黏合","detail":"合適的黏合溫度有助引子與目標序列結合；過低容易出現非特異擴增。"},{"title":"聚合酶延長新股","detail":"聚合酶沿模板將新股由五端往三端延伸，接著重複循環以增加目標片段。"},{"title":"確認產物可信","detail":"檢查無模板陰性對照與陽性對照；一般反應看終點產物，定量反應則在循環中追蹤螢光。"}],"limit":"理想早期每循環近似加倍，實際效率會受樣品品質、抑制物與引子設計影響。","check":"沒有產物時，如何用陽性對照分辨試劑故障與模板問題？","source":null},{"id":"qpcr","title":"相對基因表現：從循環數到倍數","keys":["qPCR","ΔΔCt","Ct/Cq","normalization","housekeeping"],"scope":"molbio experiment","steps":[{"title":"先確認量測對象","detail":"要量信使核糖核酸時，先反轉錄成互補核酸再擴增；較早超過螢光閾值通常表示起始模板較多。"},{"title":"扣除穩定內參","detail":"每個樣品以目標基因循環數減內參循環數，減少樣品量及部分技術差異。內參需先確認不受處理影響。"},{"title":"再與對照組比較","detail":"處理組的差值再減對照組差值，得到雙重差值；同樣門檻與分析規則才能比較。"},{"title":"換成相對倍數","detail":"目標與內參效率相近且接近每循環加倍時，以二的負雙重差值次方估算倍數；否則採效率校正。"},{"title":"檢查專一性與重複","detail":"確認熔解曲線或產物專一性，設無模板與無反轉錄對照，報告獨立生物重複。"}],"limit":"轉錄量改變不等於蛋白量或功能一定同方向改變；蛋白合成與降解也需考慮。","check":"內參被藥物改變時，正規化結果為什麼可能反而錯？","source":{"label":"定量核酸擴增應用指南","url":"https://www.bio-rad.com/sites/default/files/webroot/web/pdf/lsr/literature/Bulletin_5279.pdf"}},{"id":"wb","title":"西方墨點法：由蛋白到條帶定量","keys":["Western blot","WB","loading control","actin","西方墨點"],"scope":"experiment molbio project methods","steps":[{"title":"裂解並定量蛋白","detail":"選擇適合的裂解與抑制條件，量總蛋白後盡量等量上樣，減少組間起始差異。"},{"title":"電泳分離再轉膜","detail":"蛋白依電泳條件分開後轉移到膜上；確認轉膜是否均一、是否有明顯遺失。"},{"title":"封閉與抗體辨認","detail":"封閉降低非特異吸附，一級抗體辨認目標，搭配標記抗體系統產生可偵測訊號。"},{"title":"在線性範圍定量","detail":"扣背景、避免曝光飽和，以經驗證穩定的內參或總蛋白正規化，再比較獨立實驗。"}],"limit":"管家蛋白可能受處理影響；條帶變弱也可能來自上樣或轉膜問題。磷酸化應先相對總目標蛋白判讀。","check":"為什麼內參本身變動會使結論不可靠？","source":null},{"id":"gene-expression","title":"基因表現：核酸如何變成功能蛋白","keys":["transcription","translation","mRNA","splicing","轉錄","轉譯","promoter","enhancer"],"scope":"molbio","steps":[{"title":"調控轉錄起始","detail":"轉錄因子、啟動子與增強子共同影響聚合酶招募；染色質可接近性也會影響表現。"},{"title":"核內轉錄與加工","detail":"真核細胞先生成前信使核糖核酸，經加帽、剪接及尾端加工，形成成熟轉錄產物。"},{"title":"輸出並進行轉譯","detail":"成熟訊息輸出至細胞質，由核糖體依密碼子合成胺基酸鏈；分泌與膜蛋白常在粗糙內質網相關核糖體製造。"},{"title":"摺疊修飾與降解","detail":"蛋白還需摺疊、定位及修飾，並受到降解速率控制，最後才決定蛋白量與功能。"}],"limit":"信使核酸與蛋白不同步並不矛盾，可能涉及轉譯效率、半衰期、時間差或測量因素。","check":"信使核酸不變、蛋白下降，可以怎樣分辨合成變慢與降解加快？","source":null},{"id":"crispr","title":"基因操作：改變目標後如何驗證","keys":["CRISPR","knockdown","knockout","siRNA","miRNA","基因剔除","基因敲低"],"scope":"molbio experiment","steps":[{"title":"選擇操作層級","detail":"基因敲低通常降低轉錄產物或蛋白量；基因剔除則改變基因組以破壞功能，兩者不等同。"},{"title":"設計定位工具","detail":"基因編輯利用引導核酸把核酸酶帶到特定位點；小干擾核酸則利用沉默複合體降低目標轉錄產物。"},{"title":"確認真的改變目標","detail":"編輯後須定序與蛋白驗證；敲低也要量實際下降程度，不能只看是否完成轉染。"},{"title":"連結到功能結果","detail":"用非靶向對照、不同序列及回補實驗，排除脫靶或操作毒性，再解釋觀察到的表型。"}],"limit":"切出核酸斷裂不保證得到功能剔除；修復可能保留閱讀框，且單一工具可能有脫靶。","check":"回補目標蛋白能幫助排除什麼替代解釋？","source":null},{"id":"oxphos","title":"氧化磷酸化：電子流如何帶動能量合成","keys":["oxidative phosphorylation","ETC","electron transport","proton gradient","NADH","FADH","uncoupler","oligomycin","電子傳遞","氧化磷酸化"],"scope":"biochem cellbio physiology project","steps":[{"title":"電子進入內膜呼吸鏈","detail":"還原型電子載體將電子交給第一或第二複合體，再經輔酶Ｑ及後續載體傳遞。第二複合體本身不泵出質子。"},{"title":"建立跨內膜質子差","detail":"第一、第三與第四複合體利用電子傳遞釋放的能量，將質子從基質送到膜間腔，形成電位及酸鹼差。"},{"title":"氧氣接收電子","detail":"氧在第四複合體接受電子並與質子形成水，讓電子流能持續。"},{"title":"質子回流驅動合成","detail":"質子經合成酶回到基質，促進二磷酸腺苷與無機磷酸形成三磷酸腺苷。"},{"title":"辨別抑制與解偶聯","detail":"解偶聯增加質子漏流，能量合成效率下降，耗氧常升高；抑制合成酶則增加反壓，使呼吸鏈通常變慢。"}],"limit":"上述耗氧方向仍取決於受質、氧氣、細胞完整性與毒性程度，不能視為所有條件都固定。","check":"為什麼有氧氣消耗，卻不一定有效產生三磷酸腺苷？","source":{"label":"氧化磷酸化開放教材","url":"https://openstax.org/books/biology-2e/pages/7-4-oxidative-phosphorylation"}},{"id":"glycolysis","title":"能量代謝：葡萄糖到三羧酸循環","keys":["glycolysis","TCA","pyruvate","PDH","Warburg","糖解","三羧酸"],"scope":"biochem","steps":[{"title":"細胞質進行糖解","detail":"一個葡萄糖形成兩個丙酮酸，淨得兩個三磷酸腺苷及兩個還原型菸醯胺腺嘌呤二核苷酸。"},{"title":"依條件處理丙酮酸","detail":"丙酮酸可變成乳酸再生氧化型輔酶，或進入粒線體經脫氫酶複合體變成乙醯輔酶甲。"},{"title":"基質進行循環氧化","detail":"乙醯基進入三羧酸循環，產生二氧化碳、還原型電子載體及少量核苷三磷酸；第二複合體位於內膜。"},{"title":"連接呼吸鏈與合成","detail":"還原型載體提供呼吸鏈電子，循環中間物也可供合成代謝，因此通量受能量需求與中間物補充調控。"}],"limit":"有氧糖解增加不代表粒線體完全沒有功能；循環本身不直接消耗氧，但依賴載體再氧化。","check":"缺氧時，把丙酮酸轉成乳酸如何幫助糖解持續？","source":null},{"id":"enzyme","title":"酵素抑制：先看結合，再看兩個參數","keys":["Km","Vmax","Michaelis","competitive","enzyme kinetics","酵素動力","抑制劑"],"scope":"biochem","steps":[{"title":"理解速率曲線","detail":"固定酵素量下增加受質，初速逐漸接近最大反應速率；達最大速率一半時的受質濃度是米氏常數。"},{"title":"競爭性抑制","detail":"抑制劑與受質競爭游離酵素；理想可逆模型下表觀米氏常數上升，足量受質時最大速率維持。"},{"title":"純非競爭性抑制","detail":"抑制劑對游離酵素和酵素受質複合體親和力相同；有效催化能力下降，最大速率下降、米氏常數不變。"},{"title":"反競爭與混合型","detail":"反競爭型只結合酵素受質複合體，兩參數同比下降；混合型使最大速率下降，米氏常數依結合偏好改變。"}],"limit":"米氏常數不在所有機制下都等於解離常數；純非競爭性只是混合型的一個特殊情形。","check":"為什麼增加受質可以克服理想競爭性抑制？","source":{"label":"酵素與抑制開放教材","url":"https://openstax.org/books/biology-2e/pages/6-5-enzymes"},"diagramKind":"comparison"},{"id":"action-potential","title":"神經動作電位：通道改變造成電壓變化","keys":["action potential","refractory","depolarization","repolarization","動作電位","不反應期"],"scope":"physiology","steps":[{"title":"達到閾值","detail":"去極化達到閾值後，電壓閘控鈉離子通道快速活化，使鈉離子順電化學梯度進入細胞。"},{"title":"鈉流入使去極化","detail":"更多鈉通道開啟形成短暫正回饋，膜電位快速往較正的方向移動。"},{"title":"鈉失活、鉀流出","detail":"鈉通道逐漸失活，延遲開啟的鉀通道讓鉀離子流出，膜電位回到較負值。"},{"title":"過極化與恢復","detail":"鉀通道較慢關閉造成後過極化；鈉通道由失活恢復，細胞重新具備放電能力。"},{"title":"理解不反應期","detail":"絕對不反應期主要因鈉通道失活；相對不反應期因仍有鉀電導等影響，需要更強刺激。"}],"limit":"此圖以典型神經元為例；心臟節律細胞與其他可興奮細胞使用的離子通道和時程不同。","check":"鈉鉀幫浦為什麼重要，卻不是每次快速再極化的主要直接原因？","source":{"label":"神經動作電位開放教材","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential"}},{"id":"resting","title":"靜止膜電位：濃度差與通透性一起決定","keys":["resting membrane","Nernst","Goldman","Na⁺/K⁺","靜止膜電位","equilibrium potential"],"scope":"physiology","steps":[{"title":"建立離子濃度差","detail":"鈉鉀幫浦每消耗一個三磷酸腺苷，送出三個鈉離子、帶入兩個鉀離子，長期維持濃度差。"},{"title":"離子經通道移動","detail":"靜止時常有較高的鉀離子通透性，鉀順濃度差外流，留下相對負的細胞內電位。"},{"title":"電力抵消擴散趨勢","detail":"單一離子達到化學與電力驅動互相平衡時，其淨通量為零，對應能斯特平衡電位。"},{"title":"合併不同離子貢獻","detail":"真實細胞同時有多種可通透離子，膜電位依濃度與相對通透性加權；高德曼方程可用來估計。"}],"limit":"靜止狀態通常是動態穩態，不代表所有離子各自都在平衡，也不是細胞內完全沒有離子流。","check":"細胞外鉀濃度上升，為什麼通常使膜電位較不負？","source":null},{"id":"raas","title":"血壓與保水：腎素系統的完整分支","keys":["RAAS","renin","angiotensin","aldosterone","腎素","醛固酮"],"scope":"physiology","steps":[{"title":"腎臟收到低灌流訊號","detail":"腎灌流下降、緻密斑鹽輸送下降或交感刺激，可促使腎小球旁細胞釋放腎素。"},{"title":"形成血管張力素二","detail":"腎素切割肝臟產生的血管張力素原，再由轉換酶把第一型轉成第二型血管張力素。"},{"title":"一支使血管收縮","detail":"血管張力素二使血管收縮，提高周邊阻力；也影響口渴、抗利尿激素與腎小管運輸。"},{"title":"另一支促進保鈉","detail":"血管張力素二促使腎上腺皮質釋放醛固酮，增加遠端腎元鈉再吸收與鉀分泌。"},{"title":"體液回補並負回饋","detail":"鈉與水的保留有助有效循環量恢復；灌流改善後，原本促進腎素的刺激減少。"}],"limit":"醛固酮主要調節鈉與鉀；抗利尿激素則直接改變集尿管水通透性，兩者不可混為同一作用。","check":"這套系統如何同時改變血管阻力與循環血容量？","source":{"label":"血管恆定調節開放教材","url":"https://openstax.org/books/anatomy-and-physiology-2e/pages/20-4-homeostatic-regulation-of-the-vascular-system"},"diagramRows":[[0],[1],[2,3],[4]],"diagramEdges":[[0,1],[1,2],[1,3],[2,4],[3,4]]},{"id":"adh","title":"抗利尿激素：集尿管為什麼更保水","keys":["ADH","aquaporin","抗利尿"],"scope":"physiology","steps":[{"title":"偵測滲透壓或血容量","detail":"血漿有效滲透壓上升或有效循環量明顯下降，可刺激下視丘相關神經分泌細胞。"},{"title":"後葉釋放激素","detail":"抗利尿激素在下視丘合成、由腦下垂體後葉釋放到血液，再作用到腎臟。"},{"title":"增加水通道插入","detail":"集尿管主細胞受體訊號促使第二型水通道插入頂端膜，提高水通透性。"},{"title":"水沿梯度回到體內","detail":"在腎髓質滲透梯度存在下，水離開管腔，使尿量下降、尿液通常更濃。"}],"limit":"只有水通道增加仍不夠，濃縮尿液還需要腎髓質滲透梯度與正常腎功能。","check":"抗利尿激素不足時，預期尿量和尿液濃度怎麼變？","source":null},{"id":"baroreflex","title":"壓力受器反射：血壓突然下降的補償","keys":["baroreceptor","壓力受器","血壓突然"],"scope":"physiology","steps":[{"title":"動脈壁伸展減少","detail":"血壓突然下降時，頸動脈竇與主動脈弓的壓力受器受到較少伸展。"},{"title":"傳入放電減少","detail":"感覺訊息傳到延腦循環調節中心，改變交感與副交感輸出。"},{"title":"交感增、副交感減","detail":"心率與心肌收縮力上升；小動脈及靜脈收縮，分別增加阻力與靜脈回流。"},{"title":"血壓朝原值恢復","detail":"心輸出量與總周邊阻力增加，有助抵消原本的血壓下降，形成負回饋。"}],"limit":"這是快速調節；長期血壓控制還涉及腎臟與體液，受器也會適應。","check":"為什麼由躺姿突然站起時，心跳可能暫時加快？","source":null},{"id":"muscle","title":"骨骼肌收縮：從電訊號到橫橋循環","keys":["skeletal muscle","cross-bridge","troponin","肌肉收縮","橫橋"],"scope":"physiology","steps":[{"title":"神經訊號到肌纖維","detail":"運動神經釋放乙醯膽鹼，使肌膜去極化，動作電位沿肌膜與橫小管傳遞。"},{"title":"肌漿網釋放鈣離子","detail":"電壓感受機制連結肌漿網鈣通道，讓鈣離子進入細胞質。"},{"title":"暴露肌動蛋白位點","detail":"鈣結合肌鈣蛋白，改變原肌球蛋白位置，使肌球蛋白可以結合肌動蛋白。"},{"title":"反覆結合拉動與脫離","detail":"肌球蛋白釋放磷酸後進行力衝程，結合新的三磷酸腺苷後脫離，再水解以準備下一輪。"},{"title":"回收鈣而舒張","detail":"鈣幫浦把鈣送回肌漿網，結合位點重新被遮住，肌肉進入舒張。"}],"limit":"平滑肌主要由鈣調蛋白與肌球蛋白輕鏈激酶調控，不能直接套用骨骼肌的肌鈣蛋白流程。","check":"沒有新的三磷酸腺苷時，為什麼橫橋不容易脫離？","source":null},{"id":"statistics","title":"實驗證據：先確定重複單位，再談顯著","keys":["replicate","SD","SEM","ANOVA","p value","p-value","統計","重複","error bar"],"scope":"experiment project","steps":[{"title":"界定獨立實驗單位","detail":"不同獨立培養或個體才可能構成生物重複；同一樣品分孔量測通常是技術重複。"},{"title":"先看差異與散布","detail":"標準差描述觀察值散布；平均值的標準誤描述平均估計的不確定性，不能把它當作個體差異。"},{"title":"依設計選擇模型","detail":"單一因素多組可考慮單因子變異數分析；兩因素可檢驗各自主效應與交互作用，並檢查模型假設。"},{"title":"回報效應及不確定性","detail":"同時提供效應量、信賴區間與適當多重比較校正；顯著性只是判斷的一部分。"}],"limit":"顯著性機率不是虛無假設為真的機率，也不是效果大小；同一批多個孔不能冒充多次獨立實驗。","check":"很小的差異為什麼可能顯著，卻沒有太大生物意義？","source":null},{"id":"reactors","title":"理想反應器：混合方式決定速率分布","keys":["CSTR","PFR","batch reactor","反應器","mole balance"],"scope":"reaction","steps":[{"title":"先寫物料衡算","detail":"累積等於流入減流出加生成；反應物的生成項為負，先固定速率與轉化率的符號定義。"},{"title":"攪拌槽使用出口速率","detail":"理想連續攪拌槽完全混合，槽內與出口濃度相同；穩態時，以全槽相同的出口條件速率計算體積。"},{"title":"塞流管逐小段積分","detail":"理想塞流沿流向有濃度變化，每一小段依當地速率反應，將微小體積沿轉化率積分。"},{"title":"在相同假設下比較","detail":"等溫、定密度、一階不可逆反應中，塞流前段濃度較高，平均消耗速率較快，達相同轉化率常需較小體積。"}],"limit":"不能把這個體積排序套用到所有速率式、放熱效應或多重反應。批次槽沒有持續進出料，通常比較反應時間。","check":"為什麼攪拌槽一開始就以較低的出口濃度反應？","source":{"label":"密西根大學反應器設計教材","url":"https://websites.umich.edu/~elements/7e/02chap/summary.html"}},{"id":"kinetics","title":"反應速率：級數、溫度與機制","keys":["Arrhenius","reaction order","rate constant","一階","二階","反應級數","活化能","half-life"],"scope":"reaction calc","steps":[{"title":"先由資料建立速率式","detail":"反應級數描述速率對各濃度的依賴，通常要由實驗判定；只有符合基元反應假設時才可直接由分子性推得。"},{"title":"依速率式確認單位","detail":"速率常數單位須使整體速率維持濃度除以時間；一階為時間的倒數，二階則多一個濃度的倒數。"},{"title":"溫度影響跨越障壁","detail":"阿瑞尼士關係將速率常數連到溫度與活化能；在適用範圍內升溫通常提高速率常數。"},{"title":"積分後連到可測量量","detail":"恆體積一階不可逆反應的濃度呈指數下降，半衰期等於二的自然對數除以速率常數，與起始濃度無關。"}],"limit":"催化劑改變可行反應途徑與速率，不改變同一溫度下由熱力學決定的平衡常數。","check":"為什麼反應級數不能直接照總反應式係數抄寫？","source":null},{"id":"catalyst","title":"多孔催化劑：傳進去、反應、再傳出來","keys":["Thiele","effectiveness","diffusion limitation","催化劑","catalyst","mass-transfer limitation"],"scope":"reaction","steps":[{"title":"反應物穿過外部薄膜","detail":"主流體中的反應物先傳到顆粒表面；攪拌或流速不足時，外部質傳可能成為限制。"},{"title":"沿孔隙擴散到活性位","detail":"反應物進入顆粒內部孔道；顆粒大或反應快時，深處濃度可能較低。"},{"title":"表面反應生成產物","detail":"在活性位吸附、反應與脫附；有效因子比較實際整體速率與全顆粒都處於表面條件時的速率。"},{"title":"產物向外傳出","detail":"產物經孔隙與外部薄膜返回主流體；改變粒徑、流速與溫度可協助區分限制來源。"}],"limit":"蒂勒模數大常表示內擴散更重要；縮小顆粒可能改善利用率，但填充床壓降通常增加。","check":"降低粒徑後觀察速率增加，可能提示什麼限制？","source":null},{"id":"thermo","title":"熱力學判斷：守恆、方向與平衡","keys":["Gibbs","entropy","enthalpy","internal energy","自發","熵","state function","equilibrium","chemical potential"],"scope":"thermo","steps":[{"title":"先界定系統與限制","detail":"說清楚封閉或開放、定溫或定壓，以及能量和物質能否交換；判準依限制改變。"},{"title":"第一定律做能量帳","detail":"內能變化由熱與功及必要時進出料能量決定。熱與功是傳遞方式，內能與焓才是狀態函數。"},{"title":"第二定律判方向","detail":"把系統連同環境考慮，實際自發程序使總熵不減；只有理想可逆極限的總熵生成為零。"},{"title":"定溫定壓看自由能","detail":"在通常只有體積功的條件下，自發方向使吉布斯自由能下降；平衡時對允許變化達最低。相平衡要求同成分化學勢相等。"}],"limit":"熱力學可行不表示反應很快；穩態也不等於平衡，穩態仍可能持續有流動與熵生成。","check":"為什麼自發的反應仍可能在室溫下幾乎看不見？","source":null},{"id":"phase","title":"非理想相平衡：由成分到兩相分配","keys":["fugacity","activity coefficient","Raoult","Henry","bubble point","dew point","azeotrope","相平衡","逸度","活度"],"scope":"thermo unitops","steps":[{"title":"平衡要求化學勢相等","detail":"同一成分在共存相間沒有淨轉移的趨勢，熱力學上以各相化學勢相等表達。"},{"title":"用逸度或活度修正","detail":"真實氣體用逸度修正壓力；液體常用活度係數描述偏離理想混合的程度。"},{"title":"連到泡點與露點","detail":"泡點是液體剛出現第一小泡氣體；露點是氣體剛出現第一小滴液體。兩者對應不同的已知組成。"},{"title":"判斷能否繼續分離","detail":"蒸餾靠氣液組成差；共沸時兩相組成相同，固定壓力下的普通蒸餾會遇到分離限制。"}],"limit":"活度係數大於一的意義需對應所選標準態；拉午耳定律與亨利定律的適用濃度區間不同。","check":"共沸點為什麼會限制普通蒸餾？","source":null},{"id":"heat","title":"熱傳：驅動溫差如何通過串聯熱阻","keys":["heat transfer","Fourier","heat exchanger","Biot","LMTD","heat-transfer","熱傳","熱交換"],"scope":"transport unitops","steps":[{"title":"找出熱流路徑","detail":"先標出熱流體、壁面、冷流體與熱流方向；熱量通常從高溫向低溫傳遞。"},{"title":"各段各有阻力","detail":"流體側通常用對流熱傳係數，固體壁用熱導係數與厚度；積垢還會增加額外熱阻。"},{"title":"穩態串聯熱流相同","detail":"在無側漏或內部生熱等假設下，各段穩態熱流相同，總溫差分配到不同熱阻上。"},{"title":"以總係數估算熱負荷","detail":"熱交換器可用總傳熱係數、面積及適當平均溫差連結熱負荷；同時滿足兩側能量衡算。"}],"limit":"畢歐數比較物體內部傳導與表面對流熱阻，小於約零點一時才常可採集總近似，仍需檢查幾何及條件。","check":"積垢增加後，即使入口溫度不變，熱負荷為什麼可能下降？","source":null},{"id":"mass-transfer","title":"質傳：分子擴散與邊界層","keys":["Fick","diffusion","mass transfer","mass-transfer coefficient","boundary layer","擴散","質傳"],"scope":"transport","steps":[{"title":"先看濃度與化學勢差","detail":"簡單稀溶液的擴散常以濃度梯度描述，熱力學上更一般的驅動來自化學勢梯度。"},{"title":"分子運動造成淨通量","detail":"在菲克模型中，擴散通量與濃度梯度成反向，比例係數是擴散係數。"},{"title":"流動改變邊界層","detail":"對流把物質帶到界面附近，但靠近界面仍有傳遞阻力；混合常能減薄有效邊界層。"},{"title":"用質傳係數整理結果","detail":"質傳係數把通量連到主體與界面濃度差，它包含幾何與流動影響，不能當作材料本身的擴散係數。"}],"limit":"負號表示向較低濃度的方向傳遞，並非通量大小必須是負值；座標定義仍須明確。","check":"同一物質在同一溫度，為什麼攪拌後質傳係數可改變？","source":null},{"id":"fluid","title":"管流與泵浦：壓力如何克服流動阻力","keys":["Reynolds","Bernoulli","Poiseuille","Darcy","NPSH","cavitation","pipe flow","pump","雷諾","管流"],"scope":"transport","steps":[{"title":"先檢查流動假設","detail":"界定密度是否近似固定、穩態與否、管徑和粗糙度；雷諾數比較慣性與黏性影響。"},{"title":"寫機械能衡算","detail":"壓力、速度與高度能量可以互換；實際流動再加入摩擦損失及泵浦提供的揚程。"},{"title":"依流況估算壓降","detail":"充分發展的牛頓流體圓管層流有拋物線速度分布；紊流需考慮不同摩擦關係及粗糙度。"},{"title":"檢查操作點與空蝕","detail":"泵浦曲線與系統曲線交點決定流量；入口壓力太低使液體汽化，氣泡後續崩潰可能損傷泵浦。"}],"limit":"伯努力的無損形式不能直接忽略實際摩擦；空蝕要比較可用與所需淨正吸入揚程並保留裕度。","check":"為什麼同樣流量下，縮小管徑通常會大幅增加壓降？","source":null},{"id":"distillation","title":"蒸餾塔：反覆汽化冷凝如何分離","keys":["distillation","reflux","McCabe","蒸餾","reboiler","condenser"],"scope":"unitops","steps":[{"title":"利用氣液組成差","detail":"同一平衡級中，蒸氣通常較富含易揮發成分，液體相對較富含難揮發成分。"},{"title":"再沸器提供上升蒸氣","detail":"塔底加熱產生蒸氣往上，與向下液體逐級接觸，交換物質與熱。"},{"title":"冷凝器與回流補液","detail":"塔頂蒸氣冷凝後一部分作餾出液，一部分回流入塔，提供再接觸分離的液體。"},{"title":"權衡級數與能耗","detail":"在既定分離要求和合理範圍下，增加回流通常可減少所需理論級數，但再沸與冷凝負荷增加。"}],"limit":"最小回流比是無限理論級數的理想極限；實際塔還受液泛、壓降與共沸限制。","check":"回流越大為什麼不一定越經濟？","source":null},{"id":"membrane","title":"膜分離：驅動力、選擇性與濃差極化","keys":["reverse osmosis","membrane separation","ultrafiltration","濃差極化","concentration polarization","逆滲透","膜分離"],"scope":"unitops transport","steps":[{"title":"選擇膜與驅動方式","detail":"不同膜利用壓力、濃度、電位或其他差異分離；多孔膜可依尺寸篩分，緻密膜需考慮溶解與擴散。"},{"title":"逆滲透克服滲透壓","detail":"在濃溶液側施加足夠壓力，使淨水通量朝稀側，方向與自然滲透相反。"},{"title":"膜面溶質累積","detail":"被截留溶質在膜面附近濃縮，降低有效驅動力並可能增加結垢風險。"},{"title":"調整操作維持通量","detail":"提高合理的錯流混合、改善前處理或清洗，有助減少濃差極化及積垢，仍需兼顧能耗與膜壽命。"}],"limit":"提高操作壓力未必使通量一直線性增加；膜面濃度與積垢都會改變有效條件。","check":"為什麼膜面濃度可能比主流體濃度高？","source":null},{"id":"pid","title":"回授控制：量到誤差後如何調整","keys":["PID","feedback","closed-loop","open-loop","integral","derivative","控制","windup"],"scope":"control","steps":[{"title":"比較目標與量測","detail":"設定值減去量測值形成誤差，控制器依誤差調整加熱、閥位等操控量。"},{"title":"比例作用處理現在","detail":"比例項依目前誤差立即回應；增益加大常使反應更快，但可能增加振盪與不穩定風險。"},{"title":"積分作用處理累積","detail":"積分項累計過去誤差，若系統能穩定且致動器有能力，可消除固定擾動下的穩態偏差。"},{"title":"微分作用看變化趨勢","detail":"微分項依變化速度提供阻尼，但容易放大量測雜訊，實作常對量測值微分並加濾波。"},{"title":"檢查延遲與飽和","detail":"大延遲讓回應來得晚；致動器飽和時積分可能持續累加，因此需要抗積分飽和與合理調校。"}],"limit":"閉迴路不保證比開迴路穩定，控制器方向、增益、延遲與程序特性都必須一起考量。","check":"加熱器已到最大功率時，積分繼續增加會出現什麼問題？","source":null},{"id":"laplace","title":"拉普拉斯轉換：微分方程如何變成代數","keys":["Laplace","transfer function","拉普拉斯","轉移函數"],"scope":"engmath control","steps":[{"title":"從時間域模型出發","detail":"先寫描述系統動態的微分方程，並列出輸入、輸出與初始條件。"},{"title":"轉換每個微分項","detail":"轉換後導數變成變換變數乘原函數，再扣除初始值項，使求解成為代數運算。"},{"title":"求解轉換後輸出","detail":"整理輸入與輸出的關係；線性時不變系統在零初始條件下，輸出除以輸入可定義轉移函數。"},{"title":"反轉換並解釋時間行為","detail":"把結果反轉回時間域，觀察暫態、穩態與時間常數；極點位置幫助分析穩定性。"}],"limit":"非零初始條件的響應要另外納入；傳遞函數的定義不能把初始條件項直接忽略後誤用。","check":"為什麼求轉移函數時要特別寫明零初始條件？","source":null},{"id":"math","title":"工程數學：由模型到可檢查的解","keys":["ODE","PDE","boundary condition","initial condition","eigenvalue","Taylor","Jacobian","線性化","數值積分"],"scope":"engmath math","steps":[{"title":"辨別變數與方程型式","detail":"未知量只對一個自變數求導是常微分方程；對時間與空間等多個自變數求偏導是偏微分方程。"},{"title":"提供足夠初始與邊界條件","detail":"初始條件描述起始狀態；邊界條件描述空間邊緣的值、通量或混合限制。"},{"title":"選擇解析或近似方法","detail":"可用變數分離、轉換或數值法；在操作點附近用泰勒展開保留一階，可建立局部線性模型。"},{"title":"核對適用性與誤差","detail":"檢查單位、條件及極限；數值法須確認步長收斂，線性化只在偏離操作點不太大的範圍可靠。"}],"limit":"連續線性系統的特徵值實部皆負才具有漸近穩定性；離散系統則看特徵值是否在單位圓內。","check":"為什麼方程相同，初始或邊界條件不同仍會有不同解？","source":null},{"id":"spectra","title":"儀器判讀：先知道訊號來自什麼","keys":["UV-Vis","Beer","FTIR","fluorescence","absorbance","螢光","吸光"],"scope":"instrument","steps":[{"title":"辨認光與物質作用","detail":"吸收光譜量入射光被吸收多少；螢光量激發後放出的光。紅外光譜主要反映分子振動。"},{"title":"建立訊號與濃度關係","detail":"理想稀溶液吸光值等於吸光係數乘光徑及濃度；螢光也需在經驗證範圍建立校正曲線。"},{"title":"先扣背景再判讀","detail":"設適當溶劑空白與標準品，確認波長、光徑及儀器條件一致。"},{"title":"排除非線性來源","detail":"高濃度、散射、化學平衡變化、雜散光或螢光淬熄都可能使訊號偏離簡單線性。"}],"limit":"紅外特徵峰可支持官能基判斷，但單一峰位移不一定能證明形成新化學鍵。","check":"為什麼高濃度樣品應先稀釋再重新驗證線性？","source":null},{"id":"chromatography","title":"層析：不同停留程度形成分離","keys":["HPLC","GC","chromatograph","retention time","層析"],"scope":"instrument methods","steps":[{"title":"樣品進入移動相","detail":"氣相層析以氣體帶動樣品，液相層析以液體流動；樣品的揮發性與熱穩定性影響方法選擇。"},{"title":"與固定相反覆作用","detail":"成分在兩相間分配或吸附的程度不同，因此沿管柱前進速度不同。"},{"title":"各成分形成不同峰","detail":"滯留時間反映在該操作條件下的停留行為，解析度則同時受峰距與峰寬影響。"},{"title":"用標準品與方法確認","detail":"搭配標準品、適當偵測器與校正曲線做定性定量；改變流速、溶劑與管柱都可能改變結果。"}],"limit":"滯留時間相同不保證是同一物質；反相液相層析通常固定相較疏水，仍需看具體管柱。","check":"兩峰的滯留時間不同，為什麼仍可能無法可靠定量？","source":null},{"id":"xrd","title":"繞射峰：位置與寬度各在說什麼","keys":["XRD","Bragg","Scherrer","繞射"],"scope":"instrument materials","steps":[{"title":"晶格面使波產生干涉","detail":"Ｘ光被週期晶格散射，滿足布拉格條件時產生較強繞射。"},{"title":"峰位連到晶面間距","detail":"在已知波長下，繞射角與晶面間距相關，結合多個峰可協助辨認晶相。"},{"title":"峰寬包含多種貢獻","detail":"小晶粒、微應變、缺陷與儀器解析度都可能造成展寬。"},{"title":"先校正再估算尺寸","detail":"用合適標準校正儀器展寬，並確認形狀與應變等假設後，才用謝樂關係估計相干繞射晶粒尺寸。"}],"limit":"晶粒尺寸不一定等於顆粒尺寸；峰變寬也不能直接等同結晶度下降。","check":"如果兩樣品峰位相同但峰寬不同，你還需要知道哪些條件？","source":null},{"id":"dilution","title":"濃度計算：先守恆，再換單位","keys":["stock","總莫耳數","稀釋","dilution"],"scope":"calc project experiment","steps":[{"title":"分清濃度與總量","detail":"濃度是每單位體積的物質量；總莫耳數等於濃度乘體積。"},{"title":"統一濃度及體積單位","detail":"先把毫、微、奈、皮等前綴轉成同一基準，或清楚追蹤其乘積，避免差一千倍。"},{"title":"稀釋保持溶質莫耳數","detail":"原液濃度乘取用體積，等於終濃度乘最終體積；據此解出要取多少原液。"},{"title":"配到最終體積","detail":"稀釋液用量是最終體積扣掉加入的原液及其他溶液；若藥物以溶劑溶解，也要對齊終溶劑比例。"}],"limit":"最終體積包含原液本身，不能直接在完整最終體積的溶劑中再額外加入原液。","check":"十毫升最終體積加入零點一毫升原液，稀釋液應是多少？","source":null},{"id":"5fu","title":"五氟尿嘧啶：兩類核酸作用","keys":["5-FU 的主要","5-FU 抗癌","thymidylate","五氟尿嘧啶"],"scope":"project biochem","steps":[{"title":"細胞內代謝活化","detail":"五氟尿嘧啶進入細胞後形成不同活性代謝物，各自影響核苷酸合成或被加入核酸。"},{"title":"抑制胸苷酸合成","detail":"其中氟去氧尿苷單磷酸抑制胸苷酸合成酶，減少合成去氧核糖核酸所需的胸苷核苷酸供應。"},{"title":"干擾核酸的加工與功能","detail":"其他代謝物可摻入核糖核酸或去氧核糖核酸，干擾加工、功能與複製。"},{"title":"影響增殖與細胞存活","detail":"這些作用可造成複製壓力或生長受抑，但細胞反應取決於代謝、修復能力與處理條件。"}],"limit":"這是已知的一般藥物作用，不等於你的合併用藥實驗已證明哪一支機制主導。","check":"只量細胞活性，能區分核苷酸不足和核糖核酸損傷嗎？","source":{"label":"美國國家癌症研究所藥物詞典","url":"https://www.cancer.gov/publications/dictionaries/cancer-drug/def/fluorouracil"},"diagramRows":[[0],[1,2],[3]],"diagramEdges":[[0,1],[0,2],[1,3],[2,3]]},{"id":"gpcr","title":"受體訊號：第二信使如何放大反應","keys":["GPCR","cAMP","adenylyl","G protein"],"scope":"cellbio physiology","steps":[{"title":"配體結合膜受體","detail":"配體使受體構形改變，促進鳥嘌呤核苷酸結合蛋白交換其結合的核苷酸。"},{"title":"活化刺激型訊號蛋白","detail":"以刺激型途徑為例，活化次單元調節腺苷酸環化酶，使環磷酸腺苷產生增加。"},{"title":"第二信使活化下游酵素","detail":"環磷酸腺苷促進相應蛋白激酶活化，再改變標的蛋白的磷酸化與功能。"},{"title":"關閉與回復","detail":"核苷酸水解、磷酸二酯酶降解第二信使及磷酸酶作用，使訊號逐步結束。"}],"limit":"不同受體可連到抑制型或其他訊號蛋白，不能說所有此類受體都會增加環磷酸腺苷。","check":"為什麼同一類受體的下游效果可能相反？"},{"id":"cell-cycle","title":"細胞週期：檢查點如何延後分裂","keys":["cell cycle","p53","checkpoint","G1/S","細胞週期"],"scope":"cellbio project","steps":[{"title":"生長並檢查進入合成期","detail":"生長一期整合營養、生長訊號與損傷狀態，條件合適才進入核酸合成期。"},{"title":"完成複製再準備分裂","detail":"合成期複製去氧核糖核酸，生長二期確認複製狀態並準備有絲分裂。"},{"title":"損傷訊號啟動停滯","detail":"例如腫瘤抑制蛋白五十三促進抑制因子，降低細胞週期蛋白依賴性激酶活性，爭取修復時間。"},{"title":"依狀態修復或改變命運","detail":"修復成功可恢復週期；持續嚴重損傷可能導向老化或凋亡，並非只能有一種結局。"}],"limit":"核酸含量分析通常只能分出生長一期、合成期及生長二期／分裂期，不能直接區分後兩者。","check":"四倍核酸含量變多，為什麼不一定代表有絲分裂增加？"},{"id":"protein-turnover","title":"蛋白品質：辨認、標記與降解","keys":["ubiquitin","proteasom","protein folding","misfolded","ER stress","UPR","蛋白質降解"],"scope":"biochem cellbio","steps":[{"title":"辨認錯誤或待更新蛋白","detail":"分子伴護蛋白協助摺疊；嚴重錯誤或需調節含量的蛋白可被導向降解。"},{"title":"泛素系統加上標記","detail":"活化酶、接合酶與連接酶接力把泛素加到目標，連接酶協助選擇對象。"},{"title":"蛋白酶體處理部分蛋白","detail":"特定多泛素鏈可引導底物至蛋白酶體，經展開及切割成短胜肽。"},{"title":"大分子或胞器走溶體途徑","detail":"胞吞或自噬可把其他物質送去溶體。內質網壓力還會透過未摺疊蛋白反應調節合成、摺疊與降解。"}],"limit":"泛素化不一定代表降解；不同鏈型或位置也可能參與定位、訊號與修復。","check":"為什麼蛋白量下降不能直接判定轉錄下降？"},{"id":"kidney","title":"腎臟處理物質：過濾、再吸收與分泌","keys":["GFR","clearance","glomerular","proximal tubule","loop of Henle","腎絲球","腎臟 clearance"],"scope":"physiology","steps":[{"title":"腎絲球先過濾","detail":"血液中的水與可濾過小分子進入鮑氏囊；壓力差、膠體滲透壓及濾過屏障特性共同決定速率。"},{"title":"腎小管選擇性再吸收","detail":"身體要保留的水與溶質從管腔回到血液；近曲小管負責大量回收。"},{"title":"某些物質再被分泌","detail":"部分離子與有機分子可從血液經管壁進入管腔，使其排出量增加。"},{"title":"比較排出與血漿濃度","detail":"排出量等於過濾量減再吸收量加分泌量；清除率則是尿中濃度乘尿流量，再除以血漿濃度。"}],"limit":"清除率不一定等於腎絲球過濾率；只有適合的標記物在相應假設成立時，才可用來估算。","check":"葡萄糖清除率很低，代表腎絲球沒有過濾葡萄糖嗎？"},{"id":"oxygen","title":"氣體交換：從通氣到組織釋氧","keys":["Bohr","ventilation","perfusion","hemoglobin","血紅素","呼吸","oxygen affinity"],"scope":"physiology","steps":[{"title":"通氣把新鮮氣體帶到肺泡","detail":"真正參與交換的是扣除死腔後的肺泡通氣量，不能只看呼吸次數。"},{"title":"氧依分壓差穿越屏障","detail":"肺泡與微血管間透過擴散交換氣體；厚度、面積及分壓差都會影響交換。"},{"title":"血流把氧帶往組織","detail":"血紅素攜帶多數氧氣；通氣與灌流須配合，否則即使總通氣量足夠仍可能低血氧。"},{"title":"代謝活躍處較易釋氧","detail":"二氧化碳、酸度或溫度增加等因素可使解離曲線右移，降低相同氧分壓下的親和力並促進釋氧。"}],"limit":"右移不是肺泡氧分壓提高，也不等於每種情境的總氧輸送都增加；還須考慮血紅素量與心輸出量。","check":"組織運動時變熱且酸度上升，對卸載氧氣有什麼幫助？"},{"id":"endocrine","title":"內分泌軸：逐級刺激與負回饋","keys":["thyroid","甲狀腺","cortisol","HPA","CRH","ACTH","TSH","TRH"],"scope":"physiology","steps":[{"title":"下視丘發出釋放訊號","detail":"下視丘整合生理需要後，釋放激素調節腦下垂體前葉。"},{"title":"前葉促進周邊內分泌腺","detail":"例如促甲狀腺激素刺激甲狀腺；促腎上腺皮質素則刺激腎上腺皮質。"},{"title":"末端激素影響器官","detail":"甲狀腺激素調節代謝等功能；皮質醇參與壓力反應與代謝，兩條軸的末端作用不同。"},{"title":"末端回頭抑制上游","detail":"末端激素回饋下視丘與前葉，降低原本的刺激訊號，協助維持適當濃度。"}],"limit":"原發性腺體問題與中樞問題可呈現不同的上游／下游激素組合，判讀必須沿整條軸看。","check":"甲狀腺本身製造能力下降時，促甲狀腺激素通常往哪個方向變？"},{"id":"organic","title":"取代反應：一步協同或兩步中間體","keys":["SN1","SN2","carbocation","親核取代"],"scope":"organic","steps":[{"title":"先看底物與條件","detail":"判斷位阻、離去基、溶劑與親核試劑；不同條件會改變哪條途徑較有利。"},{"title":"單分子途徑先離去","detail":"離去基先脫離形成碳陽離子，再被親核試劑進攻；碳陽離子穩定性重要，也可能重排。"},{"title":"雙分子途徑同步進行","detail":"親核試劑從背面進攻時離去基同步離開，是一步反應；位阻常降低其可行性。"},{"title":"比較速率與立體結果","detail":"理想單分子速率主要依底物；雙分子依底物與親核試劑。背面進攻會使反應中心構形反轉。"}],"limit":"不能只看底物就忽略溶劑或消去競爭；單分子途徑的立體結果也不一定完全各半。","check":"為什麼第三級底物通常不適合背面進攻？","diagramKind":"comparison"},{"id":"acid-base","title":"酸鹼性：失去質子後能否穩定","keys":["conjugate base","resonance","酸鹼","共軛鹼","carboxylic acid","inductive"],"scope":"organic","steps":[{"title":"先畫失去質子後的結構","detail":"比較的是原酸與其共軛鹼；共軛鹼承受新增負電荷的位置十分重要。"},{"title":"看電荷能否離域","detail":"共振讓負電荷分散在多個原子，常使共軛鹼更穩定，例如羧酸根的兩個氧。"},{"title":"再看原子與誘導效應","detail":"電負度、原子大小、軌域混成與鄰近吸電子基團都可能改變負電荷穩定程度。"},{"title":"連到酸性強弱","detail":"在同一溶劑與可比較條件下，共軛鹼越穩定，原酸通常越容易失去質子。"}],"limit":"酸性比較必須注意溶劑與溶劑化；不同類型化合物不能只靠一個因素判斷。","check":"為什麼羧酸通常比醇更酸？"},{"id":"material","title":"材料量測：由曲線區段推回物理變化","keys":["TGA","stress–strain","stress-strain","Young","拉伸","熱重"],"scope":"instrument materials","steps":[{"title":"確認量測軸與條件","detail":"拉伸量應力與應變；熱重量質量隨溫度或時間變化。先確認單位、速率與氣氛。"},{"title":"區分不同曲線區段","detail":"拉伸可看初始彈性斜率、降伏與破裂；熱重可看不同失重區段及殘留比例。"},{"title":"提出合理物理解釋","detail":"拉伸斜率反映剛性；熱重失重可能是水分、揮發物或分解產物離開，需依材料與溫區判讀。"},{"title":"用另一量測核對","detail":"用量熱、產物分析或結構量測區分相變與分解，避免只憑一段曲線就指定反應機制。"}],"limit":"熱重殘留不一定全是灰分，也可能有殘炭；彈性模數相同不等於韌性或延性相同。","check":"氮氣下的殘留量，為什麼可能比空氣下高？"},{"id":"mitosox-specific","title":"粒線體超氧訊號：由探針到可支持的結論","questionIds":["q_1yxhps7","q_13r9gpi"],"keys":[],"scope":"project experiment","steps":[{"title":"探針進入並累積","detail":"探針載入量與細胞狀態、染色條件及粒線體膜電位有關；先保持處理條件一致。"},{"title":"氧化後出現螢光","detail":"氧化產物的螢光可供偵測，但一般紅色訊號也可能包含非超氧特異的氧化產物。"},{"title":"排除量測干擾","detail":"設定未染、溶劑與陽性對照，排除死細胞，檢查自體螢光、補償及不同載入量的影響。"},{"title":"與獨立證據互證","detail":"必要時區分氧化產物或採用其他氧化壓力指標，才討論超氧生成與藥物作用。"}],"limit":"螢光升高不能直接換算為超氧絕對濃度，也不能單獨證明粒線體是凋亡的起始原因。","check":"若處理組膜電位也改變，為什麼不能只比較螢光平均值？","source":{"label":"原廠粒線體超氧探針手冊","url":"https://assets.thermofisher.com/TFS-Assets/LSG/manuals/MAN0028459-MitoSOXGreenMitoSOXRedMitochondrialSuperoxideIndicators-UG.pdf"}},{"id":"calcium-ros","title":"鈣離子與活性氧：如何確認先後與因果","questionIds":["q_xt14j7"],"keys":[],"scope":"project cellbio","steps":[{"title":"先畫出兩種假說","detail":"可能是鈣離子增加先改變粒線體而提高活性氧，也可能是氧化壓力先影響鈣離子通道與儲存。"},{"title":"量測早期時間序列","detail":"同步追蹤胞內與粒線體鈣離子、活性氧和膜電位；時間先後能提供線索，但不足以證明因果。"},{"title":"分別擾動兩條路徑","detail":"利用鈣離子螯合或通道干預，以及適當氧化還原干預，觀察另一訊號是否跟著變化。"},{"title":"比較救援與限制","detail":"檢查干預本身的毒性與探針干擾，配合基因方法或另一量測方式，評估雙向回饋的可能性。"}],"limit":"單一抑制劑同時改變兩個訊號仍可能是非特異作用；不能把相關性畫成已證實的單向因果。","check":"哪一種結果會支持鈣離子在活性氧上游？又需要排除什麼？","source":{"label":"原廠粒線體功能量測說明","url":"https://www.thermofisher.com/us/en/home/life-science/cell-analysis/cell-viability-and-regulation/apoptosis/mitochondria-function.html"}},{"id":"nao-mass","title":"粒線體量：染劑訊號與生合成要分開","questionIds":["q_13oohol","q_9ull70"],"keys":[],"scope":"project experiment","steps":[{"title":"辨認染劑讀到什麼","detail":"壬基吖啶橙可與膜磷脂結合，常用於粒線體相關量測；不是直接數粒線體顆數。"},{"title":"檢查膜脂與電位","detail":"訊號也可能受膜脂組成、細胞大小、載入與膜電位影響，需比較存活單細胞並保持染色一致。"},{"title":"增加獨立量測","detail":"搭配粒線體蛋白、粒線體核酸相對量或影像面積等指標，檢查多種證據是否一致。"},{"title":"區分含量與生成","detail":"含量增加可能來自新生成、清除減少或形態改變；若要主張生合成，還需生成調控與動態證據。"}],"limit":"單一染劑變亮不能直接證明粒線體生合成，也不能單獨推定呼吸能力變好。","check":"除了染劑，你會用哪兩項獨立指標驗證粒線體含量？","source":{"label":"壬基吖啶橙與磷脂結合研究","url":"https://pubmed.ncbi.nlm.nih.gov/1396703/"}},{"id":"respiration-perturbation","title":"呼吸鏈干預：抑制合成與解偶聯的差別","questionIds":["q_1ytwkdn","q_1j9kk6j"],"keys":[],"scope":"biochem project experiment","steps":[{"title":"阻擋能量合成酶","detail":"寡黴素阻擋質子經能量合成酶回流，使與能量合成相連的耗氧下降；仍可能有質子洩漏耗氧。"},{"title":"解偶聯消散梯度","detail":"適量解偶聯劑讓質子跨膜回流，電子傳遞可加速而耗氧提高，但不有效驅動能量合成。"},{"title":"末端抑制辨別背景","detail":"再用呼吸鏈抑制劑壓低粒線體耗氧，估計非粒線體背景，幫助拆分各部分。"},{"title":"以滴定確認解讀","detail":"最佳解偶聯濃度依細胞而異；過量或受損細胞不一定增加耗氧，需做滴定與存活檢查。"}],"limit":"這裡比較不同干預，方框間沒有因果箭頭；實際試劑加入順序應依量測套組設計。","check":"為什麼耗氧增加不一定代表能量產生增加？","source":{"label":"原廠粒線體呼吸壓力測試","url":"https://www.agilent.com/en/support/cell-analysis/mitochondrial-respiration-xf-cell-mito-stress-test"},"diagramKind":"comparison"},{"id":"osmosis","title":"滲透作用：濃度差與壓力差共同決定","questionIds":["q_mc8i3o"],"keys":[],"scope":"physiology biochem thermo","steps":[{"title":"先看膜的通透性","detail":"半透膜讓水通過而限制某些溶質；有效滲透差取決於不能自由跨膜的溶質。"},{"title":"比較水的化學勢","detail":"在壓力相同等條件下，水傾向流向有效溶質較高的一側，使水的化學勢差縮小。"},{"title":"靜水壓反向抵銷","detail":"水移動可能建立壓力差；當靜水壓作用抵銷滲透驅動力時，沒有淨水流。"},{"title":"連回細胞體積","detail":"判斷細胞膨脹或收縮要看張力與溶質能否跨膜，不能只比較總滲透濃度。"}],"limit":"滲透不是水永遠只向高總濃度移動；膜選擇性與既有壓力差都會改變結果。","check":"兩液總滲透濃度相同，為什麼仍可能對細胞造成不同體積變化？","source":{"label":"開放教材：腎臟與滲透調節","url":"https://openstax.org/books/biology/pages/41-2-the-kidneys-and-osmoregulatory-organs"}},{"id":"countercurrent","title":"逆流倍增：局部差異如何成為髓質梯度","questionIds":["q_dpz11x"],"keys":[],"scope":"physiology","steps":[{"title":"上升支移出鹽分","detail":"粗上升支再吸收鹽且對水通透性很低，讓間質比管液更濃、上升支管液變稀。"},{"title":"下降支水向外移","detail":"下降支較容易通水，水向較高滲透濃度的間質移動，管液因此濃縮。"},{"title":"逆向流動反覆累積","detail":"新管液持續進入，兩支相反流向配合局部鹽水分離，沿深度形成髓質滲透梯度。"},{"title":"集尿管利用梯度","detail":"抗利尿激素提高集尿管水通透性後，水沿梯度再吸收；直血管交換與尿素循環也協助維持梯度。"}],"limit":"倍增機制建立梯度，直血管的逆流交換主要協助維持梯度；兩者功能不同。","check":"為什麼上升支若同時大量通水，就難以建立這個梯度？","source":{"label":"開放教材：腎臟與滲透調節","url":"https://openstax.org/books/biology/pages/41-2-the-kidneys-and-osmoregulatory-organs"}},{"id":"interaction-evidence","title":"交互作用證據：共沉澱與染色質富集","questionIds":["q_1h6jch1","q_1d0o1th"],"keys":[],"scope":"molbio experiment","steps":[{"title":"共沉澱看複合體","detail":"以抗體拉下目標蛋白，再看另一蛋白是否一起被帶下來；可支持同一複合體，但不一定直接結合。"},{"title":"染色質富集看區域","detail":"固定、打斷染色質後，拉下目標蛋白相關片段，再檢查某核酸區域是否富集。"},{"title":"對照排除非特異","detail":"比較輸入樣本、非特異抗體與適當陽性或陰性目標，核對抗體品質和背景。"},{"title":"功能必須另行驗證","detail":"定位或共同出現不等於調控功能；需再用基因干預、報導系統或生化方法檢查。"}],"limit":"這是兩種方法的比較，不能把富集結果直接解讀成直接物理結合或已證實的轉錄調控。","check":"你要回答蛋白互作或核酸區域定位時，會分別選哪一種方法？","source":{"label":"原廠免疫共沉澱說明","url":"https://assets.thermofisher.com/TFS-Assets/LSG/Application-Notes/TR0064-Immunoprecipitation-guide.pdf"},"diagramKind":"comparison","sources":[{"label":"原廠染色質免疫沉澱方法","url":"https://www.cellsignal.com/applications/chip-and-chip-seq/chip-assay-overview"}]},{"id":"surface-markers","title":"表面標記：從染色族群到功能證據","questionIds":["q_1i9987s"],"keys":[],"scope":"project experiment","steps":[{"title":"先定義表型問題","detail":"第二十四型與第四十四型分化群抗原是表面標記；哪種組合有意義需依細胞與研究背景決定。"},{"title":"建立可靠染色分析","detail":"使用存活、單細胞與單色補償對照，必要時以缺一色對照設定陽性閾值，避免主觀切群。"},{"title":"比較比例與強度","detail":"依預先定義的閘門比較雙標記族群比例與訊號分布，保留獨立重複、變異及不符合預期的結果。"},{"title":"另測功能性特徵","detail":"若要討論幹性或腫瘤起始能力，仍需適合的功能實驗；標記變化本身只支持表型改變。"}],"limit":"不能替尚未完成或尚無明確結果的實驗編造結論；應清楚區分已觀察結果、可能原因與後續驗證。","check":"當雙標記結果不如預期時，你先核對哪三個量測條件？","source":{"label":"癌症幹細胞標記與功能量測","url":"https://www.thermofisher.com/es/en/home/life-science/cancer-research/cancer-cell-analysis/cancer-stem-cells.html"}}],"answers":{"q_1h2w2e7":"細胞計數試劑八號利用活細胞相關脫氫酶反應，將水溶性四唑鹽還原成有色甲臢產物，再量測約四百五十奈米吸光值。扣除空白並相對於溶劑對照後，可得到相對代謝活性。在經驗證的線性範圍內，它可以作為存活細胞相關指標，但讀值同時受到細胞數與單一細胞代謝影響。因此訊號下降還可能是增殖變慢或代謝受抑，不能單獨認定細胞凋亡，應以細胞計數或凋亡指標交叉確認。","q_1ithyed":"五氟尿嘧啶是氟嘧啶類抗代謝藥物，需要在細胞內形成活性代謝物。其中一條重要作用是抑制胸苷酸合成酶，使去氧胸苷核苷酸供應不足，干擾去氧核糖核酸合成；其他代謝物也可摻入核糖核酸或去氧核糖核酸，影響其加工與功能。因此它不只有單一作用點。這些是一般已知機制，若要說明它在本專題中與匹莫齊特的交互作用，仍需以對應實驗驗證。","q_1bbo10v":"線性齊次微分方程的解可以線性疊加：若兩個函數分別是解，它們的任意線性組合仍是解。但這個組合也必須符合題目指定的初始與邊界條件。對非齊次線性系統，總解可以寫成一個特解加上齊次解；若比較不同輸入，在相容的零初始條件下，輸入的線性組合也對應輸出的線性組合。非線性方程一般不能直接套用這個原理。","q_1k0bzn6":"促凋亡蛋白巴克斯與巴克在活化後會寡聚化，促使粒線體外膜通透化，讓細胞色素丙等蛋白釋放到細胞質。細胞色素丙接著參與凋亡小體組裝，促進第九型半胱天冬酶活化，再活化執行者半胱天冬酶，推進內源性凋亡。只看到這些蛋白的總量變化，不代表已發生孔洞形成或凋亡，還需要活化、定位及下游指標。","q_1jtf5jr":"第八型半胱天冬酶典型地由細胞膜死亡受體的外源性途徑啟動；第九型則在粒線體釋放細胞色素丙後，於凋亡小體中啟動，屬於內源性途徑。兩者都可接續活化執行者半胱天冬酶。兩條途徑也能互相連結，所以不能因偵測到其中一種活化，就斷言另一條完全沒有參與。","q_1i68508":"繞射峰的位置反映晶面間距，結合多個峰及標準資料可協助辨認晶相。峰寬則可能同時受到相干繞射晶粒尺寸、微應變、缺陷與儀器解析度影響。因此峰變寬不能直接說成結晶度下降。若要用謝樂方程估晶粒尺寸，需要先扣除儀器展寬，並留意形狀與應變等假設；估出的晶粒尺寸也不必等於整個顆粒的大小。","q_kehz0d":"兩種測定要回答的問題不同。細胞活性測定可用較寬濃度範圍觀察劑量反應；流式分析則通常希望在仍能取得足量完整細胞時，比較鈣訊號或粒線體相關變化，避免嚴重死亡使結果只代表存活者。因此可選較低且較密的濃度，但實際選擇仍應以預試、存活率和原始紀錄說明。若要把兩種結果串成同一機制，還需要在相同濃度與時間下交叉驗證。","q_1tb43ap":"四十八小時可以是觀察藥物處理後訊號變化的中期時間點，但不能只憑這個數字宣稱它最適合。合理的選擇需同時考量藥物作用是否已出現、可分析的活細胞是否足夠，以及染色與圈選品質。面試時應依實際預試或文獻說明依據；若沒有做過時間比較，就承認目前只有單一時間點，後續補早期與晚期量測，釐清訊號變化是否先於細胞傷害。","q_xt14j7":"胞質鈣離子升高時，粒線體可攝入部分鈣，適量時促進代謝；過量時則可能擾亂電子傳遞與膜通透性，增加氧化相關訊號。反過來，活性氧也可能改變鈣通道、內質網釋鈣與鈣幫浦功能，使鈣更難回到基礎濃度，形成相互放大的循環。不過同時看到鈣與氧化訊號上升，只能支持關聯；應用時間順序、鈣調控干預與抗氧化干預，確認哪一步是原因及是否影響最終細胞反應。","q_1yxhps7":"粒線體超氧陰離子探針主要用來追蹤粒線體超氧陰離子相關的氧化訊號。探針進入細胞並在粒線體累積後，氧化產物與核酸結合可產生螢光。但一般量到的總紅色螢光也可能包含其他氧化產物，且受膜電位、探針累積、染色條件及活細胞比例影響。因此可說相對氧化訊號改變，不能把亮度直接當作超氧陰離子絕對濃度，更不能只用它證明氧化壓力造成細胞死亡；需搭配適當對照和獨立驗證。","q_13r9gpi":"先分清比較對象。十五微莫耳每公升組的平均值比十微莫耳每公升組低，不代表它一定低於對照組，也不代表兩個處理組彼此有顯著差異。應查看相對對照的效應、獨立重複與誤差範圍，再決定能否描述氧化訊號增加。高濃度還可能造成細胞死亡、膜電位下降或高訊號細胞流失，使平均螢光不再隨濃度上升；沒有相關驗證時，應描述非單調反應，不能自行補上原因。","q_13oohol":"壬基吖啶橙是可與心磷脂等帶負電磷脂結合的螢光染劑，常用來觀察粒線體內膜相關變化。分析時需固定染色條件、排除死細胞，並以適當方式比較單細胞訊號。螢光可能受到膜脂組成、染劑進入和細胞狀態影響，因此它提供的是粒線體膜相關指標，不能單獨等同粒線體數量。若要確認含量，應搭配粒線體蛋白、核酸拷貝數或影像定量。","q_9ull70":"不能。壬基吖啶橙變亮，可能來自粒線體膜脂或心磷脂變化、粒線體含量增加，也可能受到染劑累積和細胞狀態影響。要區分這些解釋，可同時量測粒線體外膜蛋白、粒線體核酸與核基因的比例，以及每個細胞的粒線體影像面積或體積。多種獨立指標一致時，才更支持含量增加；要進一步宣稱粒線體新生，仍需檢查合成與調控相關證據。","q_jx2mud":"這表示降低目前量到的活性氧訊號，未必足以恢復五氟尿嘧啶反應，氧化訊號可能只是伴隨現象，或存在其他並行機制。也要先確認乙醯半胱胺酸本身沒有毒性、真的作用到相關區室，且加入時間沒有晚於不可逆傷害。可用另一種作用方式不同的抗氧化干預並同步量測細胞活性與死亡，區分干預失效、訊號量測限制和氧化壓力並非必要原因等可能。","q_cyws6h":"選低濃度的目的，是讓單藥仍保留足夠反應空間，觀察合併後是否進一步抑制細胞；若匹莫齊特單獨已使訊號接近最低，合併效果就難以判讀。仍要比較相同濃度的兩種單藥、合併組與溶劑對照。合併組低於任一單藥，可描述抑制較強，但不能直接稱為協同；需要多濃度矩陣及事先選定的相加基準分析。","q_99iybx":"七十二小時可讓細胞經歷較長的增殖與藥物暴露，較容易觀察具有時間依賴性的生長抑制；但這只是可能的設計理由，實際依據應回到預試與研究紀錄。同時要確認細胞沒有過度匯合、培養條件穩定，而且活性訊號仍在線性範圍內。單一時間點不能說明效果何時開始或證明作用先後，最好比較多個時間點，並在相同條件下量測機制指標。","q_232axs":"單一人類胃腺癌細胞株只能代表特定的遺傳、訊號與代謝背景。其他胃癌細胞可能因藥物運輸、標靶表現或抗氧化能力不同而有不同反應，因此不能直接推廣到所有胃癌。只有癌細胞也無法判斷對正常組織的選擇性。後續應加入不同背景的胃癌細胞及適當正常胃上皮模型，確認結果能否重現，再逐步評估更接近體內的模型。","q_on75g4":"最想比較的是在相同暴露條件下，癌細胞與正常胃上皮模型的存活、增殖和傷害程度，判斷是否存在對癌細胞較強的作用。應先確認兩種模型各自的培養與測定線性範圍，避免把生長速度或代謝差異誤認為選擇性。再比較完整劑量反應與獨立死亡指標；正常細胞較少受影響也只支持這些體外條件下的選擇性，不能直接代表人體安全。","q_1t7jh35":"技術重複是同一份生物材料的重複量測，例如同一次細胞處理分裝成數孔，用來估計加樣與儀器誤差。生物重複是獨立建立並處理的生物樣本，用來評估實驗可再現性。三個同批孔通常不能當成三次獨立實驗；可先整理同一實驗內的技術重複，再以獨立實驗作統計單位。報告時應清楚交代批次、重複層級及樣本數。","q_1ba1qso":"標準差描述各個獨立觀測值分散的程度；平均值的標準誤描述樣本平均值估計母群體平均值的不確定性，通常是標準差除以獨立樣本數的平方根。樣本數增加時，標準誤可能變小，但不代表個別數據更一致。圖說必須寫清楚使用哪一種誤差線及獨立樣本數；不能只看兩組誤差線是否重疊，就代替合適的統計檢定。","q_fb6tsw":"若濃度與時間的各組合都有獨立重複，可先考慮包含交互作用的雙因子變異數分析，分別檢查濃度、時間及濃度效果是否隨時間改變。若同一樣本被連續量測，或各批實驗存在配對結構，應改用能處理重複量測或批次的模型。還要檢查殘差與變異數假設，並對事先規劃的多重比較作校正，不能把同批技術孔視為完全獨立樣本。","q_1gqdrxv":"半最大抑制濃度需要足夠的劑量反應資料，並先說明是相對對照降到一半，還是擬合曲線上下平台中點的濃度。若測試範圍沒有涵蓋目標反應，或曲線與重複品質不足，就不適合硬報一個數值。可補足涵蓋反應區間的濃度，固定時間與對照，以合適的非線性模型擬合並報信賴區間；不同時間與模型的結果也不能直接混比。","q_wow7tr":"溶劑本身可能影響細胞代謝、膜性質與存活，合併用藥又可能帶入較多溶劑，因此必須核對各組最終溶劑比例並設對應的溶劑對照。原液使用什麼溶劑，應以實際配藥紀錄與試劑溶解性為準，不能從題目假設所有藥都一定使用同一溶劑。確認溶劑效應後，才把處理組差異主要歸於藥物；若各組溶劑比例不同，需先修正設計再解讀。","q_a21mbo":"先確認儀器電壓、補償、染色條件和圈選方式一致，再看右移是否出現在可比較的活單細胞族群。未染色對照可檢查自體螢光，多色分析還要檢查串色與適當對照。接著判斷是整個族群變亮，還是高訊號小族群比例增加。只有量測條件和細胞組成可比較時，才能討論目標訊號增加；直方圖右移本身不等於已證明某條機制活化。","q_1gut9ox":"未染色對照可量到細胞本身的自體螢光和儀器背景，幫助判斷染色後增加的訊號是否超過背景。陰性對照則用來呈現沒有目標反應或標記時的狀態，未必與未染色對照完全相同。多色分析還需依目的加入單染補償或缺一色對照。對照必須與樣本使用相容的處理及儀器條件，不能只靠任意畫一道門檻區分陽性。","q_ljggvj":"高濃度造成大量死亡時，高訊號或嚴重受損細胞可能破裂、流失，或被活細胞圈選排除，最後平均螢光只代表留下的細胞，形成存活者偏差。死細胞也可能因膜通透性改變而非特異吸入染劑，造成相反方向的偏差。應一併報告存活比例、事件分布、圈選和收樣情況，並在較早時間或較低濃度驗證，不能僅憑平均值下降就說氧化壓力改善。","q_qfyp4m":"先逐項描述實際測到的指標：胞內鈣探針、膜電位相關染劑、粒線體氧化探針與膜脂相關染劑，再說它們共同提示細胞鈣恆定及粒線體狀態受到影響。不同探針有不同限制，若濃度和時間不一致，更不能把四張圖直接排成因果鏈。可提出待驗證假說，但應以同條件時間序列、獨立測定和回復實驗，確認哪個變化先發生，以及阻斷它是否改變細胞或合併用藥反應。","q_ag3m1l":"我會先承認目前直接支持的是特定條件下的細胞反應與粒線體相關訊號變化，尚不足以證明完整因果途徑。如果題目用了『透過』或『由某機制造成』等字眼，我會改成『影響』或『與某訊號相關』，讓主張與證據一致。接著說明最需要補的是在相同條件下干預候選機制，確認最終反應是否被改變；未完成的實驗應明確列為後續工作。","q_14ts60k":"匹莫齊特原為具有多巴胺受體阻斷作用的抗精神病藥物。老藥新用的優勢是已有部分人體用藥與藥物動力學資料，可協助研究規劃；但不代表新的抗癌用途、劑量或合併方案已證實有效安全。仍要評估可達暴露、對正常細胞的作用、藥物交互影響及心臟電氣傳導等風險。細胞實驗只能建立研究線索，不能直接當成臨床用藥建議。","q_10byq8j":"不能把培養液中的名目濃度直接換成人體血中目標。體內還受到吸收、蛋白結合、分布、代謝、排除及組織暴露影響；細胞培養中的游離藥物比例也可能不同。應比較可達的游離暴露與持續時間，並確認安全性及正常細胞反應。若有效濃度遠高於合理暴露，只能描述體外效應，需重新評估研究條件與轉譯可行性。","q_ubenx2":"可先用直接細胞計數或增殖標記，區分細胞數減少與單一細胞代謝降低，再搭配死亡指標確認是否真的造成細胞死亡。接著做移除藥物後的恢復觀察或群落形成試驗，看短期受抑細胞是否仍能長期增殖。若活性訊號降低但細胞數及移藥後增殖恢復，就較符合可逆代謝抑制；不同結果也可能代表增殖停滯或不可逆傷害，需要分開描述。","q_1i9987s":"應如實交代曾做過分化群二十四與四十四表面標誌分析，但結果的變異、方向或統計支持不足，目前無法下明確結論。簡報可用一頁呈現實際結果與限制，避免把未達預期說成沒有做，或只保留支持假說的資料。這些表面標誌也不能單獨證明癌幹細胞功能；後續需檢查染色、圈選、存活族群與獨立重複，再依研究問題加入功能性驗證。","q_1xq18pf":"過濾壓降是推動液體通過濾材與濾餅的驅動力。若其他條件及阻力不變，提高壓降通常使流量增加；但可壓縮濾餅可能被壓得更密，阻力也會上升，因此流量不一定成比例增加。要先分清操作模式：定壓過濾時，濾餅累積通常使流量逐漸下降；定流量過濾時，則需要逐漸提高壓降來克服增加的阻力。","q_fpyiwj":"氣相層析以氣體作流動相，樣品通常需能氣化且在進樣與管柱溫度下穩定，適合揮發性或可衍生化的成分。高效液相層析以液體作流動相，適合許多不易揮發、熱敏感或較大的分子，但仍需能溶於相容溶劑。兩者都靠分析物在固定相與流動相間不同的作用程度形成分離；選擇時還要考量偵測方式、樣品前處理及所需選擇性。","q_17vqfes":"紫外可見光吸收光譜量測樣品吸收特定波長光的程度。當光子能量符合分子的電子能階差時，電子可被激發，使透過光減少；用入射與透射強度比求吸光值。在適當濃度、固定光徑及化學狀態下，吸光值可與濃度近似成正比，用標準曲線定量。散射、混濁、背景吸收或化學平衡改變都可能干擾，因此需設空白與確認線性範圍。","q_gtjot6":"一般螢光放射的波長通常比激發吸收波長長，因為分子吸光後，常先經振動鬆弛等非輻射過程失去部分能量，再放出較低能量的光。波長越長代表光子能量越低，兩者差異稱為斯托克斯位移。這是常見情形而非所有發光的絕對規則；量測仍須依實際激發與放射光譜選濾光片，避免把激發光散射誤當螢光。","q_zmxuno":"傅立葉轉換紅外光譜主要反映分子振動吸收，可用特徵吸收帶判斷官能基，並比較反應前後鍵結環境的改變。儀器先取得干涉訊號，再轉成波數對吸收的光譜；不同振動要能造成偶極矩改變，才具有紅外活性。峰位、強度或寬度變化可支持化學環境改變，但峰重疊、含水量與樣品接觸也會影響，不能只憑單一新峰就證明特定交聯反應完成。","q_1tjufor":"質譜的質荷比是離子質量相對於電荷數的比值。樣品先被游離，再依離子在電場或磁場中的運動特性分析。單電荷離子的質荷比常接近其離子質量；多電荷離子則會出現在較低的質荷比位置。還需辨認加合離子、碎片、同位素分布和電荷狀態，因此一個峰的位置不能直接當成中性分子的分子量。","q_2zcacm":"Ｘ光繞射利用晶體週期結構對Ｘ光的干涉，峰的位置可連到晶面間距，整體圖譜可用來辨認晶相。峰強度也受晶體結構與優選取向影響；峰寬在扣除儀器效應後，可提供晶粒尺寸或微應變線索。繞射晶粒尺寸不一定等於顆粒尺寸，寬峰也不一定只由小晶粒造成。非晶成分多以寬廣散射呈現，不能只看有沒有尖峰就做所有結構判斷。","q_tzp6av":"酸失去質子後形成共軛鹼；若共軛鹼能較穩定地分散負電荷，原酸通常較容易解離，因此酸性較強。比較時可依序看帶負電原子的電負度與大小、共振、誘導效應、軌域及溶劑穩定作用。例如羧酸的共軛鹼能讓負電荷分散於兩個氧，因此通常比相應醇的共軛鹼穩定。不同溶劑會改變相對穩定性，不能脫離條件只背單一排序。","q_djuewg":"碳正離子缺電子，能提供電子密度或分散正電荷的作用通常使它較穩定。烷基可透過超共軛和誘導作用穩定簡單碳正離子；烯丙基或苄基碳正離子則可由共振分散電荷。常見的三級大於二級大於一級排序適用於可比較的簡單烷基系統，遇到共振、吸電子取代基或特殊結構就要重新判斷。穩定性也會影響是否容易形成中間體及是否重排。","q_tpsbhf":"能斯特方程式用單一離子的內外濃度比與電荷，計算它的平衡電位；在該電位下，這種離子的化學與電位驅動力互相抵消。高德曼方程式則把多種離子的濃度和相對通透性一起納入，在相應模型假設下估計膜電位。實際靜止膜電位通常較接近通透性最高離子的平衡電位，但不必等於它。兩者都需要明確的離子濃度、溫度及適用假設。","q_mc8i3o":"滲透是水跨越可透水但限制某些溶質通過的膜之淨移動。若兩側靜水壓相同，水通常由有效溶質濃度較低的一側移向較高的一側，因為後者的水化學位較低。若存在壓力差，需同時考量靜水壓與有效滲透壓，不能只看總溶質濃度。能快速穿膜的溶質不一定能維持長期張力，因此等滲也不必然等於等張。","q_o4j3e4":"以骨骼肌為例，動作電位經橫小管使肌漿網釋放鈣離子。鈣與肌鈣蛋白結合後，帶動原肌球蛋白移位，露出肌動蛋白上的結合位置，肌凝蛋白便可進行耗能的橫橋循環產生收縮。鈣被幫浦送回肌漿網後，結合位置再被遮蔽，肌肉放鬆。平滑肌的調控方式不同，主要由鈣與鈣調蛋白活化肌凝蛋白輕鏈激酶，不能全部套用骨骼肌模型。","q_11l0lm0":"腎清除率表示腎臟每單位時間排出的某物質量，相當於完全清除了多少體積血漿中的該物質；它是等效體積，不是實際被清空的一杯血漿。計算概念是尿中濃度乘尿流率，再除以血漿濃度。某物質若只被自由過濾而不再吸收或分泌，其清除率可反映腎絲球過濾率；若有再吸收通常較低，有分泌則可能較高，需依物質的腎處理方式解讀。","q_dpz11x":"亨利氏環的下降支較易透水，上升支尤其粗段則再吸收鹽分而不易透水，兩支反向流動形成逆流倍增，建立腎髓質由外到內的滲透梯度。直小血管的逆流交換協助保留此梯度，尿素回收也有貢獻。當抗利尿激素使集尿管對水通透性提高時，水才能沿髓質梯度離開管腔，形成較濃尿液。因此建立梯度與開啟集尿管水通道是不同但互相配合的步驟。","q_1rqvvkc":"波耳效應指二氧化碳增加或酸度上升時，血紅素對氧的親和力降低，使氧合血紅素解離曲線向右移。在代謝旺盛的組織，這有利於血紅素釋放氧氣；肺部排出二氧化碳則有利於重新結合氧。這描述的是血紅素與氧的結合特性改變，不代表血紅素總量增加。溫度和其他調控物也可影響曲線，但不應把所有右移都只稱為波耳效應。","q_13poz4o":"通氣與灌流匹配是指肺泡得到的新鮮空氣量，與流經周圍微血管的血流量相互配合，才能有效交換氣體。通氣不足但有血流時，血液不易充分氧合；有通氣卻缺血流時，空氣就不能有效供血液利用。肺部不同區域的比值本來就不完全一樣，但嚴重不匹配會降低整體氧合。低氧性肺血管收縮可把血流部分導向通氣較好的區域，屬於補償而非完全修復。","q_1mhi4a2":"下視丘釋放促甲狀腺激素釋放激素，刺激腦下垂體前葉分泌促甲狀腺激素，再促使甲狀腺合成與釋出甲狀腺素。循環中的甲狀腺素升高後，會抑制上游兩層訊號，形成負回饋。若問題出在甲狀腺本身，甲狀腺素降低時促甲狀腺激素通常升高；若問題位於上游，則可能沒有適當升高。因此需把上下游激素一起看，才能判斷異常位置。","q_1ytwkdn":"解偶聯劑讓質子繞過三磷酸腺苷合成酶回流，削弱粒線體內膜的質子驅動力。由於電子傳遞所承受的回壓降低，在底物、氧氣與呼吸鏈能力足夠時，氧消耗通常增加；但氧化磷酸化產生三磷酸腺苷的效率下降，能量較多以熱散失。這不是直接增加有效能量供應。高劑量或嚴重受損細胞未必仍能提高呼吸，因此需依實際濃度與細胞狀態判讀。","q_1j9kk6j":"寡黴素阻斷三磷酸腺苷合成酶的質子通路，使質子較難經此路徑回到基質，氧化磷酸化的能量合成下降。質子梯度累積後，電子傳遞鏈繼續向外泵質子更困難，因此與能量合成耦聯的氧消耗通常下降。剩下的呼吸可能包含質子洩漏及非粒線體氧消耗。若再加入適量解偶聯劑，可在呼吸鏈仍有能力時解除回壓並提高氧消耗，但不會恢復被阻斷的能量合成。","q_1ud8vlr":"瓦氏效應是指某些細胞即使有氧，仍表現較高的葡萄糖攝取與乳酸生成，也就是有氧糖解。它可配合快速增殖所需的代謝中間物與氧化還原調節，但不代表所有癌細胞都如此，也不代表粒線體完全沒有功能。若要研究它，應結合葡萄糖消耗、乳酸、呼吸與代謝流等指標，不能只憑一次酸化或某酵素表現變化就下結論。","q_ka5gd2":"磷酸化不一定活化蛋白。加入磷酸基會改變局部電荷、構形、結合能力或所在位置，實際效果取決於蛋白種類與磷酸化位點，可能活化、抑制，或調整降解與運輸。蛋白激酶加上磷酸基，磷酸酶移除，使這種調節具有可逆性。看到磷酸化條帶增加時，還要核對目標位點、總蛋白量與功能讀值，才能判斷訊號真正的方向。","q_5ilnpm":"泛素與蛋白酶體系統負責選擇性處理部分受損、錯誤折疊或需要調控的蛋白。活化、接合與連接酵素逐步把泛素接到目標蛋白，特定多聚泛素鏈可被蛋白酶體辨認，再將蛋白展開並分解成較小片段。這有助於蛋白品質與細胞週期調控。不是所有泛素化都代表降解，鏈型與位置也可能傳遞其他訊號；大胞器等材料則常需其他回收途徑。","q_ttkykw":"內質網累積未正確折疊的蛋白時，會啟動未折疊蛋白反應。主要感測分支可暫時降低整體蛋白合成、增加分子伴侶及移除異常蛋白的能力，減少負荷並恢復平衡。如果壓力太強或持續太久，反應可能轉向促進細胞死亡。因此內質網壓力指標上升不一定等於細胞正在凋亡；需比較時間、適應性反應及死亡指標，並用干預確認作用。","q_yai5y5":"對耦聯刺激型鳥嘌呤核苷酸結合蛋白的受體而言，配體結合使受體構形改變，促使其阿爾法次單元交換核苷酸並活化腺苷酸環化酶，增加環磷酸腺苷。這個第二信使可活化下游蛋白激酶，改變蛋白磷酸化與細胞反應。核苷酸水解和磷酸二酯酶分解第二信使有助於終止訊號。並非所有此類受體都升高環磷酸腺苷；耦聯抑制型蛋白時可使其下降。","q_7y36a8":"受體酪胺酸激酶通常在配體結合後形成或重排受體複合體，使激酶活性與酪胺酸磷酸化增加，再招募接頭蛋白啟動下游。鳥嘌呤核苷酸結合蛋白偶聯受體則先透過受體構形改變，促進異三聚體蛋白的核苷酸交換，再調節酵素或離子通道。兩者起始方式不同，但下游可交會，且同一受體家族也可能因細胞背景而產生不同反應。","q_10wmpqt":"先把每份樣本的目標基因閾值循環數減去穩定內參的循環數，校正起始材料等差異；再把處理組的差值減去校準對照的差值，得到雙重差值。當目標和內參的擴增效率相近且接近每循環加倍時，可用二的負雙重差值次方估算相對表現倍數。內參若被處理改變或效率不符，就不能直接套用，需驗證效率並使用適當校正模型。","q_xf4qzu":"引子需能專一辨認目標序列，兩條的熔解溫度應相近，並避免明顯二聚體、髮夾結構或非特異配對。基因表現分析還要依轉錄本選擇位置，盡量降低基因組核酸污染影響。設計後不能只相信軟體分數，需用標準曲線確認擴增效率，並以熔解曲線或產物分析確認專一性；無模板及無反轉錄對照可協助辨認污染與背景。","q_1e6zynb":"基因敲低是降低目標核糖核酸或蛋白量，常保留部分表現，效果也可能暫時且不完全；基因剔除則改變基因本身，使功能喪失，但仍需驗證等位基因、蛋白與功能是否確實消失。兩者都可能有非目標作用或細胞適應。應搭配多個獨立設計、適當陰性對照及回補實驗，確認觀察到的表型來自目標改變，而不是把技術名稱當成成功證據。","q_1h6jch1":"共同免疫沉澱以抗體拉下目標蛋白，觀察其他蛋白是否一起被帶下來，用來支持它們位於同一複合體或存在關聯。一起沉澱不代表兩者一定直接結合，也可能由第三個分子連接。需有起始樣本、抗體或珠子背景對照，並注意裂解條件可能破壞或製造關聯。可用反向沉澱或其他獨立方法確認，直接結合則需要更進一步的證據。","q_1d0o1th":"染色質免疫沉澱用抗體富集與特定蛋白或組蛋白修飾相關的染色質片段，再檢查哪些核酸區段被帶下來。它可研究轉錄因子的區域占據或組蛋白修飾分布；定量核酸擴增適合指定區域，定序則可看較廣的分布。需有起始染色質、背景抗體及適當區域對照。富集支持空間上的關聯，不單獨證明直接結合或對基因表現具有因果作用。","q_4dleu0":"免疫螢光保留細胞或組織的空間資訊，適合觀察蛋白位於哪裡、不同細胞是否一致及是否共定位；但染色、影像飽和和曝光會影響定量。西方墨點法先依蛋白大小分離，再辨認條帶，較適合比較分子量、相對含量或特定位點修飾，但多半失去單細胞位置資訊。兩者可互補，且都需要抗體專一性、背景與適當正規化對照。","q_amg40m":"黴漿菌污染可能改變細胞生長、代謝、基因表現和藥物反應，卻不一定造成明顯混濁，因此外觀正常也不能排除。這會讓處理組差異混入污染造成的變化，降低再現性。應依實驗室規範隔離可疑培養、使用合適的檢測確認並追查共用試劑和相關細胞。受影響資料需重新評估，不能在未處理污染的情況下持續把結果解釋為藥物機制。","q_1swsl4u":"長期繼代可能選出較適應培養條件的亞族群，造成遺傳或表型漂移，使增殖、代謝與藥物反應改變。不同細胞株對繼代的敏感程度不同，不能只用單一通用代數判斷品質。應使用可追溯的細胞庫、記錄解凍與繼代資訊，盡量讓比較組處於相近範圍，並確認細胞身分及污染狀態；結果異常時也要把代數和批次列入檢查。","q_bfrqlh":"流式細胞儀的一個事件不一定只含一個細胞，兩個黏在一起的細胞可能被同時量到，使散射、核酸含量或標記螢光被高估。先用脈衝面積與高度或寬度等關係篩選單細胞，可降低雙聯體被誤認為高表現族群或特定細胞週期的風險。這和排除碎屑、死細胞是不同步驟，需依樣本與儀器建立並一致使用圈選流程。","q_7ylgl9":"在固定壓力下，泡點是液體加熱到剛產生第一個氣泡的溫度；露點是氣體冷卻到剛形成第一滴液體的溫度。對混合物，第一個形成的另一相通常與原相組成不同，因此同一總組成的泡點與露點不一定相同。也可在固定溫度下討論相應壓力。計算需結合物料衡算和氣液平衡關係；純物質在給定壓力的平衡沸騰與凝結溫度則相同。","q_19w2juw":"凡得瓦方程式在理想氣體基礎上加入兩項修正：分子本身占有體積，使實際可運動空間減少；分子間吸引力則改變量測壓力與理想碰撞模型的關係。這使模型可描述部分真實氣體與相變特徵。低密度時修正通常較小；接近臨界或高壓條件時非理想性更重要，但此方程式仍是簡化模型，精密設計需驗證其適用範圍或使用更合適的狀態方程。","q_k2ui29":"從工程角度，熵是用來描述狀態並判斷能量轉換方向與不可逆程度的性質。系統可隨熱傳或物質流動交換熵，摩擦、有限溫差熱傳和混合等不可逆過程則會產生熵。熵產生量不小於零，可逆極限才為零；它也與可用功損失相關。局部系統的熵可以因向外輸出而下降，因此不能把『系統熵總是增加』當成所有情況的規則，也不能只用混亂度代替熵衡算。","q_v145zr":"絕熱是指系統與外界沒有熱量交換；等熵則指所考慮狀態間的熵不變。可逆絕熱過程是等熵，但有摩擦、混合或其他不可逆性的絕熱過程仍會產生熵。對穩態單入口單出口的絕熱設備，忽略其他熵流時，出口比熵通常不低於入口。反過來，某系統的熵保持不變，也可能是熵輸出抵消熵產生，不能僅由等熵推定完全絕熱可逆。","q_8g90f":"壓縮機通常需要外界輸入軸功來提高流體壓力；渦輪則利用流體膨脹，向外輸出軸功。在穩態、近似絕熱且動能與位能變化可忽略時，壓縮機所需的單位質量輸入功可近似入口到出口的焓增加，渦輪輸出功則近似焓下降。正負號取決於選定的功符號慣例，應先寫清楚；若存在顯著熱交換或速度改變，這些項目也需列入能量衡算。","q_1mgzm6u":"達姆科勒數用來比較反應與流動或傳輸的特徵快慢。常見反應器定義是流體停留時間除以反應特徵時間；值較大表示在離開系統之前，相對有較多時間發生反應。涉及擴散與反應時，則可能使用不同形式的定義。因此不能只背一條通用公式，需先交代反應速率模型、特徵尺度與比較對象；它可協助判斷控制步驟與尺度放大，但不單獨決定所有轉化率。","q_hc6i3l":"催化劑失活可能來自毒物強烈占據活性位、積碳或沉積物遮住孔道、高溫燒結使有效表面積下降，或活性成分溶出及相態改變。這些機制會降低可用活性位或使反應物難以接近它們。應比較反應時間、進料雜質、溫度及材料表徵，辨認主要原因。再生方式必須依機制選擇；例如去除沉積物不一定能修復已燒結的結構，不能把所有失活都當成可逆。","q_9mx5sq":"反應物進入多孔催化顆粒後，若反應消耗比內部擴散補給快，顆粒深處的濃度就會低於表面，內部活性位無法充分利用。對等溫、一般正級數反應，顆粒平均速率會低於把整顆都視為表面濃度時的理想速率，有效因子因此小於一。減小顆粒或改善孔道可能減輕限制。觀察到的級數與溫度依賴也可能改變，因此不能把表觀速率直接當成純表面反應動力學。","q_1yzmzw":"填充床中流體通過顆粒間隙會產生摩擦壓降。對氣相反應，沿床壓力下降常使反應物濃度與體積流率改變，進而影響局部速率和停留條件；實際方向仍與反應級數和體積變化有關。因此設計時要把壓降關係與物料衡算一起求解，而不能假設全床同壓。較小顆粒可改善內擴散，卻通常增加壓降，需在反應利用率與輸送能耗之間折衷。","q_1wg4hf6":"最簡單的白努利方程式通常用於穩態、不可壓縮、黏滯損失可忽略的流動，沿同一流線比較壓力能、動能與位能，且比較區間沒有泵浦或渦輪的軸功。流速分布不均、摩擦、局部損失或設備作功明顯時，應使用含修正項的機械能衡算。不同流線之間不能任意套同一常數，除非另有適當條件，例如無旋流場。","q_k8u46r":"對圓管中充分發展、穩態、不可壓縮的牛頓流體層流，在固定體積流率、管長與黏度下，壓降與管徑的四次方成反比。因此管徑減半時，所需壓降會變成十六倍。若固定的是平均流速，流量會隨管徑改變，壓降的尺度關係就不同。這個結果不能直接套用到紊流、非牛頓流體或入口效應顯著的情況。","q_h21cji":"普朗特數是動量擴散率除以熱擴散率，用來比較動量與熱在流體中傳播的相對快慢。值較大表示熱擴散相對較慢，在可比較的邊界層問題中，熱邊界層常比速度邊界層薄；值較小則常相反。它主要是流體性質的組合，與溫度等狀態有關。使用熱傳關係式時需核對適用流況與性質評估條件，不能單看這個數就決定熱傳係數。","q_1go0ip9":"施密特數是動量擴散率除以物質的分子擴散係數，用來比較動量與濃度擾動的傳播快慢。值較大代表物種分子擴散相對較慢，在可比較的邊界層中，濃度邊界層常較薄。它是特定流體與溶質組合的性質，因此同一流體中的不同物種可能不同。它常與雷諾數一起用於質傳關係式，但不包含所有幾何和操作資訊。","q_1nx7q0d":"路易斯數通常定義為熱擴散率除以物質擴散係數，用來比較熱與質量擴散的相對快慢。值接近一時，熱與物種在相同尺度下的擴散時間較相近，可在適當條件下使用熱質傳類比；大於一表示熱擴散相對較快。不同資料可能採倒數慣例，所以需先核對定義。化學反應、多成分擴散或不同邊界條件仍可能使簡單類比失效。","q_acor1i":"無因次分析把有單位的變數組合成無因次群，可減少獨立參數，整理實驗資料並辨認主導機制。例如雷諾數比較慣性與黏滯作用，讓不同尺寸系統在適當條件下建立相似性。做法是先列出相關變數、基本量綱及物理假設，再找獨立無因次組合。量綱一致是必要檢查，但不能單靠它得到數值常數、完整函數形式或證明模型的物理假設正確。","q_dlvii3":"共沸是混合物在特定壓力與組成下，平衡氣相和液相具有相同組成的狀態。此時單純把液體部分汽化，不會讓氣相進一步富集某一成分，因此普通定壓蒸餾受到分離限制。增加理論板數或回流也無法直接跨越同一條件下的共沸限制。若要突破，需依系統性質評估改變壓力、加入選擇性溶劑或使用其他分離方法，不能只說加熱更久即可。","q_1qbmbd2":"在產品純度、進料及其他條件可比較時，提高回流比通常會加強塔內氣液接觸，使所需理論級數減少，但再沸器與冷凝器負荷通常增加。接近最小回流比時，理論級數會很大；全回流可用來界定最少理論級數，但沒有正常淨產品產出。實際設計須平衡設備與能耗，也要考慮液泛等操作限制，因此回流不是越大越好。","q_ylngia":"閃蒸分離讓進料在指定壓力與能量條件下部分汽化，形成通常接近平衡的氣液兩相，再將它們分開。兩相組成因揮發性不同而不同，較易揮發成分通常在氣相富集。計算需同時滿足總量與各成分衡算、相平衡及能量條件；氣化比例也會影響分離結果。它本質上是單級分離，不能期待一次就達到多級精餾的高純度。","q_1i9suzf":"膜分離的直接驅動可來自壓力、濃度或化學位、電位等差異，依膜與操作模式而定。微過濾或超過濾常由跨膜壓差推動，透析依溶質化學位差，電透析利用電位差移動離子；逆滲透則需施加足以克服滲透壓差的壓力。分離選擇性同時取決於孔徑、溶解擴散或電荷作用，濃差極化與污堵也會降低有效驅動力和通量。","q_17a8sox":"向上流動的流體會對顆粒產生阻力。流速增加到床層壓降所提供的向上支撐，約可平衡顆粒扣除浮力後的重量時，顆粒開始脫離固定接觸並可移動，這就是最小流化狀態。再增加流速，床層通常膨脹，可能出現氣泡或夾帶等現象。最小流化速度受粒徑、密度、流體性質與床層狀態影響，不能只以單一固定速度套用所有材料。","q_7xeew":"閉迴路並不保證比開迴路穩定。回授可減少誤差與擾動，但若增益過大、延遲或相位落後明顯，修正動作可能反而放大偏差，產生振盪或發散。應分析包含控制器和受控程序的閉迴路極點，並檢查穩定裕度、飽和及模型誤差。有些開迴路不穩定程序可被適當回授穩定，但也有原本穩定程序被不當控制器 變得不穩定 的情況。","q_7055v9":"對連續時間線性定常系統，極點實部皆嚴格小於零時，各自然模態會隨時間衰減，對應漸近穩定；若有極點實部大於零，則存在增長模態。位於虛軸的極點需要另行檢查，不能一概稱穩定；重複虛軸極點可能引入隨時間增大的項，純振盪的臨界情況也不等於輸入輸出穩定。離散時間系統則以單位圓內外判斷，且需注意不穩定內部模態可能被表面上的零極點消去隱藏。","q_108n1r5":"積分作用把誤差持續累加，只要仍有固定偏差，控制輸出就會繼續調整，因此在閉迴路穩定、致動器未飽和且問題可控制的條件下，可消除對固定設定值或相應常值擾動的穩態偏差。若控制輸出已達上限，積分仍累加就可能產生積分飽和，使恢復變慢或超越量增加。積分也可能降低穩定裕度，因此需要整定與防飽和設計，不能把積分當作無條件有效的修正。","q_1lq3sbq":"初始條件描述某個起始時間的系統狀態，例如整根棒在開始加熱前的溫度分布；邊界條件描述空間邊界上的限制，例如兩端固定溫度、指定熱通量或與外界對流。含時間與空間的暫態偏微分方程通常兩者都需要，才能從多個可能解中選出符合問題的解。邊界條件可以隨時間改變，因此不能把它誤認成所有時候都固定不變的數值。","q_1v6vz0y":"比爾－朗伯定律的線性關係依賴可比較的吸收物種、光徑和適當光學條件。高濃度時，分子間作用或折射率改變可能使吸光係數變動；聚集、解離等平衡也可能改變實際吸收物種。儀器的雜散光及有限光譜頻寬也會造成偏離。因此應區分物理、化學與儀器因素，以稀釋系列、空白和標準曲線確認可用範圍，不宜把高吸光值直接外推。","q_4tz506":"逆相高效液相層析的固定相通常偏疏水，例如以十八碳鏈修飾的矽膠；流動相則通常是水與有機溶劑的混合物。分析物對疏水固定相的作用較強時，通常停留較久。提高適当有機溶劑比例常可減弱滯留，但實際分離仍受分析物電離、酸鹼值、固定相及梯度影響。不能單凭分子大小就判斷所有化合物的出峰順序。","q_1wy7xxr":"氣相層析需要樣品在進樣及管柱條件下變成可移動的氣相。許多大分子不易揮發，或在氣化前就熱分解，使原分子無法以完整形式被分離與辨認。某些分析物可藉衍生化改善揮發性，但這會增加前處理與副反應考量。對不適合氣化的樣品，常考慮液相層析或其他方法，並依實際性質選擇，不能只因需要高靈敏度就硬用氣相層析。","q_1vn8slx":"布拉格定律描述相鄰晶面散射的Ｘ光，在光程差等於整數倍波長時產生建設性干涉。關係是二倍晶面間距乘繞射角正弦，等於整數倍波長；其中角度是入射光與晶面的夾角，儀器圖譜常標示的是它的兩倍。已知波長與峰位可求晶面間距，但單一峰不一定能唯一辨認晶相，仍需整體圖譜與結構資訊。","q_1c06swh":"單分子親核取代通常先由離去基離開形成碳正離子，再由親核試劑進攻，理想速率主要依底物濃度，且可能重排；若形成可被兩側進攻的中間體，產物立體化學可能部分或近似消旋。雙分子親核取代則在同一步中背面進攻與離去同時發生，速率依底物和親核試劑濃度，反應中心通常構形反轉且受立體障礙影響。選路徑須一起看底物、親核性、離去基與溶劑，不能只靠一個條件判斷。"},"hints":{"q_fb6tsw":"濃度與時間是兩個因子，分析時要一起考慮各自效應與交互作用。","q_1gdhpst":"反轉錄是把核糖核酸轉成互補去氧核糖核酸；即時定量聚合酶連鎖反應才是逐循環追蹤擴增訊號。","q_ckcw3":"凱普一蛋白受到氧化修飾後，對核因子紅血球二相關因子二的降解調控會改變。","q_cdxwau":"露點是氣體開始出現第一滴液體；泡點是液體開始出現第一個氣泡。","q_1gu3xqi":"不要只看磷酸化蛋白條帶，也要核對總蛋白、上樣量與訊號的線性範圍。","q_7x9do4":"從心房去極化開始，到心室去極化開始，這段時間包含傳導延遲。","q_1ut9tz2":"先分辨技術操作與生物差異，再檢查對照組、流程、試劑、儀器及重複樣本，最後與老師或學長姐討論。","q_3l3b39":"理想氣體模型忽略分子間作用力與分子本身體積；真實氣體則可能偏離。"}};

// One longest-match pass prevents partial translations and replacement cascades.
let chineseMatcher=null,chineseLexicon=null;
function chineseTranslationIndex(){
 if(chineseMatcher)return;
 const reversed=Object.fromEntries(Object.entries({...TECHNICAL_ZH_TO_EN,...V18_VISUAL_TECHNICAL_ZH_TO_EN}).map(([zh,en])=>[en,zh]));
 const entries={...ANSWER_WORD_ZH,...ANSWER_TERM_MAP,...ANSWER_PHRASE_ZH,...reversed,...LEARNING_CONTENT.translations};
 chineseLexicon=new Map(Object.entries(entries).map(([en,zh])=>[en.toLowerCase().replace(/’/g,"'"),preferredZhTerm(zh)]));
 chineseMatcher=new RegExp('(?<![A-Za-z0-9])(?:'+[...chineseLexicon.keys()].sort((a,b)=>b.length-a.length).map(escapeRegExpSafe).join('|')+')(?![A-Za-z0-9])','gi');
}
function fullChineseAnswerText(source,domain=''){
 chineseTranslationIndex();
 let text=String(source||'').replace(/’/g,"'");
 const held=[];const hold=value=>{held.push(value);return String.fromCharCode(0xe000+held.length-1);};
 // Case distinguishes pI (isoelectric point), Pi (phosphate), PI (dye), and unit prefixes.
 text=text.replace(/(?<![A-Za-z0-9])(?:pI|Pi|PI|CA|RT|μm|µm|μM|µM|mm|mM)(?![A-Za-z0-9])/g,m=>{
  const value={pI:'等電點',Pi:'無機磷酸',PI:domain==='control'?'比例積分控制':'碘化丙啶',CA:'CA',RT:['thermo','reaction','transport','unitops'].includes(domain)?'RT':'反轉錄','μm':'微米','µm':'微米','μM':'微莫耳每公升','µM':'微莫耳每公升',mm:'毫米',mM:'毫莫耳每公升'}[m];
  return hold(value);
 });
 // SEM has two different meanings. Keep the statistical and microscopy contexts distinct.
 if(['instrument','materials'].includes(domain)||/\bSEM\b.{0,18}\bTEM\b|掃描式?電子/.test(text))text=text.replace(/\bSEM\b/g,'掃描式電子顯微鏡');
 text=text.replace(chineseMatcher,m=>chineseLexicon.get(m.toLowerCase())||m);
 // Resolve English abbreviations contained in legacy dictionary values as well.
 text=text.replace(chineseMatcher,m=>chineseLexicon.get(m.toLowerCase())||m);
 text=text.replace(/[\ue000-\uf8ff]/g,m=>held[m.charCodeAt(0)-0xe000]??m);
 return text.replace(/\s+([，。；：、])/g,'$1').replace(/\s*\/\s*/g,'／').replace(/([\u3400-\u9FFF])\s+(?=[\u3400-\u9FFF])/g,'$1').replace(/系統系統/g,'系統').replace(/\s{2,}/g,' ').trim();
}
function hasLearningTerm(text,term){
 const source=String(text||'');
 return /[A-Za-z]/.test(term)?new RegExp('(?<![A-Za-z0-9])'+escapeRegExpSafe(term)+'(?![A-Za-z0-9])',caseSensitiveTerm(term)?'':'i').test(source):source.includes(term);
}
function caseSensitiveTerm(term){return /^(PI|Pi|pI|μm|µm|μM|µM|mm|mM|CA|RT)$/.test(term);}
function learningTermKey(term){return caseSensitiveTerm(term)?term:term.toLowerCase();}
let lessonLookupCache=new Map();
function lessonFor(q){
 if(!q||q.domain==='personal'||q.domain==='english'||q.domain==='paper')return null;
 const cacheKey=q.domain+'\x1f'+q.id+'\x1f'+q.variantOf+'\x1f'+q.text;
 if(lessonLookupCache.has(cacheKey))return lessonLookupCache.get(cacheKey);
 // Match the question itself; an incidental word in an answer must not select a different mechanism.
 const scored=LEARNING_CONTENT.lessons.filter(l=>l.scope.split(' ').includes(q.domain)).map(l=>({l,score:l.questionIds?.some(id=>id===q.id||id===q.variantOf)?1000:l.keys.reduce((n,k)=>n+(hasLearningTerm(q.text,k)?Math.min(k.length,22):0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
 const lesson=scored[0]?.l||null;lessonLookupCache.set(cacheKey,lesson);return lesson;
}
function glossaryCatalog(domain=''){
 const all=new Map();
 const add=(en,zh)=>{const root=zh.endsWith('的')?zh.slice(0,-1):'';if(root&&LEARNING_CONTENT.terms.some(t=>t.zh===root))zh=root;all.set(learningTermKey(en),[en,zh]);};
 Object.entries(TERM_GLOSSARY).forEach(([en,zh])=>add(en,zh));
 Object.entries(LEARNING_CONTENT.translations).filter(([en])=>en.length>2).forEach(([en,zh])=>{if(!all.has(learningTermKey(en)))add(en,zh);});
 LEARNING_CONTENT.terms.forEach(t=>add(t.en,t.zh));
 add('SEM',['instrument','materials'].includes(domain)?'掃描式電子顯微鏡':'平均值的標準誤');
 if(domain==='control')add('PI','比例積分控制');
 const rows=[...all.values()];
 if(!domain){rows.push(['SEM','掃描式電子顯微鏡'],['PI','比例積分控制']);}
 return rows;
}
function glossaryMatches(text,domain=''){
 const seen=new Set();
 return glossaryCatalog(domain).filter(([en,zh])=>hasLearningTerm(text,en)||((termDefinition(en,zh)||Object.hasOwn(TERM_GLOSSARY,en))&&zh.length>1&&String(text).includes(preferredZhTerm(zh)))).sort((a,b)=>Number(!!termDefinition(b[0],b[1]))-Number(!!termDefinition(a[0],a[1]))||b[0].length-a[0].length).filter(([en,zh])=>{const key=preferredZhTerm(zh);if(seen.has(key))return false;seen.add(key);return true;});
}
let termDefinitionIndex=null;
function termDefinition(en,zh){
 if(zh==='掃描式電子顯微鏡')return '利用電子束掃描表面並偵測訊號，觀察表面形態或成分相關資訊。';
 if(zh==='比例積分控制')return '同時使用目前誤差與累積誤差調整輸出；積分可消除部分穩態偏差，但過強可能造成振盪或飽和累積。';
 if(!termDefinitionIndex)termDefinitionIndex={en:new Map(LEARNING_CONTENT.terms.map(t=>[learningTermKey(t.en),t.meaning])),zh:new Map(LEARNING_CONTENT.terms.map(t=>[t.zh,t.meaning]))};
 return termDefinitionIndex.zh.get(preferredZhTerm(zh))||termDefinitionIndex.en.get(learningTermKey(en))||'';
}
function glossaryHtml(text,{limit=18,search=false,domain=''}={}){
 const ms=glossaryMatches(text,domain);
 const cards=rows=>rows.map(([en,zh])=>`<div class="term-item"><b>${escapeHtml(fullChineseAnswerText(zh,domain))}</b><small class="term-original">${escapeHtml(en)}</small>${termDefinition(en,zh)?`<p>${escapeHtml(termDefinition(en,zh))}</p>`:''}</div>`).join('');
 return `${ms.length?`<div class="glossary-grid">${cards(ms.slice(0,limit))}</div>${ms.length>limit?`<details class="more-terms"><summary>展開其餘 ${ms.length-limit} 個名詞</summary><div class="glossary-grid">${cards(ms.slice(limit))}</div></details>`:''}`:'<p class="sub">這段沒有比對到名詞，可以用下方中英文搜尋。</p>'}${search?`<label class="term-search-label">還有哪個字看不懂？<input type="search" placeholder="輸入中文或英文，例如：凋亡、apoptosis" data-domain="${escapeHtml(domain)}" oninput="searchLearningTerms(this.value,this.nextElementSibling,this.dataset.domain)" aria-label="搜尋專有名詞"><div class="term-search-results" aria-live="polite"></div></label>`:''}`;
}
function searchLearningTerms(value,target,domain=''){
 if(!target)return;const raw=String(value||'').trim(),s=raw.toLowerCase();
 if(!s){target.innerHTML='';return;}
 const rows=glossaryCatalog(domain).filter(([en,zh])=>(caseSensitiveTerm(raw)?en===raw:en.toLowerCase().includes(s))||zh.includes(raw));
 const unique=[...new Map(rows.map(([en,zh])=>[zh,[en,zh]])).values()];
 target.innerHTML=unique.length?`<div class="glossary-grid">${unique.slice(0,30).map(([en,zh])=>`<div class="term-item"><b>${escapeHtml(fullChineseAnswerText(zh))}</b><small class="term-original">${escapeHtml(en)}</small><p>${escapeHtml(termDefinition(en,zh))}</p></div>`).join('')}</div>${unique.length>30?'<p>結果較多，請再輸入幾個字縮小範圍。</p>':''}`:'<p>目前字典沒有這個詞；不會用相似拼字猜測意思。</p>';
}

function mechanismDiagram(l,compact=false){
 // Exact SVG shapes and text, no network fonts, chart library, or generated bitmap required.
 if(!compact)return `<div class="mechanism-desktop">${mechanismDiagram({...l,_desktop:true},true)}</div><div class="mechanism-mobile">${mechanismDiagram({...l,_mobile:true},true)}</div>`;
 const stack=l._mobile&&!l.diagramRows;
 const rows=stack?l.steps.length:(l.diagramRows?.length||Math.ceil(l.steps.length/2)),height=rows*116+8;
 const positions=l.steps.map((s,i)=>({x:(Math.floor(i/2)%2===0?i%2:1-i%2)*306+10,y:Math.floor(i/2)*116+8}));
 if(stack)positions.forEach((p,i)=>{p.x=10;p.y=i*116+8;});
 if(l.diagramRows)l.diagramRows.forEach((row,r)=>row.forEach((index,col)=>positions[index]={x:row.length===1?163:10+col*306,y:r*116+8}));
 const pairs=l.diagramKind==='comparison'?[]:(l.diagramEdges||positions.slice(1).map((p,i)=>[i,i+1]));
 const edges=pairs.map(([from,to])=>{const a=positions[from],p=positions[to];let x1,y1,x2,y2;
 if(a.y===p.y){const right=p.x>a.x;x1=a.x+(right?282:0);x2=p.x+(right?0:282);y1=y2=a.y+40;}
 else {x1=a.x+141;x2=p.x+141;y1=a.y+80;y2=p.y;}
 const dx=x2-x1,dy=y2-y1,ang=Math.atan2(dy,dx),len=7;
 return `<path d="M ${x1} ${y1} L ${x2} ${y2}" stroke="#627787" stroke-width="2" fill="none"/><path d="M ${x2-len*Math.cos(ang-.45)} ${y2-len*Math.sin(ang-.45)} L ${x2} ${y2} L ${x2-len*Math.cos(ang+.45)} ${y2-len*Math.sin(ang+.45)}" stroke="#627787" stroke-width="2" fill="none"/>`;
 }).join('');
 return `<figure class="mechanism-figure"><svg viewBox="0 0 ${stack?304:610} ${height}" role="img" aria-label="${escapeHtml(l.title)}；${l.steps.map((s,i)=>escapeHtml((i+1)+'、'+s.title)).join('；')}" xmlns="http://www.w3.org/2000/svg"><title>${escapeHtml(l.title)}</title>${edges}${l.steps.map((s,i)=>{const p=positions[i];return `<g><rect x="${p.x}" y="${p.y}" width="282" height="80" rx="12" fill="${i===l.steps.length-1?'#e0efea':'#edf2f7'}" stroke="#bac9d4"/><text x="${p.x+18}" y="${p.y+24}" font-size="13" fill="#53677b">步驟 ${i+1}</text><text x="${p.x+18}" y="${p.y+53}" font-size="18" font-weight="600" fill="#16364b">${escapeHtml(s.title)}</text></g>`;}).join('')}</svg><figcaption>${l.diagramKind==='comparison'?'各框是比較項目，不代表反應先後。':'按編號閱讀；每一步的原因與條件在下方。'}這是概念示意，不是實驗結果圖。</figcaption></figure>`;
}

 const found=pairs.filter(([symbol])=>hasLearningTerm(text,symbol));
 return found.length?`<details class="formula-help"><summary>公式符號中文對照</summary><dl>${found.map(([symbol,zh])=>`<div><dt>${escapeHtml(symbol)}</dt><dd>${escapeHtml(zh.replaceAll('题','題'))}</dd></div>`).join('')}</dl></details>`:'';
}

function matchGroup(text,group){const t=enrichedNormalize(text);return group.some(k=>t.includes(normalize(k)))}
function semanticPartialCredit(q,answer){
 const a=normalize(answer),t=normalize(q.text),m=normalize(q.answer||'');
 const partial=[];
 const rules=[
  [/catalyst|催化劑/,/加快反應|反應速率|降低活化能|activationenergy|reactionrate/,'知道催化劑會加快反應／降低活化能'],
  [/cck8/,/代謝|脫氫酶|活性|450|wst8/,'抓到 CCK-8 與代謝／脫氫酶活性相關'],
  [/mitosox/,/ros|活性氧|超氧|superoxide|氧化壓力/,'抓到 MitoSOX 與粒線體氧化壓力／superoxide 相關'],
  [/mitotracker/,/膜電位|粒線體|membrane|potential/,'抓到 MitoTracker 與粒線體／膜電位相關訊號'],
  [/fluo4/,/ca|鈣|calcium/,'抓到 Fluo-4 與胞內 Ca²⁺ 訊號相關'],
  [/nao/,/粒線體|cardiolipin|總量|mass/,'抓到 NAO 與粒線體相關訊號／cardiolipin 相關'],
  [/synergy|協同/,/不能|需要分析|bliss|loewe|combination|dosematrix/,'知道不能只靠合併組下降就宣稱 synergy'],
  [/equilibrium|平衡/,/加快|速率|催化|activation/,'回答碰到動力學影響，但尚未直接回答平衡是否改變']
 ];
 for(const [qr,ar,label] of rules){if(qr.test(t)&&ar.test(a))partial.push(label)}
 if(!partial.length && answer.trim().length>=8 && m){
  const terms=Object.keys(TERM_GLOSSARY).filter(k=>m.includes(normalize(k))||normalize(q.answer||'').includes(normalize(TERM_GLOSSARY[k])));
  if(terms.some(k=>a.includes(normalize(k))||a.includes(normalize(TERM_GLOSSARY[k]))))partial.push('回答與標準概念有部分語意重疊，建議人工複核');
 }
 return partial;
}
